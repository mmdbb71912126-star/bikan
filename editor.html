<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>必看 · 剪辑 · 编辑</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ========== 顶部导航 ========== -->
    <header class="editor-header">
        <div class="header-left">
            <span class="project-title" id="projectTitle">加载中...</span>
        </div>
        <div class="header-right">
            <button class="btn-settings" id="settingsBtn" title="设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- ========== 视频预览区域 ========== -->
    <div class="video-preview-area" id="videoPreview">
        <div class="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <polygon points="10 8 16 12 10 16 10 8"/>
            </svg>
            <span>暂未导入视频</span>
        </div>
    </div>

    <!-- ========== 工作区（下半部分） ========== -->
    <div class="editor-workspace">
        <div class="workspace-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="#3a5a3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="3" y1="9" x2="21" y2="9"/>
                <line x1="3" y1="15" x2="21" y2="15"/>
                <line x1="9" y1="3" x2="9" y2="21"/>
                <line x1="15" y1="3" x2="15" y2="21"/>
            </svg>
            <span>编辑功能开发中...</span>
        </div>
    </div>

    <!-- ========== 全屏设置界面（遮罩 + 侧边栏 + 内容） ========== -->
    <div class="settings-overlay" id="settingsOverlay" style="display:none;">
        <div class="settings-container">
            <!-- 左侧侧边栏 -->
            <aside class="settings-sidebar">
                <div class="settings-sidebar-header">
                    <span class="settings-title">设置</span>
                    <button class="settings-close" id="settingsCloseBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <nav class="settings-nav">
                    <button class="settings-nav-item active" data-section="shortcuts">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 3a3 3 0 00-3 3v12a3 3 0 003 3 3 3 0 003-3 3 3 0 00-3-3H6a3 3 0 00-3 3 3 3 0 003 3 3 3 0 003-3V6a3 3 0 00-3-3 3 3 0 00-3 3 3 3 0 003 3h12a3 3 0 003-3 3 3 0 00-3-3z"/>
                        </svg>
                        快捷键
                    </button>
                    <button class="settings-nav-item" data-section="video">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/>
                            <polygon points="10 8 16 12 10 16 10 8"/>
                        </svg>
                        视频设置
                    </button>
                    <button class="settings-nav-item" data-section="save-exit">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                        保存并退出
                    </button>
                    <button class="settings-nav-item" data-section="export">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        导出
                    </button>
                </nav>
            </aside>

            <!-- 右侧内容区域 -->
            <main class="settings-content" id="settingsContent">
                <!-- 由 JavaScript 动态渲染 -->
            </main>
        </div>
    </div>

    <!-- ========== 自定义确认弹窗（用于导出二次确认） ========== -->
    <div class="confirm-overlay" id="confirmOverlay" style="display:none;">
        <div class="confirm-box">
            <div class="confirm-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </div>
            <h3 id="confirmTitle">确认导出</h3>
            <p id="confirmMessage">确定要导出当前视频吗？</p>
            <div class="confirm-actions">
                <button class="btn btn-outline" id="confirmCancelBtn">取消</button>
                <button class="btn btn-primary" id="confirmOkBtn">确定</button>
            </div>
        </div>
    </div>

    <!-- ========== JS 加载 ========== -->
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/editor.js"></script>

</body>
</html>
