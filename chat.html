<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 私信</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* 聊天页面专用样式 */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            position: relative;
        }
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: white;
            z-index: 10;
            flex-shrink: 0;
        }
        .chat-header .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--text-secondary);
        }
        .chat-header .back-btn:hover {
            color: var(--primary);
        }
        .chat-header .chat-user-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header .chat-user-info .avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        .chat-header .chat-user-info .avatar-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .chat-header .chat-user-info .user-name {
            font-weight: 600;
            font-size: 16px;
        }
        .chat-header .chat-user-info .user-id {
            color: var(--text-light);
            font-size: 13px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: var(--bg-light);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }
        .chat-message.sent {
            align-self: flex-end;
            align-items: flex-end;
        }
        .chat-message.received {
            align-self: flex-start;
            align-items: flex-start;
        }
        .chat-message .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
        }
        .chat-message.sent .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .chat-message.received .bubble {
            background: white;
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }
        .chat-message .message-time {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
            padding: 0 4px;
        }
        .chat-message.sent .message-time {
            text-align: right;
        }
        /* 帖子卡片消息 */
        .chat-message .post-card {
            margin: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            max-width: 300px;
        }
        .chat-message .post-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .chat-message .post-card .post-card-content {
            font-size: 14px;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .chat-message .post-card .post-card-author {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-message .post-card .post-card-author .avatar-xs {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
        }
        .chat-message .post-card .post-card-author .avatar-xs img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .chat-message .post-card .post-card-media {
            margin-top: 6px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .chat-message .post-card .post-card-media img {
            max-width: 80px;
            max-height: 80px;
            border-radius: 6px;
            object-fit: cover;
        }
        .chat-message .post-card .post-card-media .file-icon-sm {
            width: 40px;
            height: 40px;
            background: var(--bg-light);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 输入框区域 */
        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: white;
            flex-shrink: 0;
        }
        .chat-input-area textarea {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            resize: none;
            font-size: 14px;
            min-height: 40px;
            max-height: 120px;
            outline: none;
            transition: var(--transition);
        }
        .chat-input-area textarea:focus {
            border-color: var(--primary);
        }
        .chat-input-area .file-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-input-area .file-btn:hover {
            color: var(--primary);
        }
        .chat-input-area .file-btn svg {
            width: 24px;
            height: 24px;
        }
        .chat-input-area .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .chat-input-area .send-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }
        .chat-input-area .send-btn svg {
            width: 20px;
            height: 20px;
        }
        /* 空状态 */
        .chat-empty {
            text-align: center;
            color: var(--text-light);
            padding: 40px 20px;
        }
        /* 滚动条微调 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 头部 -->
        <div class="chat-header">
            <button class="back-btn" id="backBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="chat-user-info" id="chatUserInfo">
                <div class="avatar-sm" data-action="view-profile" data-user-id="{{otherUserId}}" style="cursor:pointer;">
                    <img src="" alt="avatar" id="chatUserAvatar" />
                </div>
                <div>
                    <div class="user-name" id="chatUserName">加载中...</div>
                    <div class="user-id" id="chatUserId">@...</div>
                </div>
            </div>
        </div>

        <!-- 消息列表 -->
        <div class="chat-messages" id="chatMessages">
            <div class="chat-empty">加载中...</div>
        </div>

        <!-- 输入区域 -->
        <div class="chat-input-area">
            <button class="file-btn" id="fileBtn" title="发送文件">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                </svg>
            </button>
            <input type="file" id="fileInput" multiple style="display:none;" />
            <textarea id="messageInput" rows="1" placeholder="输入消息..."></textarea>
            <button class="send-btn" id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
                </svg>
            </button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script>
        (function() {
            const cfg = window.BikanConfig;
            const comp = window.BikanComponents;
            const { supabaseClient, sdkReady, uploadFile, showToast } = cfg;
            const { Icons, getUserAvatarHTML, getUserDisplayName, getUserHandle, renderPostCard, openModal } = comp;

            // ---------- 获取 URL 参数 ----------
            const urlParams = new URLSearchParams(window.location.search);
            const otherUserId = urlParams.get('userId');
            if (!otherUserId) {
                showToast('缺少用户 ID', 'error');
                window.location.href = 'app.html';
                return;
            }

            let currentUser = null;
            let otherUser = null;
            let chatMessages = [];
            let messageChannel = null;

            // DOM 元素
            const backBtn = document.getElementById('backBtn');
            const chatUserInfo = document.getElementById('chatUserInfo');
            const chatUserAvatar = document.getElementById('chatUserAvatar');
            const chatUserName = document.getElementById('chatUserName');
            const chatUserId = document.getElementById('chatUserId');
            const chatMessagesDiv = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const fileBtn = document.getElementById('fileBtn');
            const fileInput = document.getElementById('fileInput');

            // ---------- 初始化 ----------
            async function init() {
                if (!sdkReady) {
                    showToast('Supabase 未初始化', 'error');
                    return;
                }
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (!session) {
                        window.location.href = 'index.html';
                        return;
                    }
                    const { data: profile } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', session.user.id)
                        .single();
                    if (!profile) {
                        showToast('获取用户信息失败', 'error');
                        return;
                    }
                    currentUser = profile;

                    // 获取对方信息
                    const { data: other, error: otherError } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', otherUserId)
                        .single();
                    if (otherError || !other) {
                        showToast('对方用户不存在', 'error');
                        window.location.href = 'app.html';
                        return;
                    }
                    otherUser = other;
                    renderHeader();

                    // 加载消息
                    await loadMessages();

                    // 监听新消息
                    setupRealtime();

                    // 事件绑定
                    backBtn.addEventListener('click', () => {
                        window.location.href = 'app.html';
                    });
                    sendBtn.addEventListener('click', sendMessage);
                    messageInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            sendMessage();
                        }
                    });
                    fileBtn.addEventListener('click', () => fileInput.click());
                    fileInput.addEventListener('change', handleFileUpload);

                    // 头部头像点击跳转
                    const headerAvatar = document.querySelector('.chat-header .chat-user-info .avatar-sm');
                    if (headerAvatar) {
                        headerAvatar.dataset.userId = otherUserId;
                        headerAvatar.addEventListener('click', () => {
                            window.location.href = 'post-detail.html?type=user&id=' + otherUserId;
                        });
                    }

                    // 滚动到最新消息
                    scrollToBottom();

                    // 全局事件：头像点击跳转
                    document.addEventListener('click', (e) => {
                        const target = e.target.closest('[data-action="view-profile"]');
                        if (target) {
                            const userId = target.dataset.userId;
                            if (userId) {
                                window.location.href = 'post-detail.html?type=user&id=' + userId;
                            }
                        }
                    });

                } catch (e) {
                    console.error('初始化失败', e);
                    showToast('初始化失败: ' + e.message, 'error');
                }
            }

            // ---------- 渲染头部 ----------
            function renderHeader() {
                if (!otherUser) return;
                chatUserAvatar.src = otherUser.avatar_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(otherUser.username) + '&background=667eea&color=fff&size=64';
                chatUserName.textContent = getUserDisplayName(otherUser);
                chatUserId.textContent = getUserHandle(otherUser);
            }

            // ---------- 加载消息 ----------
            async function loadMessages() {
                try {
                    chatMessagesDiv.innerHTML = '<div class="chat-empty">加载中...</div>';
                    const { data, error } = await supabaseClient
                        .from('messages')
                        .select('*')
                        .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`)
                        .order('created_at', { ascending: true });

                    if (error) {
                        chatMessagesDiv.innerHTML = '<div class="chat-empty">加载失败，请刷新重试</div>';
                        showToast('加载消息失败: ' + error.message, 'error');
                        return;
                    }
                    chatMessages = data || [];

                    // 标记收到的消息为已读
                    const unreadIds = chatMessages
                        .filter(m => m.receiver_id === currentUser.id && !m.is_read)
                        .map(m => m.id);
                    if (unreadIds.length > 0) {
                        await supabaseClient
                            .from('messages')
                            .update({ is_read: true })
                            .in('id', unreadIds);
                    }

                    renderMessages();
                } catch (e) {
                    console.error('加载消息失败', e);
                    chatMessagesDiv.innerHTML = '<div class="chat-empty">加载失败，请刷新重试</div>';
                }
            }

            // ---------- 渲染消息 ----------
            function renderMessages() {
                if (!chatMessages.length) {
                    chatMessagesDiv.innerHTML = '<div class="chat-empty">暂无消息，开始聊天吧</div>';
                    return;
                }
                chatMessagesDiv.innerHTML = '';
                chatMessages.forEach(msg => {
                    const msgEl = createMessageElement(msg);
                    chatMessagesDiv.appendChild(msgEl);
                });
                scrollToBottom();
            }

            // ---------- 创建单条消息元素 ----------
            function createMessageElement(msg) {
                const isSent = msg.sender_id === currentUser.id;
                const wrapper = document.createElement('div');
                wrapper.className = `chat-message ${isSent ? 'sent' : 'received'}`;

                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                // 判断是否帖子卡片
                let parsed = null;
                let isCard = false;
                try {
                    parsed = JSON.parse(msg.content);
                    if (parsed.type === 'post_card') {
                        isCard = true;
                    }
                } catch (e) {
                    // 不是 JSON，普通文本
                }

                if (isCard && parsed) {
                    // 渲染帖子卡片
                    const cardContainer = document.createElement('div');
                    cardContainer.className = 'post-card';
                    cardContainer.dataset.postId = parsed.post_id;
                    cardContainer.addEventListener('click', () => {
                        window.location.href = 'post-detail.html?type=post&id=' + parsed.post_id;
                    });

                    // 作者信息（头像可点击）
                    const authorDiv = document.createElement('div');
                    authorDiv.className = 'post-card-author';
                    authorDiv.innerHTML = `
                        <div class="avatar-xs" data-action="view-profile" data-user-id="${parsed.author.id}" style="cursor:pointer;"><img src="${parsed.author.avatar_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(parsed.author.username) + '&background=667eea&color=fff&size=32'}" alt="avatar" /></div>
                        <span>${getUserDisplayName(parsed.author)}</span>
                        <span style="font-size:12px;color:var(--text-light);">${new Date(parsed.created_at).toLocaleString()}</span>
                    `;
                    cardContainer.appendChild(authorDiv);

                    // 内容
                    if (parsed.content) {
                        const contentDiv = document.createElement('div');
                        contentDiv.className = 'post-card-content';
                        contentDiv.textContent = parsed.content;
                        cardContainer.appendChild(contentDiv);
                    }

                    // 媒体缩略图
                    if (parsed.media && parsed.media.length > 0) {
                        const mediaDiv = document.createElement('div');
                        mediaDiv.className = 'post-card-media';
                        parsed.media.slice(0, 3).forEach(file => {
                            if (file.type && file.type.startsWith('image/')) {
                                const img = document.createElement('img');
                                img.src = file.url;
                                img.alt = 'image';
                                mediaDiv.appendChild(img);
                            } else {
                                const icon = document.createElement('div');
                                icon.className = 'file-icon-sm';
                                icon.innerHTML = Icons.file;
                                mediaDiv.appendChild(icon);
                            }
                        });
                        if (parsed.media.length > 3) {
                            const more = document.createElement('span');
                            more.textContent = `+${parsed.media.length - 3}`;
                            more.style.cssText = 'font-size:12px;color:var(--text-light);align-self:center;';
                            mediaDiv.appendChild(more);
                        }
                        cardContainer.appendChild(mediaDiv);
                    }

                    bubble.appendChild(cardContainer);
                } else {
                    // 普通文本消息
                    const contentText = document.createElement('div');
                    contentText.textContent = msg.content || '[文件]';
                    bubble.appendChild(contentText);

                    // 如果有文件（旧格式）
                    if (msg.file_url) {
                        const fileLink = document.createElement('div');
                        fileLink.style.marginTop = '6px';
                        fileLink.innerHTML = `<a href="${msg.file_url}" target="_blank" style="color:${isSent ? 'white' : 'var(--primary)'};">${Icons.file} ${msg.file_name || '附件'}</a>`;
                        bubble.appendChild(fileLink);
                    }
                }

                wrapper.appendChild(bubble);

                // 时间
                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = new Date(msg.created_at).toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                wrapper.appendChild(time);

                return wrapper;
            }

            // ---------- 发送消息 ----------
            async function sendMessage() {
                const text = messageInput.value.trim();
                if (!text) return;

                try {
                    const { data, error } = await supabaseClient
                        .from('messages')
                        .insert({
                            sender_id: currentUser.id,
                            receiver_id: otherUserId,
                            content: text,
                            is_read: false
                        })
                        .select()
                        .single();

                    if (error) {
                        showToast('发送失败: ' + error.message, 'error');
                        return;
                    }
                    chatMessages.push(data);
                    chatMessagesDiv.appendChild(createMessageElement(data));
                    messageInput.value = '';
                    messageInput.style.height = 'auto';
                    scrollToBottom();
                } catch (e) {
                    showToast('发送失败: ' + e.message, 'error');
                }
            }

            // ---------- 发送文件 ----------
            async function handleFileUpload(e) {
                const files = e.target.files;
                if (!files.length) return;
                fileInput.value = '';

                for (const file of files) {
                    try {
                        const uploaded = await uploadFile(file, 'messages', `chat/${currentUser.id}`);
                        const { data, error } = await supabaseClient
                            .from('messages')
                            .insert({
                                sender_id: currentUser.id,
                                receiver_id: otherUserId,
                                content: JSON.stringify({
                                    type: 'file',
                                    file_name: file.name,
                                    file_url: uploaded.url,
                                    file_type: file.type,
                                    file_size: file.size
                                }),
                                is_read: false
                            })
                            .select()
                            .single();

                        if (error) {
                            showToast('发送文件失败: ' + error.message, 'error');
                            continue;
                        }
                        chatMessages.push(data);
                        chatMessagesDiv.appendChild(createMessageElement(data));
                        scrollToBottom();
                    } catch (err) {
                        showToast('文件上传失败: ' + err.message, 'error');
                    }
                }
            }

            // ---------- 实时订阅 ----------
            function setupRealtime() {
                if (messageChannel) return;
                messageChannel = supabaseClient
                    .channel('chat-' + currentUser.id + '-' + otherUserId)
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                        const newMsg = payload.new;
                        if ((newMsg.sender_id === currentUser.id && newMsg.receiver_id === otherUserId) ||
                            (newMsg.sender_id === otherUserId && newMsg.receiver_id === currentUser.id)) {
                            if (!chatMessages.some(m => m.id === newMsg.id)) {
                                chatMessages.push(newMsg);
                                chatMessagesDiv.appendChild(createMessageElement(newMsg));
                                scrollToBottom();
                                if (newMsg.receiver_id === currentUser.id) {
                                    supabaseClient
                                        .from('messages')
                                        .update({ is_read: true })
                                        .eq('id', newMsg.id)
                                        .then(() => {});
                                }
                            }
                        }
                    })
                    .subscribe();
            }

            // ---------- 滚动到底部 ----------
            function scrollToBottom() {
                setTimeout(() => {
                    chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
                }, 50);
            }

            // ---------- 启动 ----------
            init();
        })();
    </script>
</body>
</html>
