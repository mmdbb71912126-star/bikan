<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>详情 - ACG 资源</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ===== 详情页专属样式 ===== */
    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #86868b;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .detail-back:hover {
      color: #1d1d1f;
    }

    .detail-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }

    .detail-image {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #e8e8ed;
    }

    .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-info {
      padding: 40px 40px 40px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .detail-category {
      display: inline-block;
      background: #f0f0f5;
      padding: 4px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      color: #86868b;
      width: fit-content;
      margin-bottom: 12px;
    }

    .detail-title {
      font-size: 32px;
      font-weight: 700;
      color: #1d1d1f;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .detail-description {
      font-size: 16px;
      color: #86868b;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .detail-meta {
      font-size: 13px;
      color: #a1a1a6;
      margin-bottom: 20px;
    }

    .detail-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: #007aff;
      color: #fff;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
      width: fit-content;
    }

    .detail-link:hover {
      background: #0066d9;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 122, 255, 0.3);
    }

    .detail-error {
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }

    .detail-error .icon {
      display: block;
      margin-bottom: 16px;
      color: #c0c0c5;
    }

    .detail-error h3 {
      font-size: 20px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 8px;
    }

    .detail-error p {
      color: #86868b;
      margin-bottom: 20px;
    }

    .detail-error .btn-back {
      padding: 10px 28px;
      background: #007aff;
      color: #fff;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .detail-error .btn-back:hover {
      background: #0066d9;
    }

    @media (max-width: 768px) {
      .detail-container {
        grid-template-columns: 1fr;
        gap: 0;
        border-radius: 16px;
      }

      .detail-image {
        aspect-ratio: 4 / 3;
      }

      .detail-info {
        padding: 24px 20px 28px;
      }

      .detail-title {
        font-size: 24px;
      }

      .detail-description {
        font-size: 15px;
      }

      .detail-back {
        margin-bottom: 16px;
      }
    }

    @media (max-width: 480px) {
      .detail-title {
        font-size: 20px;
      }

      .detail-info {
        padding: 18px 16px 22px;
      }

      .detail-link {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- ===== 返回按钮 ===== -->
    <a href="index.html" class="detail-back">
      ${renderIcon('arrowLeft')} 返回首页
    </a>

    <!-- ===== 详情内容 ===== -->
    <div id="detailContent">
      <!-- 由 JS 渲染 -->
    </div>
  </div>

  <!-- ===== 脚本加载 ===== -->
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/detail.js"></script>

</body>
</html>
