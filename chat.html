<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 私信</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="app-container" style="display: block;">
        <main class="main-content" id="mainContent" style="max-width: 800px; margin: 0 auto; padding: 20px;">
            <button class="btn btn-secondary" id="backBtn">返回</button>
            <div id="chatHeader" style="margin: 16px 0; display: flex; align-items: center; gap: 12px;"></div>
            <div id="typingIndicator" style="height: 20px; margin-bottom: 8px; font-size: 13px; color: var(--text-light);"></div>
            <div id="chatMessages" style="height: 60vh; overflow-y: auto; background: white; border-radius: 12px; padding: 16px; box-shadow: var(--shadow-sm);"></div>
            <div style="display: flex; gap: 8px; margin-top: 16px;">
                <input type="text" id="chatInput" placeholder="输入消息..." style="flex:1;" />
                <button class="btn btn-primary" id="sendChatBtn">发送</button>
            </div>
            <div style="margin-top: 8px;">
                <input type="file" id="chatFileInput" multiple />
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script>
        (function() {
            const cfg = window.BikanConfig;
            const comp = window.BikanComponents;
            const { supabaseClient, sdkReady, uploadFile, showToast } = {
                supabaseClient: cfg.supabaseClient,
                sdkReady: cfg.sdkReady,
                uploadFile: cfg.uploadFile,
                showToast: comp.showToast
            };

            let currentUser = null;
            let otherUser = null;
            let typingTimer = null;
            const urlParams = new URLSearchParams(window.location.search);
            const otherUserId = urlParams.get('userId');

            async function initChat() {
                if (!sdkReady) {
                    showToast('Supabase 未初始化', 'error');
                    return;
                }

                const { data: { session }, error: authError } = await supabaseClient.auth.getSession();
                if (authError || !session) {
                    window.location.href = 'index.html';
                    return;
                }

                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();
                if (profileError || !profile) {
                    showToast('获取用户信息失败', 'error');
                    return;
                }
                currentUser = profile;

                if (currentUser.is_banned) {
                    showToast('你已被封禁，无法私信', 'error');
                    document.getElementById('chatInput').disabled = true;
                    document.getElementById('sendChatBtn').disabled = true;
                    document.getElementById('chatFileInput').disabled = true;
                }

                if (!otherUserId) {
                    showToast('缺少用户 ID', 'error');
                    return;
                }

                const { data: otherData, error: otherError } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', otherUserId)
                    .single();
                if (otherError || !otherData) {
                    showToast('用户不存在', 'error');
                    return;
                }
                otherUser = otherData;

                // 渲染聊天头部
                const headerDiv = document.getElementById('chatHeader');
                headerDiv.innerHTML = `
                    ${comp.getUserAvatarHTML(otherUser, 'avatar')}
                    <div>
                        <div class="post-user-name">${comp.getUserDisplayName(otherUser)}</div>
                        <div class="post-user-id">${comp.getUserHandle(otherUser)}</div>
                    </div>
                `;

                await loadMessages();
                setupRealtimeSubscription();
                setupTypingIndicators();

                document.getElementById('backBtn').addEventListener('click', () => {
                    window.location.href = 'app.html';
                });

                document.getElementById('sendChatBtn').addEventListener('click', sendTextMessage);
                document.getElementById('chatInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendTextMessage();
                });

                document.getElementById('chatFileInput').addEventListener('change', async (e) => {
                    if (currentUser.is_banned) {
                        showToast('你已被封禁，无法发送文件', 'error');
                        return;
                    }
                    const files = e.target.files;
                    if (!files.length) return;
                    for (const file of files) {
                        try {
                            showToast('文件上传中...', 'info');
                            const uploaded = await uploadFile(file, 'messages', `chat/${currentUser.id}`);
                            await insertMessage(null, uploaded);
                        } catch (err) {
                            showToast('文件上传失败: ' + err.message, 'error');
                        }
                    }
                    e.target.value = '';
                    await loadMessages();
                });

                // 页面关闭前清除自己的打字状态
                window.addEventListener('beforeunload', async () => {
                    if (currentUser && otherUser) {
                        await supabaseClient
                            .from('profiles')
                            .update({ typing_to: null })
                            .eq('id', currentUser.id);
                    }
                });
            }

            function setupRealtimeSubscription() {
                // 消息订阅
                const messageChannel = supabaseClient
                    .channel('chat-messages-' + currentUser.id + '-' + otherUser.id)
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                        const newMsg = payload.new;
                        if (
                            (newMsg.sender_id === currentUser.id && newMsg.receiver_id === otherUser.id) ||
                            (newMsg.sender_id === otherUser.id && newMsg.receiver_id === currentUser.id)
                        ) {
                            appendMessageToChat(newMsg);
                        }
                    })
                    .subscribe();

                // 打字状态订阅
                const typingChannel = supabaseClient
                    .channel('typing-' + currentUser.id + '-' + otherUser.id)
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'profiles' }, (payload) => {
                        const updatedUser = payload.new;
                        if (updatedUser.id === otherUser.id) {
                            updateTypingIndicator(updatedUser.typing_to === currentUser.id);
                        }
                    })
                    .subscribe();
            }

            function setupTypingIndicators() {
                const chatInput = document.getElementById('chatInput');
                // 输入时更新 typing_to
                chatInput.addEventListener('input', () => {
                    if (currentUser.is_banned) return;
                    // 清除之前的定时器
                    clearTimeout(typingTimer);
                    // 设置新状态
                    supabaseClient
                        .from('profiles')
                        .update({ typing_to: otherUser.id })
                        .eq('id', currentUser.id)
                        .then(() => {
                            // 2秒后自动清除
                            typingTimer = setTimeout(async () => {
                                await supabaseClient
                                    .from('profiles')
                                    .update({ typing_to: null })
                                    .eq('id', currentUser.id);
                            }, 2000);
                        });
                });
            }

            function updateTypingIndicator(isTyping) {
                const indicator = document.getElementById('typingIndicator');
                indicator.textContent = isTyping ? '对方正在输入...' : '';
            }

            function appendMessageToChat(msg) {
                const messagesContainer = document.getElementById('chatMessages');
                const isMine = msg.sender_id === currentUser.id;
                const bubble = document.createElement('div');
                bubble.style.cssText = `text-align:${isMine ? 'right' : 'left'}; margin-bottom: 8px;`;
                bubble.innerHTML = `
                    <div style="display: inline-block; background: ${isMine ? 'var(--primary)' : 'var(--bg-light)'}; color: ${isMine ? 'white' : 'var(--text-main)'}; padding: 8px 12px; border-radius: 12px; max-width: 80%; word-break: break-word;">
                        ${msg.content || ''}
                        ${msg.file_url ? `<div><a href="${msg.file_url}" target="_blank" style="color: ${isMine ? 'white' : 'var(--primary)'}; text-decoration: underline;">${msg.file_name || '文件'}</a></div>` : ''}
                    </div>
                `;
                messagesContainer.appendChild(bubble);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            async function loadMessages() {
                const messagesContainer = document.getElementById('chatMessages');
                messagesContainer.innerHTML = '<p>加载中...</p>';
                const { data, error } = await supabaseClient
                    .from('messages')
                    .select('*')
                    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUser.id}),and(sender_id.eq.${otherUser.id},receiver_id.eq.${currentUser.id})`)
                    .order('created_at', { ascending: true });
                if (error) {
                    messagesContainer.innerHTML = `<p>加载失败: ${error.message}</p>`;
                    return;
                }
                if (!data.length) {
                    messagesContainer.innerHTML = '<p>暂无消息</p>';
                    return;
                }
                messagesContainer.innerHTML = '';
                data.forEach(msg => appendMessageToChat(msg));
            }

            async function insertMessage(content, fileObj) {
                const payload = {
                    sender_id: currentUser.id,
                    receiver_id: otherUser.id,
                    content: content || null,
                };
                if (fileObj) {
                    payload.file_url = fileObj.url;
                    payload.file_name = fileObj.name;
                    payload.file_type = fileObj.type;
                }
                const { error } = await supabaseClient.from('messages').insert(payload);
                if (error) throw error;
            }

            async function sendTextMessage() {
                if (currentUser.is_banned) {
                    showToast('你已被封禁，无法发送消息', 'error');
                    return;
                }
                const input = document.getElementById('chatInput');
                const text = input.value.trim();
                if (!text) return;
                try {
                    await insertMessage(text, null);
                    input.value = '';
                    await loadMessages();
                    // 清除自己的打字状态
                    await supabaseClient
                        .from('profiles')
                        .update({ typing_to: null })
                        .eq('id', currentUser.id);
                } catch (err) {
                    showToast('发送失败: ' + err.message, 'error');
                }
            }

            initChat();
        })();
    </script>
</body>
</html>
