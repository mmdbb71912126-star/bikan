<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 重置密码</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
    <div class="card">
        <h2>设置新密码</h2>
        <div class="subtitle">请输入你的新密码</div>
        <div class="form-group">
            <label>新密码</label>
            <input type="password" id="newPassword" placeholder="至少6位" />
        </div>
        <div class="form-group">
            <label>确认新密码</label>
            <input type="password" id="confirmPassword" placeholder="再次输入" />
        </div>
        <button class="btn btn-primary btn-block" id="updatePasswordBtn">更新密码</button>
        <div id="message" class="message"></div>
        <div class="footer-link">
            <a href="index.html">返回登录</a>
        </div>
    </div>

    <script>
        window.onload = function() {
            const SUPABASE_URL = 'https://bazpyoiklkoajdhfkwly.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_lTx_tYITroL8_jVVR4EjAA_Eg61lBFT';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const updateBtn = document.getElementById('updatePasswordBtn');
            const messageEl = document.getElementById('message');

            function showMessage(text, isSuccess) {
                messageEl.textContent = text;
                messageEl.className = 'message ' + (isSuccess ? 'success' : 'error');
            }

            updateBtn.addEventListener('click', async () => {
                const password = newPasswordInput.value;
                const confirm = confirmPasswordInput.value;
                if (!password || !confirm) {
                    showMessage('请填写所有字段');
                    return;
                }
                if (password.length < 6) {
                    showMessage('密码至少6位');
                    return;
                }
                if (password !== confirm) {
                    showMessage('两次密码输入不一致');
                    return;
                }
                // Supabase 会在 URL 中携带 token，直接调用 updateUser 更新密码
                const { error } = await supabase.auth.updateUser({ password: password });
                if (error) {
                    showMessage('更新失败: ' + error.message);
                } else {
                    showMessage('密码更新成功，正在跳转...', true);
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 2000);
                }
            });
        };
    </script>
</body>
</html>
