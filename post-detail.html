<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 详情</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .modal .avatar-sm {
            width: 32px !important;
            height: 32px !important;
        }
        .modal .avatar-sm img {
            width: 32px !important;
            height: 32px !important;
            border-radius: 50%;
            object-fit: cover;
        }
        .stat-link {
            cursor: pointer;
            color: var(--text-main);
            transition: var(--transition);
        }
        .stat-link:hover {
            color: var(--primary);
        }
        .stat-link.disabled {
            cursor: default;
            color: var(--text-light);
        }
        .stat-link.disabled:hover {
            color: var(--text-light);
        }
        /* 用户主页标签 */
        .profile-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }
        .profile-tab {
            padding: 8px 20px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: var(--transition);
        }
        .profile-tab:hover {
            color: var(--text-main);
        }
        .profile-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .profile-content {
            min-height: 100px;
        }
    </style>
</head>
<body>
    <div class="app-container" style="display:block;">
        <main class="main-content" id="mainContent" style="max-width:800px; margin:0 auto; padding:20px; position:relative;">
            <button class="btn btn-secondary" id="backBtn">返回</button>
            <div id="detailContainer" style="margin-top:16px; position:relative;"></div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script>
        (function() {
            const cfg = window.BikanConfig;
            const comp = window.BikanComponents;
            const { supabaseClient, sdkReady, uploadFile, uploadFiles, showToast } = {
                supabaseClient: cfg.supabaseClient,
                sdkReady: cfg.sdkReady,
                uploadFile: cfg.uploadFile,
                uploadFiles: cfg.uploadFiles,
                showToast: comp.showToast
            };

            let currentUser = null;
            let isTogglingLike = false;
            let isTogglingFavorite = false;
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type') || 'post';
            const id = urlParams.get('id');

            async function init() {
                if (!sdkReady) return showToast('Supabase 未初始化', 'error');
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) { window.location.href = 'index.html'; return; }
                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
                if (!profile) return showToast('获取用户信息失败', 'error');
                currentUser = profile;

                if (currentUser.is_banned) {
                    document.body.insertAdjacentHTML('beforeend', `
                        <div class="banned-overlay"><div class="banned-logo">${comp.Icons.logo(150)}</div><div class="banned-text">你已被封禁</div></div>
                    `);
                }

                document.getElementById('backBtn').addEventListener('click', goBack);

                try {
                    if (type === 'post') await loadPostDetail(id);
                    else if (type === 'topic') await loadTopicDetail(id);
                    else if (type === 'announcement') await loadAnnouncementDetail(id);
                    else if (type === 'user') await loadUserProfile(id);
                    else showToast('未知类型', 'error');
                } catch (e) {
                    console.error('详情加载失败', e);
                    document.getElementById('detailContainer').innerHTML = '<p>加载失败：' + e.message + '</p>';
                }

                setupRealtime();
                setupGlobalEvents();
            }

            function goBack() {
                window.location.href = 'app.html';
            }

            function setupGlobalEvents() {
                document.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-action="view-profile"]');
                    if (target) {
                        const userId = target.dataset.userId;
                        if (userId) {
                            window.location.href = 'post-detail.html?type=user&id=' + userId;
                        }
                    }
                });
            }

            function setupRealtime() {
                if (!supabaseClient || !id) return;

                if (type === 'post') {
                    supabaseClient
                        .channel('post-detail-realtime-' + id)
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, (payload) => {
                            if (payload.new.post_id === id) {
                                const postAuthorId = document.getElementById('commentsList')?.dataset.postAuthorId;
                                if (postAuthorId) loadComments(id, postAuthorId);
                            }
                        })
                        .subscribe();

                    supabaseClient
                        .channel('post-detail-counts-' + id)
                        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'posts' }, (payload) => {
                            const updatedPost = payload.new;
                            if (updatedPost.id !== id) return;
                            document.querySelectorAll(`[data-post-id="${updatedPost.id}"][data-action="like"]`).forEach(btn => {
                                const countSpan = btn.querySelector('.count');
                                if (countSpan) countSpan.textContent = updatedPost.like_count || 0;
                            });
                            document.querySelectorAll(`[data-post-id="${updatedPost.id}"][data-action="favorite"]`).forEach(btn => {
                                const countSpan = btn.querySelector('.count');
                                if (countSpan) countSpan.textContent = updatedPost.favorite_count || 0;
                            });
                            document.querySelectorAll(`[data-post-id="${updatedPost.id}"][data-action="comment"]`).forEach(btn => {
                                const countSpan = btn.querySelector('.count');
                                if (countSpan) countSpan.textContent = updatedPost.comment_count || 0;
                            });
                        })
                        .subscribe();
                }

                if (type === 'topic') {
                    supabaseClient
                        .channel('topic-detail-realtime-' + id)
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'topic_posts' }, (payload) => {
                            if (payload.new.topic_id === id) loadTopicPosts(id);
                        })
                        .subscribe();
                }
            }

            // ==================== 帖子详情 ====================
            async function loadPostDetail(postId) {
                if (!postId) return showToast('缺少帖子 ID', 'error');
                const container = document.getElementById('detailContainer');
                container.innerHTML = '加载中...';
                const { data: post, error } = await supabaseClient
                    .from('posts')
                    .select('*, profiles:user_id(id, username, nickname, avatar_url, is_online, is_banned)')
                    .eq('id', postId)
                    .single();
                if (error || !post) {
                    container.innerHTML = '<p>帖子不存在</p>';
                    return;
                }

                await supabaseClient.from('view_history').upsert({ user_id: currentUser.id, post_id: postId, viewed_at: new Date().toISOString() }, { onConflict: 'user_id,post_id' });

                const [likeRes, favRes] = await Promise.all([
                    supabaseClient.from('likes').select('id').eq('user_id', currentUser.id).eq('post_id', postId).maybeSingle(),
                    supabaseClient.from('favorites').select('id').eq('user_id', currentUser.id).eq('post_id', postId).maybeSingle()
                ]);
                post.liked_by_me = !!likeRes.data;
                post.favorited_by_me = !!favRes.data;
                post.is_owner = post.user_id === currentUser.id;

                container.innerHTML = '';

                if (currentUser.is_admin && post.public_id) {
                    const idTag = document.createElement('div');
                    idTag.style.cssText = 'position:absolute; top:10px; right:10px; background:var(--bg-light); padding:4px 8px; border-radius:6px; font-size:12px; color:var(--text-light); z-index:10;';
                    idTag.textContent = 'ID: ' + post.public_id;
                    container.appendChild(idTag);
                }

                container.appendChild(comp.renderPostCard(post, { showActions: true, isDetail: true }));

                if (post.media?.length) {
                    const mediaDiv = document.createElement('div');
                    mediaDiv.innerHTML = post.media.map(file => comp.renderFileDetail(file)).join('');
                    container.appendChild(mediaDiv);
                }

                const commentsSection = document.createElement('div');
                commentsSection.className = 'comments-section';
                commentsSection.innerHTML = `<h3>评论</h3><div id="commentsList"></div>
                    <div class="comment-form" style="margin-top:16px;">
                        <textarea id="commentInput" placeholder="写下你的评论..." rows="3"></textarea>
                        <button class="btn btn-primary" id="submitCommentBtn" style="margin-top:8px;">发表评论</button>
                    </div>`;
                container.appendChild(commentsSection);

                await loadComments(postId, post.user_id);
                bindPostActions(postId, post.user_id, container);
            }

            async function loadComments(postId, postAuthorId) {
                const listDiv = document.getElementById('commentsList');
                if (!listDiv) return;
                listDiv.innerHTML = '加载中...';
                const { data, error } = await supabaseClient
                    .from('comments')
                    .select('*, profiles:user_id(id, username, nickname, avatar_url, is_banned), reply_to_user:reply_to_user_id(id, username, nickname, is_banned)')
                    .eq('post_id', postId)
                    .order('created_at', { ascending: true });
                if (error) {
                    listDiv.innerHTML = '<p>加载评论失败</p>';
                    return;
                }
                if (!data.length) {
                    listDiv.innerHTML = '<p>暂无评论</p>';
                    return;
                }
                listDiv.innerHTML = '';
                listDiv.dataset.postId = postId;
                listDiv.dataset.postAuthorId = postAuthorId;

                const mainComments = data.filter(c => !c.parent_id);
                const replies = data.filter(c => c.parent_id);
                mainComments.forEach(comment => {
                    listDiv.appendChild(renderCommentWithDelete(comment, false));
                    const commentReplies = replies.filter(r => r.parent_id === comment.id);
                    commentReplies.forEach(reply => {
                        const replyEl = renderCommentWithDelete(reply, true);
                        replyEl.style.marginLeft = '24px';
                        listDiv.appendChild(replyEl);
                    });
                });
            }

            function renderCommentWithDelete(comment, isReply) {
                const commentEl = comp.renderCommentItem(comment, { isReply });
                const postAuthorId = document.getElementById('commentsList')?.dataset.postAuthorId;
                const canDelete = comment.user_id === currentUser.id || (postAuthorId && postAuthorId === currentUser.id);
                if (canDelete) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'action-btn';
                    deleteBtn.dataset.action = 'delete-comment';
                    deleteBtn.dataset.commentId = comment.id;
                    deleteBtn.innerHTML = `${comp.Icons.trash} 删除`;
                    const actionsDiv = commentEl.querySelector('.comment-actions');
                    if (actionsDiv) actionsDiv.appendChild(deleteBtn);
                }
                return commentEl;
            }

            function bindPostActions(postId, postAuthorId, container) {
                container.addEventListener('click', async (e) => {
                    const target = e.target.closest('[data-action]');
                    if (!target) return;
                    if (currentUser.is_banned) return showToast('你已被封禁，无法操作', 'error');
                    const action = target.dataset.action;
                    const commentId = target.dataset.commentId;

                    if (action === 'like') await toggleLike(postId, target);
                    else if (action === 'favorite') await toggleFavorite(postId, target);
                    else if (action === 'share') showShareModal(postId);
                    else if (action === 'report') showReportModal('post', postId);
                    else if (action === 'edit') showEditPostModal(postId);
                    else if (action === 'delete') {
                        if (confirm('确认删除这条帖子吗？')) {
                            await supabaseClient.from('posts').delete().eq('id', postId);
                            showToast('已删除', 'success');
                            window.location.href = 'app.html';
                        }
                    }
                    else if (action === 'like-comment' && commentId) await toggleCommentLike(commentId, target);
                    else if (action === 'reply-comment' && commentId) {
                        const commentInput = document.getElementById('commentInput');
                        commentInput.focus();
                        commentInput.dataset.parentId = commentId;
                        const { data: cmt } = await supabaseClient.from('comments').select('user_id').eq('id', commentId).single();
                        if (cmt) commentInput.dataset.replyToUserId = cmt.user_id;
                    }
                    else if (action === 'share-comment' && commentId) await shareComment(commentId);
                    else if (action === 'report-comment' && commentId) showReportModal('comment', commentId);
                    else if (action === 'delete-comment' && commentId) {
                        if (confirm('确认删除这条评论吗？')) {
                            await supabaseClient.from('comments').delete().eq('id', commentId);
                            showToast('评论已删除', 'success');
                            await loadComments(postId, postAuthorId);
                        }
                    }
                });

                document.getElementById('submitCommentBtn').addEventListener('click', async () => {
                    if (currentUser.is_banned) return showToast('你已被封禁，无法评论', 'error');
                    const input = document.getElementById('commentInput');
                    const content = input.value.trim();
                    if (!content) return showToast('请输入评论内容', 'error');
                    const parentId = input.dataset.parentId || null;
                    const replyToUserId = input.dataset.replyToUserId || null;
                    const insertData = { post_id: postId, user_id: currentUser.id, content };
                    if (parentId) { insertData.parent_id = parentId; insertData.reply_to_user_id = replyToUserId; }
                    const { error } = await supabaseClient.from('comments').insert(insertData);
                    if (error) return showToast('评论失败: ' + error.message, 'error');
                    input.value = '';
                    delete input.dataset.parentId;
                    delete input.dataset.replyToUserId;
                    await loadComments(postId, postAuthorId);
                });
            }

            async function toggleLike(postId, btn) {
                if (isTogglingLike) return;
                isTogglingLike = true;
                if (btn) btn.disabled = true;
                try {
                    const existing = await supabaseClient.from('likes').select('id').eq('user_id', currentUser.id).eq('post_id', postId).maybeSingle();
                    if (existing.data) {
                        await supabaseClient.from('likes').delete().eq('id', existing.data.id);
                    } else {
                        await supabaseClient.from('likes').insert({ user_id: currentUser.id, post_id: postId });
                    }
                    await loadPostDetail(postId);
                } finally {
                    isTogglingLike = false;
                }
            }

            async function toggleFavorite(postId, btn) {
                if (isTogglingFavorite) return;
                isTogglingFavorite = true;
                if (btn) btn.disabled = true;
                try {
                    const existing = await supabaseClient.from('favorites').select('id').eq('user_id', currentUser.id).eq('post_id', postId).maybeSingle();
                    if (existing.data) {
                        await supabaseClient.from('favorites').delete().eq('id', existing.data.id);
                    } else {
                        await supabaseClient.from('favorites').insert({ user_id: currentUser.id, post_id: postId, is_public: true });
                    }
                    await loadPostDetail(postId);
                } finally {
                    isTogglingFavorite = false;
                }
            }

            async function toggleCommentLike(commentId, btn) {
                const existing = await supabaseClient.from('likes').select('id').eq('user_id', currentUser.id).eq('comment_id', commentId).maybeSingle();
                if (existing.data) {
                    await supabaseClient.from('likes').delete().eq('id', existing.data.id);
                } else {
                    await supabaseClient.from('likes').insert({ user_id: currentUser.id, comment_id: commentId });
                }
                const postId = document.getElementById('commentsList')?.dataset.postId;
                const postAuthorId = document.getElementById('commentsList')?.dataset.postAuthorId;
                if (postId) loadComments(postId, postAuthorId);
            }

            function showShareModal(postId) {
                if (window._modalLock) return;
                window._modalLock = true;
                document.querySelector('.modal-overlay')?.remove();

                supabaseClient
                    .from('posts')
                    .select('*, profiles:user_id(id, username, nickname, avatar_url)')
                    .eq('id', postId)
                    .single()
                    .then(async ({ data: post }) => {
                        if (!post) {
                            showToast('帖子不存在', 'error');
                            window._modalLock = false;
                            return;
                        }
                        const { data: follows } = await supabaseClient
                            .from('follows')
                            .select('following:following_id(id, username, nickname, avatar_url)')
                            .eq('follower_id', currentUser.id);
                        let friendListHtml = '';
                        if (follows && follows.length > 0) {
                            friendListHtml = follows.map(f => {
                                const friend = f.following;
                                return `
                                    <div class="share-friend-item" data-user-id="${friend.id}">
                                        <div class="share-friend-avatar">${comp.getUserAvatarHTML(friend, 'avatar-sm')}</div>
                                        <div class="share-friend-info">
                                            <div class="share-friend-name">${comp.getUserDisplayName(friend)}</div>
                                            <div class="share-friend-id">${comp.getUserHandle(friend)}</div>
                                        </div>
                                        <button class="share-send-btn" data-user-id="${friend.id}">
                                            ${comp.Icons.send}
                                        </button>
                                    </div>
                                `;
                            }).join('');
                        } else {
                            friendListHtml = '<div class="share-empty">暂无互关好友</div>';
                        }
                        const content = `
                            <div class="share-modal">
                                <div class="share-modal-title">分享帖子</div>
                                <div class="share-friend-list">${friendListHtml}</div>
                                <div class="share-bottom">
                                    <div class="share-id-row">
                                        <input type="text" id="sharePostIdInput" value="${post.public_id || post.id}" readonly />
                                        <button class="btn btn-secondary" id="copyPostIdBtn">复制</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        const modal = comp.openModal('分享', content);
                        const observer = new MutationObserver(() => {
                            if (!document.body.contains(modal)) {
                                window._modalLock = false;
                                observer.disconnect();
                            }
                        });
                        observer.observe(modal.parentElement, { childList: true, subtree: true });
                        modal.querySelectorAll('.share-send-btn').forEach(btn => {
                            btn.addEventListener('click', async (e) => {
                                e.stopPropagation();
                                const receiverId = btn.dataset.userId;
                                const cardData = {
                                    type: 'post_card',
                                    post_id: post.id,
                                    content: post.content || '',
                                    author: {
                                        id: post.profiles.id,
                                        username: post.profiles.username,
                                        nickname: post.profiles.nickname,
                                        avatar_url: post.profiles.avatar_url
                                    },
                                    media: post.media || [],
                                    created_at: post.created_at
                                };
                                const { error } = await supabaseClient
                                    .from('messages')
                                    .insert({
                                        sender_id: currentUser.id,
                                        receiver_id: receiverId,
                                        content: JSON.stringify(cardData),
                                        is_read: false
                                    });
                                if (error) {
                                    showToast('发送失败: ' + error.message, 'error');
                                } else {
                                    showToast('已发送帖子卡片', 'success');
                                    modal.remove();
                                    window._modalLock = false;
                                }
                            });
                        });
                        modal.querySelector('#copyPostIdBtn').addEventListener('click', () => {
                            const input = modal.querySelector('#sharePostIdInput');
                            input.select();
                            navigator.clipboard.writeText(input.value).then(() => showToast('已复制帖子 ID', 'success'))
                                .catch(() => { document.execCommand('copy'); showToast('已复制帖子 ID', 'success'); });
                        });
                    })
                    .catch(() => { window._modalLock = false; });
            }

            function showReportModal(targetType, targetId) {
                if (window._modalLock) return;
                window._modalLock = true;
                document.querySelector('.modal-overlay')?.remove();
                const reasonOptions = ['血腥', '恶意病毒文件', '政治', '招嫖', '诈骗', '其他'];
                const content = `<div class="form-group"><label>举报原因</label><select id="reportReason">${reasonOptions.map(r => `<option value="${r}">${r}</option>`).join('')}</select></div><div class="form-group"><label>详细描述</label><textarea id="reportDesc"></textarea></div><div class="form-group"><label>图片证据（可选）</label><input type="file" id="reportEvidence" accept="image/*" multiple></div><button class="btn btn-danger" id="submitReportBtn">提交举报</button>`;
                const modal = comp.openModal('举报', content);
                const observer = new MutationObserver(() => {
                    if (!document.body.contains(modal)) {
                        window._modalLock = false;
                        observer.disconnect();
                    }
                });
                observer.observe(modal.parentElement, { childList: true, subtree: true });
                modal.querySelector('#submitReportBtn').addEventListener('click', async () => {
                    const reason = modal.querySelector('#reportReason').value;
                    const desc = modal.querySelector('#reportDesc').value.trim();
                    let evidenceUrls = [];
                    for (const file of modal.querySelector('#reportEvidence').files) {
                        const uploaded = await uploadFile(file, 'reports', 'evidence');
                        evidenceUrls.push(uploaded.url);
                    }
                    await supabaseClient.from('reports').insert({ reporter_id: currentUser.id, target_type: targetType, target_id: targetId, reason, description: desc, evidence_urls: evidenceUrls });
                    modal.remove();
                    window._modalLock = false;
                    showToast('举报已提交', 'success');
                });
            }

            async function showEditPostModal(postId) {
                if (window._modalLock) return;
                window._modalLock = true;
                document.querySelector('.modal-overlay')?.remove();
                const { data: post } = await supabaseClient.from('posts').select('*').eq('id', postId).single();
                if (!post) { window._modalLock = false; return; }
                const content = `<div class="form-group"><label>内容</label><textarea id="editPostContent">${post.content || ''}</textarea></div><button class="btn btn-primary" id="saveEditBtn">保存修改</button>`;
                const modal = comp.openModal('编辑帖子', content);
                const observer = new MutationObserver(() => {
                    if (!document.body.contains(modal)) {
                        window._modalLock = false;
                        observer.disconnect();
                    }
                });
                observer.observe(modal.parentElement, { childList: true, subtree: true });
                modal.querySelector('#saveEditBtn').addEventListener('click', async () => {
                    const newContent = modal.querySelector('#editPostContent').value;
                    await supabaseClient.from('posts').update({ content: newContent, is_edited: true, edited_at: new Date().toISOString() }).eq('id', postId);
                    modal.remove();
                    window._modalLock = false;
                    showToast('已更新', 'success');
                    loadPostDetail(postId);
                });
            }

            async function shareComment(commentId) {
                if (window._modalLock) return;
                window._modalLock = true;
                document.querySelector('.modal-overlay')?.remove();
                const { data: comment } = await supabaseClient.from('comments').select('content, post_id').eq('id', commentId).single();
                if (!comment) { window._modalLock = false; return; }
                const shareContent = comment.content || '';
                const postLink = window.location.origin + '/post-detail.html?type=post&id=' + comment.post_id;
                const content = `<p>分享评论：</p><p style="background:var(--bg-light);padding:8px;border-radius:6px;">${shareContent}</p><button class="btn btn-secondary" id="copyCommentBtn">复制评论</button><button class="btn btn-secondary" id="copyPostLinkBtn">复制帖子链接</button><hr><p>发送到好友私聊：</p><div id="friendList"></div>`;
                const modal = comp.openModal('分享评论', content);
                const observer = new MutationObserver(() => {
                    if (!document.body.contains(modal)) {
                        window._modalLock = false;
                        observer.disconnect();
                    }
                });
                observer.observe(modal.parentElement, { childList: true, subtree: true });
                modal.querySelector('#copyCommentBtn').addEventListener('click', () => navigator.clipboard.writeText(shareContent).then(() => showToast('评论已复制', 'success')));
                modal.querySelector('#copyPostLinkBtn').addEventListener('click', () => navigator.clipboard.writeText(postLink).then(() => showToast('链接已复制', 'success')));
                const friendListDiv = modal.querySelector('#friendList');
                const { data: follows } = await supabaseClient.from('follows').select('following:following_id(id, username, nickname, avatar_url)').eq('follower_id', currentUser.id);
                if (follows?.length) follows.forEach(f => {
                    const btn = document.createElement('button'); btn.className = 'btn btn-secondary btn-sm'; btn.textContent = comp.getUserDisplayName(f.following);
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('messages').insert({ sender_id: currentUser.id, receiver_id: f.following.id, content: `分享评论：${shareContent}`, is_read: false });
                        modal.remove();
                        window._modalLock = false;
                        showToast('已发送到私聊','success');
                    });
                    friendListDiv.appendChild(btn);
                });
                else friendListDiv.innerHTML = '<p>暂无好友</p>';
            }

            // ==================== 话题详情 ====================
            async function loadTopicDetail(topicId) {
                if (!topicId) return showToast('缺少话题 ID', 'error');
                const container = document.getElementById('detailContainer');
                container.innerHTML = '加载中...';
                const { data: topic, error } = await supabaseClient.from('topics').select('*').eq('id', topicId).single();
                if (error || !topic) return container.innerHTML = '<p>话题不存在</p>';
                container.innerHTML = `
                    <h2>${topic.name}</h2>
                    <p>${topic.description || ''}</p>
                    ${currentUser.is_admin && topic.public_id ? `<div style="font-size:13px;color:var(--text-light);">ID: ${topic.public_id}</div>` : ''}
                    <div class="post-actions" style="margin:16px 0;">
                        <button class="action-btn" data-action="like-topic" data-topic-id="${topic.id}">${comp.Icons.heart} 点赞</button>
                        <button class="action-btn" data-action="favorite-topic" data-topic-id="${topic.id}">${comp.Icons.bookmark} 收藏</button>
                        <button class="action-btn" data-action="share-topic" data-topic-id="${topic.id}">${comp.Icons.share} 分享</button>
                        <button class="action-btn" data-action="report-topic" data-topic-id="${topic.id}">${comp.Icons.flag} 举报</button>
                    </div>
                    <div id="topicComposer" style="margin:16px 0;">
                        <textarea id="topicPostContent" placeholder="发布讨论..." rows="3"></textarea>
                        <input type="file" id="topicPostFiles" multiple style="margin-top:8px;" />
                        <button class="btn btn-primary" id="submitTopicPostBtn" style="margin-top:8px;">发布讨论</button>
                    </div>
                    <h3>讨论</h3>
                    <div id="topicPosts"></div>
                `;
                container.addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-action]');
                    if (!btn) return;
                    if (btn.dataset.action === 'like-topic') showToast('话题点赞开发中', 'info');
                    else if (btn.dataset.action === 'favorite-topic') showToast('话题收藏开发中', 'info');
                    else if (btn.dataset.action === 'share-topic') showToast('话题分享开发中', 'info');
                    else if (btn.dataset.action === 'report-topic') showReportModal('topic', topicId);
                });
                document.getElementById('submitTopicPostBtn').addEventListener('click', async () => {
                    if (currentUser.is_banned) return showToast('你已被封禁，无法发布', 'error');
                    const content = document.getElementById('topicPostContent').value.trim();
                    const filesInput = document.getElementById('topicPostFiles');
                    if (!content && filesInput.files.length === 0) return showToast('请输入内容或选择文件', 'error');
                    let media = [];
                    if (filesInput.files.length > 0) {
                        try {
                            media = await uploadFiles(filesInput.files, 'posts', 'posts');
                        } catch (err) {
                            return showToast('文件上传失败: ' + err.message, 'error');
                        }
                    }
                    const publicId = generatePublicId();
                    const { data: newPost, error: postError } = await supabaseClient
                        .from('posts')
                        .insert({ user_id: currentUser.id, content, media, public_id: publicId })
                        .select()
                        .single();
                    if (postError) return showToast('发布失败: ' + postError.message, 'error');
                    const { error: linkError } = await supabaseClient
                        .from('topic_posts')
                        .insert({ topic_id: topicId, post_id: newPost.id });
                    if (linkError) return showToast('关联话题失败: ' + linkError.message, 'error');
                    showToast('讨论已发布', 'success');
                    document.getElementById('topicPostContent').value = '';
                    filesInput.value = '';
                    await loadTopicPosts(topicId);
                });
                await loadTopicPosts(topicId);
            }

            async function loadTopicPosts(topicId) {
                const postsDiv = document.getElementById('topicPosts');
                postsDiv.innerHTML = '加载中...';
                const { data: topicPosts, error } = await supabaseClient.from('topic_posts').select('post:post_id(*, profiles:user_id(id, username, nickname, avatar_url, is_online, is_banned))').eq('topic_id', topicId).order('created_at', { ascending: false });
                if (error || !topicPosts?.length) return postsDiv.innerHTML = '<p>暂无讨论</p>';
                postsDiv.innerHTML = '';
                const posts = topicPosts.map(tp => tp.post).sort((a,b) => (b.like_count - a.like_count) || (new Date(b.created_at) - new Date(a.created_at)));
                for (const post of posts) {
                    const [likeRes, favRes] = await Promise.all([
                        supabaseClient.from('likes').select('id').eq('user_id', currentUser.id).eq('post_id', post.id).maybeSingle(),
                        supabaseClient.from('favorites').select('id').eq('user_id', currentUser.id).eq('post_id', post.id).maybeSingle()
                    ]);
                    post.liked_by_me = !!likeRes.data;
                    post.favorited_by_me = !!favRes.data;
                    post.is_owner = post.user_id === currentUser.id;
                    postsDiv.appendChild(comp.renderPostCard(post));
                }
                postsDiv.addEventListener('click', (e) => {
                    const card = e.target.closest('.post-card');
                    if (card && !e.target.closest('[data-action]') && !e.target.closest('.media-item')) {
                        const pid = card.querySelector('[data-post-id]')?.dataset.postId;
                        if (pid) window.location.href = 'post-detail.html?type=post&id=' + pid;
                    }
                });
            }

            // ==================== 公告详情 ====================
            async function loadAnnouncementDetail(announcementId) {
                if (!announcementId) return showToast('缺少公告 ID', 'error');
                const container = document.getElementById('detailContainer');
                container.innerHTML = '加载中...';
                const { data: ann, error } = await supabaseClient.from('announcements').select('*').eq('id', announcementId).single();
                if (error || !ann) return container.innerHTML = '<p>公告不存在</p>';
                container.innerHTML = `
                    <h2>${ann.title}</h2>
                    <div class="post-content">${ann.content || ''}</div>
                    <div style="font-size:13px;color:var(--text-light); margin-bottom:16px;">${timeAgo(ann.created_at)}</div>
                `;
                if (ann.files?.length) {
                    const filesDiv = document.createElement('div');
                    ann.files.forEach(file => filesDiv.appendChild(comp.renderFileDetail(file)));
                    container.appendChild(filesDiv);
                }
                if (ann.referenced_posts?.length) {
                    const postsDiv = document.createElement('div');
                    postsDiv.innerHTML = '<h3>引用帖子</h3>';
                    for (const postId of ann.referenced_posts) {
                        const { data: post } = await supabaseClient.from('posts').select('*, profiles:user_id(id, username, nickname, avatar_url, is_online, is_banned)').eq('id', postId).single();
                        if (post) postsDiv.appendChild(comp.renderPostCard(post));
                    }
                    container.appendChild(postsDiv);
                }
                if (ann.referenced_topics?.length) {
                    const topicsDiv = document.createElement('div');
                    topicsDiv.innerHTML = '<h3>引用话题</h3>';
                    for (const topicId of ann.referenced_topics) {
                        const { data: topic } = await supabaseClient.from('topics').select('*').eq('id', topicId).single();
                        if (topic) topicsDiv.appendChild(comp.renderTopicCard(topic));
                    }
                    container.appendChild(topicsDiv);
                }
            }

            // ==================== 用户主页（含帖子/话题列表） ====================
            async function loadUserProfile(userId) {
                if (!userId) return showToast('缺少用户 ID', 'error');
                const container = document.getElementById('detailContainer');
                container.innerHTML = '加载中...';

                const { data: profile, error } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();
                if (error || !profile) return container.innerHTML = '<p>用户不存在</p>';

                const isOwnProfile = userId === currentUser.id;

                // 统计
                const [{ count: followingCount }, { count: followerCount }, { count: favCount }] = await Promise.all([
                    supabaseClient.from('follows').select('id', { count: 'exact', head: true }).eq('follower_id', userId),
                    supabaseClient.from('follows').select('id', { count: 'exact', head: true }).eq('following_id', userId),
                    supabaseClient.from('favorites').select('id', { count: 'exact', head: true }).eq('user_id', userId)
                ]);

                // 关注状态（仅他人主页需要）
                let isFollowing = false;
                let isMutual = false;
                if (!isOwnProfile) {
                    const { data: followData } = await supabaseClient.from('follows').select('id').eq('follower_id', currentUser.id).eq('following_id', userId).maybeSingle();
                    isFollowing = !!followData;
                    const { data: reverseFollow } = await supabaseClient.from('follows').select('id').eq('follower_id', userId).eq('following_id', currentUser.id).maybeSingle();
                    isMutual = isFollowing && !!reverseFollow;
                }

                // 隐私
                const favPublic = profile.favorites_public !== false;
                const followingPublic = profile.following_public === true;

                // ---------- 生成 HTML ----------
                let html = `
                    <div style="position:relative; display:inline-block; float:right;">
                        <button class="btn btn-secondary btn-sm" id="moreMenuBtn">${comp.Icons.more}</button>
                    </div>
                    <div class="profile-header" style="display:flex;align-items:center;gap:20px;margin:20px 0;">
                        ${comp.getUserAvatarHTML(profile, 'avatar-lg')}
                        <div>
                            <h2>${comp.getUserDisplayName(profile)}</h2>
                            <p>${comp.getUserHandle(profile)}</p>
                            <p style="color:var(--text-secondary);">${profile.bio || '暂无简介'}</p>
                            <p style="font-size:13px;color:var(--text-light);">注册于 ${new Date(profile.created_at).toLocaleDateString()}</p>
                            ${isOwnProfile ? `<p style="font-size:13px;color:var(--text-secondary);">邮箱：${currentUser.email || '未绑定'}</p>` : ''}
                        </div>
                    </div>

                    <!-- 统计数字 -->
                    <div style="display:flex; gap:24px; margin-bottom:20px; flex-wrap:wrap;">
                        <span class="stat-link ${(followingPublic || isOwnProfile) ? '' : 'disabled'}" 
                              data-action="${(followingPublic || isOwnProfile) ? 'view-following' : ''}" 
                              data-user-id="${profile.id}"
                              style="${(followingPublic || isOwnProfile) ? 'cursor:pointer;color:var(--text-main);' : 'cursor:default;color:var(--text-light);'}">
                            关注 <strong>${followingCount || 0}</strong>
                        </span>
                        <span class="stat-link ${(followingPublic || isOwnProfile) ? '' : 'disabled'}" 
                              data-action="${(followingPublic || isOwnProfile) ? 'view-followers' : ''}" 
                              data-user-id="${profile.id}"
                              style="${(followingPublic || isOwnProfile) ? 'cursor:pointer;color:var(--text-main);' : 'cursor:default;color:var(--text-light);'}">
                            粉丝 <strong>${followerCount || 0}</strong>
                        </span>
                        <span class="stat-link ${(favPublic || isOwnProfile) ? '' : 'disabled'}" 
                              data-action="${(favPublic || isOwnProfile) ? 'view-favorites' : ''}" 
                              data-user-id="${profile.id}"
                              style="${(favPublic || isOwnProfile) ? 'cursor:pointer;color:var(--text-main);' : 'cursor:default;color:var(--text-light);'}">
                            收藏 <strong>${favCount || 0}</strong>
                        </span>
                    </div>

                    <!-- 操作按钮 -->
                    <div style="display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;">
                `;

                if (isOwnProfile) {
                    html += `
                        <button class="btn btn-primary" id="chatBtn">私聊</button>
                        <button class="btn btn-secondary" id="editProfileBtn">编辑资料</button>
                    `;
                } else {
                    if (isFollowing) {
                        html += `<button class="btn btn-secondary" id="unfollowBtn" style="min-width:80px;">取关</button>`;
                    } else {
                        html += `<button class="btn btn-primary" id="followBtn">关注</button>`;
                    }
                    if (!isMutual) {
                        html += `<button class="btn btn-primary" id="friendRequestBtn">好友请求</button>`;
                    } else {
                        html += `<button class="btn btn-secondary" disabled style="opacity:0.6;">已互关</button>`;
                    }
                    html += `<button class="btn btn-primary" id="chatBtn">私聊</button>`;
                }

                html += `
                    </div>

                    <!-- 帖子/话题标签 -->
                    <div class="profile-tabs">
                        <span class="profile-tab active" data-tab="posts">帖子</span>
                        <span class="profile-tab" data-tab="topics">话题</span>
                    </div>
                    <div id="profileContent" class="profile-content">
                        <div class="loading">加载中...</div>
                    </div>
                `;

                container.innerHTML = html;

                // ---------- 事件绑定 ----------
                // 私聊按钮
                document.getElementById('chatBtn').addEventListener('click', () => {
                    window.location.href = 'chat.html?userId=' + userId;
                });

                // 更多菜单
                document.getElementById('moreMenuBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const menu = document.createElement('div');
                    menu.className = 'more-menu';
                    const menuItems = isOwnProfile
                        ? `<button data-action="settings">设置</button><button data-action="share-profile" data-user-id="${profile.id}">分享主页</button>`
                        : `<button data-action="report-user" data-user-id="${profile.id}">举报</button><button data-action="block-user" data-user-id="${profile.id}">拉黑</button><button data-action="share-profile" data-user-id="${profile.id}">分享主页</button>`;
                    menu.innerHTML = menuItems;
                    document.body.appendChild(menu);
                    document.addEventListener('click', function closeMenu(ev) {
                        if (!menu.contains(ev.target) && ev.target !== document.getElementById('moreMenuBtn')) {
                            menu.remove();
                            document.removeEventListener('click', closeMenu);
                        }
                    });
                });

                // 编辑资料（仅自己）
                const editBtn = document.getElementById('editProfileBtn');
                if (editBtn) {
                    editBtn.addEventListener('click', () => {
                        window.location.href = 'app.html#profile';
                    });
                }

                // 关注/取关（仅他人）
                const followBtn = document.getElementById('followBtn');
                if (followBtn) followBtn.addEventListener('click', async () => {
                    await supabaseClient.from('follows').insert({ follower_id: currentUser.id, following_id: userId });
                    showToast('已关注', 'success');
                    loadUserProfile(userId);
                });
                const unfollowBtn = document.getElementById('unfollowBtn');
                if (unfollowBtn) unfollowBtn.addEventListener('click', async () => {
                    await supabaseClient.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', userId);
                    showToast('已取关', 'success');
                    loadUserProfile(userId);
                });

                // 好友请求（仅他人）
                const friendReqBtn = document.getElementById('friendRequestBtn');
                if (friendReqBtn) {
                    friendReqBtn.addEventListener('click', async () => {
                        const existing = await supabaseClient.from('friend_requests').select('id').eq('sender_id', currentUser.id).eq('receiver_id', userId).maybeSingle();
                        if (existing.data) return showToast('已发送好友请求', 'error');
                        await supabaseClient.from('friend_requests').insert({ sender_id: currentUser.id, receiver_id: userId, status: 'pending' });
                        showToast('好友请求已发送', 'success');
                    });
                }

                // 统计数字点击
                container.querySelectorAll('.stat-link').forEach(el => {
                    el.addEventListener('click', async (e) => {
                        const action = el.dataset.action;
                        if (!action) return;
                        const isOwn = isOwnProfile;
                        if (action === 'view-following') {
                            if (!followingPublic && !isOwn) return showToast('该用户未公开关注列表', 'error');
                            const { data: list } = await supabaseClient.from('follows').select('following:following_id(id, username, nickname, avatar_url, is_banned)').eq('follower_id', userId).limit(50);
                            if (!list?.length) return showToast('暂无关注', 'error');
                            let html = '<ul style="list-style:none;padding:0;">';
                            list.forEach(item => {
                                const u = item.following;
                                html += `<li style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);">${comp.getUserAvatarHTML(u,'avatar-sm')}<span class="post-user-name">${comp.getUserDisplayName(u)}</span><span class="post-user-id">${comp.getUserHandle(u)}</span></li>`;
                            });
                            html += '</ul>';
                            comp.openModal('关注列表', html);
                        } else if (action === 'view-followers') {
                            if (!followingPublic && !isOwn) return showToast('该用户未公开粉丝列表', 'error');
                            const { data: list } = await supabaseClient.from('follows').select('follower:follower_id(id, username, nickname, avatar_url, is_banned)').eq('following_id', userId).limit(50);
                            if (!list?.length) return showToast('暂无粉丝', 'error');
                            let html = '<ul style="list-style:none;padding:0;">';
                            list.forEach(item => {
                                const u = item.follower;
                                html += `<li style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);">${comp.getUserAvatarHTML(u,'avatar-sm')}<span class="post-user-name">${comp.getUserDisplayName(u)}</span><span class="post-user-id">${comp.getUserHandle(u)}</span></li>`;
                            });
                            html += '</ul>';
                            comp.openModal('粉丝列表', html);
                        } else if (action === 'view-favorites') {
                            if (!favPublic && !isOwn) return showToast('该用户未公开收藏列表', 'error');
                            const { data: favs } = await supabaseClient.from('favorites').select('post:post_id(*, profiles:user_id(id, username, nickname, avatar_url, is_online, is_banned))').eq('user_id', userId).order('created_at', { ascending: false });
                            if (!favs?.length) return showToast('暂无公开收藏', 'error');
                            const container2 = document.createElement('div');
                            favs.forEach(f => { if (f.post) { f.post.is_owner = f.post.user_id === currentUser.id; container2.appendChild(comp.renderPostCard(f.post)); } });
                            comp.openModal('收藏列表', container2.innerHTML);
                        }
                    });
                });

                // 分享主页/举报/拉黑/设置
                document.querySelector('[data-action="share-profile"]')?.addEventListener('click', () => {
                    const url = window.location.origin + '/post-detail.html?type=user&id=' + userId;
                    comp.openModal('分享主页', `<p>复制链接：</p><input type="text" value="${url}" readonly style="width:100%;margin-bottom:12px;" onclick="this.select();document.execCommand('copy');showToast('已复制','success');">`);
                });
                document.querySelector('[data-action="settings"]')?.addEventListener('click', () => {
                    window.location.href = 'app.html#profile';
                });
                document.querySelector('[data-action="report-user"]')?.addEventListener('click', () => showReportModal('user', userId));
                document.querySelector('[data-action="block-user"]')?.addEventListener('click', async () => {
                    await supabaseClient.from('blocked_users').insert({ user_id: currentUser.id, blocked_user_id: userId });
                    showToast('已拉黑', 'success');
                    loadUserProfile(userId);
                });

                // ===== 加载帖子/话题列表 =====
                const contentDiv = document.getElementById('profileContent');
                let currentTab = 'posts';

                async function loadUserPosts() {
                    contentDiv.innerHTML = '加载帖子...';
                    const { data: posts, error } = await supabaseClient
                        .from('posts')
                        .select('*, profiles:user_id(id, username, nickname, avatar_url, is_online, is_banned)')
                        .eq('user_id', userId)
                        .order('created_at', { ascending: false });
                    if (error) {
                        contentDiv.innerHTML = '<p>加载失败</p>';
                        return;
                    }
                    if (!posts || posts.length === 0) {
                        contentDiv.innerHTML = '<p>该用户暂无帖子</p>';
                        return;
                    }
                    contentDiv.innerHTML = '';
                    for (const post of posts) {
                        const [likeRes, favRes] = await Promise.all([
                            supabaseClient.from('likes').select('id').eq('user_id', currentUser.id).eq('post_id', post.id).maybeSingle(),
                            supabaseClient.from('favorites').select('id').eq('user_id', currentUser.id).eq('post_id', post.id).maybeSingle()
                        ]);
                        post.liked_by_me = !!likeRes.data;
                        post.favorited_by_me = !!favRes.data;
                        post.is_owner = post.user_id === currentUser.id;
                        contentDiv.appendChild(comp.renderPostCard(post));
                    }
                }

                async function loadUserTopics() {
                    contentDiv.innerHTML = '加载话题...';
                    const { data: topics, error } = await supabaseClient
                        .from('topics')
                        .select('*, creator:creator_id(id, username, nickname, avatar_url)')
                        .eq('creator_id', userId)
                        .eq('status', 'approved')
                        .order('created_at', { ascending: false });
                    if (error) {
                        contentDiv.innerHTML = '<p>加载失败</p>';
                        return;
                    }
                    if (!topics || topics.length === 0) {
                        contentDiv.innerHTML = '<p>该用户暂无话题</p>';
                        return;
                    }
                    contentDiv.innerHTML = '';
                    topics.forEach(topic => {
                        contentDiv.appendChild(comp.renderTopicCard(topic, { showJoin: true }));
                    });
                }

                // 标签切换
                const tabs = container.querySelectorAll('.profile-tab');
                tabs.forEach(tab => {
                    tab.addEventListener('click', () => {
                        tabs.forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        const tabName = tab.dataset.tab;
                        currentTab = tabName;
                        if (tabName === 'posts') {
                            loadUserPosts();
                        } else {
                            loadUserTopics();
                        }
                    });
                });

                // 默认加载帖子
                loadUserPosts();

                // 分享主页/举报/拉黑/设置（继续绑定，但已完成）
            }

            function generatePublicId() {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < 8; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
                return result;
            }

            function timeAgo(dateStr) {
                if (!dateStr) return '';
                const now = new Date();
                const date = new Date(dateStr);
                const seconds = Math.floor((now - date) / 1000);
                if (seconds < 60) return '刚刚';
                const minutes = Math.floor(seconds / 60);
                if (minutes < 60) return minutes + '分钟前';
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return hours + '小时前';
                const days = Math.floor(hours / 24);
                if (days < 30) return days + '天前';
                return new Date(dateStr).toLocaleDateString();
            }

            window._modalLock = false;
            init();
        })();
    </script>
</body>
</html>
