<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 发帖</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- marked.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* ===== 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        .post-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
            position: relative;
        }

        /* ===== 顶部工具栏 ===== */
        .post-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            min-height: 48px;
            background: white;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
            flex-wrap: wrap;
        }
        .post-toolbar .toolbar-btn {
            background: none;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            white-space: nowrap;
        }
        .post-toolbar .toolbar-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }
        .post-toolbar .toolbar-btn svg {
            width: 18px;
            height: 18px;
        }
        .post-toolbar .toolbar-btn.active {
            color: var(--primary);
            background: var(--primary-light);
        }
        .post-toolbar .toolbar-spacer {
            flex: 1;
        }
        .post-toolbar .toolbar-label {
            font-size: 12px;
            color: var(--text-light);
            padding: 0 4px;
        }

        /* ===== 内容区 ===== */
        .post-content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 12px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        /* ===== 输入框（强制无边框） ===== */
        .post-content-area #postContent {
            width: 100%;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            resize: none;
            font-size: 18px;
            line-height: 1.7;
            font-family: inherit;
            color: var(--text-main);
            background: transparent;
            padding: 0;
            min-height: 180px;
            flex-shrink: 0;
        }
        .post-content-area #postContent:focus {
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }
        .post-content-area #postContent::placeholder {
            color: var(--text-light);
            font-size: 18px;
        }

        /* ===== Markdown 预览 ===== */
        .post-content-area .markdown-preview {
            display: none;
            width: 100%;
            min-height: 180px;
            font-size: 17px;
            line-height: 1.8;
            color: var(--text-main);
            padding: 0;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .post-content-area .markdown-preview.active {
            display: block;
        }
        .post-content-area .markdown-preview h1,
        .post-content-area .markdown-preview h2,
        .post-content-area .markdown-preview h3,
        .post-content-area .markdown-preview h4 {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .post-content-area .markdown-preview h1 {
            font-size: 28px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .post-content-area .markdown-preview h2 {
            font-size: 24px;
        }
        .post-content-area .markdown-preview h3 {
            font-size: 20px;
        }
        .post-content-area .markdown-preview h4 {
            font-size: 18px;
        }
        .post-content-area .markdown-preview p {
            margin-bottom: 12px;
        }
        .post-content-area .markdown-preview ul,
        .post-content-area .markdown-preview ol {
            padding-left: 28px;
            margin-bottom: 12px;
        }
        .post-content-area .markdown-preview li {
            margin-bottom: 4px;
        }
        .post-content-area .markdown-preview blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 16px;
            margin: 12px 0;
            color: var(--text-secondary);
        }
        .post-content-area .markdown-preview code {
            background: var(--bg-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: monospace;
        }
        .post-content-area .markdown-preview pre {
            background: var(--bg-light);
            padding: 12px 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
            margin: 12px 0;
        }
        .post-content-area .markdown-preview pre code {
            background: transparent;
            padding: 0;
        }
        .post-content-area .markdown-preview a {
            color: var(--primary);
            text-decoration: underline;
        }
        .post-content-area .markdown-preview img {
            max-width: 100%;
            border-radius: var(--radius);
            margin: 8px 0;
        }

        /* ===== 分界线 ===== */
        .post-divider {
            border-top: 1px solid var(--border);
            margin: 12px 0 14px;
            flex-shrink: 0;
        }

        /* ===== 底部按钮 ===== */
        .post-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 4px 0 16px;
            flex-shrink: 0;
        }
        .post-actions .btn {
            padding: 10px 28px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            min-width: 80px;
            text-align: center;
        }
        .post-actions .btn-cancel {
            background: var(--bg-light);
            color: var(--text-secondary);
        }
        .post-actions .btn-cancel:hover {
            background: #e2e8f0;
        }
        .post-actions .btn-publish {
            background: var(--primary);
            color: white;
        }
        .post-actions .btn-publish:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .post-actions .btn-publish:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== 二次确认弹窗 ===== */
        .confirm-modal .modal {
            max-width: 400px;
        }
        .confirm-modal .modal-body {
            font-size: 15px;
            color: var(--text-secondary);
            text-align: center;
            padding: 8px 0 16px;
        }
        .confirm-modal .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }
        .confirm-modal .modal-footer .btn {
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .confirm-modal .modal-footer .btn-secondary {
            background: var(--bg-light);
            color: var(--text-secondary);
        }
        .confirm-modal .modal-footer .btn-secondary:hover {
            background: #e2e8f0;
        }
        .confirm-modal .modal-footer .btn-danger {
            background: var(--danger);
            color: white;
        }
        .confirm-modal .modal-footer .btn-danger:hover {
            background: var(--danger-dark);
        }
        .confirm-modal .modal-footer .btn-primary {
            background: var(--primary);
            color: white;
        }
        .confirm-modal .modal-footer .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* ===== Markdown 帮助弹窗 ===== */
        .help-modal .modal {
            max-width: 560px;
        }
        .help-modal .modal-body {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .help-modal .modal-body code {
            background: var(--bg-light);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .help-modal .modal-body .help-row {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 6px 0;
        }
        .help-modal .modal-body .help-row:last-child {
            border-bottom: none;
        }
        .help-modal .modal-body .help-syntax {
            width: 120px;
            font-weight: 500;
            color: var(--text-main);
            flex-shrink: 0;
        }
        .help-modal .modal-body .help-desc {
            color: var(--text-secondary);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .post-toolbar {
                padding: 4px 10px;
                min-height: 40px;
                gap: 4px;
            }
            .post-toolbar .toolbar-btn {
                padding: 4px 8px;
                font-size: 12px;
            }
            .post-toolbar .toolbar-btn svg {
                width: 16px;
                height: 16px;
            }
            .post-content-area {
                padding: 12px 16px 8px;
            }
            .post-content-area #postContent {
                font-size: 16px;
                min-height: 140px;
            }
            .post-content-area #postContent::placeholder {
                font-size: 16px;
            }
            .post-content-area .markdown-preview {
                font-size: 15px;
                min-height: 140px;
            }
            .post-actions .btn {
                padding: 8px 20px;
                font-size: 14px;
                min-width: 60px;
            }
            .post-divider {
                margin: 8px 0 10px;
            }
            .help-modal .modal-body .help-syntax {
                width: 80px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="post-container">
        <!-- ===== 顶部工具栏 ===== -->
        <div class="post-toolbar" id="toolbar">
            <!-- 预览切换按钮 -->
            <button class="toolbar-btn" id="previewToggle" title="切换 Markdown 预览">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <span id="previewLabel">预览</span>
            </button>

            <!-- 帮助按钮 -->
            <button class="toolbar-btn" id="helpBtn" title="Markdown 使用帮助">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                帮助
            </button>

            <span class="toolbar-spacer"></span>
            <span class="toolbar-label">Markdown 已启用</span>
        </div>

        <!-- ===== 内容区 ===== -->
        <div class="post-content-area" id="contentArea">
            <!-- 输入框 -->
            <textarea id="postContent" placeholder="写点什么... 支持 Markdown 语法" autofocus></textarea>

            <!-- Markdown 预览区 -->
            <div class="markdown-preview" id="markdownPreview"></div>

            <!-- 分界线 -->
            <div class="post-divider"></div>

            <!-- 底部按钮 -->
            <div class="post-actions">
                <button class="btn btn-cancel" id="cancelBtn">取消</button>
                <button class="btn btn-publish" id="publishBtn">发布</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script>
        (function() {
            const cfg = window.BikanConfig;
            const comp = window.BikanComponents;
            const { supabaseClient, sdkReady, showToast } = cfg;
            const { openModal } = comp;

            let currentUser = null;
            const textarea = document.getElementById('postContent');
            const previewDiv = document.getElementById('markdownPreview');
            const contentArea = document.getElementById('contentArea');
            const cancelBtn = document.getElementById('cancelBtn');
            const publishBtn = document.getElementById('publishBtn');
            const previewToggle = document.getElementById('previewToggle');
            const previewLabel = document.getElementById('previewLabel');
            const helpBtn = document.getElementById('helpBtn');

            let isPreviewMode = false;

            // ============================================================
            // 1. 初始化
            // ============================================================
            async function init() {
                if (!sdkReady) {
                    showToast('Supabase 未初始化', 'error');
                    return;
                }
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (!session) {
                        window.location.href = 'index.html';
                        return;
                    }
                    const { data: profile } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', session.user.id)
                        .single();
                    if (!profile) {
                        showToast('获取用户信息失败', 'error');
                        return;
                    }
                    currentUser = profile;

                    if (currentUser.is_banned) {
                        showToast('你已被封禁，无法发帖', 'error');
                        setTimeout(() => {
                            window.location.href = 'app.html';
                        }, 1500);
                        return;
                    }

                    // 初始调整
                    adjustTextareaHeight();
                    bindEvents();
                    textarea.focus();

                } catch (e) {
                    console.error('初始化失败', e);
                    showToast('初始化失败: ' + e.message, 'error');
                }
            }

            // ============================================================
            // 2. 调整输入框高度
            // ============================================================
            function adjustTextareaHeight() {
                textarea.style.height = 'auto';
                const toolbarHeight = document.querySelector('.post-toolbar').offsetHeight;
                const dividerHeight = document.querySelector('.post-divider').offsetHeight;
                const actionsHeight = document.querySelector('.post-actions').offsetHeight;
                const contentPadding = 16 + 12;
                const gap = 12 + 14;
                const availableHeight = window.innerHeight - toolbarHeight - dividerHeight - actionsHeight - contentPadding - gap;
                const contentHeight = textarea.scrollHeight;
                const targetHeight = Math.max(contentHeight, availableHeight, 180);
                textarea.style.height = targetHeight + 'px';

                // 预览区高度同步
                previewDiv.style.minHeight = targetHeight + 'px';
            }

            function onInput() {
                textarea.style.height = 'auto';
                const contentHeight = textarea.scrollHeight;
                const toolbarHeight = document.querySelector('.post-toolbar').offsetHeight;
                const dividerHeight = document.querySelector('.post-divider').offsetHeight;
                const actionsHeight = document.querySelector('.post-actions').offsetHeight;
                const contentPadding = 16 + 12;
                const gap = 12 + 14;
                const minHeight = Math.max(
                    window.innerHeight - toolbarHeight - dividerHeight - actionsHeight - contentPadding - gap,
                    180
                );
                const targetHeight = Math.max(contentHeight, minHeight);
                textarea.style.height = targetHeight + 'px';
                previewDiv.style.minHeight = targetHeight + 'px';

                // 预览模式下实时渲染
                if (isPreviewMode) {
                    renderMarkdown();
                }
            }

            function onResize() {
                adjustTextareaHeight();
            }

            // ============================================================
            // 3. Markdown 渲染
            // ============================================================
            function renderMarkdown() {
                const raw = textarea.value || '';
                try {
                    const html = marked.parse(raw);
                    previewDiv.innerHTML = html;
                } catch (e) {
                    previewDiv.innerHTML = '<p style="color:var(--danger);">渲染出错，请检查 Markdown 语法</p>';
                }
            }

            // ============================================================
            // 4. 切换预览模式
            // ============================================================
            function togglePreview() {
                isPreviewMode = !isPreviewMode;

                if (isPreviewMode) {
                    // 切换到预览
                    textarea.style.display = 'none';
                    previewDiv.classList.add('active');
                    renderMarkdown();
                    previewLabel.textContent = '编辑';
                    previewToggle.classList.add('active');
                } else {
                    // 切回编辑
                    textarea.style.display = 'block';
                    previewDiv.classList.remove('active');
                    previewLabel.textContent = '预览';
                    previewToggle.classList.remove('active');
                    // 恢复输入框高度
                    setTimeout(adjustTextareaHeight, 50);
                }
            }

            // ============================================================
            // 5. Markdown 帮助
            // ============================================================
            function showHelp() {
                const helpContent = `
                    <div class="help-modal">
                        <div style="margin-bottom:12px;font-size:15px;font-weight:600;color:var(--text-main);">Markdown 语法速查</div>
                        <div class="help-row"><span class="help-syntax"><code># 标题</code></span><span class="help-desc">一级标题（最多支持 ###### 六级）</span></div>
                        <div class="help-row"><span class="help-syntax"><code>**粗体**</code></span><span class="help-desc">加粗文本</span></div>
                        <div class="help-row"><span class="help-syntax"><code>*斜体*</code></span><span class="help-desc">斜体文本</span></div>
                        <div class="help-row"><span class="help-syntax"><code>~~删除线~~</code></span><span class="help-desc">删除线</span></div>
                        <div class="help-row"><span class="help-syntax"><code>[链接](url)</code></span><span class="help-desc">插入超链接</span></div>
                        <div class="help-row"><span class="help-syntax"><code>![图片](url)</code></span><span class="help-desc">插入图片</span></div>
                        <div class="help-row"><span class="help-syntax"><code>- 列表项</code></span><span class="help-desc">无序列表（支持 + 和 *）</span></div>
                        <div class="help-row"><span class="help-syntax"><code>1. 列表项</code></span><span class="help-desc">有序列表</span></div>
                        <div class="help-row"><span class="help-syntax"><code>> 引用</code></span><span class="help-desc">引用块</span></div>
                        <div class="help-row"><span class="help-syntax"><code>`code`</code></span><span class="help-desc">行内代码</span></div>
                        <div class="help-row"><span class="help-syntax"><code>```代码块```</code></span><span class="help-desc">多行代码块（可指定语言）</span></div>
                        <div class="help-row"><span class="help-syntax"><code>---</code></span><span class="help-desc">分隔线</span></div>
                        <div style="margin-top:12px;font-size:13px;color:var(--text-light);">提示：发布后帖子内容将以 Markdown 格式渲染显示</div>
                    </div>
                `;

                const modal = openModal('Markdown 帮助', helpContent);
                // 给 modal 添加类用于样式
                modal.closest('.modal-overlay').classList.add('help-modal');
            }

            // ============================================================
            // 6. 事件绑定
            // ============================================================
            function bindEvents() {
                textarea.addEventListener('input', onInput);
                window.addEventListener('resize', onResize);

                // 预览切换
                previewToggle.addEventListener('click', togglePreview);

                // 帮助
                helpBtn.addEventListener('click', showHelp);

                // 取消
                cancelBtn.addEventListener('click', () => {
                    const content = textarea.value.trim();
                    if (content) {
                        showConfirmModal(
                            '取消发布',
                            '确定要取消发布吗？输入的内容将丢失。',
                            () => { window.location.href = 'app.html'; },
                            '取消发布',
                            'danger'
                        );
                    } else {
                        window.location.href = 'app.html';
                    }
                });

                // 发布
                publishBtn.addEventListener('click', () => {
                    const content = textarea.value.trim();
                    if (!content) {
                        showToast('请输入内容', 'error');
                        textarea.focus();
                        return;
                    }
                    showConfirmModal(
                        '发布帖子',
                        '确定发布此帖吗？发布后所有人都能看到。',
                        async () => { await doPublish(); },
                        '发布',
                        'primary'
                    );
                });

                // Ctrl+Enter
                textarea.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        publishBtn.click();
                    }
                });
            }

            // ============================================================
            // 7. 二次确认弹窗
            // ============================================================
            function showConfirmModal(title, message, onConfirm, confirmText, confirmType = 'primary') {
                const content = `
                    <div class="confirm-modal">
                        <div class="modal-body">${message}</div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" id="confirmCancelBtn">取消</button>
                            <button class="btn ${confirmType === 'danger' ? 'btn-danger' : 'btn-primary'}" id="confirmOkBtn">${confirmText}</button>
                        </div>
                    </div>
                `;

                const modal = openModal(title, content);

                modal.querySelector('#confirmCancelBtn').addEventListener('click', () => {
                    modal.closest('.modal-overlay').remove();
                });

                modal.querySelector('#confirmOkBtn').addEventListener('click', async () => {
                    modal.closest('.modal-overlay').remove();
                    if (typeof onConfirm === 'function') {
                        await onConfirm();
                    }
                });

                const overlay = modal.closest('.modal-overlay');
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.remove();
                    }
                });
            }

            // ============================================================
            // 8. 执行发布
            // ============================================================
            async function doPublish() {
                const content = textarea.value.trim();
                if (!content) {
                    showToast('请输入内容', 'error');
                    return;
                }

                publishBtn.disabled = true;
                publishBtn.textContent = '发布中...';

                try {
                    const publicId = generatePublicId();

                    // 保存原始 Markdown 内容（不转换）
                    const { data: newPost, error } = await supabaseClient
                        .from('posts')
                        .insert({
                            user_id: currentUser.id,
                            content: content, // 存 Markdown 源码
                            public_id: publicId,
                            // 后续可加字段: is_markdown: true
                        })
                        .select()
                        .single();

                    if (error) {
                        showToast('发布失败: ' + error.message, 'error');
                        publishBtn.disabled = false;
                        publishBtn.textContent = '发布';
                        return;
                    }

                    showToast('发布成功！', 'success');
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 800);

                } catch (e) {
                    console.error('发布异常', e);
                    showToast('发布失败: ' + e.message, 'error');
                    publishBtn.disabled = false;
                    publishBtn.textContent = '发布';
                }
            }

            // ============================================================
            // 9. 工具函数
            // ============================================================
            function generatePublicId() {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < 8; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            // ============================================================
            // 10. 启动
            // ============================================================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
