    <style>
        :root {
            --primary: #3ecf8e;
            --primary-dark: #2bb673;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: #3ecf8e;
            --error: #ff6b6b;
            --success: #3ecf8e;
            --google-bg: #ffffff;
            --google-text: #3c4043;
            --google-hover: #f8f9fa;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --toolbar-height: 56px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
        }

        /* ========== 顶部工具栏 ========== */
        .toolbar {
            height: var(--toolbar-height);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 10;
            overflow-x: auto;
        }

        .toolbar-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--card-border);
            margin: 0 8px;
            flex-shrink: 0;
        }

        .toolbar-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition);
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .toolbar-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .toolbar-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .toolbar-btn.active {
            background: rgba(62, 207, 142, 0.15);
            color: var(--primary);
        }

        .toolbar-btn.primary {
            color: var(--primary);
        }
        .toolbar-btn.primary:hover {
            background: rgba(62, 207, 142, 0.2);
        }

        .toolbar-btn.danger {
            color: var(--error);
        }
        .toolbar-btn.danger:hover {
            background: rgba(255, 107, 107, 0.15);
        }

        /* ========== 编辑区容器 ========== */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }

        /* 编辑器文本域 */
        .editor-textarea {
            flex: 1;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text-primary);
            font-size: 16px;
            line-height: 1.6;
            padding: 20px 24px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            transition: background var(--transition);
        }
        .editor-textarea:focus {
            background: rgba(255, 255, 255, 0.02);
        }
        .editor-textarea::placeholder {
            color: var(--text-muted);
        }

        /* 预览区域 */
        .preview-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-primary);
            display: none;
            background: rgba(255, 255, 255, 0.02);
        }
        .preview-area.show {
            display: block;
        }
        .preview-area h1,
        .preview-area h2,
        .preview-area h3,
        .preview-area h4 {
            margin: 16px 0 8px;
            line-height: 1.3;
        }
        .preview-area h1 { font-size: 2em; }
        .preview-area h2 { font-size: 1.5em; }
        .preview-area h3 { font-size: 1.17em; }
        .preview-area p { margin: 8px 0; }
        .preview-area code {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .preview-area pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }
        .preview-area pre code {
            background: none;
            padding: 0;
        }
        .preview-area a {
            color: var(--primary);
            text-decoration: none;
        }
        .preview-area a:hover {
            text-decoration: underline;
        }
        .preview-area blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 16px;
            margin: 8px 0;
            color: var(--text-secondary);
        }
        .preview-area ul,
        .preview-area ol {
            padding-left: 24px;
            margin: 8px 0;
        }
        .preview-area img {
            max-width: 100%;
            border-radius: 8px;
        }

        /* ========== 弹窗覆盖层 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px 28px;
            max-width: 480px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            color: var(--text-primary);
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: all var(--transition);
        }
        .form-input:focus {
            border-color: var(--input-focus);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(62, 207, 142, 0.15);
        }
        .form-input.error {
            border-color: var(--error);
        }
        .form-textarea {
            min-height: 80px;
            resize: vertical;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #2bb673);
            color: #0f0c29;
            box-shadow: 0 4px 12px rgba(62, 207, 142, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 18px rgba(62, 207, 142, 0.5);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-danger {
            background: rgba(255, 107, 107, 0.15);
            color: #ffb3b3;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        .btn-danger:hover {
            background: rgba(255, 107, 107, 0.25);
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 12px 24px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 300;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .toolbar {
                padding: 0 12px;
            }
            .editor-textarea {
                padding: 15px;
                font-size: 15px;
            }
            .modal {
                padding: 20px;
            }
        }
    </style>
</head>

            }

            // 打开设置弹窗
            function openSettings() {
                cardTitleInput.value = cardMeta.title || '';
                cardDescriptionInput.value = cardMeta.description || '';
                settingsModal.classList.add('show');
                cardTitleInput.focus();
            }

            // 关闭设置弹窗
            function closeSettings() {
                settingsModal.classList.remove('show');
            }

            // 保存设置
            function saveSettings() {
                const title = cardTitleInput.value.trim();
                const description = cardDescriptionInput.value.trim();
                if (!title || !description) {
                    showToast('标题和简介均为必填项');
                    if (!title) cardTitleInput.classList.add('error');
                    if (!description) cardDescriptionInput.classList.add('error');
                    setTimeout(() => {
                        cardTitleInput.classList.remove('error');
                        cardDescriptionInput.classList.remove('error');
                    }, 2000);
                    return;
                }
                cardMeta.title = title;
                cardMeta.description = description;
                closeSettings();
                showToast('设置已保存');
            }

            // 切换预览
            function togglePreview() {
                isPreviewMode = !isPreviewMode;
                if (isPreviewMode) {
                    const markdown = editor.value;
                    const html = marked.parse(markdown);
                    previewArea.innerHTML = html;
                    previewArea.classList.add('show');
                    editor.style.display = 'none';
                    previewBtn.classList.add('active');
                } else {
                    previewArea.classList.remove('show');
                    editor.style.display = 'block';
                    previewBtn.classList.remove('active');
                    editor.focus();
                }
            }

            // 在光标处插入 Markdown 语法
            function insertMarkdown(action) {
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const selectedText = editor.value.substring(start, end);
                let insertion = '';
                let cursorOffset = 0;

                switch (action) {
                    case 'heading':
                        insertion = `# ${selectedText || '标题'}`;
                        cursorOffset = insertion.length;
                        break;
                    case 'bold':
                        insertion = `**${selectedText || '加粗文本'}**`;
                        cursorOffset = 2;
                        break;
                    case 'italic':
                        insertion = `*${selectedText || '斜体文本'}*`;
                        cursorOffset = 1;
                        break;
                    case 'strike':
                        insertion = `~~${selectedText || '删除线文本'}~~`;
                        cursorOffset = 2;
                        break;
                    case 'link':
                        insertion = `[${selectedText || '链接文字'}](https://)`;
                        cursorOffset = insertion.length - 1;
                        break;
                    case 'quote':
                        insertion = `> ${selectedText || '引用内容'}`;
                        cursorOffset = insertion.length;
                        break;
                    case 'code':
                        insertion = `\`\`\`\n${selectedText || '代码'}\n\`\`\``;
                        cursorOffset = 3;
                        break;
                    case 'list-ul':
                        insertion = `\n- ${selectedText || '列表项'}`;
                        cursorOffset = insertion.length;
                        break;
                    case 'list-ol':
                        insertion = `\n1. ${selectedText || '列表项'}`;
                        cursorOffset = insertion.length;
                        break;
                    case 'hr':
                        insertion = `\n---\n`;
                        cursorOffset = insertion.length;
                        break;
                    default:
                        return;
                }

                const newValue = editor.value.substring(0, start) + insertion + editor.value.substring(end);
                editor.value = newValue;
                const newCursorPos = start + cursorOffset;
                editor.focus();
                editor.setSelectionRange(newCursorPos, newCursorPos);
            }

            // 工具栏按钮事件
            document.querySelectorAll('.toolbar-btn[data-action]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const action = this.dataset.action;
                    insertMarkdown(action);
                });
            });

            // 预览按钮
            previewBtn.addEventListener('click', togglePreview);

            // 设置按钮
            settingsBtn.addEventListener('click', openSettings);
            cancelSettingsBtn.addEventListener('click', closeSettings);
            saveSettingsBtn.addEventListener('click', saveSettings);
            cardTitleInput.addEventListener('input', () => cardTitleInput.classList.remove('error'));
            cardDescriptionInput.addEventListener('input', () => cardDescriptionInput.classList.remove('error'));

            // 保存草稿
            function saveDraft() {
                const draft = {
                    content: editor.value,
                    meta: cardMeta,
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem('draft_website_post', JSON.stringify(draft));
                showToast('草稿已保存');
            }
            saveDraftBtn.addEventListener('click', saveDraft);

            // 加载草稿（如果有）
            function loadDraft() {
                const saved = localStorage.getItem('draft_website_post');
                if (saved) {
                    try {
                        const draft = JSON.parse(saved);
                        editor.value = draft.content || '';
                        cardMeta = draft.meta || { title: '', description: '' };
                        showToast('已恢复上次草稿');
                    } catch (e) {
                        console.error('草稿解析失败:', e);
                    }
                }
            }

            // 发布流程
            function openPublishConfirm() {
                if (!cardMeta.title || !cardMeta.description) {
                    showToast('请先在设置中填写卡片标题和简介');
                    openSettings();
                    return;
                }
                if (!editor.value.trim()) {
                    showToast('内容不能为空');
                    return;
                }
                publishModal.classList.add('show');
            }

            function cancelPublish() {
                publishModal.classList.remove('show');
            }

            function confirmPublish() {
                // 模拟发布操作
                const postData = {
                    content: editor.value,
                    title: cardMeta.title,
                    description: cardMeta.description,
                    author: '当前用户',
                    timestamp: new Date().toISOString()
                };
                console.log('发布数据:', postData);
                // 这里将来会调用 Supabase 写入数据库
                publishModal.classList.remove('show');
                showToast('已提交审核，感谢分享！');
                // 清空编辑区和设置，清除草稿
                editor.value = '';
                cardMeta = { title: '', description: '' };
                localStorage.removeItem('draft_website_post');
                // 跳转回主页
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1500);
            }

            publishBtn.addEventListener('click', openPublishConfirm);
            cancelPublishBtn.addEventListener('click', cancelPublish);
            confirmPublishBtn.addEventListener('click', confirmPublish);

            // 键盘快捷键：Ctrl+S 保存草稿，Ctrl+P 预览
            editor.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    saveDraft();
                }
                if (e.ctrlKey && e.key === 'p') {
                    e.preventDefault();
                    togglePreview();
                }
            });

            // 初始化：加载草稿
            loadDraft();

            // 自动调整编辑器高度（虽然占满容器，但保留扩展）
            function adjustEditorHeight() {
                // 可以在这里添加，但编辑器目前使用flex占满高度，无需额外操作
            }

            // 获取当前用户（可选）
            async function checkUser() {
                if (supabase) {
                    try {
                        const { data: { user } } = await supabase.auth.getUser();
                        if (!user) {
                            // 如果未登录，跳转登录页
                            window.location.href = 'index.html';
                        }
                    } catch (err) {
                        console.error('获取用户失败:', err);
                    }
                }
            }
            checkUser();

            // 暴露函数给内联事件（如果有的话）
            window.togglePreview = togglePreview;
            window.openSettings = openSettings;
            window.saveSettings = saveSettings;
            window.cancelSettings = closeSettings;
            window.saveDraft = saveDraft;
            window.openPublishConfirm = openPublishConfirm;
            window.cancelPublish = cancelPublish;
            window.confirmPublish = confirmPublish;

        })();
    </script>
</body>
</html>
