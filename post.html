<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 发帖</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 引入 marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* ===== 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        .post-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
            position: relative;
        }

        /* ===== 顶部工具栏 ===== */
        .post-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            min-height: 48px;
            background: white;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
            flex-wrap: wrap;
        }
        .post-toolbar .toolbar-btn {
            background: none;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
        }
        .post-toolbar .toolbar-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }
        .post-toolbar .toolbar-btn.active {
            background: var(--primary-light);
            color: var(--primary);
        }
        .post-toolbar .toolbar-btn svg {
            width: 18px;
            height: 18px;
        }
        .post-toolbar .toolbar-spacer {
            flex: 1;
        }

        /* ===== 内容区（可滚动） ===== */
        .post-content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 12px;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== 输入框（强制无边框） ===== */
        .post-content-area #postContent {
            width: 100%;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            resize: none;
            font-size: 18px;
            line-height: 1.7;
            font-family: inherit;
            color: var(--text-main);
            background: transparent;
            padding: 0;
            min-height: 180px;
            flex-shrink: 0;
        }
        .post-content-area #postContent:focus {
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }
        .post-content-area #postContent::placeholder {
            color: var(--text-light);
            font-size: 18px;
        }

        /* ===== 预览区域 ===== */
        .post-content-area #preview {
            display: none;
            width: 100%;
            font-size: 17px;
            line-height: 1.8;
            color: var(--text-main);
            padding: 0;
            min-height: 180px;
            overflow-y: auto;
        }
        .post-content-area #preview.show {
            display: block;
        }
        .post-content-area #preview h1,
        .post-content-area #preview h2,
        .post-content-area #preview h3 {
            margin: 16px 0 8px;
            font-weight: 600;
        }
        .post-content-area #preview h1 {
            font-size: 26px;
        }
        .post-content-area #preview h2 {
            font-size: 22px;
        }
        .post-content-area #preview h3 {
            font-size: 18px;
        }
        .post-content-area #preview p {
            margin: 0 0 12px;
        }
        .post-content-area #preview ul,
        .post-content-area #preview ol {
            padding-left: 24px;
            margin: 8px 0 12px;
        }
        .post-content-area #preview blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 16px;
            margin: 8px 0 12px;
            color: var(--text-secondary);
        }
        .post-content-area #preview code {
            background: var(--bg-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: monospace;
        }
        .post-content-area #preview pre {
            background: var(--bg-light);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0 12px;
        }
        .post-content-area #preview pre code {
            background: transparent;
            padding: 0;
        }
        .post-content-area #preview img {
            max-width: 100%;
            border-radius: 8px;
            margin: 8px 0;
        }
        .post-content-area #preview a {
            color: var(--primary);
            text-decoration: underline;
        }
        .post-content-area #preview table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0 12px;
        }
        .post-content-area #preview th,
        .post-content-area #preview td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left;
        }
        .post-content-area #preview th {
            background: var(--bg-light);
        }

        /* ===== 分界线 ===== */
        .post-divider {
            border-top: 1px solid var(--border);
            margin: 12px 0 14px;
            flex-shrink: 0;
        }

        /* ===== 底部按钮区域 ===== */
        .post-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 4px 0 16px;
            flex-shrink: 0;
        }
        .post-actions .btn {
            padding: 10px 28px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            min-width: 80px;
            text-align: center;
        }
        .post-actions .btn-cancel {
            background: var(--bg-light);
            color: var(--text-secondary);
        }
        .post-actions .btn-cancel:hover {
            background: #e2e8f0;
        }
        .post-actions .btn-publish {
            background: var(--primary);
            color: white;
        }
        .post-actions .btn-publish:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .post-actions .btn-publish:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== 二次确认弹窗 ===== */
        .confirm-modal .modal {
            max-width: 400px;
        }
        .confirm-modal .modal-body {
            font-size: 15px;
            color: var(--text-secondary);
            text-align: center;
            padding: 8px 0 16px;
        }
        .confirm-modal .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }
        .confirm-modal .modal-footer .btn {
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .confirm-modal .modal-footer .btn-secondary {
            background: var(--bg-light);
            color: var(--text-secondary);
        }
        .confirm-modal .modal-footer .btn-secondary:hover {
            background: #e2e8f0;
        }
        .confirm-modal .modal-footer .btn-danger {
            background: var(--danger);
            color: white;
        }
        .confirm-modal .modal-footer .btn-danger:hover {
            background: var(--danger-dark);
        }
        .confirm-modal .modal-footer .btn-primary {
            background: var(--primary);
            color: white;
        }
        .confirm-modal .modal-footer .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* ===== Markdown 帮助弹窗 ===== */
        .help-modal .modal {
            max-width: 560px;
        }
        .help-modal .modal-body {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-main);
        }
        .help-modal .modal-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
        }
        .help-modal .modal-body th,
        .help-modal .modal-body td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left;
        }
        .help-modal .modal-body th {
            background: var(--bg-light);
        }
        .help-modal .modal-body code {
            background: var(--bg-light);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 0.9em;
            font-family: monospace;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .post-toolbar {
                padding: 4px 10px;
                min-height: 40px;
                gap: 4px;
            }
            .post-toolbar .toolbar-btn {
                padding: 4px 8px;
                font-size: 12px;
            }
            .post-toolbar .toolbar-btn svg {
                width: 16px;
                height: 16px;
            }
            .post-content-area {
                padding: 12px 16px 8px;
            }
            .post-content-area #postContent {
                font-size: 16px;
                min-height: 140px;
            }
            .post-content-area #postContent::placeholder {
                font-size: 16px;
            }
            .post-content-area #preview {
                font-size: 15px;
            }
            .post-actions .btn {
                padding: 8px 20px;
                font-size: 14px;
                min-width: 60px;
            }
            .post-divider {
                margin: 8px 0 10px;
            }
        }
    </style>
</head>
<body>
    <div class="post-container">
        <!-- ===== 顶部工具栏 ===== -->
        <div class="post-toolbar" id="toolbar">
            <!-- Markdown 帮助按钮 -->
            <button class="toolbar-btn" id="helpBtn" title="Markdown 语法帮助">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                    <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
                Markdown 帮助
            </button>

            <!-- 预览切换按钮 -->
            <button class="toolbar-btn" id="previewBtn" title="预览 Markdown">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                <span id="previewBtnText">预览</span>
            </button>

            <span class="toolbar-spacer"></span>

            <!-- 字符计数（可选） -->
            <span style="font-size:12px;color:var(--text-light);" id="charCount">0</span>
        </div>

        <!-- ===== 内容区 ===== -->
        <div class="post-content-area" id="contentArea">
            <!-- 输入框 -->
            <textarea id="postContent" placeholder="支持 Markdown 语法..." autofocus></textarea>

            <!-- 预览区域 -->
            <div id="preview"></div>

            <!-- 分界线 -->
            <div class="post-divider"></div>

            <!-- 底部按钮 -->
            <div class="post-actions">
                <button class="btn btn-cancel" id="cancelBtn">取消</button>
                <button class="btn btn-publish" id="publishBtn">发布</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script>
        (function() {
            const cfg = window.BikanConfig;
            const comp = window.BikanComponents;
            const { supabaseClient, sdkReady, showToast } = cfg;
            const { openModal } = comp;

            let currentUser = null;
            const textarea = document.getElementById('postContent');
            const previewDiv = document.getElementById('preview');
            const contentArea = document.getElementById('contentArea');
            const cancelBtn = document.getElementById('cancelBtn');
            const publishBtn = document.getElementById('publishBtn');
            const helpBtn = document.getElementById('helpBtn');
            const previewBtn = document.getElementById('previewBtn');
            const previewBtnText = document.getElementById('previewBtnText');
            const charCount = document.getElementById('charCount');

            let previewMode = false;

            // ============================================================
            // 1. 初始化
            // ============================================================
            async function init() {
                if (!sdkReady) {
                    showToast('Supabase 未初始化', 'error');
                    return;
                }
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (!session) {
                        window.location.href = 'index.html';
                        return;
                    }
                    const { data: profile } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', session.user.id)
                        .single();
                    if (!profile) {
                        showToast('获取用户信息失败', 'error');
                        return;
                    }
                    currentUser = profile;

                    if (currentUser.is_banned) {
                        showToast('你已被封禁，无法发帖', 'error');
                        setTimeout(() => {
                            window.location.href = 'app.html';
                        }, 1500);
                        return;
                    }

                    // 初始调整输入框高度
                    adjustTextareaHeight();

                    // 绑定事件
                    bindEvents();

                    // 聚焦输入框
                    textarea.focus();

                    // 更新字符数
                    updateCharCount();

                } catch (e) {
                    console.error('初始化失败', e);
                    showToast('初始化失败: ' + e.message, 'error');
                }
            }

            // ============================================================
            // 2. 调整输入框高度
            // ============================================================
            function adjustTextareaHeight() {
                textarea.style.height = 'auto';
                const toolbarHeight = document.querySelector('.post-toolbar').offsetHeight;
                const dividerHeight = document.querySelector('.post-divider').offsetHeight;
                const actionsHeight = document.querySelector('.post-actions').offsetHeight;
                const contentPadding = 16 + 12;
                const gap = 12 + 14;
                const availableHeight = window.innerHeight - toolbarHeight - dividerHeight - actionsHeight - contentPadding - gap;
                const contentHeight = textarea.scrollHeight;
                const targetHeight = Math.max(contentHeight, availableHeight, 180);
                textarea.style.height = targetHeight + 'px';
            }

            function onInput() {
                textarea.style.height = 'auto';
                const contentHeight = textarea.scrollHeight;
                const toolbarHeight = document.querySelector('.post-toolbar').offsetHeight;
                const dividerHeight = document.querySelector('.post-divider').offsetHeight;
                const actionsHeight = document.querySelector('.post-actions').offsetHeight;
                const contentPadding = 16 + 12;
                const gap = 12 + 14;
                const minHeight = Math.max(
                    window.innerHeight - toolbarHeight - dividerHeight - actionsHeight - contentPadding - gap,
                    180
                );
                textarea.style.height = Math.max(contentHeight, minHeight) + 'px';

                updateCharCount();

                // 如果在预览模式下，实时更新预览
                if (previewMode) {
                    renderPreview();
                }
            }

            function onResize() {
                adjustTextareaHeight();
            }

            // ============================================================
            // 3. 字符计数
            // ============================================================
            function updateCharCount() {
                const len = textarea.value.length;
                charCount.textContent = len + (len > 0 ? '' : '');
            }

            // ============================================================
            // 4. Markdown 渲染
            // ============================================================
            function renderPreview() {
                const raw = textarea.value;
                if (!raw.trim()) {
                    previewDiv.innerHTML = '<p style="color:var(--text-light);">预览区域为空</p>';
                    return;
                }
                try {
                    const html = marked.parse(raw);
                    previewDiv.innerHTML = html;
                } catch (e) {
                    previewDiv.innerHTML = '<p style="color:var(--danger);">渲染错误：' + e.message + '</p>';
                }
            }

            // ============================================================
            // 5. 切换预览模式
            // ============================================================
            function togglePreview() {
                previewMode = !previewMode;
                if (previewMode) {
                    // 进入预览模式
                    textarea.style.display = 'none';
                    previewDiv.classList.add('show');
                    renderPreview();
                    previewBtnText.textContent = '编辑';
                    previewBtn.classList.add('active');
                    // 调整预览区域高度
                    previewDiv.style.minHeight = textarea.style.height || '180px';
                } else {
                    // 退出预览模式
                    textarea.style.display = 'block';
                    previewDiv.classList.remove('show');
                    previewBtnText.textContent = '预览';
                    previewBtn.classList.remove('active');
                    // 重新调整输入框高度
                    adjustTextareaHeight();
                    textarea.focus();
                }
            }

            // ============================================================
            // 6. Markdown 帮助弹窗
            // ============================================================
            function showHelpModal() {
                const content = `
                    <div class="help-modal">
                        <h3 style="margin-bottom:12px;">Markdown 语法速查</h3>
                        <table>
                            <thead><tr><th>语法</th><th>效果</th></tr></thead>
                            <tbody>
                                <tr><td><code># 标题</code></td><td>一级标题</td></tr>
                                <tr><td><code>## 标题</code></td><td>二级标题</td></tr>
                                <tr><td><code>**粗体**</code></td><td><strong>粗体</strong></td></tr>
                                <tr><td><code>*斜体*</code></td><td><em>斜体</em></td></tr>
                                <tr><td><code>- 列表项</code></td><td>无序列表</td></tr>
                                <tr><td><code>1. 列表项</code></td><td>有序列表</td></tr>
                                <tr><td><code>[文字](链接)</code></td><td><a href="#">链接</a></td></tr>
                                <tr><td><code>![alt](图片URL)</code></td><td>图片</td></tr>
                                <tr><td><code>> 引用</code></td><td>引用块</td></tr>
                                <tr><td><code>\`代码\`</code></td><td><code>行内代码</code></td></tr>
                                <tr><td><code>\`\`\`代码块\`\`\`</code></td><td>代码块</td></tr>
                            </tbody>
                        </table>
                        <p style="margin-top:12px;color:var(--text-light);font-size:13px;">更多语法请参考 <a href="https://markdown.com.cn" target="_blank">Markdown 中文教程</a></p>
                    </div>
                `;
                openModal('Markdown 帮助', content);
            }

            // ============================================================
            // 7. 事件绑定
            // ============================================================
            function bindEvents() {
                textarea.addEventListener('input', onInput);
                window.addEventListener('resize', onResize);

                // 取消
                cancelBtn.addEventListener('click', () => {
                    const content = textarea.value.trim();
                    if (content) {
                        showConfirmModal(
                            '取消发布',
                            '确定要取消发布吗？输入的内容将丢失。',
                            () => { window.location.href = 'app.html'; },
                            '取消发布',
                            'danger'
                        );
                    } else {
                        window.location.href = 'app.html';
                    }
                });

                // 发布
                publishBtn.addEventListener('click', () => {
                    const content = textarea.value.trim();
                    if (!content) {
                        showToast('请输入内容', 'error');
                        textarea.focus();
                        return;
                    }
                    showConfirmModal(
                        '发布帖子',
                        '确定发布此帖吗？发布后所有人都能看到。',
                        async () => { await doPublish(); },
                        '发布',
                        'primary'
                    );
                });

                // Ctrl+Enter 快速发布
                textarea.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        publishBtn.click();
                    }
                });

                // Markdown 帮助
                helpBtn.addEventListener('click', showHelpModal);

                // 预览切换
                previewBtn.addEventListener('click', togglePreview);
            }

            // ============================================================
            // 8. 二次确认弹窗
            // ============================================================
            function showConfirmModal(title, message, onConfirm, confirmText, confirmType = 'primary') {
                const content = `
                    <div class="confirm-modal">
                        <div class="modal-body">${message}</div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" id="confirmCancelBtn">取消</button>
                            <button class="btn ${confirmType === 'danger' ? 'btn-danger' : 'btn-primary'}" id="confirmOkBtn">${confirmText}</button>
                        </div>
                    </div>
                `;
                const modal = openModal(title, content);
                modal.querySelector('#confirmCancelBtn').addEventListener('click', () => {
                    modal.closest('.modal-overlay').remove();
                });
                modal.querySelector('#confirmOkBtn').addEventListener('click', async () => {
                    modal.closest('.modal-overlay').remove();
                    if (typeof onConfirm === 'function') {
                        await onConfirm();
                    }
                });
                const overlay = modal.closest('.modal-overlay');
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.remove();
                    }
                });
            }

            // ============================================================
            // 9. 执行发布
            // ============================================================
            async function doPublish() {
                const content = textarea.value.trim();
                if (!content) {
                    showToast('请输入内容', 'error');
                    return;
                }

                publishBtn.disabled = true;
                publishBtn.textContent = '发布中...';

                try {
                    const publicId = generatePublicId();
                    const { data: newPost, error } = await supabaseClient
                        .from('posts')
                        .insert({
                            user_id: currentUser.id,
                            content: content,
                            public_id: publicId,
                        })
                        .select()
                        .single();

                    if (error) {
                        showToast('发布失败: ' + error.message, 'error');
                        publishBtn.disabled = false;
                        publishBtn.textContent = '发布';
                        return;
                    }

                    showToast('发布成功！', 'success');
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 800);

                } catch (e) {
                    console.error('发布异常', e);
                    showToast('发布失败: ' + e.message, 'error');
                    publishBtn.disabled = false;
                    publishBtn.textContent = '发布';
                }
            }

            // ============================================================
            // 10. 工具函数
            // ============================================================
            function generatePublicId() {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < 8; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            // ============================================================
            // 11. 启动
            // ============================================================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
