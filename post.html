<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 发帖</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* ===== 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        .post-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
            position: relative;
        }

        /* ===== 顶部工具栏（预留） ===== */
        .post-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            min-height: 48px;
            background: white;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }
        .post-toolbar .toolbar-placeholder {
            font-size: 13px;
            color: var(--text-light);
        }
        .post-toolbar .toolbar-btn {
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
        }
        .post-toolbar .toolbar-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }
        .post-toolbar .toolbar-btn svg {
            width: 20px;
            height: 20px;
        }

        /* ===== 内容区（可滚动） ===== */
        .post-content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 12px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        /* ===== 输入框（强制无边框） ===== */
        .post-content-area #postContent {
            width: 100%;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            resize: none;
            font-size: 18px;
            line-height: 1.7;
            font-family: inherit;
            color: var(--text-main);
            background: transparent;
            padding: 0;
            min-height: 180px;
            flex-shrink: 0;
            /* 覆盖全局样式 */;
        }
        .post-content-area #postContent:focus {
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }
        .post-content-area #postContent::placeholder {
            color: var(--text-light);
            font-size: 18px;
        }

        /* ===== 分界线 ===== */
        .post-divider {
            border-top: 1px solid var(--border);
            margin: 12px 0 14px;
            flex-shrink: 0;
        }

        /* ===== 底部按钮区域 ===== */
        .post-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 4px 0 16px;
            flex-shrink: 0;
        }
        .post-actions .btn {
            padding: 10px 28px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            min-width: 80px;
            text-align: center;
        }
        .post-actions .btn-cancel {
            background: var(--bg-light);
            color: var(--text-secondary);
        }
        .post-actions .btn-cancel:hover {
            background: #e2e8f0;
        }
        .post-actions .btn-publish {
            background: var(--primary);
            color: white;
        }
        .post-actions .btn-publish:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .post-actions .btn-publish:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== 二次确认弹窗 ===== */
        .confirm-modal .modal {
            max-width: 400px;
        }
        .confirm-modal .modal-body {
            font-size: 15px;
            color: var(--text-secondary);
            text-align: center;
            padding: 8px 0 16px;
        }
        .confirm-modal .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 8px;
        }
        .confirm-modal .modal-footer .btn {
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .confirm-modal .modal-footer .btn-secondary {
            background: var(--bg-light);
            color: var(--text-secondary);
        }
        .confirm-modal .modal-footer .btn-secondary:hover {
            background: #e2e8f0;
        }
        .confirm-modal .modal-footer .btn-danger {
            background: var(--danger);
            color: white;
        }
        .confirm-modal .modal-footer .btn-danger:hover {
            background: var(--danger-dark);
        }
        .confirm-modal .modal-footer .btn-primary {
            background: var(--primary);
            color: white;
        }
        .confirm-modal .modal-footer .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .post-toolbar {
                padding: 6px 12px;
                min-height: 44px;
            }
            .post-content-area {
                padding: 12px 16px 8px;
            }
            .post-content-area #postContent {
                font-size: 16px;
                min-height: 140px;
            }
            .post-content-area #postContent::placeholder {
                font-size: 16px;
            }
            .post-actions .btn {
                padding: 8px 20px;
                font-size: 14px;
                min-width: 60px;
            }
            .post-divider {
                margin: 8px 0 10px;
            }
        }
    </style>
</head>
<body>
    <div class="post-container">
        <!-- ===== 顶部工具栏（预留） ===== -->
        <div class="post-toolbar" id="toolbar">
            <span class="toolbar-placeholder">工具栏（后续添加）</span>
        </div>

        <!-- ===== 内容区 ===== -->
        <div class="post-content-area" id="contentArea">
            <!-- 输入框 -->
            <textarea id="postContent" placeholder="写点什么..." autofocus></textarea>

            <!-- 分界线 -->
            <div class="post-divider"></div>

            <!-- 底部按钮 -->
            <div class="post-actions">
                <button class="btn btn-cancel" id="cancelBtn">取消</button>
                <button class="btn btn-publish" id="publishBtn">发布</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script>
        (function() {
            const cfg = window.BikanConfig;
            const comp = window.BikanComponents;
            const { supabaseClient, sdkReady, showToast } = cfg;
            const { openModal } = comp;

            let currentUser = null;
            const textarea = document.getElementById('postContent');
            const contentArea = document.getElementById('contentArea');
            const cancelBtn = document.getElementById('cancelBtn');
            const publishBtn = document.getElementById('publishBtn');

            // ============================================================
            // 1. 初始化
            // ============================================================
            async function init() {
                if (!sdkReady) {
                    showToast('Supabase 未初始化', 'error');
                    return;
                }
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (!session) {
                        window.location.href = 'index.html';
                        return;
                    }
                    const { data: profile } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', session.user.id)
                        .single();
                    if (!profile) {
                        showToast('获取用户信息失败', 'error');
                        return;
                    }
                    currentUser = profile;

                    if (currentUser.is_banned) {
                        showToast('你已被封禁，无法发帖', 'error');
                        setTimeout(() => {
                            window.location.href = 'app.html';
                        }, 1500);
                        return;
                    }

                    // 初始调整输入框高度
                    adjustTextareaHeight();

                    // 绑定事件
                    bindEvents();

                    // 聚焦输入框
                    textarea.focus();

                } catch (e) {
                    console.error('初始化失败', e);
                    showToast('初始化失败: ' + e.message, 'error');
                }
            }

            // ============================================================
            // 2. 调整输入框高度（占满剩余空间 + 随内容扩展）
            // ============================================================
            function adjustTextareaHeight() {
                // 先重置为 auto，获取内容实际高度
                textarea.style.height = 'auto';

                // 计算剩余空间
                const toolbarHeight = document.querySelector('.post-toolbar').offsetHeight;
                const dividerHeight = document.querySelector('.post-divider').offsetHeight;
                const actionsHeight = document.querySelector('.post-actions').offsetHeight;
                const contentPadding = 16 + 12; // padding-top + padding-bottom
                const gap = 12 + 14; // margin-top + margin-bottom (分界线)

                // 内容区可用高度 = 视口高度 - 工具栏 - 分界线 - 按钮 - 内边距 - 间距
                const availableHeight = window.innerHeight - toolbarHeight - dividerHeight - actionsHeight - contentPadding - gap;

                // 内容实际高度
                const contentHeight = textarea.scrollHeight;

                // 取较大值：至少占满可用空间，但不超过实际内容高度（防止内容被裁剪）
                // 但如果内容高度小于可用空间，就拉伸到可用空间
                const targetHeight = Math.max(contentHeight, availableHeight, 180);

                textarea.style.height = targetHeight + 'px';
            }

            // ============================================================
            // 3. 输入时自动调整高度
            // ============================================================
            function onInput() {
                // 先重置为 auto，让 scrollHeight 反映真实内容高度
                textarea.style.height = 'auto';

                // 获取内容实际高度
                const contentHeight = textarea.scrollHeight;

                // 获取最小高度（占满可用空间）
                const toolbarHeight = document.querySelector('.post-toolbar').offsetHeight;
                const dividerHeight = document.querySelector('.post-divider').offsetHeight;
                const actionsHeight = document.querySelector('.post-actions').offsetHeight;
                const contentPadding = 16 + 12;
                const gap = 12 + 14;
                const minHeight = Math.max(
                    window.innerHeight - toolbarHeight - dividerHeight - actionsHeight - contentPadding - gap,
                    180
                );

                // 取较大值
                textarea.style.height = Math.max(contentHeight, minHeight) + 'px';
            }

            // ============================================================
            // 4. 窗口变化时重新调整
            // ============================================================
            function onResize() {
                adjustTextareaHeight();
            }

            // ============================================================
            // 5. 事件绑定
            // ============================================================
            function bindEvents() {
                // 输入时调整高度
                textarea.addEventListener('input', onInput);

                // 窗口大小变化时调整
                window.addEventListener('resize', onResize);

                // 取消按钮 -> 二次确认
                cancelBtn.addEventListener('click', () => {
                    const content = textarea.value.trim();
                    if (content) {
                        showConfirmModal(
                            '取消发布',
                            '确定要取消发布吗？输入的内容将丢失。',
                            () => {
                                window.location.href = 'app.html';
                            },
                            '取消发布',
                            'danger'
                        );
                    } else {
                        window.location.href = 'app.html';
                    }
                });

                // 发布按钮 -> 二次确认
                publishBtn.addEventListener('click', () => {
                    const content = textarea.value.trim();
                    if (!content) {
                        showToast('请输入内容', 'error');
                        textarea.focus();
                        return;
                    }
                    showConfirmModal(
                        '发布帖子',
                        '确定发布此帖吗？发布后所有人都能看到。',
                        async () => {
                            await doPublish();
                        },
                        '发布',
                        'primary'
                    );
                });

                // Ctrl+Enter 快速发布
                textarea.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        publishBtn.click();
                    }
                });
            }

            // ============================================================
            // 6. 二次确认弹窗
            // ============================================================
            function showConfirmModal(title, message, onConfirm, confirmText, confirmType = 'primary') {
                const content = `
                    <div class="confirm-modal">
                        <div class="modal-body">${message}</div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" id="confirmCancelBtn">取消</button>
                            <button class="btn ${confirmType === 'danger' ? 'btn-danger' : 'btn-primary'}" id="confirmOkBtn">${confirmText}</button>
                        </div>
                    </div>
                `;

                const modal = openModal(title, content);

                // 取消 -> 关闭弹窗
                modal.querySelector('#confirmCancelBtn').addEventListener('click', () => {
                    modal.closest('.modal-overlay').remove();
                });

                // 确认 -> 执行回调
                modal.querySelector('#confirmOkBtn').addEventListener('click', async () => {
                    modal.closest('.modal-overlay').remove();
                    if (typeof onConfirm === 'function') {
                        await onConfirm();
                    }
                });

                // 点击遮罩关闭
                const overlay = modal.closest('.modal-overlay');
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.remove();
                    }
                });
            }

            // ============================================================
            // 7. 执行发布
            // ============================================================
            async function doPublish() {
                const content = textarea.value.trim();
                if (!content) {
                    showToast('请输入内容', 'error');
                    return;
                }

                publishBtn.disabled = true;
                publishBtn.textContent = '发布中...';

                try {
                    const publicId = generatePublicId();

                    const { data: newPost, error } = await supabaseClient
                        .from('posts')
                        .insert({
                            user_id: currentUser.id,
                            content: content,
                            public_id: publicId,
                        })
                        .select()
                        .single();

                    if (error) {
                        showToast('发布失败: ' + error.message, 'error');
                        publishBtn.disabled = false;
                        publishBtn.textContent = '发布';
                        return;
                    }

                    showToast('发布成功！', 'success');

                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 800);

                } catch (e) {
                    console.error('发布异常', e);
                    showToast('发布失败: ' + e.message, 'error');
                    publishBtn.disabled = false;
                    publishBtn.textContent = '发布';
                }
            }

            // ============================================================
            // 8. 工具函数
            // ============================================================
            function generatePublicId() {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let result = '';
                for (let i = 0; i < 8; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            // ============================================================
            // 9. 启动
            // ============================================================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
