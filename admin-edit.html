<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 管理卡片</title>

    <!-- 网站图标（favicon）使用新的黑色 Logo SVG -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Markdown 渲染库 (marked) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #3ecf8e;
            --primary-dark: #2bb673;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: #3ecf8e;
            --error: #ff6b6b;
            --success: #3ecf8e;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --toolbar-height: 56px;
            --bottom-bar-height: 64px;
            --media-library-height: 180px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
        }

        /* ========== 顶部工具栏 ========== */
        .toolbar {
            height: var(--toolbar-height);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 10;
            overflow-x: auto;
        }

        .toolbar-group { display: flex; gap: 4px; align-items: center; }
        .toolbar-divider { width: 1px; height: 24px; background: var(--card-border); margin: 0 8px; flex-shrink: 0; }

        .toolbar-btn {
            background: none; border: none; cursor: pointer; padding: 8px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; transition: background var(--transition);
            color: var(--text-secondary); flex-shrink: 0;
        }
        .toolbar-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
        .toolbar-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .toolbar-btn.active { background: rgba(62, 207, 142, 0.15); color: var(--primary); }

        /* ========== 编辑器容器 ========== */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }

        .editor-textarea {
            flex: 1;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text-primary);
            font-size: 16px;
            line-height: 1.6;
            padding: 20px 24px;
            font-family: 'Inter', sans-serif;
        }
        .editor-textarea::placeholder { color: var(--text-muted); }

        .preview-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-primary);
            display: none;
            background: rgba(255, 255, 255, 0.02);
        }
        .preview-area.show { display: block; }
        .preview-area h1, .preview-area h2, .preview-area h3, .preview-area h4 {
            margin: 16px 0 8px;
            line-height: 1.3;
        }
        .preview-area h1 { font-size: 2em; }
        .preview-area h2 { font-size: 1.5em; }
        .preview-area h3 { font-size: 1.17em; }
        .preview-area p { margin: 8px 0; }
        .preview-area code {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .preview-area pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }
        .preview-area pre code {
            background: none;
            padding: 0;
        }
        .preview-area a {
            color: var(--primary);
            text-decoration: none;
        }
        .preview-area a:hover { text-decoration: underline; }
        .preview-area blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 16px;
            margin: 8px 0;
            color: var(--text-secondary);
        }
        .preview-area ul, .preview-area ol {
            padding-left: 24px;
            margin: 8px 0;
        }
        .preview-area img {
            max-width: 100%;
            border-radius: 8px;
        }
        .preview-area video {
            max-width: 100%;
            border-radius: 8px;
        }
        .preview-area audio {
            width: 100%;
            margin: 8px 0;
        }

        /* ========== 素材库面板 ========== */
        .media-library-panel {
            height: var(--media-library-height);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease;
            flex-shrink: 0;
            overflow: hidden;
        }
        .media-library-panel.collapsed {
            height: 36px;
        }
        .media-library-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 16px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }
        .media-library-header .toggle-icon {
            transition: transform 0.3s ease;
            font-size: 12px;
        }
        .media-library-panel.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }
        .media-library-title {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            flex: 1;
        }
        .media-library-actions {
            display: flex;
            gap: 8px;
        }
        .media-library-actions .toolbar-btn {
            padding: 4px;
        }
        .media-library-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-content: flex-start;
        }
        .media-library-empty {
            color: var(--text-muted);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .media-file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: grab;
            transition: background var(--transition);
            max-width: 200px;
            height: 50px;
        }
        .media-file-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .media-file-item.dragging {
            opacity: 0.5;
        }
        .media-file-thumb {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background: rgba(62, 207, 142, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 18px;
            font-weight: bold;
        }
        .media-file-info {
            flex: 1;
            overflow: hidden;
        }
        .media-file-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-file-id {
            font-size: 11px;
            color: var(--text-muted);
        }
        .media-file-delete {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            color: var(--text-muted);
            transition: color var(--transition);
            flex-shrink: 0;
        }
        .media-file-delete:hover { color: var(--error); }
        .media-file-delete svg { width: 16px; height: 16px; fill: currentColor; }

        /* ========== 底部按钮栏 ========== */
        .bottom-bar {
            height: var(--bottom-bar-height);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .bottom-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-size: 14px;
            font-weight: 500;
        }
        .bottom-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
        .bottom-btn.danger { color: var(--error); }
        .bottom-btn.danger:hover { background: rgba(255,107,107,0.1); }
        .bottom-btn.publish { color: var(--primary); }
        .bottom-btn.publish:hover { background: rgba(62,207,142,0.1); }
        .bottom-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* ========== 弹窗 ========== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 200;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: rgba(30,30,50,0.9); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border); border-radius: var(--radius); padding: 24px 28px;
            max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); animation: modalIn 0.3s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text-primary); }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 12px 16px; font-size: 15px; color: var(--text-primary);
            background: var(--input-bg); border: 1.5px solid var(--input-border); border-radius: var(--radius-sm);
            outline: none; transition: all var(--transition);
        }
        .form-input:focus { border-color: var(--input-focus); background: rgba(255,255,255,0.1); box-shadow: 0 0 0 4px rgba(62,207,142,0.15); }
        .form-textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        .btn {
            padding: 10px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
            cursor: pointer; border: none; transition: all var(--transition); display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #2bb673); color: #0f0c29; box-shadow: 0 4px 12px rgba(62,207,142,0.3); }
        .btn-primary:hover { box-shadow: 0 6px 18px rgba(62,207,142,0.5); transform: translateY(-1px); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.15); }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }

        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(30,30,50,0.95); color: #fff; padding: 12px 24px; border-radius: 30px;
            font-size: 14px; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .toast.show { opacity: 1; }

        /* 草稿列表 */
        .draft-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background var(--transition);
        }
        .draft-list-item:hover { background: rgba(255,255,255,0.1); }
        .draft-info { flex: 1; }
        .draft-title { font-weight: 600; font-size: 14px; }
        .draft-time { font-size: 12px; color: var(--text-muted); }

        @media (max-width: 600px) {
            .bottom-bar { padding: 0 10px; }
            .bottom-btn span { display: none; }
        }
    </style>
</head>
<body>

    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="toolbar-btn" data-action="heading" title="标题">
                <svg viewBox="0 0 24 24"><path d="M5 4h2v6h10V4h2v16h-2v-8H7v8H5V4z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="bold" title="加粗">
                <svg viewBox="0 0 24 24"><path d="M15.6 10.79c.97-.67 1.6-1.76 1.6-2.98C17.2 5.6 15.6 4 13.5 4H6v16h8.5c2.3 0 4.2-1.8 4.2-4.1 0-1.8-1.1-3.3-2.8-3.9zM9 6.5h3.5c1.1 0 2 .9 2 2s-.9 2-2 2H9v-4zm5.5 11H9v-4h5.5c1.2 0 2.2.9 2.2 2s-1 2-2.2 2z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="italic" title="斜体">
                <svg viewBox="0 0 24 24"><path d="M10 4h4l4 16h-2l-1-4H9l-1 4H6l4-16z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="link" title="链接">
                <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="image" title="图片（默认宽度50%）">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="video" title="视频（默认宽度50%）">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="audio" title="音频">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="quote" title="引用">
                <svg viewBox="0 0 24 24"><path d="M6 17h3l2-4V7H5v6h3l-2 4zm8 0h3l2-4V7h-6v6h3l-2 4z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="code" title="代码块">
                <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="list-ul" title="无序列表">
                <svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="list-ol" title="有序列表">
                <svg viewBox="0 0 24 24"><path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="hr" title="分割线">
                <svg viewBox="0 0 24 24"><path d="M6 11h12v2H6z"/></svg>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- 预览按钮 -->
        <button class="toolbar-btn" id="previewBtn" title="预览">
            <svg viewBox="0 0 24 24"><path d="M12 6c-3.87 0-7.17 2.36-8.48 5.66L3 12l.52.34C4.83 15.64 8.13 18 12 18s7.17-2.36 8.48-5.66L21 12l-.52-.34C19.17 8.36 15.87 6 12 6zm0 10c-2.76 0-5.24-1.55-6.47-4C6.76 9.55 9.24 8 12 8s5.24 1.55 6.47 4c-1.23 2.45-3.71 4-6.47 4zm0-6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
        </button>

        <!-- 导入草稿按钮 -->
        <button class="toolbar-btn" id="importDraftBtn" title="导入草稿">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm5 11H7v-2h10v2zm0-4H7v-2h10v2zm-6-6h3v2h-3V6z"/></svg>
        </button>
    </div>

    <!-- 编辑器主体 -->
    <div class="editor-container">
        <textarea class="editor-textarea" id="editor" placeholder="输入 Markdown 内容..." spellcheck="false"></textarea>
        <div class="preview-area" id="previewArea"></div>
    </div>

    <!-- 素材库面板 -->
    <div class="media-library-panel" id="mediaLibraryPanel">
        <div class="media-library-header" onclick="toggleMediaLibrary()">
            <span class="toggle-icon">▼</span>
            <span class="media-library-title">素材库</span>
            <div class="media-library-actions">
                <button class="toolbar-btn" id="importMediaBtn" title="导入文件" onclick="event.stopPropagation(); importMedia()">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                </button>
                <button class="toolbar-btn" id="clearMediaBtn" title="清空素材库" onclick="event.stopPropagation(); clearMediaLibrary()">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
            </div>
        </div>
        <div class="media-library-body" id="mediaLibraryBody">
            <div class="media-library-empty">还没有导入文件，点击上方“导入文件”按钮添加</div>
        </div>
    </div>

    <!-- 底部按钮栏 -->
    <div class="bottom-bar">
        <button class="bottom-btn danger" id="deleteExitBtn" title="删除并退出">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            <span>删除并退出</span>
        </button>
        <button class="bottom-btn" id="saveExitBtn" title="保存并退出">
            <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
            <span>保存并退出</span>
        </button>
        <button class="bottom-btn" id="editMetaBtn" title="修改标题与介绍">

    <script>
        (function() {
            const SUPABASE_URL = 'https://qziqskgvzabuynduyuqy.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6aXFza2d2emFidXluZHV5dXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg4ODQsImV4cCI6MjEwMjQ0NDg4NH0.-LYORLfz-xpr1dMD_T-P8LzvgqTJngc0Hd52wSORhXs';

            let supabase;

            let currentUser = null;

            // ========== 素材库 IndexedDB 封装 ==========
            const dbName = 'bikan_media_library';
            const storeName = 'media_files';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db) { resolve(db); return; }
                    const request = indexedDB.open(dbName, 1);
                    request.onupgradeneeded = (e) => {
                        const database = e.target.result;
                        if (!database.objectStoreNames.contains(storeName)) {
                            database.createObjectStore(storeName, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbAdd(id, file) {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([storeName], 'readwrite');
                    const store = transaction.objectStore(storeName);
                    const record = { id, file, type: file.type, name: file.name };
                    store.put(record);
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbGetAll() {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([storeName], 'readonly');
                    const store = transaction.objectStore(storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbDelete(id) {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([storeName], 'readwrite');
                    const store = transaction.objectStore(storeName);
                    store.delete(id);
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbClear() {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([storeName], 'readwrite');
                    const store = transaction.objectStore(storeName);
                    store.clear();
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e.target.error);
                });
            }

            // ========== 素材库管理 ==========
            function generateShortId() {
                return Math.random().toString(36).substring(2, 8);
            }

            async function renderMediaLibrary() {
                const files = await idbGetAll();
                const container = document.getElementById('mediaLibraryBody');
                container.innerHTML = '';
                if (files.length === 0) {
                    container.innerHTML = '<div class="media-library-empty">还没有导入文件，点击上方“导入文件”按钮添加</div>';
                    return;
                }
                files.forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'media-file-item';
                    item.draggable = true;
                    item.dataset.fileId = record.id;
                    item.dataset.fileType = record.type.split('/')[0];

                    const thumb = document.createElement('div');
                    thumb.className = 'media-file-thumb';
                    if (record.type.startsWith('image/')) {
                        const img = document.createElement('img');
                        img.src = URL.createObjectURL(record.file);
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        thumb.appendChild(img);
                    } else if (record.type.startsWith('video/')) {
                        thumb.textContent = 'VID';
                    } else if (record.type.startsWith('audio/')) {
                        thumb.textContent = 'AUD';
                    } else {
                        thumb.textContent = 'FILE';
                    }

                    const info = document.createElement('div');
                    info.className = 'media-file-info';
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'media-file-name';
                    nameDiv.textContent = record.name;
                    const idDiv = document.createElement('div');
                    idDiv.className = 'media-file-id';
                    idDiv.textContent = `ID: ${record.id}`;
                    info.appendChild(nameDiv);
                    info.appendChild(idDiv);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'media-file-delete';
                    deleteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
                    deleteBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        await deleteMediaFile(record.id);
                    });

                    item.appendChild(thumb);
                    item.appendChild(info);
                    item.appendChild(deleteBtn);

                    item.addEventListener('dragstart', (e) => {
                        const fileType = record.type.split('/')[0];
                        let syntax = `@id[${fileType}:${record.id}]`;
                        if (fileType === 'image' || fileType === 'video') {
                            syntax = `@id[${fileType}:${record.id} =50%]`;
                        }
                        e.dataTransfer.setData('text/plain', syntax);
                        e.dataTransfer.effectAllowed = 'copy';
                        item.classList.add('dragging');
                    });
                    item.addEventListener('dragend', () => item.classList.remove('dragging'));

                    container.appendChild(item);
                });
            }

            async function deleteMediaFile(id) {
                await idbDelete(id);
                renderMediaLibrary();
                showToast('已从素材库删除');
            }

            async function clearMediaLibrary() {
                if (confirm('确定清空素材库中的所有文件吗？')) {
                    await idbClear();

            window.toggleMediaLibrary = toggleMediaLibrary;

            // ========== 通用函数 ==========

            // 检查管理员

            // 加载卡片数据
            async function loadCardData(cardId) {
                try {
                    const { data, error } = await supabase.from('websites').select('*').eq('id', cardId).single();
                    if (error) throw error;
                    if (!data) {

            // Markdown 插入
            function insertMarkdown(action) {
                const editor = document.getElementById('editor');
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const selectedText = editor.value.substring(start, end);
                let insertion = '';
                let cursorOffset = 0;
                switch (action) {
                    case 'heading': insertion = `# ${selectedText || '标题'}`; cursorOffset = insertion.length; break;
                    case 'bold': insertion = `**${selectedText || '加粗文本'}**`; cursorOffset = 2; break;
                    case 'italic': insertion = `*${selectedText || '斜体文本'}*`; cursorOffset = 1; break;
                    case 'link': insertion = `[${selectedText || '链接文字'}](https://)`; cursorOffset = insertion.length - 1; break;
                    case 'image': insertion = `![图片描述](https:// =50%)`; cursorOffset = 6; break;
                    case 'video': insertion = `@video[视频描述](https:// =50%)`; cursorOffset = 10; break;
                    case 'audio': insertion = `@audio[音频描述](https://)`; cursorOffset = 10; break;
                    case 'quote': insertion = `> ${selectedText || '引用内容'}`; cursorOffset = insertion.length; break;
                    case 'code': insertion = `\`\`\`\n${selectedText || '代码'}\n\`\`\``; cursorOffset = 3; break;
                    case 'list-ul': insertion = `\n- ${selectedText || '列表项'}`; cursorOffset = insertion.length; break;
                    case 'list-ol': insertion = `\n1. ${selectedText || '列表项'}`; cursorOffset = insertion.length; break;
                    case 'hr': insertion = `\n---\n`; cursorOffset = insertion.length; break;
                    default: return;
                }
                editor.value = editor.value.substring(0, start) + insertion + editor.value.substring(end);
                editor.focus();
                editor.setSelectionRange(start + cursorOffset, start + cursorOffset);
            }

            // 预览处理
            function preprocessMarkdown(markdown, idMap) {
                markdown = markdown.replace(/@id\[(image|video|audio):([a-zA-Z0-9]+)\s*(?:=(\d+)%)?\]/g, (match, type, id, width) => {
                    const record = idMap[id];
                    if (!record) return `<span style="color:var(--error);">缺失文件: ${id}</span>`;
                    const url = URL.createObjectURL(record.file);
                    const widthStyle = width ? `${width}%` : '100%';
                    if (type === 'image') {
                        return `<img src="${url}" alt="${record.name}" style="max-width: ${widthStyle}; border-radius: 8px;" />`;
                    } else if (type === 'video') {
                        return `<video controls src="${url}" style="max-width: ${widthStyle}; border-radius: 8px;"></video>`;
                    } else if (type === 'audio') {
                        return `<audio controls src="${url}"></audio>`;
                    }
                    return match;
                });
                markdown = markdown.replace(/!\[([^\]]*)\]\(([^)]+?)\s*=(\d+)%\)/g, (m, alt, url, width) => `<img src="${url}" width="${width}%" alt="${alt}" />`);
                markdown = markdown.replace(/@video\[([^\]]*)\]\(([^)]+?)\s*=(\d+)%\)/g, (m, alt, url, width) => `<video width="${width}%" controls src="${url}">${alt}</video>`);
                markdown = markdown.replace(/@audio\[([^\]]*)\]\(([^)]+?)\)/g, (m, alt, url) => `<audio controls src="${url}"></audio>`);
                markdown = markdown.replace(/!\[([^\]]*)\]\(([^)]+?)\)/g, (m, alt, url) => `<img src="${url}" alt="${alt}" />`);
                return markdown;
            }

            async function togglePreview() {
                const editor = document.getElementById('editor');
                const previewArea = document.getElementById('previewArea');
                const previewBtn = document.getElementById('previewBtn');
                const isPreview = previewArea.classList.contains('show');
                if (isPreview) {
                    previewArea.classList.remove('show');
                    editor.style.display = 'block';
                    previewBtn.classList.remove('active');
                    editor.focus();
                } else {
                    const idMap = {};
                    const files = await idbGetAll();
                    files.forEach(record => { idMap[record.id] = record; });
                    const content = editor.value || '';
                    const processed = preprocessMarkdown(content, idMap);
                    previewArea.innerHTML = marked.parse(processed);
                    previewArea.classList.add('show');
                    editor.style.display = 'none';
                    previewBtn.classList.add('active');
                }
            }

            // 导入草稿功能
            function loadDraftList() {
                const container = document.getElementById('draftListContainer');
                const drafts = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('draft_')) {
                        try {
                            const draft = JSON.parse(localStorage.getItem(key));
                            draft.id = key;
                            drafts.push(draft);
                        } catch (e) {}
                    }
                }
                drafts.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                if (drafts.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted);">暂无草稿</p>';
                    return;
                }
                container.innerHTML = drafts.map(d => `
                    <div class="draft-list-item" onclick="importDraftById('${d.id}')">
                        <div class="draft-info">
                            <div class="draft-title">${d.meta.title || '未命名草稿'}</div>
                            <div class="draft-time">${new Date(d.timestamp).toLocaleString()}</div>
                        </div>
                    </div>
                `).join('');
            }

            function openDraftModal() {
                document.getElementById('draftModal').classList.add('show');
                loadDraftList();
            }

            function closeDraftModal() {
                document.getElementById('draftModal').classList.remove('show');
            }

            function importDraftById(draftId) {
                const saved = localStorage.getItem(draftId);
                if (!saved) return;
                try {
                    const draft = JSON.parse(saved);
                    document.getElementById('editor').value = draft.content || '';
                    cardMeta = draft.meta || { title: '', description: '' };
                    closeDraftModal();
                    showToast('草稿已导入');
                } catch (e) {
                    console.error('草稿解析失败:', e);
                    showToast('导入失败');
                }
            }

            // 事件绑定
            document.querySelectorAll('.toolbar-btn[data-action]').forEach(btn => {
                btn.addEventListener('click', () => insertMarkdown(btn.dataset.action));
            });
            document.getElementById('previewBtn').addEventListener('click', togglePreview);
            document.getElementById('importDraftBtn').addEventListener('click', openDraftModal);
            document.getElementById('closeDraftModalBtn').addEventListener('click', closeDraftModal);

            // 编辑器拖放插入
            document.getElementById('editor').addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';
            });
            document.getElementById('editor').addEventListener('drop', (e) => {
                e.preventDefault();
                const syntax = e.dataTransfer.getData('text/plain');
                if (syntax.startsWith('@id[')) {
                    const editor = document.getElementById('editor');
                    const start = editor.selectionStart;
                    const end = editor.selectionEnd;
                    const newValue = editor.value.substring(0, start) + syntax + editor.value.substring(end);

                    editor.focus();
                    editor.setSelectionRange(pos, pos);
                    showToast('已插入素材引用');

            // 设置弹窗
            const metaModal = document.getElementById('metaModal');
            const cardTitleInput = document.getElementById('cardTitle');
            const cardDescriptionInput = document.getElementById('cardDescription');
            const cancelMetaBtn = document.getElementById('cancelMetaBtn');
            const saveMetaBtn = document.getElementById('saveMetaBtn');

            function openMetaModal() {
                cardTitleInput.value = cardMeta.title || '';
                cardDescriptionInput.value = cardMeta.description || '';
                metaModal.classList.add('show');
            }
            function closeMetaModal() { metaModal.classList.remove('show'); }
            function saveMeta() {
                const title = cardTitleInput.value.trim();
                const description = cardDescriptionInput.value.trim();
                if (!title || !description) {
                    showToast('标题和描述不能为空');
                    return;
                }
                cardMeta.title = title;
                cardMeta.description = description;
                closeMetaModal();
                showToast('标题与介绍已保存');
            }

            document.getElementById('editMetaBtn').addEventListener('click', openMetaModal);
            cancelMetaBtn.addEventListener('click', closeMetaModal);
            saveMetaBtn.addEventListener('click', saveMeta);

            // 保存并退出
            document.getElementById('saveExitBtn').addEventListener('click', async () => {
                if (!currentUser) return;
                const content = document.getElementById('editor').value.trim();
                if (!content || !cardMeta.title || !cardMeta.description) {
                    showToast('请填写完整内容（包括标题与介绍）');
                    return;
                }
                try {
                    if (editingId) {
                        const { error } = await supabase.from('websites').update({
                            content,
                            title: cardMeta.title,
                            description: cardMeta.description
                        }).eq('id', editingId);
                        if (error) throw error;
                        showToast('已保存');
                    } else {
                        const { error } = await supabase.from('websites').insert({
                            content,
                            title: cardMeta.title,
                            description: cardMeta.description,
                            submitter_id: currentUser.id,
                            submitter_name: '管理员',
                            is_anonymous: false,
                            status: 'pending' // 暂存为草稿，不上线
                        });
                        if (error) throw error;
                        showToast('已保存为草稿');
                    }
                    setTimeout(() => window.location.href = 'home.html', 1000);
                } catch (err) {
                    console.error('保存失败:', err);
                    showToast('保存失败：' + err.message);
                }
            });

            // 删除并退出
            document.getElementById('deleteExitBtn').addEventListener('click', async () => {
                if (!editingId) {
                    window.location.href = 'home.html';
                    return;
                }
                if (!confirm('确定删除该卡片吗？此操作不可恢复。')) return;
                try {
                    const { error } = await supabase.from('websites').delete().eq('id', editingId);
                    if (error) throw error;
                    showToast('卡片已删除');
                    setTimeout(() => window.location.href = 'home.html', 1000);
                } catch (err) {
                    console.error('删除失败:', err);
                    showToast('删除失败：' + err.message);
                }
            });

            // 发布
            document.getElementById('publishBtn').addEventListener('click', async () => {
                if (!currentUser) return;
                const content = document.getElementById('editor').value.trim();
                if (!content || !cardMeta.title || !cardMeta.description) {
                    showToast('请填写完整内容（包括标题与介绍）');
                    return;
                }
                try {
                    const idMap = {};
                    const files = await idbGetAll();
                    files.forEach(record => { idMap[record.id] = record; });

                    const idRefs = content.matchAll(/@id\[(image|video|audio):([a-zA-Z0-9]+)\s*(?:=(\d+)%)?\]/g);
                    const uploadMap = {};

                    for (const match of idRefs) {
                        const type = match[1];
                        const id = match[2];
                        const width = match[3] || null;
                        if (!idMap[id]) {
                            showToast(`素材库中不存在 ${id}，请检查`);
                            return;
                        }
                        const file = idMap[id].file;
                        const fileExt = file.name.split('.').pop() || 'bin';
                        const path = `${currentUser.id}/${Date.now()}_${id}.${fileExt}`;
                        const { error: uploadError } = await supabase.storage
                            .from('media')
                            .upload(path, file);
                        if (uploadError) {
                            console.error('上传失败:', uploadError);
                            showToast(`文件 ${id} 上传失败：${uploadError.message}`);
                            return;
                        }
                        const { data: publicUrlData } = supabase.storage
                            .from('media')
                            .getPublicUrl(path);
                        const publicUrl = publicUrlData.publicUrl;
                        uploadMap[id] = { url: publicUrl, type, width };
                    }

                    let finalContent = content;
                    for (const [id, info] of Object.entries(uploadMap)) {
                        const widthSuffix = info.width ? ` =${info.width}%` : '';
                        if (info.type === 'image') {
                            finalContent = finalContent.replaceAll(new RegExp(`@id\\[image:${id}\\s*(?:=\\d+%)?\\]`, 'g'), `![图片](${info.url}${widthSuffix})`);
                        } else if (info.type === 'video') {
                            finalContent = finalContent.replaceAll(new RegExp(`@id\\[video:${id}\\s*(?:=\\d+%)?\\]`, 'g'), `@video[视频](${info.url}${widthSuffix})`);
                        } else if (info.type === 'audio') {
                            finalContent = finalContent.replaceAll(new RegExp(`@id\\[audio:${id}\\s*(?:=\\d+%)?\\]`, 'g'), `@audio[音频](${info.url})`);
                        }
                    }

                    if (editingId) {
                        const { error } = await supabase.from('websites').update({
                            content: finalContent,
                            title: cardMeta.title,
                            description: cardMeta.description,
                            status: 'approved',
                            file_map: uploadMap
                        }).eq('id', editingId);
                        if (error) throw error;
                        showToast('已发布');
                    } else {
                        const { error } = await supabase.from('websites').insert({
                            content: finalContent,
                            title: cardMeta.title,
                            description: cardMeta.description,
                            submitter_id: currentUser.id,
                            submitter_name: '管理员',
                            is_anonymous: false,
                            status: 'approved',
                            file_map: uploadMap
                        });
                        if (error) throw error;
                        showToast('已发布');
                    }
                    setTimeout(() => window.location.href = 'home.html', 1000);
                } catch (err) {
                    console.error('发布失败:', err);
                    showToast('发布失败：' + err.message);
                }
            });

            // 初始化
            async function init() {
                currentUser = await checkAdmin();
                if (!currentUser) return;

                await renderMediaLibrary();

                const params = new URLSearchParams(window.location.search);
                const cardId = params.get('id');
                if (cardId) {
                    await loadCardData(cardId);
                }
            }
            init();
        })();
    </script>
</body>
</html>
