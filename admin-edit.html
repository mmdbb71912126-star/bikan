<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 管理卡片</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #3ecf8e;
            --primary-dark: #2bb673;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: #3ecf8e;
            --error: #ff6b6b;
            --success: #3ecf8e;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --toolbar-height: 56px;
            --bottom-bar-height: 64px;
            --media-library-height: 180px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
        }

        .toolbar {
            height: var(--toolbar-height);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 10;
            overflow-x: auto;
        }
        .toolbar-group { display: flex; gap: 4px; align-items: center; }
        .toolbar-divider { width: 1px; height: 24px; background: var(--card-border); margin: 0 8px; flex-shrink: 0; }
        .toolbar-btn {
            background: none; border: none; cursor: pointer; padding: 8px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; transition: background var(--transition);
            color: var(--text-secondary); flex-shrink: 0;
        }
        .toolbar-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
        .toolbar-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .toolbar-btn.active { background: rgba(62, 207, 142, 0.15); color: var(--primary); }

        .editor-container { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
        .editor-textarea {
            flex: 1; width: 100%; height: 100%; background: transparent; border: none; outline: none;
            resize: none; color: var(--text-primary); font-size: 16px; line-height: 1.6; padding: 20px 24px;
            font-family: 'Inter', sans-serif;
        }
        .editor-textarea::placeholder { color: var(--text-muted); }
        .preview-area {
            flex: 1; overflow-y: auto; padding: 20px 24px; font-size: 16px; line-height: 1.6;
            color: var(--text-primary); display: none; background: rgba(255, 255, 255, 0.02);
        }
        .preview-area.show { display: block; }
        .preview-area h1, .preview-area h2, .preview-area h3, .preview-area h4 { margin: 16px 0 8px; }
        .preview-area p { margin: 8px 0; }
        .preview-area code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; }
        .preview-area pre { background: rgba(0,0,0,0.3); padding: 16px; border-radius: 8px; overflow-x: auto; }
        .preview-area a { color: var(--primary); }

        .media-library-panel {
            height: var(--media-library-height);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease;
            flex-shrink: 0;
            overflow: hidden;
        }
        .media-library-panel.collapsed { height: 36px; }
        .media-library-header { display: flex; align-items: center; gap: 12px; padding: 6px 16px; cursor: pointer; user-select: none; flex-shrink: 0; }
        .media-library-header .toggle-icon { transition: transform 0.3s ease; font-size: 12px; }
        .media-library-panel.collapsed .toggle-icon { transform: rotate(-90deg); }
        .media-library-title { font-weight: 600; font-size: 13px; color: var(--text-secondary); flex: 1; }
        .media-library-actions { display: flex; gap: 8px; }
        .media-library-actions .toolbar-btn { padding: 4px; }
        .media-library-body { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; gap: 12px; flex-wrap: wrap; align-content: flex-start; }
        .media-library-empty { color: var(--text-muted); font-size: 13px; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .media-file-item {
            display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06);
            border-radius: 8px; padding: 6px 10px; cursor: pointer; transition: background var(--transition);
            max-width: 250px; height: 60px;
        }
        .media-file-item:hover { background: rgba(255,255,255,0.1); }
        .media-file-item.dragging { opacity: 0.5; }
        .media-file-thumb {
            width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
            background: rgba(62,207,142,0.2); display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 18px; font-weight: bold;
        }
        .media-file-info { flex: 1; overflow: hidden; }
        .media-file-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-file-meta { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-file-delete { background: none; border: none; cursor: pointer; padding: 2px; color: var(--text-muted); transition: color var(--transition); flex-shrink: 0; }
        .media-file-delete:hover { color: var(--error); }
        .media-file-delete svg { width: 16px; height: 16px; fill: currentColor; }

        .bottom-bar {
            height: var(--bottom-bar-height);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
            flex-shrink: 0;
        }
        .bottom-btn {
            background: none; border: none; cursor: pointer; padding: 8px 12px; border-radius: 8px;
            display: flex; align-items: center; gap: 8px; color: var(--text-secondary);
            transition: all var(--transition); font-size: 14px; font-weight: 500;
        }
        .bottom-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
        .bottom-btn.danger { color: var(--error); }
        .bottom-btn.danger:hover { background: rgba(255,107,107,0.1); }
        .bottom-btn.publish { color: var(--primary); }
        .bottom-btn.publish:hover { background: rgba(62,207,142,0.1); }
        .bottom-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 200;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: rgba(30,30,50,0.9); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border); border-radius: var(--radius); padding: 24px 28px;
            max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); animation: modalIn 0.3s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text-primary); }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 12px 16px; font-size: 15px; color: var(--text-primary);
            background: var(--input-bg); border: 1.5px solid var(--input-border); border-radius: var(--radius-sm);
            outline: none; transition: all var(--transition);
        }
        .form-input:focus { border-color: var(--input-focus); background: rgba(255,255,255,0.1); box-shadow: 0 0 0 4px rgba(62,207,142,0.15); }
        .form-textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        .btn {
            padding: 10px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
            cursor: pointer; border: none; transition: all var(--transition); display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #2bb673); color: #0f0c29; box-shadow: 0 4px 12px rgba(62,207,142,0.3); }
        .btn-primary:hover { box-shadow: 0 6px 18px rgba(62,207,142,0.5); transform: translateY(-1px); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.15); }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }

        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(30,30,50,0.95); color: #fff; padding: 12px 24px; border-radius: 30px;
            font-size: 14px; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .toast.show { opacity: 1; }

        .draft-list-item {
            display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
            background: rgba(255,255,255,0.06); border-radius: 8px; margin-bottom: 8px;
            transition: background var(--transition);
        }
        .draft-list-item:hover { background: rgba(255,255,255,0.1); }
        .draft-info { flex: 1; cursor: pointer; }
        .draft-title { font-weight: 600; font-size: 14px; }
        .draft-time { font-size: 12px; color: var(--text-muted); }
        .draft-delete-btn {
            background: none; border: none; cursor: pointer; padding: 4px;
            color: var(--text-muted); transition: color var(--transition);
        }
        .draft-delete-btn:hover { color: var(--error); }
        .draft-delete-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .file-card-preview {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border: 1px solid var(--card-border); border-radius: 8px;
            background: rgba(255,255,255,0.04); margin: 8px 0;
        }
        .file-card-preview svg { width: 32px; height: 32px; fill: var(--primary); flex-shrink: 0; }
        .file-card-info { flex: 1; min-width: 0; }
        .file-card-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-card-meta { font-size: 12px; color: var(--text-muted); }
        .file-card-download {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 6px 12px; background: var(--primary); color: #0f0c29 !important;
            border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 12px;
            white-space: nowrap; flex-shrink: 0;
        }
        .preview-area a.file-card-download { color: #0f0c29 !important; }

        .upload-progress-container {
            display: none;
            padding: 4px 16px 6px 16px;
            background: rgba(0,0,0,0.1);
        }
        .upload-progress-flex {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .upload-progress-bar-bg {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .upload-progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .upload-progress-text {
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 40px;
            text-align: right;
        }

        .publish-progress-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .publish-progress-overlay.show {
            visibility: visible;
            opacity: 1;
        }
        .publish-progress-box {
            width: 300px;
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .publish-progress-file {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .publish-progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .publish-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #38bdf8);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .publish-progress-percent {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 顶部工具栏 -->
    <div class="toolbar" id="toolbar">
        <div class="toolbar-group">
            <button class="toolbar-btn" data-action="heading" title="标题"><svg viewBox="0 0 24 24"><path d="M5 4h2v6h10V4h2v16h-2v-8H7v8H5V4z"/></svg></button>
            <button class="toolbar-btn" data-action="bold" title="加粗"><svg viewBox="0 0 24 24"><path d="M15.6 10.79c.97-.67 1.6-1.76 1.6-2.98C17.2 5.6 15.6 4 13.5 4H6v16h8.5c2.3 0 4.2-1.8 4.2-4.1 0-1.8-1.1-3.3-2.8-3.9zM9 6.5h3.5c1.1 0 2 .9 2 2s-.9 2-2 2H9v-4zm5.5 11H9v-4h5.5c1.2 0 2.2.9 2.2 2s-1 2-2.2 2z"/></svg></button>
            <button class="toolbar-btn" data-action="italic" title="斜体"><svg viewBox="0 0 24 24"><path d="M10 4h4l4 16h-2l-1-4H9l-1 4H6l4-16z"/></svg></button>
            <button class="toolbar-btn" data-action="link" title="链接"><svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg></button>
            <button class="toolbar-btn" data-action="image" title="图片（默认宽度50%）"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></button>
            <button class="toolbar-btn" data-action="video" title="视频（默认宽度50%）"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
            <button class="toolbar-btn" data-action="audio" title="音频"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></button>
            <button class="toolbar-btn" data-action="file" title="文件"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg></button>
            <button class="toolbar-btn" data-action="quote" title="引用"><svg viewBox="0 0 24 24"><path d="M6 17h3l2-4V7H5v6h3l-2 4zm8 0h3l2-4V7h-6v6h3l-2 4z"/></svg></button>
            <button class="toolbar-btn" data-action="code" title="代码块"><svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg></button>
            <button class="toolbar-btn" data-action="list-ul" title="无序列表"><svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg></button>
            <button class="toolbar-btn" data-action="list-ol" title="有序列表"><svg viewBox="0 0 24 24"><path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg></button>
            <button class="toolbar-btn" data-action="hr" title="分割线"><svg viewBox="0 0 24 24"><path d="M6 11h12v2H6z"/></svg></button>
        </div>

        <div class="toolbar-divider"></div>

        <button class="toolbar-btn" id="previewBtn" title="预览"><svg viewBox="0 0 24 24"><path d="M12 6c-3.87 0-7.17 2.36-8.48 5.66L3 12l.52.34C4.83 15.64 8.13 18 12 18s7.17-2.36 8.48-5.66L21 12l-.52-.34C19.17 8.36 15.87 6 12 6zm0 10c-2.76 0-5.24-1.55-6.47-4C6.76 9.55 9.24 8 12 8s5.24 1.55 6.47 4c-1.23 2.45-3.71 4-6.47 4zm0-6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg></button>
        <button class="toolbar-btn" id="importDraftBtn" title="导入草稿"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm5 11H7v-2h10v2zm0-4H7v-2h10v2zm-6-6h3v2h-3V6z"/></svg></button>
    </div>

    <!-- 编辑器主体 -->
    <div class="editor-container">
        <textarea class="editor-textarea" id="editor" placeholder="输入 Markdown 内容..." spellcheck="false"></textarea>
        <div class="preview-area" id="previewArea"></div>
    </div>

    <!-- 素材库面板 -->
    <div class="media-library-panel" id="mediaLibraryPanel">
        <div class="media-library-header" onclick="toggleMediaLibrary()">
            <span class="toggle-icon">▼</span>
            <span class="media-library-title">素材库</span>
            <div class="media-library-actions">
                <button class="toolbar-btn" id="importMediaBtn" title="导入文件" onclick="event.stopPropagation(); importMedia()">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                </button>
                <button class="toolbar-btn" id="clearMediaBtn" title="清空素材库" onclick="event.stopPropagation(); clearMediaLibrary()">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
            </div>
        </div>
        <!-- 上传进度条 -->
        <div class="upload-progress-container" id="uploadProgressContainer">
            <div class="upload-progress-flex">
                <div class="upload-progress-bar-bg">
                    <div class="upload-progress-bar" id="uploadProgressBar"></div>
                </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://qziqskgvzabuynduyuqy.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6aXFza2d2emFidXluZHV5dXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg4ODQsImV4cCI6MjEwMjQ0NDg4NH0.-LYORLfz-xpr1dMD_T-P8LzvgqTJngc0Hd52wSORhXs';
            const ADMIN_EMAIL = '3948677391@qq.com';
            const MAX_FILE_SIZE = 100 * 1024 * 1024;

            let supabase;
            try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) { console.error(e); }

            let currentUser = null;
            let editingId = null;
            let cardMeta = { title: '', description: '' };
            let currentShortId = null;

            // ========== IndexedDB 封装 ==========
            const dbName = 'bikan_media_library';
            const storeName = 'media_files';
            const draftAssetStoreName = 'draft_assets';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db) { resolve(db); return; }
                    const request = indexedDB.open(dbName, 2);
                    request.onupgradeneeded = (e) => {
                        const database = e.target.result;
                        if (!database.objectStoreNames.contains(storeName)) {
                            database.createObjectStore(storeName, { keyPath: 'id' });
                        }
                        if (!database.objectStoreNames.contains(draftAssetStoreName)) {
                            database.createObjectStore(draftAssetStoreName, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbAdd(store, id, data) {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([store], 'readwrite');
                    const objectStore = transaction.objectStore(store);
                    objectStore.put(data);
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbGetAll(store) {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([store], 'readonly');
                    const objectStore = transaction.objectStore(store);
                    const request = objectStore.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbDelete(store, id) {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([store], 'readwrite');
                    const objectStore = transaction.objectStore(store);
                    objectStore.delete(id);
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbClear(store) {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([store], 'readwrite');
                    const objectStore = transaction.objectStore(store);
                    objectStore.clear();
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e.target.error);
                });
            }

            // ========== 素材库管理 ==========
            function generateShortId() {
                return Math.random().toString(36).substring(2, 8);
            }

            function generateShortNumericId() {
                return Math.floor(100000 + Math.random() * 900000);
            }

            function fileTypeCategory(fileType) {
                if (fileType.startsWith('image/')) return 'image';
                if (fileType.startsWith('video/')) return 'video';
                if (fileType.startsWith('audio/')) return 'audio';
                return 'file';
            }

            function formatFileSize(bytes) {
                if (bytes == null || isNaN(bytes) || bytes === undefined) return '未知大小';
                if (bytes < 1024) return bytes + ' B';
                else if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                else return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            }

            async function renderMediaLibrary() {
                const files = await idbGetAll(storeName);
                const container = document.getElementById('mediaLibraryBody');
                container.innerHTML = '';
                if (files.length === 0) {
                    container.innerHTML = '<div class="media-library-empty">还没有导入文件，点击上方“导入文件”按钮添加</div>';
                    return;
                }
                files.forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'media-file-item';
                    item.draggable = true;
                    item.dataset.fileId = record.id;
                    item.dataset.fileType = record.type;

                    const category = fileTypeCategory(record.type);
                    const thumb = document.createElement('div');
                    thumb.className = 'media-file-thumb';
                    if (category === 'image') {
                        const img = document.createElement('img');
                        img.src = record.url || URL.createObjectURL(record.file);
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        thumb.appendChild(img);
                    } else {
                        thumb.textContent = category === 'video' ? 'VID' : category === 'audio' ? 'AUD' : 'FILE';
                    }

                    const info = document.createElement('div');
                    info.className = 'media-file-info';
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'media-file-name';
                    nameDiv.textContent = record.name;
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'media-file-meta';
                    metaDiv.textContent = `ID: ${record.id} · ${formatFileSize(record.size)} · ${record.type || '未知'}`;
                    info.appendChild(nameDiv);
                    info.appendChild(metaDiv);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'media-file-delete';
                    deleteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
                    deleteBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        await deleteMediaFile(record.id);
                    });

                    item.appendChild(thumb);
                    item.appendChild(info);
                    item.appendChild(deleteBtn);

                    item.addEventListener('click', (e) => {
                        if (e.target.closest('.media-file-delete')) return;
                        let syntax;
                        if (category === 'image') syntax = `@image[图片描述](${record.id} =50%)`;
                        else if (category === 'video') syntax = `@video[视频描述](${record.id} =50%)`;
                        else if (category === 'audio') syntax = `@audio[音频描述](${record.id})`;
                        else syntax = `@file[文件描述](${record.id})`;
                        navigator.clipboard.writeText(syntax).then(() => {
                            showToast(`已复制：${syntax}`);
                        }).catch(err => {
                            console.error('复制失败:', err);
                            showToast('复制失败，请手动复制');
                        });
                    });

                    item.addEventListener('dragstart', (e) => {
                        let syntax;
                        if (category === 'image') syntax = `@image[图片描述](${record.id} =50%)`;
                        else if (category === 'video') syntax = `@video[视频描述](${record.id} =50%)`;
                        else if (category === 'audio') syntax = `@audio[音频描述](${record.id})`;
                        else syntax = `@file[文件描述](${record.id})`;
                        e.dataTransfer.setData('text/plain', syntax);
                        e.dataTransfer.effectAllowed = 'copy';
                        item.classList.add('dragging');
                    });
                    item.addEventListener('dragend', () => item.classList.remove('dragging'));

                    container.appendChild(item);
                });
            }

            // 从公共 URL 提取 Storage 路径
            function getPathFromUrl(url) {
                const regex = /\/storage\/v1\/object\/public\/media\/(.+)/;
                const match = url.match(regex);
                return match ? match[1] : null;
            }

            // 检查文件是否被帖子引用
            async function isFileReferenced(fileId) {
                try {
                    const { data, error } = await supabase
                        .from('websites')
                        .select('id, file_map')
                        .not('file_map', 'is', null);
                    if (error) throw error;
                    for (const post of data) {
                        if (post.file_map && post.file_map[fileId]) {
                            return true;
                        }
                    }
                    return false;
                } catch (err) {
                    console.error('检查引用失败:', err);
                    showToast('检查引用状态失败，请稍后重试');
                    return true;
                }
            }

            async function deleteMediaFile(id) {
                try {
                    const allFiles = await idbGetAll(storeName);
                    const record = allFiles.find(r => r.id === id);
                    if (!record) {
                        showToast('文件不存在');
                        return;
                    }

                    const referenced = await isFileReferenced(id);
                    if (referenced) {
                        showToast('该文件已被帖子引用，请先删除相关帖子或从帖子中移除该文件语法');
                        return;
                    }

                    if (!confirm('确定删除该文件吗？此操作将同时删除云存储中的文件，且不可恢复。')) return;

                    if (record.url) {
                        const path = getPathFromUrl(record.url);
                        if (path) {
                            const { error: removeError } = await supabase.storage
                                .from('media')
                                .remove([path]);
                            if (removeError) {
                                console.error('Storage 删除失败:', removeError);
                                showToast('云存储删除失败：' + removeError.message);
                                return;
                            }
                        }
                    }

                    await idbDelete(storeName, id);
                    await idbDelete(draftAssetStoreName, id);

                    renderMediaLibrary();
                    showToast('已从素材库和云存储删除');
                } catch (err) {
                    console.error('删除文件失败:', err);
                    showToast('删除失败：' + err.message);
                }
            }

            async function clearMediaLibrary() {
                const files = await idbGetAll(storeName);
                const unreferenced = [];
                for (const record of files) {
                    const referenced = await isFileReferenced(record.id);
                    if (!referenced) {
                        unreferenced.push(record);
                    }
                }
                if (unreferenced.length === 0) {
                    showToast('所有文件均被引用，无法清空');
                    return;
                }
                if (!confirm(`确定清空素材库中未被引用的 ${unreferenced.length} 个文件吗？\n（被帖子引用的文件将被保留）`)) return;
                for (const record of unreferenced) {
                    if (record.url) {
                        const path = getPathFromUrl(record.url);
                        if (path) {
                            await supabase.storage.from('media').remove([path]);
                        }
                    }
                    await idbDelete(storeName, record.id);
                    await idbDelete(draftAssetStoreName, record.id);
                }
                renderMediaLibrary();
                showToast('已清空素材库中未被引用的文件');
            }

            // 使用 XHR 上传文件，带进度回调
            function uploadFileWithProgress(bucket, path, file, onProgress) {
                return new Promise(async (resolve, reject) => {
                    const session = await supabase.auth.getSession();
                    const accessToken = session.data.session?.access_token;
                    if (!accessToken) {
                        reject(new Error('未获取到访问令牌'));
                        return;
                    }
                    const xhr = new XMLHttpRequest();
                    const url = `${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`;
                    xhr.open('POST', url);
                    xhr.setRequestHeader('Authorization', `Bearer ${accessToken}`);
                    xhr.upload.onprogress = (e) => {
                        if (e.lengthComputable && onProgress) {
                            onProgress(Math.round((e.loaded / e.total) * 100));
                        }
                    };
                    xhr.onload = () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            resolve(JSON.parse(xhr.responseText));
                        } else {
                            reject(new Error(xhr.responseText || '上传失败'));
                        }
                    };
                    xhr.onerror = () => reject(new Error('网络错误'));
                    xhr.send(file);
                });
            }

            async function importMedia() {
                document.getElementById('mediaFileInput').click();
            }

            document.getElementById('mediaFileInput').addEventListener('change', async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                const progressContainer = document.getElementById('uploadProgressContainer');
                const progressBar = document.getElementById('uploadProgressBar');
                const progressText = document.getElementById('uploadProgressText');
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                progressText.textContent = '0%';

                let completed = 0;
                let successCount = 0;

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];

                    if (file.size > MAX_FILE_SIZE) {
                        showToast(`文件 ${file.name} 超过 100MB，已跳过`);
                        completed++;
                        continue;
                    }

                    const id = generateShortId();
                    const fileExt = file.name.split('.').pop() || 'bin';
                    const path = `${currentUser.id}/${Date.now()}_${id}.${fileExt}`;

                    try {
                        await uploadFileWithProgress('media', path, file, (percent) => {
                            const totalProgress = ((completed + percent / 100) / files.length) * 100;
                            progressBar.style.width = totalProgress + '%';
                            progressText.textContent = Math.round(totalProgress) + '%';
                        });

                        const { data: urlData } = supabase.storage
                            .from('media')
                            .getPublicUrl(path);
                        const publicUrl = urlData?.publicUrl || `${SUPABASE_URL}/storage/v1/object/public/media/${path}`;

                        const record = {
                            id: id,
                            file: file,
                            type: file.type,
                            name: file.name,
                            size: file.size,
                            url: publicUrl
                        };
                        await idbAdd(storeName, id, record);
                        successCount++;
                    } catch (err) {
                        console.error('上传失败:', err);
                        showToast(`文件 ${file.name} 上传失败：${err.message}`);
                    }

                    completed++;
                    const totalProgress = (completed / files.length) * 100;
                    progressBar.style.width = totalProgress + '%';
                    progressText.textContent = Math.round(totalProgress) + '%';
                }

                progressContainer.style.display = 'none';
                await renderMediaLibrary();
                showToast(`已成功导入 ${successCount} 个文件`);
                e.target.value = '';
            });

            function toggleMediaLibrary() {
                const panel = document.getElementById('mediaLibraryPanel');
                panel.classList.toggle('collapsed');
                const icon = panel.querySelector('.toggle-icon');
                if (panel.classList.contains('collapsed')) {
                    icon.textContent = '▼';
                } else {
                    icon.textContent = '▼';
                }
            }

            window.toggleMediaLibrary = toggleMediaLibrary;
            window.importMedia = importMedia;
            window.clearMediaLibrary = clearMediaLibrary;

            // ========== 通用函数 ==========
            function showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }

            async function checkAdmin() {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) { window.location.href = 'index.html'; return null; }
                if (user.email !== ADMIN_EMAIL) {
                    showToast('您没有权限访问此页面');
                    setTimeout(() => window.location.href = 'home.html', 1500);
                    return null;
                }
                return user;
            }

            // 从 URL 下载文件并保存到 IndexedDB 素材库，返回 record
            async function downloadAndStoreFile(url, name, type, size) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('下载失败');
                    const blob = await response.blob();
                    const file = new File([blob], name, { type: type });
                    const id = generateShortId();
                    const record = {
                        id,
                        file,
                        type: type,
                        name: name,
                        size: size,
                        url: url
                    };
                    await idbAdd(storeName, id, record);
                    return record;
                } catch (err) {
                    console.error('下载文件失败:', err);
                    return null;
                }
            }

            // 还原长 URL 为短 ID 语法（仅编辑加载时使用）
            async function restoreContentWithShortIds(content, fileMap) {
                // 此函数可在未来版本中增强，当前仅返回原内容
                return content;
            }

            async function loadCardData(cardId) {
                try {
                    const { data, error } = await supabase.from('websites').select('*').eq('id', cardId).single();
                    if (error) throw error;
                    if (!data) {
                        showToast('卡片不存在');
                        setTimeout(() => window.location.href = 'home.html', 1500);
                        return;
                    }

                    currentShortId = data.short_id || null;
                    document.getElementById('editor').value = data.content || '';
                    cardMeta.title = data.title || '';
                    cardMeta.description = data.description || '';
                    editingId = cardId;

                    await renderMediaLibrary();
                } catch (err) {
                    console.error('加载卡片失败:', err);
                    showToast('加载失败：' + err.message);
                }
            }

            function insertMarkdown(action) {
                const editor = document.getElementById('editor');
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const selectedText = editor.value.substring(start, end);
                let insertion = '';
                let cursorOffset = 0;
                switch (action) {
                    case 'heading': insertion = `# ${selectedText || '标题'}`; cursorOffset = insertion.length; break;
                    case 'bold': insertion = `**${selectedText || '加粗文本'}**`; cursorOffset = 2; break;
                    case 'italic': insertion = `*${selectedText || '斜体文本'}*`; cursorOffset = 1; break;
                    case 'link': insertion = `[${selectedText || '链接文字'}](https://)`; cursorOffset = insertion.length - 1; break;
                    case 'image': insertion = `@image[图片描述](https:// =50%)`; cursorOffset = 16; break;
                    case 'video': insertion = `@video[视频描述](https:// =50%)`; cursorOffset = 16; break;
                    case 'audio': insertion = `@audio[音频描述](https://)`; cursorOffset = 16; break;
                    case 'file': insertion = `@file[文件描述](https://)`; cursorOffset = 16; break;
                    case 'quote': insertion = `> ${selectedText || '引用内容'}`; cursorOffset = insertion.length; break;
                    case 'code': insertion = `\`\`\`\n${selectedText || '代码'}\n\`\`\``; cursorOffset = 3; break;
                    case 'list-ul': insertion = `\n- ${selectedText || '列表项'}`; cursorOffset = insertion.length; break;
                    case 'list-ol': insertion = `\n1. ${selectedText || '列表项'}`; cursorOffset = insertion.length; break;
                    case 'hr': insertion = `\n---\n`; cursorOffset = insertion.length; break;
                    default: return;
                }
                editor.value = editor.value.substring(0, start) + insertion + editor.value.substring(end);
                editor.focus();
                editor.setSelectionRange(start + cursorOffset, start + cursorOffset);
            }

            function preprocessMarkdown(markdown, idMap) {
                markdown = markdown.replace(/@image\[([^\]]*)\]\(([a-zA-Z0-9]+)\s*(?:=(\d+)%)?\)/g, (match, alt, id, width) => {
                    const record = idMap[id];
                    if (!record) return `<span style="color:var(--error);">缺失文件: ${id}</span>`;
                    const url = record.url || URL.createObjectURL(record.file);
                    const widthStyle = width ? `${width}%` : '100%';
                    return `<img src="${url}" alt="${alt}" style="max-width: ${widthStyle}; border-radius: 8px;" />`;
                });
                markdown = markdown.replace(/@video\[([^\]]*)\]\(([a-zA-Z0-9]+)\s*(?:=(\d+)%)?\)/g, (match, alt, id, width) => {
                    const record = idMap[id];
                    if (!record) return `<span style="color:var(--error);">缺失文件: ${id}</span>`;
                    const url = record.url || URL.createObjectURL(record.file);
                    const widthStyle = width ? `${width}%` : '100%';
                    return `<video controls src="${url}" style="max-width: ${widthStyle}; border-radius: 8px;"></video>`;
                });
                markdown = markdown.replace(/@audio\[([^\]]*)\]\(([a-zA-Z0-9]+)\)/g, (match, alt, id) => {
                    const record = idMap[id];
                    if (!record) return `<span style="color:var(--error);">缺失文件: ${id}</span>`;
                    const url = record.url || URL.createObjectURL(record.file);
                    return `<audio controls src="${url}"></audio>`;
                });
                markdown = markdown.replace(/@file\[([^\]]*)\]\(([a-zA-Z0-9]+)\)/g, (match, alt, id) => {
                    const record = idMap[id];
                    if (!record) return `<span style="color:var(--error);">缺失文件: ${id}</span>`;
                    const url = record.url || URL.createObjectURL(record.file);
                    const size = formatFileSize(record.size);
                    const type = record.type || '未知';
                    const displayName = record.name;
                    return `<div class="file-card-preview"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg><div class="file-card-info"><div class="file-card-name">${displayName}</div><div class="file-card-meta">${size} · ${type}</div></div><a class="file-card-download" href="${url}" download="${record.name}">下载</a></div>`;
                });
                markdown = markdown.replace(/!\[([^\]]*)\]\(([^)]+?)\)/g, (m, alt, url) => `<img src="${url}" alt="${alt}" />`);
                return markdown;
            }

            async function togglePreview() {
                const editor = document.getElementById('editor');
                const previewArea = document.getElementById('previewArea');
                const previewBtn = document.getElementById('previewBtn');
                const isPreview = previewArea.classList.contains('show');
                if (isPreview) {
                    previewArea.classList.remove('show');
                    editor.style.display = 'block';
                    previewBtn.classList.remove('active');
                    editor.focus();
                } else {
                    const idMap = {};
                    const files = await idbGetAll(storeName);
                    files.forEach(record => { idMap[record.id] = record; });
                    const content = editor.value || '';
                    const processed = preprocessMarkdown(content, idMap);
                    previewArea.innerHTML = marked.parse(processed);
                    previewArea.classList.add('show');
                    editor.style.display = 'none';
                    previewBtn.classList.add('active');
                }
            }
            window.togglePreview = togglePreview;

            // ========== 导入草稿功能 ==========
            function loadDraftList() {
                const container = document.getElementById('draftListContainer');
                const drafts = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('draft_')) {
                        try {
                            const draft = JSON.parse(localStorage.getItem(key));
                            draft.id = key;
                            drafts.push(draft);
                        } catch (e) {}
                    }
                }
                drafts.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                if (drafts.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted);">暂无草稿</p>';
                    return;
                }
                container.innerHTML = drafts.map(d => `
                    <div class="draft-list-item">
                        <div class="draft-info" onclick="importDraftById('${d.id}')">
                            <div class="draft-title">${d.meta.title || '未命名草稿'}</div>
                            <div class="draft-time">${new Date(d.timestamp).toLocaleString()}</div>
                        </div>
                        <button class="draft-delete-btn" onclick="deleteDraftById('${d.id}')" title="删除草稿">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                `).join('');
            }

            function openDraftModal() {
                document.getElementById('draftModal').classList.add('show');
                loadDraftList();
            }
            function closeDraftModal() {
                document.getElementById('draftModal').classList.remove('show');
            }

            // 简化草稿导入：只导入内容，不进行文件恢复
            function importDraftById(draftId) {
                const saved = localStorage.getItem(draftId);
                if (!saved) return;
                try {
                    const draft = JSON.parse(saved);
                    document.getElementById('editor').value = draft.content || '';
                    cardMeta = draft.meta || { title: '', description: '' };
                    closeDraftModal();
                    showToast('草稿已导入');
                } catch (e) {
                    console.error('草稿解析失败:', e);
                    showToast('导入失败');
                }
            }
            function deleteDraftById(draftId) {
                if (confirm('确定删除该草稿吗？')) {
                    localStorage.removeItem(draftId);
                    loadDraftList();
                    showToast('草稿已删除');
                }
            }
            window.openDraftModal = openDraftModal;
            window.closeDraftModal = closeDraftModal;
            window.importDraftById = importDraftById;
            window.deleteDraftById = deleteDraftById;

            // ========== 收集引用的文件 ID ==========
            function collectReferencedIds(content) {
                const ids = new Set();
                const regex = /@(image|video|audio|file)\[[^\]]*\]\(([a-zA-Z0-9]+)(?:\s*=(\d+)%)?\)/g;
                let match;
                while ((match = regex.exec(content)) !== null) {
                    ids.add(match[2]);
                }
                return Array.from(ids);
            }

            // ========== 设置弹窗 ==========
            function openMetaModal() {
                document.getElementById('cardTitle').value = cardMeta.title || '';
                document.getElementById('cardDescription').value = cardMeta.description || '';
                document.getElementById('metaModal').classList.add('show');
            }
            function closeMetaModal() {
                document.getElementById('metaModal').classList.remove('show');
            }
            function saveMeta() {
                const title = document.getElementById('cardTitle').value.trim();
                const description = document.getElementById('cardDescription').value.trim();
                if (!title || !description) {
                    showToast('标题和描述不能为空');
                    return;
                }
                cardMeta.title = title;
                cardMeta.description = description;
                closeMetaModal();
                showToast('标题与介绍已保存');
            }
            window.openMetaModal = openMetaModal;
            window.closeMetaModal = closeMetaModal;
            window.saveMeta = saveMeta;

            // ========== 保存草稿 ==========
            async function saveDraftWithAssets(exitAfter) {
                const content = document.getElementById('editor').value.trim();
                if (!content) {
                    showToast('内容不能为空');
                    return;
                }
                // 仍然收集引用文件，但不再同步到草稿资产存储，避免复杂操作导致失败
                const draft = {
                    content: document.getElementById('editor').value,
                    meta: cardMeta,
                    timestamp: new Date().toISOString()
                };
                const draftKey = `draft_${Date.now()}`;
                localStorage.setItem(draftKey, JSON.stringify(draft));
                if (exitAfter) {
                    window.location.href = 'home.html';
                } else {
                    showToast('草稿已保存');
                }
            }

            async function saveDraftOnly() { await saveDraftWithAssets(false); }
            async function saveAndExit() { await saveDraftWithAssets(true); }
            window.saveDraftOnly = saveDraftOnly;
            window.saveAndExit = saveAndExit;

            // ========== 删除并退出 ==========
            async function deleteAndExit() {
                if (!editingId) {
                    window.location.href = 'home.html';
                    return;
                }
                if (!confirm('确定删除该卡片吗？此操作不可恢复。')) return;
                try {
                    await supabase.from('websites').delete().eq('id', editingId);
                    showToast('卡片已删除');
                    setTimeout(() => window.location.href = 'home.html', 1000);
                } catch (err) {
                    console.error('删除失败:', err);
                    showToast('删除失败：' + err.message);
                }
            }
            window.deleteAndExit = deleteAndExit;

            // ========== 发布进度条控制 ==========
            function showPublishProgress() {
                const overlay = document.getElementById('publishProgressOverlay');
                overlay.classList.add('show');
                document.getElementById('publishProgressBar').style.width = '0%';
                document.getElementById('publishProgressFile').textContent = '正在准备...';
                document.getElementById('publishProgressPercent').textContent = '0%';
            }
            function updatePublishProgress(percent, fileName) {
                const bar = document.getElementById('publishProgressBar');
                const fileLabel = document.getElementById('publishProgressFile');
                const percentLabel = document.getElementById('publishProgressPercent');
                bar.style.width = percent + '%';
                percentLabel.textContent = percent + '%';
                if (fileName) {
                    fileLabel.textContent = '正在处理：' + fileName;
                } else {
                    fileLabel.textContent = '正在保存...';
                }
            }
            function hidePublishProgress() {
                const overlay = document.getElementById('publishProgressOverlay');
                overlay.classList.remove('show');
            }

            // ========== 发布 ==========
            async function publishCard() {
                console.log('publishCard 被调用');
                if (!currentUser) {
                    showToast('未获取到管理员身份');
                    return;
                }
                const content = document.getElementById('editor').value.trim();
                if (!content || !cardMeta.title || !cardMeta.description) {
                    showToast('请填写完整内容（包括标题与介绍）');
                    return;
                }

                try {
                    showPublishProgress();

                    const idMap = {};
                    const files = await idbGetAll(storeName);
                    files.forEach(record => { idMap[record.id] = record; });

                    const allRefs = content.matchAll(/@(image|video|audio|file)\[([^\]]*)\]\(([a-zA-Z0-9]+)(?:\s*=(\d+)%)?\)/g);
                    const refsArray = Array.from(allRefs);
                    const totalRefs = refsArray.length;
                    let processedRefs = 0;
                    const fileMap = {};
                    let finalContent = content;

                    for (const match of refsArray) {
                        const type = match[1];
                        const alt = match[2];
                        const id = match[3];
                        const width = match[4] || null;

                        if (!idMap[id]) {
                            showToast(`素材库中不存在 ${id}，请检查`);
                            hidePublishProgress();
                            return;
                        }

                        const record = idMap[id];
                        const url = record.url;

                        if (type === 'image') {
                            const widthSuffix = width ? ` =${width}%` : '';
                            finalContent = finalContent.replace(new RegExp(`@image\\[([^\\]]*)\\]\\(${id}\\s*(?:=\\d+%)?\\)`), `@image[$1](${url}${widthSuffix})`);
                        } else if (type === 'video') {
                            const widthSuffix = width ? ` =${width}%` : '';
                            finalContent = finalContent.replace(new RegExp(`@video\\[([^\\]]*)\\]\\(${id}\\s*(?:=\\d+%)?\\)`), `@video[$1](${url}${widthSuffix})`);
                        } else if (type === 'audio') {
                            finalContent = finalContent.replace(new RegExp(`@audio\\[([^\\]]*)\\]\\(${id}\\)`), `@audio[$1](${url})`);
                        } else if (type === 'file') {
                            const fileCard = `<div class="file-card-preview"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg><div class="file-card-info"><div class="file-card-name">${record.name}</div><div class="file-card-meta">${formatFileSize(record.size)} · ${record.type || '未知'}</div></div><a class="file-card-download" href="${url}" download="${record.name}">下载</a></div>`;
                            finalContent = finalContent.replace(new RegExp(`@file\\[([^\\]]*)\\]\\(${id}\\)`), fileCard);
                        }

                        fileMap[id] = {
                            url: url,
                            type: type,
                            name: record.name,
                            size: record.size,
                            fileType: record.type,
                            width: width
                        };

                        processedRefs++;
                        const percent = totalRefs > 0 ? Math.round((processedRefs / totalRefs) * 90) : 90;
                        updatePublishProgress(percent, record.name);
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }

                    updatePublishProgress(95, null);

                    if (!currentShortId) {
                        currentShortId = generateShortNumericId();
                    }

                    if (editingId) {
                        const { error: updateError } = await supabase.from('websites').update({
                            content: finalContent,
                            title: cardMeta.title,
                            description: cardMeta.description,
                            status: 'approved',
                            file_map: fileMap,
                            short_id: currentShortId
                        }).eq('id', editingId);
                        if (updateError) throw updateError;
                        showToast('已发布');
                    } else {
                        const { error: insertError } = await supabase.from('websites').insert({
                            content: finalContent,
                            title: cardMeta.title,
                            description: cardMeta.description,
                            submitter_id: currentUser.id,
                            submitter_name: '管理员',
                            is_anonymous: false,
                            status: 'approved',
                            file_map: fileMap,
                            short_id: currentShortId
                        });
                        if (insertError) throw insertError;
                        showToast('已发布');
                    }

                    updatePublishProgress(100, null);
                    setTimeout(() => {
                        hidePublishProgress();
                        window.location.href = 'home.html';
                    }, 500);

                } catch (err) {
                    console.error('发布流程异常:', err);
                    hidePublishProgress();
                    showToast('发布失败：' + err.message);
                }
            }
            window.publishCard = publishCard;

            // ========== 绑定事件 ==========
            function bindEvents() {
                const toolbar = document.getElementById('toolbar');
                if (toolbar) {
                    toolbar.addEventListener('click', (e) => {
                        const btn = e.target.closest('.toolbar-btn[data-action]');
                        if (btn) {
                            insertMarkdown(btn.dataset.action);
                        }
                    });
                }

                const previewBtn = document.getElementById('previewBtn');
                if (previewBtn) previewBtn.addEventListener('click', togglePreview);

                const importDraftBtn = document.getElementById('importDraftBtn');
                if (importDraftBtn) importDraftBtn.addEventListener('click', openDraftModal);

                const editor = document.getElementById('editor');
                if (editor) {
                    editor.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'copy';
                    });
                    editor.addEventListener('drop', (e) => {
                        e.preventDefault();
                        const syntax = e.dataTransfer.getData('text/plain');
                        if (syntax.startsWith('@')) {
                            const start = editor.selectionStart;
                            const end = editor.selectionEnd;
                            const newValue = editor.value.substring(0, start) + syntax + editor.value.substring(end);
                            editor.value = newValue;
                            const pos = start + syntax.length;
                            editor.focus();
                            editor.setSelectionRange(pos, pos);
                            showToast('已插入素材引用');
                        }
                    });
                }

                const importMediaBtn = document.getElementById('importMediaBtn');
                if (importMediaBtn) importMediaBtn.addEventListener('click', importMedia);
                const clearMediaBtn = document.getElementById('clearMediaBtn');
                if (clearMediaBtn) clearMediaBtn.addEventListener('click', clearMediaLibrary);
            }

            // ========== 初始化 ==========
            async function init() {
                try {
                    currentUser = await checkAdmin();
                    if (!currentUser) return;

                    await renderMediaLibrary();

                    const params = new URLSearchParams(window.location.search);
                    const cardId = params.get('id');
                    if (cardId) {
                        await loadCardData(cardId);
                    }
                } catch (err) {
                    console.error('初始化出错:', err);
                }
            }

            bindEvents();
            init();
        })();
    </script>
</body>
