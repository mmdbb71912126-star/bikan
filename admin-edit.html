<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 管理卡片</title>

    <!-- 网站图标（favicon）使用新的黑色 Logo SVG -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #3ecf8e;
            --primary-dark: #2bb673;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: #3ecf8e;
            --error: #ff6b6b;
            --success: #3ecf8e;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-form-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 30px 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all var(--transition);
            margin-bottom: 20px;
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
        .back-btn svg { width: 14px; height: 14px; fill: currentColor; }

        .form-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .form-group { margin-bottom: 18px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            color: var(--text-primary);
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: all var(--transition);
        }
        .form-input:focus {
            border-color: var(--input-focus);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 4px rgba(62,207,142,0.15);
        }
        .form-input.error { border-color: var(--error); }
        .form-textarea {
            min-height: 100px;
            resize: vertical;
            line-height: 1.5;
        }

        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #2bb673);
            color: #0f0c29;
            box-shadow: 0 4px 12px rgba(62,207,142,0.3);
            width: 100%;
            justify-content: center;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 18px rgba(62,207,142,0.5);
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-danger {
            background: rgba(255,107,107,0.15);
            color: #ffb3b3;
            border: 1px solid rgba(255,107,107,0.3);
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }
        .btn-danger:hover { background: rgba(255,107,107,0.25); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30,30,50,0.95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="card-form-container">
        <a class="back-btn" href="home.html">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            返回主页
        </a>

        <div class="form-title" id="formTitle">添加卡片</div>

        <div class="form-group">
            <label class="form-label" for="cardTitle">标题 <span style="color:var(--error)">*</span></label>
            <input class="form-input" type="text" id="cardTitle" placeholder="网站名称" />
        </div>
        <div class="form-group">
            <label class="form-label" for="cardUrl">网址 <span style="color:var(--error)">*</span></label>
            <input class="form-input" type="url" id="cardUrl" placeholder="https://example.com" />
        </div>
        <div class="form-group">
            <label class="form-label" for="cardDescription">描述 <span style="color:var(--error)">*</span></label>
            <textarea class="form-input form-textarea" id="cardDescription" placeholder="简单介绍该网站的特色"></textarea>
        </div>

        <button class="btn btn-primary" id="saveCardBtn">保存</button>
        <button class="btn btn-danger" id="deleteCardBtn" style="display: none;">删除卡片</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://qziqskgvzabuynduyuqy.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6aXFza2d2emFidXluZHV5dXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg4ODQsImV4cCI6MjEwMjQ0NDg4NH0.-LYORLfz-xpr1dMD_T-P8LzvgqTJngc0Hd52wSORhXs';
            const ADMIN_EMAIL = '3948677391@qq.com';

            let supabase;
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (err) {
                console.error('Supabase 初始化失败:', err);
                showToast('Supabase 配置错误');
                return;
            }

            let currentUser = null;
            let editingId = null;

            function showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }

            // 检查是否为管理员
            async function checkAdmin() {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    window.location.href = 'index.html';
                    return null;
                }
                if (user.email !== ADMIN_EMAIL) {
                    showToast('您没有权限访问此页面');
                    setTimeout(() => window.location.href = 'home.html', 1500);
                    return null;
                }
                return user;
            }

            // 加载卡片数据（编辑模式）
            async function loadCardData(cardId) {
                try {
                    const { data, error } = await supabase
                        .from('websites')
                        .select('*')
                        .eq('id', cardId)
                        .single();

                    if (error) throw error;
                    if (!data) {
                        showToast('卡片不存在');
                        setTimeout(() => window.location.href = 'home.html', 1500);
                        return;
                    }

                    // 填充表单
                    document.getElementById('cardTitle').value = data.title || '';
                    document.getElementById('cardUrl').value = data.url || '';
                    document.getElementById('cardDescription').value = data.description || '';

                    // 切换为编辑模式
                    document.getElementById('formTitle').textContent = '编辑卡片';
                    document.getElementById('saveCardBtn').textContent = '保存修改';
                    document.getElementById('deleteCardBtn').style.display = 'flex';
                    editingId = cardId;
                } catch (err) {
                    console.error('加载卡片失败:', err);
                    showToast('加载失败：' + err.message);
                }
            }

            // 保存卡片（新建或更新）
            document.getElementById('saveCardBtn').addEventListener('click', async () => {
                const title = document.getElementById('cardTitle').value.trim();
                const url = document.getElementById('cardUrl').value.trim();
                const description = document.getElementById('cardDescription').value.trim();

                if (!title || !url || !description) {
                    showToast('请填写完整信息');
                    if (!title) document.getElementById('cardTitle').classList.add('error');
                    if (!url) document.getElementById('cardUrl').classList.add('error');
                    if (!description) document.getElementById('cardDescription').classList.add('error');
                    setTimeout(() => {
                        document.getElementById('cardTitle').classList.remove('error');
                        document.getElementById('cardUrl').classList.remove('error');
                        document.getElementById('cardDescription').classList.remove('error');
                    }, 2000);
                    return;
                }

                if (!currentUser) {
                    showToast('未获取到管理员身份');
                    return;
                }

                const submitterName = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || '管理员';

                const saveBtn = document.getElementById('saveCardBtn');
                saveBtn.disabled = true;
                saveBtn.textContent = '保存中...';

                try {
                    if (editingId) {
                        // 更新现有卡片
                        const { error } = await supabase
                            .from('websites')
                            .update({
                                title,
                                url,
                                description,
                                updated_at: new Date().toISOString()
                            })
                            .eq('id', editingId);

                        if (error) throw error;
                        showToast('卡片已更新');
                    } else {
                        // 新建卡片
                        const { error } = await supabase
                            .from('websites')
                            .insert({
                                title,
                                url,
                                description,
                                submitter_id: currentUser.id,
                                submitter_name: submitterName,
                                is_anonymous: false,
                                status: 'approved' // 管理员添加的卡片直接通过
                            });

                        if (error) throw error;
                        showToast('卡片已添加');
                    }

                    // 跳转回主页
                    setTimeout(() => window.location.href = 'home.html', 1500);
                } catch (err) {
                    console.error('保存卡片失败:', err);
                    showToast('保存失败：' + err.message);
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = editingId ? '保存修改' : '保存';
                }
            });

            // 删除卡片
            document.getElementById('deleteCardBtn').addEventListener('click', async () => {
                if (!editingId) return;
                if (!confirm('确定删除该卡片吗？此操作不可恢复。')) return;

                try {
                    const { error } = await supabase
                        .from('websites')
                        .delete()
                        .eq('id', editingId);

                    if (error) throw error;
                    showToast('卡片已删除');
                    setTimeout(() => window.location.href = 'home.html', 1500);
                } catch (err) {
                    console.error('删除卡片失败:', err);
                    showToast('删除失败：' + err.message);
                }
            });

            // 初始化
            async function init() {
                currentUser = await checkAdmin();
                if (!currentUser) return;

                // 检查 URL 参数中是否有 id
                const params = new URLSearchParams(window.location.search);
                const cardId = params.get('id');
                if (cardId) {
                    await loadCardData(cardId);
                }
            }

            init();
        })();
    </script>
</body>
</html>
