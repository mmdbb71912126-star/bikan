<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>登录 · 必看网</title>

    <!-- 与主页完全一致的深红色 Logo 图标 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M12 50 Q25 10 50 10 Q75 10 88 50 Q75 90 50 90 Q25 90 12 50 Z' fill='none' stroke='%238b0000' stroke-width='14' stroke-linejoin='round'/%3E%3Crect x='45' y='28' width='10' height='20' rx='4' fill='%238b0000'/%3E%3Crect x='47' y='56' width='6' height='6' rx='3' fill='%238b0000'/%3E%3C/svg%3E">

    <style>
        /* ============================================================
           与主页完全相同的 CSS 变量（深绿 + 黑色主题）
           ============================================================ */
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0d1117;
            --bg-card: #1e2f25;
            --bg-card-hover: #2d3f33;
            --border-color: #2d3f33;
            
            --text-primary: #e6edf3;
            --text-secondary: #94a3b8;
            --text-danger: #ef4444;
            
            --accent-green: #2d6a4f;
            --accent-green-hover: #1e4a35;
            --accent-red: #8b0000;
            
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        a { color: var(--accent-green); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ============================================================
           登录卡片
           ============================================================ */
        .login-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .logo-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .logo-header svg {
            width: 48px;
            height: 48px;
        }
        .logo-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .logo-header h1 span {
            color: var(--accent-red);
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 15px;
            transition: var(--transition);
        }
        .form-group input:focus {
            border-color: var(--accent-green);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-green);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-submit:hover {
            background: var(--accent-green-hover);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .toggle-link span {
            color: var(--accent-green);
            cursor: pointer;
            font-weight: 600;
        }
        .toggle-link span:hover {
            text-decoration: underline;
        }

        #errorMsg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--text-danger);
            color: var(--text-danger);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        #errorMsg.show {
            display: block;
        }

        .footer-text {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo -->
        <div class="logo-header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <path d="M12 50 Q25 10 50 10 Q75 10 88 50 Q75 90 50 90 Q25 90 12 50 Z" 
                      fill="none" stroke="var(--accent-red)" stroke-width="14" stroke-linejoin="round"/>
                <rect x="45" y="28" width="10" height="20" rx="4" fill="var(--accent-red)"/>
                <rect x="47" y="56" width="6" height="6" rx="3" fill="var(--accent-red)"/>
            </svg>
            <h1>必看<span>网</span></h1>
        </div>

        <!-- 错误提示 -->
        <div id="errorMsg"></div>

        <!-- 登录/注册表单 -->
        <div id="loginForm">
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="至少6位" required>
            </div>
            <button class="btn-submit" id="submitBtn" onclick="handleLogin()">登录</button>
            <div class="toggle-link">
                还没有账号？<span onclick="toggleMode()">去注册</span>
            </div>
        </div>

        <!-- 注册表单（动态切换） -->
        <div id="registerForm" style="display: none;">
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="regEmail" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>密码（至少6位）</label>
                <input type="password" id="regPassword" placeholder="设置密码" required>
            </div>
            <button class="btn-submit" id="submitBtnReg" onclick="handleRegister()">注册</button>
            <div class="toggle-link">
                已有账号？<span onclick="toggleMode()">去登录</span>
            </div>
        </div>

        <div class="footer-text">
            注册即代表你同意《必看网用户协议》
        </div>
    </div>

    <!-- ============================================================
    JS：加载 Supabase SDK
    ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================================
        //  与 app.js 完全相同的 Supabase 配置
        // ============================================================
        const SUPABASE_URL = 'https://bazpyoiklkoajdhfkwly.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lTx_tYITroL8_jVVR4EjAA_Eg61lBFT';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true;

        // ============================================================
        //  切换登录/注册模式
        // ============================================================
        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('loginForm').style.display = isLoginMode ? 'block' : 'none';
            document.getElementById('registerForm').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('errorMsg').textContent = '';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
        }

        // ============================================================
        //  登录逻辑
        // ============================================================
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!email || !password) { showError('请填写完整的邮箱和密码'); return; }

            btn.disabled = true;
            btn.textContent = '登录中...';
            document.getElementById('errorMsg').classList.remove('show');

            const { error } = await supabaseClient.auth.signInWithPassword({
                email, password
            });

            btn.disabled = false;
            btn.textContent = '登录';

            if (error) {
                showError('登录失败：' + (error.message || '未知错误'));
            } else {
                window.location.href = '/'; // 登录成功，跳转回首页
            }
        }

        // ============================================================
        //  注册逻辑
        // ============================================================
        async function handleRegister() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const btn = document.getElementById('submitBtnReg');

            if (!email || !password) { showError('请填写完整的邮箱和密码'); return; }
            if (password.length < 6) { showError('密码长度至少为 6 位'); return; }

            btn.disabled = true;
            btn.textContent = '注册中...';
            document.getElementById('errorMsg').classList.remove('show');

            const { error } = await supabaseClient.auth.signUp({
                email, password
            });

            btn.disabled = false;
            btn.textContent = '注册';

            if (error) {
                showError('注册失败：' + (error.message || '未知错误'));
            } else {
                alert('✅ 注册成功！请使用刚才的邮箱和密码登录。');
                toggleMode(); // 注册成功后自动切换到登录页
                document.getElementById('email').value = email;
                document.getElementById('password').value = '';
            }
        }

        // ============================================================
        //  回车监听（登录框直接按 Enter 触发登录）
        // ============================================================
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('regPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleRegister();
        });
    </script>
</body>
</html>
