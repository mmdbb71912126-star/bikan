<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 必看网</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #f0f2f5 0%, #e6e9f0 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: rgba(255,255,255,0.88); backdrop-filter: blur(16px); padding: 48px 44px; border-radius: 32px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.3); max-width: 420px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.6); }
        .login-box .logo { font-size: 52px; margin-bottom: 4px; }
        .login-box h1 { font-size: 30px; font-weight: 800; color: #0f172a; }
        .login-box h1 span { color: #6366f1; }
        .login-box .sub { color: #94a3b8; font-size: 15px; margin: 4px 0 28px 0; }
        .login-box .input-group { display: flex; flex-direction: column; gap: 12px; }
        .login-box .input-group input { padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 16px; background: #fff; transition: all 0.3s; }
        .login-box .input-group input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,0.12); }
        .login-box .btn-row { display: flex; gap: 10px; }
        .login-box .btn-row .btn-primary { flex:1; padding:14px; background:#6366f1; color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:600; transition: all 0.3s; cursor:pointer; }
        .login-box .btn-row .btn-primary:hover { background:#4f46e5; transform:translateY(-2px); box-shadow:0 8px 24px rgba(99,102,241,0.3); }
        .login-box .btn-row .btn-primary:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .login-box .btn-row .btn-secondary { flex:1; padding:14px; background:#8b5cf6; color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:600; transition: all 0.3s; cursor:pointer; }
        .login-box .btn-row .btn-secondary:hover { background:#7c3aed; transform:translateY(-2px); box-shadow:0 8px 24px rgba(139,92,246,0.3); }
        .login-box .msg { margin-top: 16px; padding: 10px 16px; border-radius: 12px; font-size: 14px; min-height: 44px; }
        .login-box .msg.info { background: #f1f5f9; color: #475569; }
        .login-box .msg.success { background: #dcfce7; color: #166534; }
        .login-box .msg.error { background: #fee2e2; color: #991b1b; }
        .login-box .msg.loading { background: #e0f2fe; color: #075985; }
        .login-box .hint { font-size: 13px; color: #94a3b8; margin-top: 20px; }
        .divider { display: flex; align-items: center; gap: 16px; margin: 20px 0 16px 0; color: #94a3b8; font-size: 13px; }
        .divider::before, .divider::after { flex: 1; height: 1px; background: #e2e8f0; content: ''; }
        .btn-google { width:100%; padding:12px; background:#fff; border:2px solid #e2e8f0; border-radius:14px; font-size:16px; font-weight:500; color:#1e293b; cursor:pointer; transition: all 0.3s; display:flex; align-items:center; justify-content:center; gap:10px; }
        .btn-google:hover { border-color:#4285F4; box-shadow:0 4px 12px rgba(66,133,244,0.15); }
        .btn-google img { width:20px; height:20px; }
        @media (max-width:480px) { .login-box { padding:32px 24px; } .login-box h1 { font-size:24px; } .btn-row { flex-direction:column; } }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">👁️</div>
        <h1>必看<span>网</span></h1>
        <p class="sub">分享 · 交流 · 成长</p>

        <!-- Google 登录 -->
        <button class="btn-google" onclick="signInWithGoogle()">
            <span style="font-size:20px;">🔴</span> 用 Google 账号登录
        </button>

        <div class="divider">或使用邮箱</div>

        <div class="input-group">
            <input type="email" id="loginEmail" placeholder="请输入邮箱地址" autocomplete="email">
            <button class="btn-primary" id="sendCodeBtn">📨 发送验证码</button>
            <div style="display:flex; gap:10px;">
                <input type="text" id="verifyCode" placeholder="6位验证码" maxlength="6" style="flex:2; padding:14px 18px; border:2px solid #e2e8f0; border-radius:14px; font-size:16px;">
                <button class="btn-secondary" id="verifyBtn" style="flex:1;">🔓 登录</button>
            </div>
        </div>
        <div id="loginMsg" class="msg info">💡 用 Google 一键登录，或输入邮箱收验证码</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bazpyoiklkoajdhfkwly.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lTx_tYITroL8_jVVR4EjAA_Eg61lBFT';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginEmail = document.getElementById('loginEmail');
        const verifyCode = document.getElementById('verifyCode');
        const loginMsg = document.getElementById('loginMsg');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const verifyBtn = document.getElementById('verifyBtn');
        let currentEmail = '';

        function showLoginMsg(msg, type = 'info') {
            loginMsg.textContent = msg;
            loginMsg.className = 'msg ' + type;
        }

        function setLoading(loading) {
            sendCodeBtn.disabled = loading;
            verifyBtn.disabled = loading;
            sendCodeBtn.textContent = loading ? '⏳...' : '📨 发送验证码';
            verifyBtn.textContent = loading ? '⏳...' : '🔓 登录';
        }

        // ===== 检查登录状态 =====
        (async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = '/';
            }
        })();

        // ===== Google 登录 =====
        async function signInWithGoogle() {
            console.log('🔴 Google 登录按钮被点击');
            try {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: 'http://bikan.dpdns.org'
                    }
                });
                if (error) {
                    showLoginMsg('❌ Google 登录失败：' + error.message, 'error');
                    console.error('Google 登录错误:', error);
                } else {
                    showLoginMsg('⏳ 正在跳转到 Google...', 'loading');
                }
            } catch (err) {
                showLoginMsg('❌ ' + err.message, 'error');
            }
        }

        // ===== 发送验证码 =====
        async function handleSendCode() {
            const email = loginEmail.value.trim();
            if (!email) { showLoginMsg('❌ 请输入邮箱', 'error'); return; }
            if (!email.includes('@')) { showLoginMsg('❌ 请输入有效邮箱', 'error'); return; }
            setLoading(true);
            showLoginMsg('📤 发送中...', 'loading');
            const { error } = await supabaseClient.auth.signInWithOtp({
                email: email,
                options: { shouldCreateUser: true }
            });
            setLoading(false);
            if (error) {
                if (error.message.includes('rate limit')) {
                    showLoginMsg('❌ 今天验证码发太多了，用 Google 登录吧！', 'error');
                } else {
                    showLoginMsg('❌ ' + error.message, 'error');
                }
            } else {
                currentEmail = email;
                showLoginMsg('✅ 验证码已发送（检查垃圾箱）📬', 'success');
            }
        }

        // ===== 验证验证码 =====
        async function handleVerify() {
            const code = verifyCode.value.trim();
            const email = loginEmail.value.trim();
            if (!email) { showLoginMsg('❌ 请先输入邮箱', 'error'); return; }
            if (!code || code.length < 6) { showLoginMsg('❌ 请输入6位验证码', 'error'); return; }
            setLoading(true);
            showLoginMsg('⏳ 验证中...', 'loading');
            const { error } = await supabaseClient.auth.verifyOtp({
                email: email,
                token: code,
                type: 'email'
            });
            setLoading(false);
            if (error) {
                showLoginMsg('❌ ' + error.message, 'error');
            } else {
                showLoginMsg('✅ 登录成功！', 'success');
                setTimeout(() => { window.location.href = '/'; }, 500);
            }
        }

        // ===== 绑定事件 =====
        sendCodeBtn.addEventListener('click', handleSendCode);
        verifyBtn.addEventListener('click', handleVerify);
        loginEmail.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSendCode(); });
        verifyCode.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleVerify(); });

        console.log('🔐 必看网 - Google + 验证码登录');
    </script>

</body>
</html>
