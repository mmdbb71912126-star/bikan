<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员登录 - ACG 资源</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f5f5f7;
      color: #1d1d1f;
      font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: #ffffff;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 48px rgba(0, 0, 0, 0.06);
    }

    .login-container .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-container .logo h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1d1d1f;
    }

    .login-container .logo p {
      font-size: 14px;
      color: #86868b;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #1d1d1f;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: #1d1d1f;
      background: #f5f5f7;
      border: 1px solid transparent;
      border-radius: 12px;
      transition: all 0.25s ease;
    }

    .form-group input:focus {
      outline: none;
      background: #ffffff;
      border-color: #007aff;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.08);
    }

    .form-group input::placeholder {
      color: #a1a1a6;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: #fff;
      background: #007aff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 8px;
    }

    .btn-login:hover {
      background: #0066d9;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0, 122, 255, 0.3);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      background: #fee2e2;
      color: #dc2626;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #86868b;
    }

    .login-footer a {
      color: #007aff;
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #86868b;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #1d1d1f;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <a href="index.html" class="back-link">← 返回首页</a>

    <div class="logo">
      <h1>🔐 管理员登录</h1>
      <p>输入你的账号密码</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" id="email" placeholder="admin@example.com" value="3948677391@qq.com" required />
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" required />
      </div>
      <button type="submit" class="btn-login" id="loginBtn">登 录</button>
    </form>

    <div class="login-footer">
      测试账号：3948677391@qq.com
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');

      errorMsg.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      const result = await login(email, password);

      if (result.success) {
        // 登录成功，跳回首页
        window.location.href = 'index.html';
      } else {
        errorMsg.textContent = result.error || '登录失败，请检查邮箱和密码';
        errorMsg.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
      }
    }

    // 检查是否已登录
    (async function() {
      const isLoggedIn = await checkAuth();
      if (isLoggedIn) {
        const user = await getCurrentUser();
        if (user && isAdmin(user.email)) {
          // 已登录且是管理员，直接跳转首页
          window.location.href = 'index.html';
        }
      }
    })();
  </script>

</body>
</html>
