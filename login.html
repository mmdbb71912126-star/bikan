<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 / 注册</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        h2 {
            font-weight: 600;
            font-size: 28px;
            margin-bottom: 8px;
            color: #1e293b;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: #334155;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: 0.2s;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .btn:hover {
            background: #5a6fd6;
            transform: translateY(-1px);
        }
        .btn-google {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-google:hover {
            background: #f8fafc;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
        .footer-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            cursor: pointer;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .message {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        .message.error {
            background: #fee2e2;
            color: #b91c1c;
            display: block;
        }
        .message.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <!-- ========== 登录界面 ========== -->
    <div id="loginPanel">
        <h2>欢迎回来</h2>
        <div class="subtitle">登录你的账户</div>

        <button class="btn btn-google" id="googleLoginBtn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google 一键登录
        </button>

        <div class="divider">或使用邮箱</div>

        <div class="form-group">
            <label>邮箱地址</label>
            <input type="email" id="loginEmail" placeholder="your@email.com" />
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginPassword" placeholder="••••••••" />
        </div>
        <button class="btn" id="loginBtn">登录</button>

        <div id="loginMessage" class="message"></div>

        <div class="footer-link">
            <a id="gotoForgot">忘记密码？点我验证</a> &nbsp;·&nbsp;
            <a id="gotoRegister">没有账号？点我注册</a>
        </div>
    </div>

    <!-- ========== 注册界面 ========== -->
    <div id="registerPanel" class="hidden">
        <h2>创建账户</h2>
        <div class="subtitle">快速注册，开始体验</div>

        <button class="btn btn-google" id="googleRegisterBtn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google 一键注册
        </button>

        <div class="divider">或使用邮箱注册</div>

        <div class="form-group">
            <label>邮箱地址</label>
            <input type="email" id="regEmail" placeholder="your@email.com" />
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="regPassword" placeholder="至少6位" />
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="regConfirm" placeholder="再次输入密码" />
        </div>
        <button class="btn" id="registerBtn">发送验证邮件</button>

        <div id="registerMessage" class="message"></div>

        <div class="footer-link">
            已有账号？<a id="gotoLoginFromRegister">点我登录</a>
        </div>
    </div>

    <!-- ========== 忘记密码界面 ========== -->
    <div id="forgotPanel" class="hidden">
        <a class="back-link" id="backFromForgot">← 返回</a>
        <h2>重置密码</h2>
        <div class="subtitle">我们将发送重置链接到你的邮箱</div>

        <div class="form-group">
            <label>邮箱地址</label>
            <input type="email" id="forgotEmail" placeholder="your@email.com" />
        </div>
        <button class="btn" id="forgotBtn">点击发送验证邮件</button>

        <div id="forgotMessage" class="message"></div>
    </div>
</div>

<script>
    // =====================================================
    // 1. 替换为你的 Supabase 配置
    // =====================================================
    const SUPABASE_URL = 'https://bazpyoiklkoajdhfkwly.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lTx_tYITroL8_jVVR4EjAA_Eg61lBFT';

    // =====================================================
    // 2. 初始化 Supabase 客户端
    // =====================================================
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =====================================================
    // 3. DOM 元素引用
    // =====================================================
    const loginPanel = document.getElementById('loginPanel');
    const registerPanel = document.getElementById('registerPanel');
    const forgotPanel = document.getElementById('forgotPanel');

    // 登录
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginMessage = document.getElementById('loginMessage');
    const googleLoginBtn = document.getElementById('googleLoginBtn');

    // 注册
    const regEmail = document.getElementById('regEmail');
    const regPassword = document.getElementById('regPassword');
    const regConfirm = document.getElementById('regConfirm');
    const registerBtn = document.getElementById('registerBtn');
    const registerMessage = document.getElementById('registerMessage');
    const googleRegisterBtn = document.getElementById('googleRegisterBtn');

    // 忘记密码
    const forgotEmail = document.getElementById('forgotEmail');
    const forgotBtn = document.getElementById('forgotBtn');
    const forgotMessage = document.getElementById('forgotMessage');

    // 导航链接
    const gotoRegister = document.getElementById('gotoRegister');
    const gotoLoginFromRegister = document.getElementById('gotoLoginFromRegister');
    const gotoForgot = document.getElementById('gotoForgot');
    const backFromForgot = document.getElementById('backFromForgot');

    // =====================================================
    // 4. 界面切换
    // =====================================================
    function showPanel(panel) {
        loginPanel.classList.add('hidden');
        registerPanel.classList.add('hidden');
        forgotPanel.classList.add('hidden');
        panel.classList.remove('hidden');
        // 清除所有消息
        document.querySelectorAll('.message').forEach(el => {
            el.className = 'message';
            el.textContent = '';
        });
    }

    gotoRegister.addEventListener('click', () => showPanel(registerPanel));
    gotoLoginFromRegister.addEventListener('click', () => showPanel(loginPanel));
    gotoForgot.addEventListener('click', () => showPanel(forgotPanel));
    backFromForgot.addEventListener('click', () => showPanel(loginPanel));

    // =====================================================
    // 5. 辅助函数：显示消息
    // =====================================================
    function setMessage(element, text, type = 'error') {
        element.textContent = text;
        element.className = `message ${type}`;
    }

    // =====================================================
    // 6. 登录功能
    // =====================================================
    loginBtn.addEventListener('click', async () => {
        const email = loginEmail.value.trim();
        const password = loginPassword.value;
        if (!email || !password) {
            setMessage(loginMessage, '请填写完整的邮箱和密码');
            return;
        }
        const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
        });
        if (error) {
            setMessage(loginMessage, error.message);
        } else {
            setMessage(loginMessage, '✅ 登录成功！正在跳转...', 'success');
            // 这里可以跳转到主页，例如：
            // window.location.href = '/dashboard.html';
        }
    });

    // Google 登录
    googleLoginBtn.addEventListener('click', async () => {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: window.location.origin  // 登录后回到当前页面
            }
        });
        if (error) setMessage(loginMessage, error.message);
        // 成功后会跳转到 Google，然后回跳到当前页面，此时用户已登录
    });

    // =====================================================
    // 7. 注册功能（发送验证邮件）
    // =====================================================
    registerBtn.addEventListener('click', async () => {
        const email = regEmail.value.trim();
        const password = regPassword.value;
        const confirm = regConfirm.value;
        if (!email || !password || !confirm) {
            setMessage(registerMessage, '请填写所有字段');
            return;
        }
        if (password.length < 6) {
            setMessage(registerMessage, '密码至少6位');
            return;
        }
        if (password !== confirm) {
            setMessage(registerMessage, '两次密码输入不一致');
            return;
        }
        const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
                emailRedirectTo: window.location.origin  // 验证后跳转地址
            }
        });
        if (error) {
            setMessage(registerMessage, error.message);
        } else {
            setMessage(registerMessage, '✅ 验证邮件已发送，请查收邮箱并点击链接完成注册！', 'success');
        }
    });

    // Google 注册（同登录，因为 OAuth 自动处理注册/登录）
    googleRegisterBtn.addEventListener('click', async () => {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: window.location.origin
            }
        });
        if (error) setMessage(registerMessage, error.message);
    });

    // =====================================================
    // 8. 忘记密码
    // =====================================================
    forgotBtn.addEventListener('click', async () => {
        const email = forgotEmail.value.trim();
        if (!email) {
            setMessage(forgotMessage, '请输入你的邮箱地址');
            return;
        }
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/update-password.html' // 你自定义的重置密码页面
        });
        if (error) {
            setMessage(forgotMessage, error.message);
        } else {
            setMessage(forgotMessage, '✅ 重置链接已发送，请查收邮箱！', 'success');
        }
    });

    // =====================================================
    // 9. 自动检测已登录用户（可选）
    // =====================================================
    (async function checkSession() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            // 用户已登录，可以跳转或显示信息
            console.log('已登录用户：', session.user.email);
            // 例如：显示欢迎信息或重定向
            // window.location.href = '/dashboard.html';
        }
    })();

    // 监听登录状态变化（例如 OAuth 回调后）
    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) {
            // 登录成功，可以跳转
            console.log('登录成功', session.user);
            // window.location.href = '/dashboard.html';
        }
    });
</script>

</body>
</html>
