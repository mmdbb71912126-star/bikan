<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 必看网</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ... 样式保持不变，省略 ... */
    </style>
</head>
<body>
    <!-- HTML 结构保持不变，同之前 -->
    <div class="login-box">...</div>

    <script>
        // ============================================================
        //  配 置
        // ============================================================
        const SUPABASE_URL = 'https://bazpyoiklkoajdhfkwly.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lTx_tYITroL8_jVVR4EjAA_Eg61lBFT';
        const SITE_URL = 'http://bikan.dpdns.org';

        const ALLOWED_DOMAINS = ['qq.com', 'gmail.com', '163.com', '126.com', 'outlook.com', 'foxmail.com', 'hotmail.com', 'live.com', 'yahoo.com', 'proton.me'];

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        //  DOM 元素（同之前）
        // ============================================================
        // ...（省略，与之前相同）

        // ============================================================
        //  检 查 登 录（加日志，加 token 有效性验证）
        // ============================================================
        let _isChecking = false;

        (async function checkSession() {
            if (_isChecking) {
                console.log('⚠️ 检查已在进行中，跳过');
                return;
            }
            _isChecking = true;
            console.log('🔍 开始检查登录状态...');

            try {
                // 1. 获取 session
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError) {
                    console.error('❌ 获取 session 失败:', sessionError);
                    _isChecking = false;
                    return;
                }

                console.log('📦 session:', session ? '存在' : '不存在');

                if (!session) {
                    console.log('✅ 无 session，停留在登录页');
                    _isChecking = false;
                    return;
                }

                // 2. 验证 token 是否有效（关键步骤）
                console.log('🔑 验证 token 有效性...');
                const { data: userData, error: userError } = await supabaseClient.auth.getUser();
                if (userError) {
                    console.error('❌ getUser 失败:', userError);
                    // token 无效，清除存储
                    await supabaseClient.auth.signOut();
                    localStorage.clear();
                    sessionStorage.clear();
                    try {
                        const dbs = await indexedDB.databases ? await indexedDB.databases() : [];
                        for (const db of dbs) {
                            if (db.name && db.name.includes('supabase')) {
                                indexedDB.deleteDatabase(db.name);
                                console.log('🗑️ 删除 IndexedDB:', db.name);
                            }
                        }
                    } catch (e) {}
                    _isChecking = false;
                    console.log('🔄 token 无效，已清除存储，重新加载页面');
                    location.reload();
                    return;
                }

                if (!userData.user) {
                    console.warn('⚠️ getUser 返回空用户');
                    await supabaseClient.auth.signOut();
                    localStorage.clear();
                    sessionStorage.clear();
                    _isChecking = false;
                    location.reload();
                    return;
                }

                console.log('✅ token 有效，用户:', userData.user.email);

                // 3. 检查封禁
                console.log('🔍 检查封禁状态...');
                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('is_banned, ban_expires_at, ban_reason')
                    .eq('id', userData.user.id)
                    .single();

                if (profileError) {
                    console.error('❌ 获取 profile 失败:', profileError);
                    // 如果 profile 不存在，可能是新用户，允许登录
                }

                if (profile?.is_banned) {
                    const expires = profile.ban_expires_at ? new Date(profile.ban_expires_at) : null;
                    if (!expires || expires > new Date()) {
                        console.warn('🚫 用户被封禁，退出');
                        await supabaseClient.auth.signOut();
                        localStorage.clear();
                        sessionStorage.clear();
                        showLoginMsg('🚫 你的账号已被封禁' + (profile.ban_reason ? '，理由：' + profile.ban_reason : '') + (expires ? '，封禁至：' + expires.toLocaleString() : '（永久封禁）'), 'error');
                        _isChecking = false;
                        return;
                    }
                }

                // 4. 一切正常，跳转到首页
                console.log('✅ 一切正常，跳转到首页');
                window.location.href = '/';
            } catch (e) {
                console.error('❌ 检查登录状态异常:', e);
                await supabaseClient.auth.signOut();
                localStorage.clear();
                sessionStorage.clear();
            }
            _isChecking = false;
        })();

        // ... 其他函数（登录、注册等）保持不变 ...
    </script>
</body>
</html>
