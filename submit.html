<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 发布网址</title>

    <!-- 网站图标（favicon）使用新的黑色 Logo SVG -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Markdown 渲染库 (marked) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ... 样式不变 ... */
        :root {
            --primary: #3ecf8e;
            --primary-dark: #2bb673;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: #3ecf8e;
            --error: #ff6b6b;
            --success: #3ecf8e;
            --google-bg: #ffffff;
            --google-text: #3c4043;
            --google-hover: #f8f9fa;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --toolbar-height: 56px;
            --id-library-height: 180px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
        }

        /* 工具栏、编辑器、弹窗等样式不变（由于篇幅，不再重复，请保留之前样式） */
        /* 此处省略样式，实际文件中应包含完整样式 */
    </style>
</head>
<body>

    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <!-- 工具栏按钮不变 ... -->
    </div>

    <!-- 编辑器主体 -->
    <div class="editor-container">
        <textarea class="editor-textarea" id="editor" placeholder="输入 Markdown 内容..." spellcheck="false"></textarea>
        <div class="preview-area" id="previewArea"></div>
    </div>

    <!-- ID库面板 -->
    <div class="id-library-panel" id="idLibraryPanel">
        <!-- ID库内容不变 ... -->
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal">
        <!-- 设置弹窗内容不变 ... -->
    </div>

    <!-- 发布确认弹窗 -->
    <div class="modal-overlay" id="publishModal">
        <div class="modal">
            <h3 class="modal-title">确认发布</h3>
            <p style="color:var(--text-secondary); margin-bottom:20px;">请确认您的帖子内容无误。发布后将提交给管理员审核，审核通过后才会在主页展示。</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelPublishBtn">再检查一下</button>
                <!-- 确保 onclick 属性存在 -->
                <button class="btn btn-primary" id="confirmPublishBtn" onclick="confirmPublish()">确认发布</button>
            </div>
        </div>
    </div>

    <!-- 草稿列表弹窗 -->
    <div class="modal-overlay" id="draftListModal">
        <!-- 草稿列表内容不变 ... -->
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="fileInput" multiple style="display:none" accept="image/*,video/*,audio/*" />

    <script>
        (function() {
            const SUPABASE_URL = 'https://qziqskgvzabuynduyuqy.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6aXFza2d2emFidXluZHV5dXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg4ODQsImV4cCI6MjEwMjQ0NDg4NH0.-LYORLfz-xpr1dMD_T-P8LzvgqTJngc0Hd52wSORhXs';

            let supabase;
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('Supabase 初始化成功');
            } catch (err) {
                console.error('Supabase 初始化失败:', err);
                showToast('Supabase 配置错误');
                return;
            }

            // DOM 元素
            const editor = document.getElementById('editor');
            const previewArea = document.getElementById('previewArea');
            const previewBtn = document.getElementById('previewBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const draftListBtn = document.getElementById('draftListBtn');
            const saveDraftBtn = document.getElementById('saveDraftBtn');
            const publishBtn = document.getElementById('publishBtn');
            const settingsModal = document.getElementById('settingsModal');
            const publishModal = document.getElementById('publishModal');
            const draftListModal = document.getElementById('draftListModal');
            const draftListContainer = document.getElementById('draftListContainer');
            const closeDraftListBtn = document.getElementById('closeDraftListBtn');
            const cardTitleInput = document.getElementById('cardTitle');
            const cardDescriptionInput = document.getElementById('cardDescription');
            const isAnonymousInput = document.getElementById('isAnonymous');
            const cancelSettingsBtn = document.getElementById('cancelSettingsBtn');
            const saveSettingsBtn = document.getElementById('saveSettingsBtn');
            const cancelPublishBtn = document.getElementById('cancelPublishBtn');
            const confirmPublishBtn = document.getElementById('confirmPublishBtn');
            const toast = document.getElementById('toast');
            const idLibraryPanel = document.getElementById('idLibraryPanel');
            const idLibraryBody = document.getElementById('idLibraryBody');
            const importFilesBtn = document.getElementById('importFilesBtn');
            const clearIdLibraryBtn = document.getElementById('clearIdLibraryBtn');
            const fileInput = document.getElementById('fileInput');

            let isPreviewMode = false;
            let cardMeta = { title: '', description: '', isAnonymous: false };

            // IndexedDB 封装（省略，与之前相同）
            // ...

            // 显示 Toast
            function showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(toast._hideTimer);
                toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 3000);
            }

            // 退出登录
            async function logout() {
                if (supabase) await supabase.auth.signOut();
                window.location.href = 'index.html';
            }
            window.logout = logout;

            // 设置弹窗相关（省略，与之前相同）
            // ...

            // 发布确认
            function openPublishConfirm() {
                console.log('openPublishConfirm called');
                if (!cardMeta.title || !cardMeta.description) {
                    showToast('请先在设置中填写卡片标题和简介');
                    openSettings();
                    return;
                }
                if (!editor.value.trim()) {
                    showToast('内容不能为空');
                    return;
                }
                publishModal.classList.add('show');
                console.log('发布确认弹窗已打开');
            }

            function cancelPublish() {
                publishModal.classList.remove('show');
            }

            async function confirmPublish() {
                console.log('confirmPublish 被调用');
                try {
                    const { data: { user } } = await supabase.auth.getUser();
                    if (!user) {
                        showToast('请先登录');
                        window.location.href = 'index.html';
                        return;
                    }
                    console.log('当前用户:', user.email);

                    const submitterName = user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || '用户';

                    // 简化：先不处理文件上传，只做基本插入
                    const { error: insertError } = await supabase
                        .from('websites')
                        .insert({
                            title: cardMeta.title,
                            description: cardMeta.description,
                            content: editor.value,
                            submitter_id: user.id,
                            submitter_name: submitterName,
                            is_anonymous: cardMeta.isAnonymous,
                            status: 'pending'
                            // 暂不包含 file_map
                        });

                    if (insertError) {
                        console.error('插入失败:', insertError);
                        showToast('发布失败：' + insertError.message);
                        return;
                    }

                    console.log('帖子插入成功');
                    publishModal.classList.remove('show');
                    showToast('已提交审核，感谢分享！');
                    editor.value = '';
                    cardMeta = { title: '', description: '', isAnonymous: false };
                    localStorage.removeItem('draft_website_post');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1500);
                } catch (err) {
                    console.error('发布过程出错:', err);
                    showToast('发布失败：' + err.message);
                }
            }

            // 将关键函数挂载到全局
            window.openSettings = openSettings;
            window.saveSettings = saveSettings;
            window.cancelSettings = closeSettings;
            window.togglePreview = togglePreview;
            window.saveDraft = saveDraft;
            window.openPublishConfirm = openPublishConfirm;
            window.cancelPublish = cancelPublish;
            window.confirmPublish = confirmPublish;
            window.loadDraftById = loadDraftById;
            window.deleteDraftById = deleteDraftById;
            window.toggleIdLibrary = toggleIdLibrary;
            window.importFiles = importFiles;
            window.clearIdLibrary = clearIdLibrary;

            // 事件绑定
            document.querySelectorAll('.toolbar-btn[data-action]').forEach(btn => {
                btn.addEventListener('click', function() {
                    insertMarkdown(this.dataset.action);
                });
            });
            previewBtn.addEventListener('click', togglePreview);
            settingsBtn.addEventListener('click', openSettings);
            cancelSettingsBtn.addEventListener('click', closeSettings);
            saveSettingsBtn.addEventListener('click', saveSettings);
            saveDraftBtn.addEventListener('click', saveDraft);
            publishBtn.addEventListener('click', openPublishConfirm);
            cancelPublishBtn.addEventListener('click', cancelPublish);
            // 确认发布按钮同时绑定两种方式
            confirmPublishBtn.addEventListener('click', confirmPublish);
            confirmPublishBtn.onclick = confirmPublish; // 确保内联 onclick 也有效
            draftListBtn.addEventListener('click', function() {
                renderDraftList();
                draftListModal.classList.add('show');
            });
            closeDraftListBtn.addEventListener('click', function() {
                draftListModal.classList.remove('show');
            });
            cardTitleInput.addEventListener('input', () => cardTitleInput.classList.remove('error'));
            cardDescriptionInput.addEventListener('input', () => cardDescriptionInput.classList.remove('error'));

            editor.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    saveDraft();
                }
                if (e.ctrlKey && e.key === 'p') {
                    e.preventDefault();
                    togglePreview();
                }
            });

            // 初始化
            async function init() {
                console.log('submit.html 初始化');
                // 加载草稿、ID库等
                await renderIdLibrary();
                loadLatestDraft();
                // 检查登录
                if (supabase) {
                    const { data: { user } } = await supabase.auth.getUser();
                    if (!user) {
                        window.location.href = 'index.html';
                    }
                }
            }
            init();
        })();
    </script>
</body>
</html>
