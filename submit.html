<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 发布网址</title>

    <!-- 网站图标（favicon）使用新的黑色 Logo SVG -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Markdown 渲染库 (marked) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #3ecf8e;
            --primary-dark: #2bb673;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: #3ecf8e;
            --error: #ff6b6b;
            --success: #3ecf8e;
            --google-bg: #ffffff;
            --google-text: #3c4043;
            --google-hover: #f8f9fa;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --toolbar-height: 56px;
            --id-library-height: 180px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
        }

        /* 工具栏 */
        .toolbar {
            height: var(--toolbar-height);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 10;
            overflow-x: auto;
        }
        .toolbar-group { display: flex; gap: 4px; align-items: center; }
        .toolbar-divider { width: 1px; height: 24px; background: var(--card-border); margin: 0 8px; flex-shrink: 0; }
        .toolbar-btn {
            background: none; border: none; cursor: pointer; padding: 8px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; transition: background var(--transition);
            color: var(--text-secondary); flex-shrink: 0;
        }
        .toolbar-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
        .toolbar-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .toolbar-btn.active { background: rgba(62, 207, 142, 0.15); color: var(--primary); }
        .toolbar-btn.primary { color: var(--primary); }
        .toolbar-btn.danger { color: var(--error); }
        .toolbar-btn.danger:hover { background: rgba(255, 107, 107, 0.15); }

        /* 编辑器容器 */
        .editor-container { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
        .editor-textarea {
            flex: 1; width: 100%; height: 100%; background: transparent; border: none; outline: none;
            resize: none; color: var(--text-primary); font-size: 16px; line-height: 1.6; padding: 20px 24px;
            font-family: 'Inter', sans-serif; transition: background var(--transition);
        }
        .editor-textarea:focus { background: rgba(255, 255, 255, 0.02); }
        .editor-textarea::placeholder { color: var(--text-muted); }

        .preview-area {
            flex: 1; overflow-y: auto; padding: 20px 24px; font-size: 16px; line-height: 1.6;
            color: var(--text-primary); display: none; background: rgba(255, 255, 255, 0.02);
        }
        .preview-area.show { display: block; }
        .preview-area h1, .preview-area h2, .preview-area h3 { margin: 16px 0 8px; }
        .preview-area p { margin: 8px 0; }
        .preview-area code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; }
        .preview-area pre { background: rgba(0,0,0,0.3); padding: 16px; border-radius: 8px; overflow-x: auto; }
        .preview-area a { color: var(--primary); }
        .preview-area img, .preview-area video { max-width: 100%; border-radius: 8px; }
        .preview-area audio { width: 100%; margin: 8px 0; }
        .id-placeholder { display: inline-block; background: rgba(62,207,142,0.15); border: 1px dashed var(--primary); border-radius: 8px; padding: 4px 10px; color: var(--primary); font-size: 14px; }

        /* ID库面板 */
        .id-library-panel {
            height: var(--id-library-height);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease;
            flex-shrink: 0;
            overflow: hidden;
        }
        .id-library-panel.collapsed { height: 36px; }
        .id-library-header { display: flex; align-items: center; gap: 12px; padding: 6px 16px; cursor: pointer; user-select: none; flex-shrink: 0; }
        .id-library-header .toggle-icon { transition: transform 0.3s ease; font-size: 12px; }
        .id-library-panel.collapsed .toggle-icon { transform: rotate(-90deg); }
        .id-library-title { font-weight: 600; font-size: 13px; color: var(--text-secondary); flex: 1; }
        .id-library-actions { display: flex; gap: 8px; }
        .id-library-actions .toolbar-btn { padding: 4px; }
        .id-library-body { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; gap: 12px; flex-wrap: wrap; align-content: flex-start; }
        .id-library-empty { color: var(--text-muted); font-size: 13px; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .id-file-item {
            display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06);
            border-radius: 8px; padding: 6px 10px; cursor: grab; transition: background var(--transition);
            max-width: 200px; height: 50px;
        }
        .id-file-item:hover { background: rgba(255,255,255,0.1); }
        .id-file-item.dragging { opacity: 0.5; }
        .id-file-thumb {
            width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
            background: rgba(62,207,142,0.2); display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 18px; font-weight: bold;
        }
        .id-file-info { flex: 1; overflow: hidden; }
        .id-file-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .id-file-id { font-size: 11px; color: var(--text-muted); }
        .id-file-delete { background: none; border: none; cursor: pointer; padding: 2px; color: var(--text-muted); transition: color var(--transition); flex-shrink: 0; }
        .id-file-delete:hover { color: var(--error); }
        .id-file-delete svg { width: 16px; height: 16px; fill: currentColor; }

        /* 弹窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 200;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: rgba(30,30,50,0.9); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border); border-radius: var(--radius); padding: 24px 28px;
            max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); animation: modalIn 0.3s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text-primary); }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 12px 16px; font-size: 15px; color: var(--text-primary);
            background: var(--input-bg); border: 1.5px solid var(--input-border); border-radius: var(--radius-sm);
            outline: none; transition: all var(--transition);
        }
        .form-input:focus { border-color: var(--input-focus); background: rgba(255,255,255,0.1); box-shadow: 0 0 0 4px rgba(62,207,142,0.15); }
        .form-input.error { border-color: var(--error); }
        .form-textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 14px; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        .btn {
            padding: 10px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
            cursor: pointer; border: none; transition: all var(--transition); display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #2bb673); color: #0f0c29; box-shadow: 0 4px 12px rgba(62,207,142,0.3); }
        .btn-primary:hover { box-shadow: 0 6px 18px rgba(62,207,142,0.5); transform: translateY(-1px); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.15); }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(30,30,50,0.95); color: #fff; padding: 12px 24px; border-radius: 30px;
            font-size: 14px; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 600px) {
            .toolbar { padding: 0 12px; }
            .editor-textarea { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="toolbar-btn" data-action="heading" title="标题">
                <svg viewBox="0 0 24 24"><path d="M5 4h2v6h10V4h2v16h-2v-8H7v8H5V4z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="bold" title="加粗">
                <svg viewBox="0 0 24 24"><path d="M15.6 10.79c.97-.67 1.6-1.76 1.6-2.98C17.2 5.6 15.6 4 13.5 4H6v16h8.5c2.3 0 4.2-1.8 4.2-4.1 0-1.8-1.1-3.3-2.8-3.9zM9 6.5h3.5c1.1 0 2 .9 2 2s-.9 2-2 2H9v-4zm5.5 11H9v-4h5.5c1.2 0 2.2.9 2.2 2s-1 2-2.2 2z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="italic" title="斜体">
                <svg viewBox="0 0 24 24"><path d="M10 4h4l4 16h-2l-1-4H9l-1 4H6l4-16z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="link" title="链接">
                <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="image" title="图片（默认宽度50%）">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="video" title="视频（默认宽度50%）">
                <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="audio" title="音频">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="quote" title="引用">
                <svg viewBox="0 0 24 24"><path d="M6 17h3l2-4V7H5v6h3l-2 4zm8 0h3l2-4V7h-6v6h3l-2 4z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="code" title="代码块">
                <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="list-ul" title="无序列表">
                <svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="list-ol" title="有序列表">
                <svg viewBox="0 0 24 24"><path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="hr" title="分割线">
                <svg viewBox="0 0 24 24"><path d="M6 11h12v2H6z"/></svg>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
            <button class="toolbar-btn" id="previewBtn" title="预览">
                <svg viewBox="0 0 24 24"><path d="M12 6c-3.87 0-7.17 2.36-8.48 5.66L3 12l.52.34C4.83 15.64 8.13 18 12 18s7.17-2.36 8.48-5.66L21 12l-.52-.34C19.17 8.36 15.87 6 12 6zm0 10c-2.76 0-5.24-1.55-6.47-4C6.76 9.55 9.24 8 12 8s5.24 1.55 6.47 4c-1.23 2.45-3.71 4-6.47 4zm0-6.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
            </button>
            <button class="toolbar-btn" id="settingsBtn" title="设置（卡片标题和简介）">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.31.59.22l2.39-.96c.49.37 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54a7.03 7.03 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
            <button class="toolbar-btn" id="saveDraftBtn" title="保存草稿">
                <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
            </button>
            <button class="toolbar-btn danger" id="publishBtn" title="发布">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
            <button class="toolbar-btn" id="logoutBtn" title="退出登录" onclick="logout()">
                <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
            </button>
        </div>
    </div>

    <!-- 编辑器 -->
    <div class="editor-container">
        <textarea class="editor-textarea" id="editor" placeholder="输入 Markdown 内容，例如：&#10;# 标题&#10;这是一段描述..." spellcheck="false"></textarea>
        <div class="preview-area" id="previewArea"></div>
    </div>

    <!-- ID库面板 -->
    <div class="id-library-panel" id="idLibraryPanel">
        <div class="id-library-header" onclick="toggleIdLibrary()">
            <span class="toggle-icon">▼</span>
            <span class="id-library-title">ID 库</span>
            <div class="id-library-actions">
                <button class="toolbar-btn" id="importFilesBtn" title="导入文件" onclick="event.stopPropagation(); importFiles()">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                </button>
                <button class="toolbar-btn" id="clearIdLibraryBtn" title="清空ID库" onclick="event.stopPropagation(); clearIdLibrary()">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
            </div>
        </div>
        <div class="id-library-body" id="idLibraryBody">
            <div class="id-library-empty">还没有导入文件，点击上方“导入文件”按钮添加</div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3 class="modal-title">设置卡片信息</h3>
            <div class="form-group">
                <label class="form-label" for="cardTitle">卡片标题 <span style="color:var(--error)">*</span></label>
                <input class="form-input" type="text" id="cardTitle" placeholder="例如：必看 - 精选好网址" />
            </div>
            <div class="form-group">
                <label class="form-label" for="cardDescription">简单介绍 <span style="color:var(--error)">*</span></label>
                <textarea class="form-input form-textarea" id="cardDescription" placeholder="用一两句话介绍这个网址的特色"></textarea>
            </div>
            <div class="form-group">
                <label class="checkbox-group">
                    <input type="checkbox" id="isAnonymous" />
                    <span>匿名发布（不显示我的用户名）</span>
                </label>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelSettingsBtn">取消</button>
                <button class="btn btn-primary" id="saveSettingsBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 发布确认弹窗 -->
    <div class="modal-overlay" id="publishModal">
        <div class="modal">
            <h3 class="modal-title">确认发布</h3>
            <p style="color:var(--text-secondary); margin-bottom:20px;">请确认您的帖子内容无误。发布后将提交给管理员审核，审核通过后才会在主页展示。</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelPublishBtn">再检查一下</button>
                <button class="btn btn-primary" id="confirmPublishBtn" onclick="confirmPublish()">确认发布</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="fileInput" multiple style="display:none" accept="image/*,video/*,audio/*" />

    <script>
        (function() {
            const SUPABASE_URL = 'https://qziqskgvzabuynduyuqy.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6aXFza2d2emFidXluZHV5dXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg4ODQsImV4cCI6MjEwMjQ0NDg4NH0.-LYORLfz-xpr1dMD_T-P8LzvgqTJngc0Hd52wSORhXs';

            let supabase;
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (err) {
                console.error('Supabase 初始化失败:', err);
                showToast('Supabase 配置错误');
                return;
            }

            // DOM 元素
            const editor = document.getElementById('editor');
            const previewArea = document.getElementById('previewArea');
            const previewBtn = document.getElementById('previewBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const saveDraftBtn = document.getElementById('saveDraftBtn');
            const publishBtn = document.getElementById('publishBtn');
            const settingsModal = document.getElementById('settingsModal');
            const publishModal = document.getElementById('publishModal');
            const cardTitleInput = document.getElementById('cardTitle');
            const cardDescriptionInput = document.getElementById('cardDescription');
            const isAnonymousInput = document.getElementById('isAnonymous');
            const cancelSettingsBtn = document.getElementById('cancelSettingsBtn');
            const saveSettingsBtn = document.getElementById('saveSettingsBtn');
            const cancelPublishBtn = document.getElementById('cancelPublishBtn');
            const confirmPublishBtn = document.getElementById('confirmPublishBtn');
            const toast = document.getElementById('toast');
            const idLibraryPanel = document.getElementById('idLibraryPanel');
            const idLibraryBody = document.getElementById('idLibraryBody');
            const importFilesBtn = document.getElementById('importFilesBtn');
            const clearIdLibraryBtn = document.getElementById('clearIdLibraryBtn');
            const fileInput = document.getElementById('fileInput');

            let isPreviewMode = false;
            let cardMeta = { title: '', description: '', isAnonymous: false };

            // ========== IndexedDB 封装 ==========
            const dbName = 'bikan_id_library';
            const storeName = 'files';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db) { resolve(db); return; }
                    const request = indexedDB.open(dbName, 1);
                    request.onupgradeneeded = (e) => {
                        const database = e.target.result;
                        if (!database.objectStoreNames.contains(storeName)) {
                            database.createObjectStore(storeName, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbAdd(id, file) {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([storeName], 'readwrite');
                    const store = transaction.objectStore(storeName);
                    const record = { id, file, type: file.type, name: file.name };
                    store.put(record);
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbGetAll() {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([storeName], 'readonly');
                    const store = transaction.objectStore(storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbDelete(id) {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([storeName], 'readwrite');
                    const store = transaction.objectStore(storeName);
                    store.delete(id);
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e.target.error);
                });
            }

            async function idbClear() {
                await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([storeName], 'readwrite');
                    const store = transaction.objectStore(storeName);
                    store.clear();
                    transaction.oncomplete = () => resolve();
                    transaction.onerror = (e) => reject(e.target.error);
                });
            }

            // ========== 文件ID库管理 ==========
            function generateShortId() {
                return Math.random().toString(36).substring(2, 8);
            }

            async function renderIdLibrary() {
                const files = await idbGetAll();
                idLibraryBody.innerHTML = '';
                if (files.length === 0) {
                    idLibraryBody.innerHTML = '<div class="id-library-empty">还没有导入文件，点击上方“导入文件”按钮添加</div>';
                    return;
                }
                files.forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'id-file-item';
                    item.draggable = true;
                    item.dataset.fileId = record.id;
                    item.dataset.fileType = record.type.split('/')[0];

                    const thumb = document.createElement('div');
                    thumb.className = 'id-file-thumb';
                    if (record.type.startsWith('image/')) {
                        const img = document.createElement('img');
                        img.src = URL.createObjectURL(record.file);
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        thumb.appendChild(img);
                    } else if (record.type.startsWith('video/')) {
                        thumb.textContent = 'VID';
                    } else if (record.type.startsWith('audio/')) {
                        thumb.textContent = 'AUD';
                    } else {
                        thumb.textContent = 'FILE';
                    }

                    const info = document.createElement('div');
                    info.className = 'id-file-info';
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'id-file-name';
                    nameDiv.textContent = record.name;
                    const idDiv = document.createElement('div');
                    idDiv.className = 'id-file-id';
                    idDiv.textContent = `ID: ${record.id}`;
                    info.appendChild(nameDiv);
                    info.appendChild(idDiv);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'id-file-delete';
                    deleteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
                    deleteBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        await deleteIdFile(record.id);
                    });

                    item.appendChild(thumb);
                    item.appendChild(info);
                    item.appendChild(deleteBtn);

                    item.addEventListener('dragstart', (e) => {
                        const fileType = record.type.split('/')[0];
                        let syntax = `@id[${fileType}:${record.id}]`;
                        if (fileType === 'image' || fileType === 'video') {
                            syntax = `@id[${fileType}:${record.id} =50%]`;
                        }
                        e.dataTransfer.setData('text/plain', syntax);
                        e.dataTransfer.effectAllowed = 'copy';
                        item.classList.add('dragging');
                    });
                    item.addEventListener('dragend', () => item.classList.remove('dragging'));

                    idLibraryBody.appendChild(item);
                });
            }

            async function deleteIdFile(id) {
                await idbDelete(id);
                renderIdLibrary();
                showToast('已从 ID 库删除');
            }

            async function clearIdLibrary() {
                if (confirm('确定清空 ID 库中的所有文件吗？')) {
                    await idbClear();
                    renderIdLibrary();
                    showToast('ID 库已清空');
                }
            }

            async function importFiles() {
                fileInput.click();
            }

            fileInput.addEventListener('change', async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                for (const file of files) {
                    if (!['image/', 'video/', 'audio/'].some(prefix => file.type.startsWith(prefix))) {
                        showToast(`不支持的文件类型: ${file.name}`);
                        continue;
                    }
                    const id = generateShortId();
                    await idbAdd(id, file);
                }
                renderIdLibrary();
                showToast(`已导入 ${files.length} 个文件`);
                fileInput.value = '';
            });

            function toggleIdLibrary() {
                idLibraryPanel.classList.toggle('collapsed');
                const icon = idLibraryPanel.querySelector('.toggle-icon');
                if (idLibraryPanel.classList.contains('collapsed')) {
                    icon.textContent = '▼';
                } else {
                    icon.textContent = '▼';
                }
            }
            window.toggleIdLibrary = toggleIdLibrary;
            window.importFiles = importFiles;
            window.clearIdLibrary = clearIdLibrary;

            // ========== Markdown 编辑器逻辑 ==========
            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(toast._hideTimer);
                toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 3000);
            }

            async function logout() {
                if (supabase) await supabase.auth.signOut();
                window.location.href = 'index.html';
            }
            window.logout = logout;

            function openSettings() {
                cardTitleInput.value = cardMeta.title || '';
                cardDescriptionInput.value = cardMeta.description || '';
                isAnonymousInput.checked = cardMeta.isAnonymous || false;
                settingsModal.classList.add('show');
                cardTitleInput.focus();
            }
            window.openSettings = openSettings;

            function closeSettings() {
                settingsModal.classList.remove('show');
            }
            window.cancelSettings = closeSettings;

            function saveSettings() {
                const title = cardTitleInput.value.trim();
                const description = cardDescriptionInput.value.trim();
                if (!title || !description) {
                    showToast('标题和简介均为必填项');
                    if (!title) cardTitleInput.classList.add('error');
                    if (!description) cardDescriptionInput.classList.add('error');
                    setTimeout(() => {
                        cardTitleInput.classList.remove('error');
                        cardDescriptionInput.classList.remove('error');
                    }, 2000);
                    return;
                }
                cardMeta.title = title;
                cardMeta.description = description;
                cardMeta.isAnonymous = isAnonymousInput.checked;
                closeSettings();
                showToast('设置已保存');
            }
            window.saveSettings = saveSettings;

            function preprocessMarkdown(markdown, idMap) {
                markdown = markdown.replace(/@id\[(image|video|audio):([a-zA-Z0-9]+)\s*(?:=(\d+)%)?\]/g, (match, type, id, width) => {
                    const record = idMap[id];
                    if (!record) return `<span class="id-placeholder">缺失文件: ${id}</span>`;
                    const url = URL.createObjectURL(record.file);
                    const widthStyle = width ? `${width}%` : '100%';
                    if (type === 'image') {
                        return `<img src="${url}" alt="${record.name}" style="max-width: ${widthStyle}; border-radius: 8px;" />`;
                    } else if (type === 'video') {
                        return `<video controls src="${url}" style="max-width: ${widthStyle}; border-radius: 8px;"></video>`;
                    } else if (type === 'audio') {
                        return `<audio controls src="${url}"></audio>`;
                    }
                    return match;
                });
                markdown = markdown.replace(/!\[([^\]]*)\]\(([^)]+?)\s*=(\d+)%\)/g, (m, alt, url, width) => `<img src="${url}" width="${width}%" alt="${alt}" />`);
                markdown = markdown.replace(/@video\[([^\]]*)\]\(([^)]+?)\s*=(\d+)%\)/g, (m, alt, url, width) => `<video width="${width}%" controls src="${url}">${alt}</video>`);
                markdown = markdown.replace(/@audio\[([^\]]*)\]\(([^)]+?)\)/g, (m, alt, url) => `<audio controls src="${url}"></audio>`);
                return markdown;
            }

            async function togglePreview() {
                isPreviewMode = !isPreviewMode;
                if (isPreviewMode) {
                    const idMap = {};
                    const files = await idbGetAll();
                    files.forEach(record => { idMap[record.id] = record; });
                    const processed = preprocessMarkdown(editor.value, idMap);
                    const html = marked.parse(processed);
                    previewArea.innerHTML = html;
                    previewArea.classList.add('show');
                    editor.style.display = 'none';
                    previewBtn.classList.add('active');
                } else {
                    previewArea.classList.remove('show');
                    editor.style.display = 'block';
                    previewBtn.classList.remove('active');
                    editor.focus();
                }
            }
            window.togglePreview = togglePreview;

            function insertMarkdown(action) {
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                const selectedText = editor.value.substring(start, end);
                let insertion = '';
                let cursorOffset = 0;
                switch (action) {
                    case 'heading': insertion = `# ${selectedText || '标题'}`; cursorOffset = insertion.length; break;
                    case 'bold': insertion = `**${selectedText || '加粗文本'}**`; cursorOffset = 2; break;
                    case 'italic': insertion = `*${selectedText || '斜体文本'}*`; cursorOffset = 1; break;
                    case 'link': insertion = `[${selectedText || '链接文字'}](https://)`; cursorOffset = insertion.length - 1; break;
                    case 'image': insertion = `![图片描述](https:// =50%)`; cursorOffset = 6; break;
                    case 'video': insertion = `@video[视频描述](https:// =50%)`; cursorOffset = 10; break;
                    case 'audio': insertion = `@audio[音频描述](https://)`; cursorOffset = 10; break;
                    case 'quote': insertion = `> ${selectedText || '引用内容'}`; cursorOffset = insertion.length; break;
                    case 'code': insertion = `\`\`\`\n${selectedText || '代码'}\n\`\`\``; cursorOffset = 3; break;
                    case 'list-ul': insertion = `\n- ${selectedText || '列表项'}`; cursorOffset = insertion.length; break;
                    case 'list-ol': insertion = `\n1. ${selectedText || '列表项'}`; cursorOffset = insertion.length; break;
                    case 'hr': insertion = `\n---\n`; cursorOffset = insertion.length; break;
                    default: return;
                }
                const newValue = editor.value.substring(0, start) + insertion + editor.value.substring(end);
                editor.value = newValue;
                const newCursorPos = start + cursorOffset;
                editor.focus();
                editor.setSelectionRange(newCursorPos, newCursorPos);
            }

            // 拖放编辑器
            editor.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
            editor.addEventListener('drop', (e) => {
                e.preventDefault();
                const syntax = e.dataTransfer.getData('text/plain');
                if (syntax.startsWith('@id[')) {
                    const start = editor.selectionStart;
                    const end = editor.selectionEnd;
                    const newValue = editor.value.substring(0, start) + syntax + editor.value.substring(end);
                    editor.value = newValue;
                    const pos = start + syntax.length;
                    editor.focus();
                    editor.setSelectionRange(pos, pos);
                    showToast('已插入 ID 引用');
                }
            });

            // ========== 草稿相关 ==========
            function saveDraft() {
                const draft = { content: editor.value, meta: cardMeta, timestamp: new Date().toISOString() };
                localStorage.setItem(`draft_${Date.now()}`, JSON.stringify(draft));
                showToast('草稿已保存');
            }
            window.saveDraft = saveDraft;

            // ========== 发布流程 ==========
            function openPublishConfirm() {
                if (!cardMeta.title || !cardMeta.description) {
                    showToast('请先在设置中填写卡片标题和简介');
                    openSettings();
                    return;
                }
                if (!editor.value.trim()) {
                    showToast('内容不能为空');
                    return;
                }
                publishModal.classList.add('show');
            }
            window.openPublishConfirm = openPublishConfirm;

            function cancelPublish() {
                publishModal.classList.remove('show');
            }
            window.cancelPublish = cancelPublish;

            async function confirmPublish() {
                console.log('开始发布流程');
                try {
                    const { data: { user } } = await supabase.auth.getUser();
                    if (!user) {
                        showToast('请先登录');
                        window.location.href = 'index.html';
                        return;
                    }

                    const submitterName = user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || '用户';

                    // 收集 ID 库文件引用
                    const idMap = {};
                    const files = await idbGetAll();
                    files.forEach(record => { idMap[record.id] = record; });

                    const content = editor.value;
                    const idRefs = content.matchAll(/@id\[(image|video|audio):([a-zA-Z0-9]+)\s*(?:=(\d+)%)?\]/g);
                    const uploadMap = {};

                    for (const match of idRefs) {
                        const type = match[1];
                        const id = match[2];
                        const width = match[3] || null;
                        if (!idMap[id]) {
                            showToast(`ID 库中不存在 ${id}，请检查`);
                            return;
                        }
                        const file = idMap[id].file;
                        const fileExt = file.name.split('.').pop() || 'bin';
                        const path = `${user.id}/${Date.now()}_${id}.${fileExt}`;
                        const { error: uploadError } = await supabase.storage
                            .from('media')
                            .upload(path, file);
                        if (uploadError) {
                            console.error('上传失败:', uploadError);
                            showToast(`文件 ${id} 上传失败：${uploadError.message}`);
                            return;
                        }
                        const { data: publicUrlData } = supabase.storage
                            .from('media')
                            .getPublicUrl(path);
                        const publicUrl = publicUrlData.publicUrl;
                        uploadMap[id] = { url: publicUrl, type, width };
                    }

                    // 替换内容中的 ID 引用为公共 URL
                    let finalContent = content;
                    for (const [id, info] of Object.entries(uploadMap)) {
                        const widthSuffix = info.width ? ` =${info.width}%` : '';
                        if (info.type === 'image') {
                            finalContent = finalContent.replaceAll(new RegExp(`@id\\[image:${id}\\s*(?:=\\d+%)?\\]`, 'g'), `![图片](${info.url}${widthSuffix})`);
                        } else if (info.type === 'video') {
                            finalContent = finalContent.replaceAll(new RegExp(`@id\\[video:${id}\\s*(?:=\\d+%)?\\]`, 'g'), `@video[视频](${info.url}${widthSuffix})`);
                        } else if (info.type === 'audio') {
                            finalContent = finalContent.replaceAll(new RegExp(`@id\\[audio:${id}\\s*(?:=\\d+%)?\\]`, 'g'), `@audio[音频](${info.url})`);
                        }
                    }

                    const { error: dbError } = await supabase
                        .from('websites')
                        .insert({
                            title: cardMeta.title,
                            description: cardMeta.description,
                            content: finalContent,
                            submitter_id: user.id,
                            submitter_name: submitterName,
                            is_anonymous: cardMeta.isAnonymous,
                            status: 'pending',
                            file_map: uploadMap
                        });

                    if (dbError) throw dbError;

                    publishModal.classList.remove('show');
                    showToast('已提交审核，感谢分享！');
                    editor.value = '';
                    cardMeta = { title: '', description: '', isAnonymous: false };
                    localStorage.removeItem('draft_website_post');
                    await idbClear();
                    renderIdLibrary();
                    setTimeout(() => { window.location.href = 'home.html'; }, 1500);
                } catch (err) {
                    console.error('发布失败:', err);
                    showToast('发布失败：' + err.message);
                }
            }
            window.confirmPublish = confirmPublish;

            // ========== 事件绑定 ==========
            document.querySelectorAll('.toolbar-btn[data-action]').forEach(btn => {
                btn.addEventListener('click', () => insertMarkdown(btn.dataset.action));
            });
            previewBtn.addEventListener('click', togglePreview);
            settingsBtn.addEventListener('click', openSettings);
            cancelSettingsBtn.addEventListener('click', closeSettings);
            saveSettingsBtn.addEventListener('click', saveSettings);
            saveDraftBtn.addEventListener('click', saveDraft);
            publishBtn.addEventListener('click', openPublishConfirm);
            cancelPublishBtn.addEventListener('click', cancelPublish);
            confirmPublishBtn.addEventListener('click', confirmPublish);
            confirmPublishBtn.onclick = confirmPublish;

            editor.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveDraft(); }
                if (e.ctrlKey && e.key === 'p') { e.preventDefault(); togglePreview(); }
            });

            // ========== 初始化 ==========
            async function init() {
                await renderIdLibrary();
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    window.location.href = 'index.html';
                    return;
                }
                // 可选加载草稿
                const drafts = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('draft_')) {
                        try { const d = JSON.parse(localStorage.getItem(key)); d.id = key; drafts.push(d); } catch(e) {}
                    }
                }
                if (drafts.length > 0) {
                    drafts.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                    const latest = drafts[0];
                    editor.value = latest.content || '';
                    cardMeta = latest.meta || { title: '', description: '', isAnonymous: false };
                }
            }
            init();
        })();
    </script>
</body>
