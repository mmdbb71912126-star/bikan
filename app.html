<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 主页</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg class="sidebar-logo" xmlns="http://www.w3.org/2000/svg" viewBox="280 140 440 400">
                    <path d="M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z" fill="black" fill-rule="evenodd" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="484" y="273" width="32" height="100" rx="10" fill="black" />
                    <rect x="488" y="383" width="24" height="24" rx="8" fill="black" />
                </svg>
                <span class="sidebar-title">必看</span>
                <span id="navBadge" class="nav-badge hidden"></span>
            </div>

            <nav id="sidebarNav"></nav>

            <!-- 静态退出登录按钮区域 -->
            <div class="sidebar-footer" id="sidebarFooter">
                <div class="user-mini" data-route="profile">
                    <div class="avatar-sm" id="userAvatarSmall"></div>
                    <div class="user-mini-info">
                        <div class="user-mini-name" id="userDisplayName">用户</div>
                        <div class="user-mini-id" id="userEmail">user@example.com</div>
                    </div>
                    <button class="logout-btn" id="logoutBtn" title="退出登录">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </div>
        </aside>

        <main class="main-content" id="mainContent"></main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
