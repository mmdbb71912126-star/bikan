<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 反馈管理</title>

    <!-- 网站图标（favicon）使用新的黑色 Logo SVG -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #3ecf8e;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --error: #ff6b6b;
            --success: #3ecf8e;
            --warning: #ffc107;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            padding: 30px 36px;
        }

        .admin-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition);
        }
        .back-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
        .back-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .admin-title { font-size: 24px; font-weight: 700; }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .admin-tab {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--input-border);
            background: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            font-weight: 500;
        }
        .admin-tab:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
        .admin-tab.active { background: var(--primary); color: #0f0c29; border-color: var(--primary); }

        .feedback-item {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
        }
        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .feedback-title { font-weight: 600; font-size: 16px; }
        .feedback-actions { display: flex; gap: 8px; }

        .btn {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all var(--transition);
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-resolve { background: var(--success); color: #0f0c29; }
        .btn-ignore { background: rgba(255,193,7,0.2); color: var(--warning); }
        .btn-delete { background: rgba(255,107,107,0.2); color: var(--error); }

        .feedback-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
        .feedback-url { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .feedback-meta { font-size: 11px; color: var(--text-muted); }

        .status-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-pending { background: rgba(255,193,7,0.2); color: var(--warning); }
        .status-resolved { background: rgba(62,207,142,0.2); color: var(--success); }
        .status-ignored { background: rgba(255,107,107,0.2); color: var(--error); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30,30,50,0.95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="admin-header">
        <a class="back-btn" href="home.html">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            返回主页
        </a>
        <h1 class="admin-title">反馈管理</h1>
    </div>

    <div class="admin-tabs">
        <button class="admin-tab active" data-status="pending">待处理</button>
        <button class="admin-tab" data-status="resolved">已处理</button>
        <button class="admin-tab" data-status="ignored">已忽略</button>
    </div>

    <div id="feedbackList"></div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://qziqskgvzabuynduyuqy.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6aXFza2d2emFidXluZHV5dXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg4ODQsImV4cCI6MjEwMjQ0NDg4NH0.-LYORLfz-xpr1dMD_T-P8LzvgqTJngc0Hd52wSORhXs';
            const ADMIN_EMAIL = '3948677391@qq.com';

            let supabase;
            try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) { console.error(e); }

            let currentUser = null;
            let currentStatus = 'pending';
            let allFeedbacks = [];

            function showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            async function loadFeedbacks(status) {
                currentStatus = status;
                const container = document.getElementById('feedbackList');
                container.innerHTML = '<p style="color:var(--text-muted);">加载中...</p>';
                try {
                    const { data, error } = await supabase
                        .from('feedback')
                        .select('*')
                        .eq('status', status)
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    allFeedbacks = data;
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty-state">暂无反馈</div>';
                        return;
                    }
                    container.innerHTML = data.map(item => {
                        const statusMap = {
                            pending: '<span class="status-tag status-pending">待处理</span>',
                            resolved: '<span class="status-tag status-resolved">已处理</span>',
                            ignored: '<span class="status-tag status-ignored">已忽略</span>'
                        };
                        const statusHtml = statusMap[item.status] || '';
                        const date = item.created_at ? new Date(item.created_at).toLocaleString() : '';
                        return `
                        <div class="feedback-item">
                            <div class="feedback-header">
                                <div class="feedback-title">${item.title} ${statusHtml}</div>
                                <div class="feedback-actions">
                                    ${item.status === 'pending' ? `
                                        <button class="btn btn-resolve" onclick="updateFeedbackStatus('${item.id}', 'resolved')">标记已处理</button>
                                        <button class="btn btn-ignore" onclick="updateFeedbackStatus('${item.id}', 'ignored')">忽略</button>
                                    ` : ''}
                                    <button class="btn btn-delete" onclick="deleteFeedback('${item.id}')">删除</button>
                                </div>
                            </div>
                            <div class="feedback-desc">${escapeHtml(item.description || '')}</div>
                            ${item.suggested_url ? `<div class="feedback-url">建议网址：<a href="${item.suggested_url}" target="_blank" style="color:var(--primary);">${item.suggested_url}</a></div>` : ''}
                            <div class="feedback-meta">提交于 ${date}</div>
                        </div>
                        `;
                    }).join('');
                } catch (err) {
                    console.error('加载反馈失败:', err);
                    container.innerHTML = '<div class="empty-state">加载失败：' + (err.message || '未知错误') + '</div>';
                }
            }

            async function updateFeedbackStatus(feedbackId, newStatus) {
                try {
                    const { error } = await supabase
                        .from('feedback')
                        .update({ status: newStatus })
                        .eq('id', feedbackId);

                    if (error) throw error;
                    showToast('状态已更新');
                    loadFeedbacks(currentStatus);
                } catch (err) {
                    console.error('更新状态失败:', err);
                    showToast('操作失败：' + err.message);
                }
            }

            async function deleteFeedback(feedbackId) {
                if (!confirm('确定删除该反馈吗？此操作不可恢复。')) return;
                try {
                    const { error } = await supabase
                        .from('feedback')
                        .delete()
                        .eq('id', feedbackId);

                    if (error) throw error;
                    showToast('反馈已删除');
                    loadFeedbacks(currentStatus);
                } catch (err) {
                    console.error('删除反馈失败:', err);
                    showToast('删除失败：' + err.message);
                }
            }

            // 挂载全局函数
            window.updateFeedbackStatus = updateFeedbackStatus;
            window.deleteFeedback = deleteFeedback;

            // 标签切换
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    loadFeedbacks(tab.dataset.status);
                });
            });

            // 初始化
            async function init() {
                if (!supabase) {
                    window.location.href = 'home.html';
                    return;
                }
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    window.location.href = 'index.html';
                    return;
                }
                if (user.email !== ADMIN_EMAIL) {
                    showToast('您没有权限访问此页面');
                    setTimeout(() => window.location.href = 'home.html', 1500);
                    return;
                }
                currentUser = user;
                await loadFeedbacks('pending');
            }
            init();
        })();
    </script>
</body>
</html>
