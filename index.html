<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸飞机 · 登录</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <h1>纸飞机</h1>
    <p class="sub">登录或注册</p>
    <input type="email" id="email" placeholder="邮箱" autocomplete="email">
    <input type="password" id="password" placeholder="密码" autocomplete="current-password">
    <button id="loginBtn" class="btn primary">登录</button>
    <button id="signupBtn" class="btn">注册</button>
    <p class="msg" id="msg"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
