<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>必看网</title>

    <!-- 标签页图标（深红色） -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M12 50 Q25 10 50 10 Q75 10 88 50 Q75 90 50 90 Q25 90 12 50 Z' fill='none' stroke='%238b0000' stroke-width='14' stroke-linejoin='round'/%3E%3Crect x='45' y='28' width='10' height='20' rx='4' fill='%238b0000'/%3E%3Crect x='47' y='56' width='6' height='6' rx='3' fill='%238b0000'/%3E%3C/svg%3E">

    <style>
        /* ============================================================
           全局 CSS 变量（深绿 + 黑色主题）
           ============================================================ */
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0d1117;
            --bg-card: #1e2f25;
            --bg-card-hover: #2d3f33;
            --border-color: #2d3f33;
            
            --text-primary: #e6edf3;
            --text-secondary: #94a3b8;
            --text-danger: #ef4444;
            
            --accent-green: #2d6a4f;
            --accent-green-hover: #1e4a35;
            --accent-red: #8b0000;
            
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        a { color: var(--accent-green); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ============================================================
           侧边栏（含收起逻辑）
           ============================================================ */
        #sideNav {
            position: fixed;
            top: 0;
            left: 0;
            width: 220px;
            height: 100vh;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px 0;
            z-index: 100;
            transition: width 0.3s ease;
            overflow: hidden;
        }

        #sideNav.collapsed { width: 60px; }
        #sideNav.collapsed .nav-item span,
        #sideNav.collapsed .nav-group-title,
        #sideNav.collapsed .nav-footer { display: none; }
        #sideNav.collapsed .nav-item { justify-content: center; padding: 12px 0; }
        #sideNav.collapsed #sidebarToggle { margin: 0 auto; width: 40px; }

        #sidebarToggle {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            margin: 0 16px 16px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        #sidebarToggle:hover { background-color: var(--bg-card); }

        .nav-group { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 0 12px; }
        .nav-group-title { font-size: 12px; color: var(--text-secondary); padding: 8px 4px 12px 4px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: var(--radius-sm);
            cursor: pointer; transition: var(--transition);
            color: var(--text-secondary); font-size: 14px; font-weight: 500;
            white-space: nowrap;
        }
        .nav-item:hover { background-color: var(--bg-card); color: var(--text-primary); }
        .nav-item.active { background-color: var(--accent-green); color: #fff; }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
        .badge { background: var(--text-danger); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 12px; margin-left: auto; }
        .badge.hidden { display: none; }

        .nav-footer { padding: 16px 12px 0 12px; border-top: 1px solid var(--border-color); margin-top: 8px; }

        /* ============================================================
           主内容区（修复排版偏左的核心代码）
           ============================================================ */
        #mainContent {
            margin-left: 220px;
            flex: 1;
            padding: 16px 24px 80px 24px;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
            
            /* 关键修复：让所有内容水平居中 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #sideNav.collapsed + #mainContent { margin-left: 60px; }

        /* 限制动态渲染内容的宽度，防止贴边 */
        #contentRender {
            min-height: 400px;
            width: 100%;
            max-width: 1000px;
        }

        /* 侧边栏在特殊页面隐藏的逻辑（由 router.js 控制） */
        #sideNav.hidden { display: none !important; }
        #sidebarToggle.hidden { display: none !important; }

        /* ============================================================
           通用按钮样式（修复硬切块、胶带感）
           ============================================================ */
        .btn-publish, .btn-submit {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }
        .btn-publish:hover, .btn-submit:hover {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
        }

        /* 胶囊式标签（二级分区、推荐徽章） */
        .capsule-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }
        .capsule-tab:hover { background: var(--bg-card); color: var(--text-primary); }
        .capsule-tab.active { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }

        /* ============================================================
           内容卡片与模态框
           ============================================================ */
        .content-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .content-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            border-color: var(--accent-green);
        }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 999; padding: 20px;
        }
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            max-width: 600px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute; top: 12px; right: 16px;
            background: transparent; border: none;
            color: var(--text-secondary); font-size: 24px; cursor: pointer;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px 14px;
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px;
            transition: var(--transition);
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--accent-green); outline: none;
        }

        .qq-group-tip { border: 1px solid var(--border-color); background: rgba(45, 106, 79, 0.1); border-radius: var(--radius-md); padding: 12px 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); margin-top: 8px; }

        .hidden { display: none !important; }

        /* 移动端适配 */
        @media (max-width: 768px) {
            #sideNav { width: 60px; }
            #sideNav .nav-item span, #sideNav .nav-group-title, #sideNav .nav-footer { display: none; }
            #sideNav .nav-item { justify-content: center; padding: 12px 0; }
            #sideNav #sidebarToggle { margin: 0 auto 16px auto; width: 36px; }
            #mainContent { margin-left: 60px; padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- 主应用 -->
    <div id="app" class="hidden">
        
        <!-- ====== 左侧导航栏 ====== -->
        <div id="sideNav">
            <button id="sidebarToggle" onclick="toggleSidebar()" title="收起/展开">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>

            <div class="nav-group">
                <div class="nav-group-title">导航</div>
                <div class="nav-item active" data-page="home" onclick="navigateTo('home')">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3"/></svg>
                    <span>首页</span>
                </div>
                <div class="nav-item" data-page="upload" onclick="navigateTo('upload')">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span>我的内容</span>
                </div>
                <div class="nav-item" data-page="messages" onclick="navigateTo('messages')">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                    <span>消息</span>
                    <span class="badge hidden" id="msgBadge">0</span>
                </div>
                <div class="nav-item hidden" data-page="review" onclick="navigateTo('review')" id="navReview">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <span>待审核</span>
                    <span class="badge hidden" id="reviewBadge">0</span>
                </div>
                <div class="nav-item hidden" data-page="admin" onclick="navigateTo('admin')" id="navAdmin">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M17 11l2 2 4-4"/></svg>
                    <span>管理中心</span>
                </div>
                <div class="nav-item" data-page="profile" onclick="navigateTo('profile')" id="navProfile">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span>个人中心</span>
                </div>
            </div>

            <div class="nav-footer">
                <div class="nav-item" onclick="handleLogout()" style="color:var(--text-danger);">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>退出</span>
                </div>
            </div>
        </div>

        <!-- ====== 主内容区 ====== -->
        <div id="mainContent">
            <div id="contentRender"></div>
        </div>
    </div>

    <!-- ============================================================
    模态框组件（供 JS 调用）
    ============================================================ -->
    <div id="uploadModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closeUploadModal()">✕</button>
            <h2 style="margin-bottom:16px;">发布新内容</h2>
            <form id="uploadForm" onsubmit="submitContent(event)">
                <div class="form-group"><label>分区</label><select id="uploadCategory"><option>论坛</option><option>资源分享</option><option>网址分享</option><option>VPN分享</option></select></div>
                <div class="form-group"><label>标题 *</label><input type="text" id="uploadTitle" required></div>
                <div class="form-group"><label>描述</label><textarea id="uploadDesc" rows="2"></textarea></div>
                <div class="form-group"><label>上传文件</label><input type="file" id="uploadFile" multiple onchange="updateFileNames(this)"><div id="uploadFileName" style="font-size:12px;color:var(--text-secondary);">点击选择文件</div></div>
                <div class="form-group" id="urlGroup"><label>链接</label><div style="display:flex;gap:8px;"><input type="url" id="uploadUrlInput" style="flex:1;"><button type="button" onclick="addUrl()" class="btn-publish">添加</button></div><div id="urlList"></div></div>
                <div class="form-group"><label>标签</label><div style="display:flex;gap:8px;"><input type="text" id="tagInput" onkeydown="if(event.key==='Enter'){addTag();event.preventDefault();}" style="flex:1;"><button type="button" onclick="addTag()" class="btn-publish">添加</button></div><div id="tagList"></div></div>
                <button type="submit" class="btn-publish" id="submitBtn" style="width:100%;justify-content:center;">提交审核</button>
            </form>
        </div>
    </div>

    <div id="announceModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closeAnnounceModal()">✕</button>
            <h2 style="margin-bottom:16px;">编辑公告</h2>
            <div class="form-group"><label>公告内容</label><textarea id="announceInput" rows="3"></textarea></div>
            <button onclick="saveAnnouncement()" class="btn-publish">保存公告</button>
        </div>
    </div>

    <div id="profileEditModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closeProfileEdit()">✕</button>
            <h2 style="margin-bottom:16px;">编辑资料</h2>
            <div class="form-group"><label>展示ID</label><input type="text" id="editDisplayId"></div>
            <div class="form-group"><label>昵称</label><input type="text" id="editNickname"></div>
            <div class="form-group"><label>简介</label><textarea id="editBio" rows="2"></textarea></div>
            <div class="form-group"><label>头像</label><div style="display:flex;align-items:center;gap:12px;"><div id="avatarPreview" style="width:48px;height:48px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><input type="file" id="editAvatar" accept="image/*" onchange="previewAvatar(this)"><div id="avatarFileName" style="font-size:12px;color:var(--text-secondary);">点击选择</div></div></div>
            <button onclick="saveProfile()" class="btn-publish" id="saveProfileBtn" style="width:100%;justify-content:center;">保存修改</button>
        </div>
    </div>

    <div id="reportModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closeReportModal()">✕</button>
            <h2 style="margin-bottom:16px;">举报内容</h2>
            <div class="form-group"><label>理由</label><textarea id="reportReason" rows="3" maxlength="500"></textarea><div style="text-align:right;font-size:12px;color:var(--text-secondary);"><span id="reportCharCount">0</span>/500</div></div>
            <button onclick="submitReport()" class="btn-publish" style="width:100%;justify-content:center;">提交举报</button>
        </div>
    </div>

    <!-- ============================================================
    加载 JS（严格按照顺序）
    ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="icon.js"></script>
    <script src="router.js"></script>
    <!-- 注意：旧版 app.js 已彻底移除，后续功能由 home.js、profile.js 等模块文件接管 -->

</body>
</html>
