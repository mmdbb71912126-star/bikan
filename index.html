<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📑 网址收藏管理器</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --sidebar-bg: #ffffff;
            --main-bg: #ffffff;
            --primary: #4a6cf7;
            --primary-hover: #3651d5;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --text: #2c3e50;
            --text-secondary: #6b7d8e;
            --text-muted: #95a5a6;
            --border: #e1e8ed;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 10px;
            --radius-sm: 6px;
            --transition: 0.2s ease;
            --star-color: #f59e0b;
            --star-empty: #d1d5db;
            --card-hover-bg: #f8fafc;
            --section-active-bg: #eef2ff;
            --section-active-border: #4a6cf7;
            --vpn-yes-bg: #dcfce7;
            --vpn-yes-text: #166534;
            --vpn-no-bg: #f3f4f6;
            --vpn-no-text: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            line-height: 1.5;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1300px;
            min-height: 85vh;
            background: var(--main-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
        }

        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            position: relative;
            z-index: 2;
        }

        .sidebar-header {
            padding: 20px 18px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .sidebar-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h2 .icon {
            font-size: 1.3rem;
        }

        .btn-add-section {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px dashed var(--border);
            background: transparent;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            line-height: 1;
        }
        .btn-add-section:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f8faff;
            transform: rotate(90deg);
        }
        .btn-add-section:active {
            transform: rotate(90deg) scale(0.92);
        }

        .section-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
        }
        .section-list::-webkit-scrollbar {
            width: 5px;
        }
        .section-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .section-list::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        .section-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: 1.5px solid transparent;
            position: relative;
            user-select: none;
            font-weight: 500;
            font-size: 0.93rem;
            color: var(--text);
        }
        .section-item:hover {
            background: #f8fafc;
            border-color: #e8ecf1;
        }
        .section-item.active {
            background: var(--section-active-bg);
            border-color: var(--section-active-border);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.08);
        }
        .section-item .section-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .section-item .badge {
            background: #e8ecf1;
            color: var(--text-secondary);
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
            flex-shrink: 0;
            min-width: 22px;
            text-align: center;
        }
        .section-item.active .badge {
            background: #d4ddfc;
            color: var(--primary);
        }
        .section-item .section-actions {
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .section-item:hover .section-actions,
        .section-item.active .section-actions {
            opacity: 1;
        }

        .btn-icon-sm {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .btn-icon-sm:hover {
            background: #e8ecf1;
            color: var(--text);
        }
        .btn-icon-sm.danger:hover {
            background: #fde8e8;
            color: var(--danger);
        }
        .btn-icon-sm.move-btn:hover {
            background: #e8ecf1;
            color: var(--primary);
        }

        .sidebar-footer {
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sidebar-footer .btn-row {
            display: flex;
            gap: 6px;
        }
        .btn-sm {
            flex: 1;
            padding: 9px 10px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
            white-space: nowrap;
            text-align: center;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-sm:hover {
            background: #f8fafc;
            border-color: #c0c7d0;
        }
        .btn-sm.primary-outline {
            border-color: var(--primary);
            color: var(--primary);
            background: #fafbff;
        }
        .btn-sm.primary-outline:hover {
            background: #eef2ff;
        }
        .btn-sm.warning-outline {
            border-color: #f59e0b;
            color: #b45309;
            background: #fffdf7;
        }
        .btn-sm.warning-outline:hover {
            background: #fffbeb;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #fafbfc;
        }

        .main-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 10;
            border-radius: 0 16px 0 0;
        }
        .main-header .current-section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .main-header .bookmark-count {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }
        .btn-add-bookmark {
            padding: 10px 18px;
            border-radius: 25px;
            border: none;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(74, 108, 247, 0.25);
        }
        .btn-add-bookmark:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .bookmark-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 20px;
            scroll-behavior: smooth;
        }
        .bookmark-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .bookmark-list-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .bookmark-list-container::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        .bookmark-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bookmark-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow-sm);
            border: 1.5px solid var(--border);
            transition: var(--transition);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            position: relative;
        }
        .bookmark-card:hover {
            box-shadow: var(--shadow);
            border-color: #cdd5de;
            background: var(--card-hover-bg);
        }
        .bookmark-card .card-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            padding-top: 2px;
        }
        .bookmark-card .card-number {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            background: #f0f2f5;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bookmark-card .star-display {
            display: flex;
            gap: 1px;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
        }
        .bookmark-card .star-display .star {
            color: var(--star-empty);
            transition: var(--transition);
            cursor: pointer;
            font-size: 1rem;
        }
        .bookmark-card .star-display .star.filled {
            color: var(--star-color);
        }
        .bookmark-card .star-display:hover .star {
            color: var(--star-color);
            transform: scale(1.1);
        }
        .bookmark-card .star-display .star:hover~.star {
            color: var(--star-empty);
            transform: scale(1);
        }

        .bookmark-card .card-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .bookmark-card .card-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
            text-decoration: none;
            transition: var(--transition);
            word-break: break-all;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            width: fit-content;
            max-width: 100%;
        }
        .bookmark-card .card-title:hover {
            color: var(--primary);
        }
        .bookmark-card .card-url {
            font-size: 0.8rem;
            color: var(--text-secondary);
            word-break: break-all;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
        .bookmark-card .card-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }
        .bookmark-card .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 2px;
        }
        .vpn-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 14px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .vpn-badge.yes {
            background: var(--vpn-yes-bg);
            color: var(--vpn-yes-text);
        }
        .vpn-badge.no {
            background: var(--vpn-no-bg);
            color: var(--vpn-no-text);
        }

        .bookmark-card .card-actions {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-shrink: 0;
            opacity: 0;
            transition: var(--transition);
        }
        .bookmark-card:hover .card-actions {
            opacity: 1;
        }
        .bookmark-card .card-actions .btn-icon-sm {
            width: 28px;
            height: 28px;
            font-size: 0.85rem;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            gap: 12px;
        }
        .empty-state .empty-icon {
            font-size: 4rem;
            opacity: 0.6;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
            padding: 20px;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: #fff;
            border-radius: 14px;
            padding: 28px 26px 22px;
            width: 100%;
            max-width: 520px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text);
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text);
        }
        .modal .form-group input,
        .modal .form-group textarea,
        .modal .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: inherit;
            transition: var(--transition);
            background: #fafbfc;
            color: var(--text);
            resize: vertical;
        }
        .modal .form-group input:focus,
        .modal .form-group textarea:focus,
        .modal .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.08);
            background: #fff;
        }
        .modal .form-group textarea {
            min-height: 70px;
            max-height: 150px;
        }
        .modal .star-input {
            display: flex;
            gap: 4px;
            font-size: 1.6rem;
            cursor: pointer;
            user-select: none;
        }
        .modal .star-input .star {
            color: var(--star-empty);
            transition: var(--transition);
            cursor: pointer;
        }
        .modal .star-input .star.filled {
            color: var(--star-color);
        }
        .modal .star-input:hover .star {
            color: var(--star-color);
            transform: scale(1.15);
        }
        .modal .star-input .star:hover~.star {
            color: var(--star-empty);
            transform: scale(1);
        }

        .vpn-toggle-group {
            display: flex;
            gap: 12px;
        }
        .vpn-option {
            flex: 1;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            background: #fafbfc;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .vpn-option.selected-no {
            border-color: #9ca3af;
            background: #f3f4f6;
            color: #1f2937;
        }
        .vpn-option.selected-yes {
            border-color: #22c55e;
            background: #dcfce7;
            color: #166534;
        }
        .vpn-option:hover {
            border-color: var(--primary);
        }

        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
        }
        .btn {
            padding: 10px 22px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .btn-cancel {
            background: #e8ecf1;
            color: var(--text);
        }
        .btn-cancel:hover {
            background: #d5dbe3;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2c3e50;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            z-index: 2000;
            transition: transform 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #10b981;
        }
        .toast.error {
            background: #e74c3c;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }
            .app-container {
                flex-direction: column;
                border-radius: 12px;
            }
            .sidebar {
                width: 100%;
                min-width: auto;
                max-height: 260px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .sidebar .section-list {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                padding: 8px 10px;
                overflow-x: auto;
                max-height: 120px;
            }
            .section-item {
                flex-shrink: 0;
                padding: 8px 12px;
                font-size: 0.82rem;
                border-radius: 20px;
            }
            .section-item .section-actions {
                opacity: 1;
            }
            .sidebar-footer {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .bookmark-card .card-actions {
                opacity: 1;
                flex-direction: row;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><span class="icon">📑</span>我的分区</h2>
                <button class="btn-add-section" id="btnAddSection" title="新建分区">＋</button>
            </div>
            <ul class="section-list" id="sectionList"></ul>
            <div class="sidebar-footer">
                <div class="btn-row">
                    <button class="btn-sm primary-outline" id="btnExportTxt">📄 导出TXT</button>
                    <button class="btn-sm warning-outline" id="btnExportJson">💾 备份JSON</button>
                </div>
                <button class="btn-sm" id="btnImportJson">📥 导入JSON恢复</button>
                <input type="file" id="importFileInput" accept=".json" style="display:none;" />
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <div class="main-header">
                <div class="current-section-title">
                    📂 <span id="currentSectionName">选择分区</span>
                    <span class="bookmark-count" id="bookmarkCount"></span>
                </div>
                <button class="btn-add-bookmark" id="btnAddBookmark">＋ 添加网址</button>
            </div>
            <div class="bookmark-list-container" id="bookmarkListContainer"></div>
        </main>
    </div>

    <!-- 模态框：编辑/添加 -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal" id="modal">
            <h3 id="modalTitle">✏️ 编辑书签</h3>
            <div class="form-group">
                <label>📛 名称 *</label>
                <input type="text" id="inputName" placeholder="网站名称" maxlength="200" />
            </div>
            <div class="form-group">
                <label>🔗 网址 *</label>
                <input type="url" id="inputUrl" placeholder="https://example.com" maxlength="2000" />
            </div>
            <div class="form-group">
                <label>📝 介绍</label>
                <textarea id="inputDesc" placeholder="简要描述..." maxlength="1000"></textarea>
            </div>
            <div class="form-group">
                <label>⭐ 星级评分</label>
                <div class="star-input" id="starInput">
                    <span class="star" data-star="1">★</span>
                    <span class="star" data-star="2">★</span>
                    <span class="star" data-star="3">★</span>
                    <span class="star" data-star="4">★</span>
                    <span class="star" data-star="5">★</span>
                </div>
            </div>
            <div class="form-group">
                <label>🔐 是否需要VPN</label>
                <div class="vpn-toggle-group" id="vpnToggle">
                    <div class="vpn-option" data-vpn="no">🌐 无需VPN</div>
                    <div class="vpn-option" data-vpn="yes">🔒 需VPN</div>
                </div>
            </div>
            <div class="form-group" id="modalSectionGroup">
                <label>📁 所属分区</label>
                <select id="inputSection"></select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="btnModalCancel">取消</button>
                <button class="btn btn-primary" id="btnModalSave">💾 保存</button>
            </div>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div class="modal-overlay" id="confirmOverlay" style="display:none;">
        <div class="modal" style="max-width:400px;">
            <h3>⚠️ 确认删除</h3>
            <p id="confirmMessage" style="margin-bottom:18px;color:var(--text-secondary);"></p>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="btnConfirmCancel">取消</button>
                <button class="btn btn-danger" id="btnConfirmOk">确认删除</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ---------- 常量 & 状态 ----------
            const STORAGE_KEY = 'bookmarkAppData_v3';
            let data = { sections: [] };
            let currentSectionId = null;

            // 模态框状态
            let modalMode = 'add'; // 'add' | 'edit'
            let editingBookmarkId = null;
            let editingBookmarkSectionId = null;
            let vpnSelected = 'no'; // 'yes' | 'no'

            // 确认框回调
            let confirmCallback = null;

            // ---------- 工具函数 ----------
            function generateId() {
                return 'id_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
            }

            function escapeHtml(s) {
                if (!s) return '';
                const d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }

            function formatDate() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate())
                .padStart(2, '0');
            }

            function downloadFile(content, filename, mime) {
                const blob = new Blob(['\uFEFF' + content], { type: mime });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            }

            // ---------- Toast ----------
            let toastTimer = null;

            function showToast(msg, type) {
                type = type || '';
                const t = document.getElementById('toast');
                if (toastTimer) clearTimeout(toastTimer);
                t.textContent = msg;
                t.className = 'toast ' + type + ' show';
                toastTimer = setTimeout(function() {
                    t.classList.remove('show');
                }, 2200);
            }

            // ---------- 数据读写 ----------
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && Array.isArray(parsed.sections)) {
                            data.sections = parsed.sections.map(function(s) {
                                return {
                                    id: s.id || generateId(),
                                    name: s.name || '未命名分区',
                                    bookmarks: Array.isArray(s.bookmarks) ? s.bookmarks.map(function(b) {
                                        return {
                                            id: b.id || generateId(),
                                            name: b.name || '未命名',
                                            url: b.url || '',
                                            description: b.description || '',
                                            stars: Math.max(1, Math.min(5, parseInt(b.stars) || 3)),
                                            requiresVpn: (b.requiresVpn === true || b.requiresVpn ===
                                                'yes') ? 'yes' : 'no'
                                        };
                                    }) : []
                                };
                            });
                        }
                    }
                } catch (e) {
                    console.warn('数据加载失败', e);
                    data.sections = [];
                }

                // 默认数据
                if (data.sections.length === 0) {
                    data.sections = [{
                        id: generateId(),
                        name: '常用网址',
                        bookmarks: [
                            { id: generateId(), name: '百度', url: 'https://www.baidu.com',
                                description: '中文搜索引擎', stars: 4, requiresVpn: 'no' },
                            { id: generateId(), name: 'GitHub', url: 'https://github.com',
                                description: '代码托管平台', stars: 5, requiresVpn: 'no' }
                        ]
                    }, {
                        id: generateId(),
                        name: '学习资源',
                        bookmarks: [
                            { id: generateId(), name: 'MDN', url: 'https://developer.mozilla.org',
                                description: 'Web 文档', stars: 5, requiresVpn: 'no' }
                        ]
                    }];
                    saveData();
                }

                // 修正 currentSectionId
                if (!currentSectionId || !data.sections.some(function(s) { return s.id === currentSectionId; })) {
                    currentSectionId = data.sections.length > 0 ? data.sections[0].id : null;
                }
            }

            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    console.error('保存失败', e);
                    showToast('保存失败', 'error');
                }
            }

            // ---------- 数据查询 ----------
            function getCurrentSection() {
                return data.sections.find(function(s) { return s.id === currentSectionId; }) || null;
            }

            function getSection(id) {
                if (!id) return null;
                return data.sections.find(function(s) { return s.id === id; }) || null;
            }

            function getBookmark(bookmarkId, sectionId) {
                const sec = getSection(sectionId);
                if (!sec) return null;
                return sec.bookmarks.find(function(b) { return b.id === bookmarkId; }) || null;
            }

            // ---------- 渲染 ----------
            function renderAll() {
                renderSections();
                renderBookmarks();
                updateMainHeader();
            }

            function renderSections() {
                const list = document.getElementById('sectionList');
                list.innerHTML = '';

                data.sections.forEach(function(section, index) {
                    const li = document.createElement('li');
                    li.className = 'section-item' + (section.id === currentSectionId ? ' active' : '');
                    li.setAttribute('data-section-id', section.id);

                    const isFirst = index === 0;
                    const isLast = index === data.sections.length - 1;

                    li.innerHTML =
                        '<span class="section-name" title="' + escapeHtml(section.name) + '">📁 ' + escapeHtml(
                            section.name) + '</span>' +
                        '<span class="badge">' + section.bookmarks.length + '</span>' +
                        '<span class="section-actions">' +
                        '<button class="btn-icon-sm move-btn" data-action="moveUp" ' + (isFirst ?
                            'disabled style="opacity:0.3"' : '') + '>⬆</button>' +
                        '<button class="btn-icon-sm move-btn" data-action="moveDown" ' + (isLast ?
                            'disabled style="opacity:0.3"' : '') + '>⬇</button>' +
                        '<button class="btn-icon-sm" data-action="rename">✏️</button>' +
                        '<button class="btn-icon-sm danger" data-action="deleteSection">🗑️</button>' +
                        '</span>';

                    // 点击分区名切换
                    li.querySelector('.section-name').addEventListener('click', function(e) {
                        e.stopPropagation();
                        selectSection(section.id);
                    });

                    // 点击整行切换（但避开按钮）
                    li.addEventListener('click', function(e) {
                        if (e.target.closest('button')) return;
                        selectSection(section.id);
                    });

                    // 按钮事件
                    li.querySelector('[data-action="moveUp"]').addEventListener('click', function(e) {
                        e.stopPropagation();
                        moveSection(section.id, -1);
                    });
                    li.querySelector('[data-action="moveDown"]').addEventListener('click', function(e) {
                        e.stopPropagation();
                        moveSection(section.id, 1);
                    });
                    li.querySelector('[data-action="rename"]').addEventListener('click', function(e) {
                        e.stopPropagation();
                        renameSection(section.id);
                    });
                    li.querySelector('[data-action="deleteSection"]').addEventListener('click', function(e) {
                        e.stopPropagation();
                        deleteSectionConfirm(section.id);
                    });

                    list.appendChild(li);
                });

                if (data.sections.length === 0) {
                    list.innerHTML =
                        '<div style="padding:30px;text-align:center;color:var(--text-muted);">📭<br />暂无分区</div>';
                }
            }

            function renderBookmarks() {
                const container = document.getElementById('bookmarkListContainer');
                const section = getCurrentSection();

                if (!section) {
                    container.innerHTML =
                        '<div class="empty-state"><div class="empty-icon">📂</div><p>请选择分区</p></div>';
                    return;
                }

                if (section.bookmarks.length === 0) {
                    container.innerHTML =
                        '<div class="empty-state"><div class="empty-icon">⭐</div><p>暂无书签</p><button class="btn-add-bookmark" onclick="document.getElementById(\'btnAddBookmark\').click()">＋ 添加</button></div>';
                    return;
                }

                const ul = document.createElement('ul');
                ul.className = 'bookmark-list';

                section.bookmarks.forEach(function(bookmark, index) {
                    const li = document.createElement('li');
                    li.className = 'bookmark-card';

                    const vpnText = bookmark.requiresVpn === 'yes' ? '需VPN' : '无需VPN';
                    const vpnClass = bookmark.requiresVpn === 'yes' ? 'yes' : 'no';

                    // 星级HTML
                    let starsHtml = '';
                    for (var i = 1; i <= 5; i++) {
                        starsHtml += '<span class="star' + (i <= bookmark.stars ? ' filled' : '') + '" data-star="' +
                            i + '">★</span>';
                    }

                    const isFirst = index === 0;
                    const isLast = index === section.bookmarks.length - 1;

                    li.innerHTML =
                        '<div class="card-left">' +
                        '<span class="card-number">' + (index + 1) + '</span>' +
                        '<div class="star-display" data-bookmark-id="' + bookmark.id + '">' + starsHtml +
                        '</div>' +
                        '</div>' +
                        '<div class="card-body">' +
                        '<a href="' + escapeHtml(bookmark.url) + '" target="_blank" class="card-title">' + escapeHtml(
                            bookmark.name) + ' ↗</a>' +
                        '<span class="card-url">' + escapeHtml(bookmark.url) + '</span>' +
                        (bookmark.description ? '<p class="card-desc">' + escapeHtml(bookmark.description) +
                            '</p>' : '') +
                        '<div class="card-meta">' +
                        '<span class="vpn-badge ' + vpnClass + '">' + vpnText + '</span>' +
                        '</div>' +
                        '</div>' +
                        '<div class="card-actions">' +
                        '<button class="btn-icon-sm move-btn" data-action="moveUp" ' + (isFirst ?
                            'disabled style="opacity:0.3"' : '') + '>⬆</button>' +
                        '<button class="btn-icon-sm move-btn" data-action="moveDown" ' + (isLast ?
                            'disabled style="opacity:0.3"' : '') + '>⬇</button>' +
                        '<button class="btn-icon-sm" data-action="edit">✏️</button>' +
                        '<button class="btn-icon-sm danger" data-action="delete">🗑️</button>' +
                        '</div>';

                    // 星级点击
                    li.querySelector('.star-display').addEventListener('click', function(e) {
                        var starEl = e.target.closest('.star');
                        if (starEl) {
                            var val = parseInt(starEl.dataset.star, 10);
                            updateBookmarkStar(bookmark.id, val);
                        }
                    });

                    // 移动
                    li.querySelector('[data-action="moveUp"]').addEventListener('click', function(e) {
                        e.stopPropagation();
                        moveBookmark(bookmark.id, -1);
                    });
                    li.querySelector('[data-action="moveDown"]').addEventListener('click', function(e) {
                        e.stopPropagation();
                        moveBookmark(bookmark.id, 1);
                    });

                    // 编辑
                    li.querySelector('[data-action="edit"]').addEventListener('click', function(e) {
                        e.stopPropagation();
                        openEditModal(bookmark.id, section.id);
                    });

                    // 删除
                    li.querySelector('[data-action="delete"]').addEventListener('click', function(e) {
                        e.stopPropagation();
                        deleteBookmarkConfirm(bookmark.id, section.id);
                    });

                    // 点击卡片打开链接（避开按钮和链接）
                    li.addEventListener('click', function(e) {
                        if (e.target.closest('button') || e.target.closest('a') || e.target.closest(
                                '.star-display')) return;
                        window.open(bookmark.url, '_blank');
                    });
                    li.style.cursor = 'pointer';

                    ul.appendChild(li);
                });

                container.innerHTML = '';
                container.appendChild(ul);
            }

            function updateMainHeader() {
                var section = getCurrentSection();
                document.getElementById('currentSectionName').textContent = section ? section.name : '未选择';
                document.getElementById('bookmarkCount').textContent = section ? '(' + section.bookmarks.length + ' 个)' :
                    '';
            }

            // ---------- 分区操作 ----------
            function selectSection(id) {
                if (currentSectionId !== id) {
                    currentSectionId = id;
                    renderAll();
                }
            }

            function addSection() {
                var name = prompt('新分区名称：', '新分区');
                if (name && name.trim()) {
                    var newSection = {
                        id: generateId(),
                        name: name.trim(),
                        bookmarks: []
                    };
                    data.sections.push(newSection);
                    currentSectionId = newSection.id;
                    saveData();
                    renderAll();
                    showToast('分区已创建', 'success');
                }
            }

            function renameSection(id) {
                var s = getSection(id);
                if (!s) return;
                var name = prompt('重命名：', s.name);
                if (name && name.trim()) {
                    s.name = name.trim();
                    saveData();
                    renderAll();
                    showToast('已重命名', 'success');
                }
            }

            function deleteSectionConfirm(id) {
                var s = getSection(id);
                if (!s) return;
                showConfirm('删除分区「' + s.name + '」及其所有书签？', function() {
                    data.sections = data.sections.filter(function(sec) { return sec.id !== id; });
                    if (currentSectionId === id) {
                        currentSectionId = data.sections.length > 0 ? data.sections[0].id : null;
                    }
                    saveData();
                    renderAll();
                    showToast('已删除', 'success');
                });
            }

            function moveSection(id, dir) {
                var idx = data.sections.findIndex(function(s) { return s.id === id; });
                if (idx === -1) return;
                var newIdx = idx + dir;
                if (newIdx < 0 || newIdx >= data.sections.length) return;
                var temp = data.sections[idx];
                data.sections[idx] = data.sections[newIdx];
                data.sections[newIdx] = temp;
                saveData();
                renderAll();
            }

            // ---------- 书签操作 ----------
            function openAddModal() {
                var section = getCurrentSection();
                if (!section) {
                    showToast('请先选择分区', 'error');
                    return;
                }

                modalMode = 'add';
                editingBookmarkId = null;
                editingBookmarkSectionId = null;

                document.getElementById('modalTitle').textContent = '➕ 添加书签';
                document.getElementById('inputName').value = '';
                document.getElementById('inputUrl').value = '';
                document.getElementById('inputDesc').value = '';
                document.getElementById('modalSectionGroup').style.display = 'block';

                updateStarInput(3);
                setVpnToggle('no');
                updateSectionSelect(section.id);
                showModal();
            }

            function openEditModal(bookmarkId, sectionId) {
                var section = getSection(sectionId);
                if (!section) {
                    showToast('分区不存在', 'error');
                    return;
                }
                var bm = section.bookmarks.find(function(b) { return b.id === bookmarkId; });
                if (!bm) {
                    showToast('书签不存在', 'error');
                    return;
                }

                modalMode = 'edit';
                editingBookmarkId = bookmarkId;
                editingBookmarkSectionId = sectionId;

                document.getElementById('modalTitle').textContent = '✏️ 编辑书签';
                document.getElementById('inputName').value = bm.name;
                document.getElementById('inputUrl').value = bm.url;
                document.getElementById('inputDesc').value = bm.description || '';
                document.getElementById('modalSectionGroup').style.display = 'block';

                updateStarInput(bm.stars);
                setVpnToggle(bm.requiresVpn || 'no');
                updateSectionSelect(sectionId);
                showModal();
            }

            function saveBookmarkFromModal() {
                var name = document.getElementById('inputName').value.trim();
                var url = document.getElementById('inputUrl').value.trim();
                var desc = document.getElementById('inputDesc').value.trim();
                var stars = getStarInputValue();
                var targetId = document.getElementById('inputSection').value;
                var requiresVpn = vpnSelected;

                if (!name) {
                    showToast('请输入名称', 'error');
                    return;
                }
                if (!url) {
                    showToast('请输入网址', 'error');
                    return;
                }
                if (!/^https?:\/\//i.test(url)) {
                    url = 'https://' + url;
                }

                var targetSection = getSection(targetId);
                if (!targetSection) {
                    showToast('目标分区不存在，请重新选择', 'error');
                    return;
                }

                if (modalMode === 'add') {
                    // ---- 添加 ----
                    targetSection.bookmarks.push({
                        id: generateId(),
                        name: name,
                        url: url,
                        description: desc,
                        stars: stars,
                        requiresVpn: requiresVpn
                    });
                    if (currentSectionId !== targetId) {
                        currentSectionId = targetId;
                    }
                    saveData();
                    hideModal();
                    renderAll();
                    showToast('已添加', 'success');
                    return;
                }

                // ---- 编辑 ----
                if (editingBookmarkSectionId === targetId) {
                    // 同一分区内编辑
                    var bm = targetSection.bookmarks.find(function(b) { return b.id === editingBookmarkId; });
                    if (!bm) {
                        showToast('书签不存在', 'error');
                        return;
                    }
                    bm.name = name;
                    bm.url = url;
                    bm.description = desc;
                    bm.stars = stars;
                    bm.requiresVpn = requiresVpn;
                } else {
                    // 跨分区移动
                    var oldSec = getSection(editingBookmarkSectionId);
                    if (!oldSec) {
                        showToast('原分区不存在', 'error');
                        return;
                    }
                    var idx = oldSec.bookmarks.findIndex(function(b) { return b.id === editingBookmarkId; });
                    if (idx === -1) {
                        showToast('书签不存在', 'error');
                        return;
                    }
                    // 从旧分区移除
                    var moved = oldSec.bookmarks.splice(idx, 1)[0];
                    // 更新属性
                    moved.name = name;
                    moved.url = url;
                    moved.description = desc;
                    moved.stars = stars;
                    moved.requiresVpn = requiresVpn;
                    // 添加到目标分区
                    targetSection.bookmarks.push(moved);
                    if (currentSectionId !== targetId) {
                        currentSectionId = targetId;
                    }
                }

                saveData();
                hideModal();
                renderAll();
                showToast('已保存', 'success');
            }

            function deleteBookmarkConfirm(bmId, secId) {
                var sec = getSection(secId);
                if (!sec) return;
                var bm = sec.bookmarks.find(function(b) { return b.id === bmId; });
                if (!bm) return;
                showConfirm('删除「' + bm.name + '」？', function() {
                    sec.bookmarks = sec.bookmarks.filter(function(b) { return b.id !== bmId; });
                    saveData();
                    renderAll();
                    showToast('已删除', 'success');
                });
            }

            function moveBookmark(id, dir) {
                var sec = getCurrentSection();
                if (!sec) return;
                var idx = sec.bookmarks.findIndex(function(b) { return b.id === id; });
                if (idx === -1) return;
                var newIdx = idx + dir;
                if (newIdx < 0 || newIdx >= sec.bookmarks.length) return;
                var temp = sec.bookmarks[idx];
                sec.bookmarks[idx] = sec.bookmarks[newIdx];
                sec.bookmarks[newIdx] = temp;
                saveData();
                renderBookmarks();
            }

            function updateBookmarkStar(id, val) {
                var sec = getCurrentSection();
                if (!sec) return;
                var bm = sec.bookmarks.find(function(b) { return b.id === id; });
                if (!bm) return;
                bm.stars = val;
                saveData();
                renderBookmarks();
            }

            // ---------- 导出 / 导入 ----------
            function exportToTxt() {
                if (!data.sections.length) {
                    showToast('无数据', 'error');
                    return;
                }
                var txt = '';
                data.sections.forEach(function(sec, si) {
                    txt += sec.name + '：\n';
                    sec.bookmarks.forEach(function(bm, bi) {
                        txt += '  ' + (bi + 1) + '.' + bm.name + '\n';
                        txt += '        ' + bm.url + '\n';
                        if (bm.description) txt += '            ' + bm.description + '\n';
                        var starsStr = '★'.repeat(bm.stars) + '☆'.repeat(5 - bm.stars);
                        var vpnStr = bm.requiresVpn === 'yes' ? '需VPN' : '无需VPN';
                        txt += '        ' + starsStr + ' ' + vpnStr + '\n';
                    });
                    if (si < data.sections.length - 1) txt += '\n';
                });
                downloadFile(txt, '书签导出_' + formatDate() + '.txt', 'text/plain;charset=utf-8');
                showToast('TXT导出成功', 'success');
            }

            function exportToJson() {
                if (!data.sections.length) {
                    showToast('无数据', 'error');
                    return;
                }
                downloadFile(JSON.stringify(data, null, 2), '备份_' + formatDate() + '.json', 'application/json');
                showToast('JSON导出成功', 'success');
            }

            function importFromJson(file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        var parsed = JSON.parse(e.target.result);
                        if (!parsed || !Array.isArray(parsed.sections) || !parsed.sections.length) {
                            throw new Error('格式错误');
                        }
                        showConfirm('导入将覆盖当前数据，确定？', function() {
                            data.sections = parsed.sections.map(function(s) {
                                return {
                                    id: s.id || generateId(),
                                    name: s.name || '未命名',
                                    bookmarks: (s.bookmarks || []).map(function(b) {
                                        return {
                                            id: b.id || generateId(),
                                            name: b.name || '',
                                            url: b.url || '',
                                            description: b.description || '',
                                            stars: Math.max(1, Math.min(5, parseInt(b
                                            .stars) || 3)),
                                            requiresVpn: (b.requiresVpn === true || b
                                                .requiresVpn === 'yes') ? 'yes' : 'no'
                                        };
                                    })
                                };
                            });
                            currentSectionId = data.sections.length > 0 ? data.sections[0].id : null;
                            saveData();
                            renderAll();
                            showToast('导入成功', 'success');
                        });
                    } catch (err) {
                        console.error(err);
                        showToast('导入失败，文件格式不正确', 'error');
                    }
                };
                reader.readAsText(file);
            }

            // ---------- 模态框 UI ----------
            function showModal() {
                document.getElementById('modalOverlay').style.display = 'flex';
                setTimeout(function() {
                    document.getElementById('inputName').focus();
                }, 50);
            }

            function hideModal() {
                document.getElementById('modalOverlay').style.display = 'none';
            }

            function showConfirm(msg, cb) {
                document.getElementById('confirmMessage').textContent = msg;
                document.getElementById('confirmOverlay').style.display = 'flex';
                confirmCallback = cb;
            }

            function hideConfirm() {
                document.getElementById('confirmOverlay').style.display = 'none';
                confirmCallback = null;
            }

            function updateStarInput(val) {
                var stars = document.querySelectorAll('#starInput .star');
                stars.forEach(function(el) {
                    var starVal = parseInt(el.dataset.star, 10);
                    el.classList.toggle('filled', starVal <= val);
                });
                document.getElementById('starInput').setAttribute('data-value', val);
            }

            function getStarInputValue() {
                var val = parseInt(document.getElementById('starInput').getAttribute('data-value'), 10);
                return isNaN(val) ? 3 : val;
            }

            function setVpnToggle(value) {
                vpnSelected = value;
                var opts = document.querySelectorAll('#vpnToggle .vpn-option');
                opts.forEach(function(el) {
                    el.classList.remove('selected-yes', 'selected-no');
                    if (el.dataset.vpn === 'yes') {
                        if (value === 'yes') el.classList.add('selected-yes');
                    } else {
                        if (value === 'no') el.classList.add('selected-no');
                    }
                });
            }

            function updateSectionSelect(selectedId) {
                var sel = document.getElementById('inputSection');
                sel.innerHTML = '';
                data.sections.forEach(function(s) {
                    var opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.name;
                    if (s.id === selectedId) opt.selected = true;
                    sel.appendChild(opt);
                });
            }

            // ---------- 事件绑定 ----------
            function init() {
                // 加载数据
                loadData();
                renderAll();

                // 添加分区
                document.getElementById('btnAddSection').addEventListener('click', addSection);

                // 添加书签
                document.getElementById('btnAddBookmark').addEventListener('click', openAddModal);

                // 导出
                document.getElementById('btnExportTxt').addEventListener('click', exportToTxt);
                document.getElementById('btnExportJson').addEventListener('click', exportToJson);

                // 导入
                document.getElementById('btnImportJson').addEventListener('click', function() {
                    document.getElementById('importFileInput').click();
                });
                document.getElementById('importFileInput').addEventListener('change', function() {
                    if (this.files && this.files[0]) {
                        importFromJson(this.files[0]);
                        this.value = '';
                    }
                });

                // 模态框 取消 / 保存
                document.getElementById('btnModalCancel').addEventListener('click', hideModal);
                document.getElementById('btnModalSave').addEventListener('click', saveBookmarkFromModal);

                // 点击遮罩关闭模态框
                document.getElementById('modalOverlay').addEventListener('click', function(e) {
                    if (e.target === e.currentTarget) hideModal();
                });

                // 星级点击
                document.getElementById('starInput').addEventListener('click', function(e) {
                    var star = e.target.closest('.star');
                    if (star) {
                        updateStarInput(parseInt(star.dataset.star, 10));
                    }
                });
                // 鼠标离开时保持选中值
                document.getElementById('starInput').addEventListener('mouseleave', function() {
                    updateStarInput(getStarInputValue());
                });

                // VPN 切换
                document.querySelectorAll('#vpnToggle .vpn-option').forEach(function(el) {
                    el.addEventListener('click', function() {
                        setVpnToggle(el.dataset.vpn);
                    });
                });

                // 确认框
                document.getElementById('btnConfirmCancel').addEventListener('click', hideConfirm);
                document.getElementById('btnConfirmOk').addEventListener('click', function() {
                    if (confirmCallback) confirmCallback();
                    hideConfirm();
                });
                document.getElementById('confirmOverlay').addEventListener('click', function(e) {
                    if (e.target === e.currentTarget) hideConfirm();
                });

                // 键盘快捷键：ESC 关闭模态框，Ctrl+S 导出TXT
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        if (document.getElementById('modalOverlay').style.display === 'flex') {
                            hideModal();
                        } else if (document.getElementById('confirmOverlay').style.display === 'flex') {
                            hideConfirm();
                        }
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        exportToTxt();
                    }
                });
            }

            // ---------- 启动 ----------
            // 保证 DOM 加载完毕
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
