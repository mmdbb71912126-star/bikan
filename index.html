<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的网站</title>
    <!-- 加载 Supabase SDK (使用多个 CDN 备用) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <!-- 如果第一个 CDN 失败，尝试第二个 -->
    <script>
        if (typeof window.supabase === 'undefined') {
            document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
        }
    </script>
    <style>
        /* ===== 全局重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
        }

        /* ===== 登录相关样式 ===== */
        h2 {
            font-weight: 600;
            font-size: 28px;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: #334155;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: 0.2s;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }

        .btn:hover {
            background: #5a6fd6;
            transform: translateY(-1px);
        }

        .btn-google {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background: #f8fafc;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .footer-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            cursor: pointer;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: #fee2e2;
            color: #b91c1c;
            display: block;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        /* ===== 主页（Dashboard）样式 ===== */
        #dashboardContainer {
            max-width: 600px;
        }

        .welcome {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .user-email {
            color: #64748b;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .btn-logout {
            background: #ef4444;
        }

        .btn-logout:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        /* 调试信息 */
        #debugInfo {
            margin-top: 20px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 13px;
            color: #334155;
            text-align: left;
            display: none;
        }
    </style>
</head>

<body>

    <div class="card" id="app">
        <!-- ========================================================= -->
        <!-- 认证界面 (登录/注册/忘记密码)                               -->
        <!-- ========================================================= -->
        <div id="authContainer">
            <!-- 登录面板 -->
            <div id="loginPanel">
                <h2>欢迎回来</h2>
                <div class="subtitle">登录你的账户</div>

                <button class="btn btn-google" id="googleLoginBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Google 一键登录
                </button>

                <div class="divider">或使用邮箱</div>

                <div class="form-group">
                    <label>邮箱地址</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" />
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" />
                </div>
                <button class="btn" id="loginBtn">登录</button>

                <div id="loginMessage" class="message"></div>

                <div class="footer-link">
                    <a id="gotoForgot">忘记密码？点我验证</a> &nbsp;·&nbsp;
                    <a id="gotoRegister">没有账号？点我注册</a>
                </div>
            </div>

            <!-- 注册面板 -->
            <div id="registerPanel" class="hidden">
                <h2>创建账户</h2>
                <div class="subtitle">快速注册，开始体验</div>

                <button class="btn btn-google" id="googleRegisterBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Google 一键注册
                </button>

                <div class="divider">或使用邮箱注册</div>

                <div class="form-group">
                    <label>邮箱地址</label>
                    <input type="email" id="regEmail" placeholder="your@email.com" />
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="至少6位" />
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirm" placeholder="再次输入密码" />
                </div>
                <button class="btn" id="registerBtn">发送验证邮件</button>

                <div id="registerMessage" class="message"></div>

                <div class="footer-link">
                    已有账号？<a id="gotoLoginFromRegister">点我登录</a>
                </div>
            </div>

            <!-- 忘记密码面板 -->
            <div id="forgotPanel" class="hidden">
                <a class="back-link" id="backFromForgot">← 返回</a>
                <h2>重置密码</h2>
                <div class="subtitle">我们将发送重置链接到你的邮箱</div>

                <div class="form-group">
                    <label>邮箱地址</label>
                    <input type="email" id="forgotEmail" placeholder="your@email.com" />
                </div>
                <button class="btn" id="forgotBtn">点击发送验证邮件</button>

                <div id="forgotMessage" class="message"></div>
            </div>
        </div>

        <!-- ========================================================= -->
        <!-- 主页界面 (登录后显示)                                       -->
        <!-- ========================================================= -->
        <div id="dashboardContainer" class="hidden">
            <div class="welcome" id="welcomeUser">👋 欢迎回来</div>
            <div class="user-email" id="userEmail">user@example.com</div>
            <p style="margin: 16px 0; color: #475569;">
                你已经成功登录，这里是你的个人主页。
            </p>
            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button class="btn btn-secondary" id="goToSettings" style="flex:1;">设置</button>
                <button class="btn btn-logout" id="logoutBtn" style="flex:1;">退出登录</button>
            </div>
        </div>

        <!-- 调试信息区域 (默认隐藏，出错时显示) -->
        <div id="debugInfo"></div>
    </div>

    <script>
        // =============================================================
        // 0. 页面加载时立即弹窗，证明 JS 已执行
        // =============================================================
        alert('✅ 页面脚本已启动！如果看到此弹窗，说明 JavaScript 正在运行。');

        // =============================================================
        // 1. 配置 Supabase（请替换为你的实际值）
        // =============================================================
        const SUPABASE_URL = 'https://bazpyoiklkoajdhfkwly.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lTx_tYITroL8_jVVR4EjAA_Eg61lBFT';

        // =============================================================
        // 2. 安全初始化 Supabase 客户端
        // =============================================================
        let supabase = null;
        let sdkLoaded = false;

        try {
            if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                sdkLoaded = true;
                console.log('✅ Supabase SDK 加载成功');
            } else {
                throw new Error('Supabase SDK 未加载，请检查网络或 CDN 链接。');
            }
        } catch (err) {
            console.error('❌ Supabase 初始化失败:', err.message);
            // 显示调试信息
            const debug = document.getElementById('debugInfo');
            debug.style.display = 'block';
            debug.innerHTML = '<strong>⚠️ 错误：</strong> ' + err.message +
                '<br>请检查网络连接或刷新页面重试。';
            // 即使 SDK 加载失败，按钮事件依然绑定，但会给出提示
        }

        // =============================================================
        // 3. 等待 DOM 完全加载后绑定事件
        // =============================================================
        window.onload = function() {
            console.log('📄 DOM 已完全加载，开始绑定事件...');

            // 获取所有需要操作的元素
            const elements = {
                authContainer: document.getElementById('authContainer'),
                dashboardContainer: document.getElementById('dashboardContainer'),
                welcomeUser: document.getElementById('welcomeUser'),
                userEmail: document.getElementById('userEmail'),
                loginPanel: document.getElementById('loginPanel'),
                registerPanel: document.getElementById('registerPanel'),
                forgotPanel: document.getElementById('forgotPanel'),
                loginEmail: document.getElementById('loginEmail'),
                loginPassword: document.getElementById('loginPassword'),
                loginBtn: document.getElementById('loginBtn'),
                loginMessage: document.getElementById('loginMessage'),
                googleLoginBtn: document.getElementById('googleLoginBtn'),
                gotoRegister: document.getElementById('gotoRegister'),
                gotoForgot: document.getElementById('gotoForgot'),
                backFromForgot: document.getElementById('backFromForgot'),
                regEmail: document.getElementById('regEmail'),
                regPassword: document.getElementById('regPassword'),
                regConfirm: document.getElementById('regConfirm'),
                registerBtn: document.getElementById('registerBtn'),
                registerMessage: document.getElementById('registerMessage'),
                googleRegisterBtn: document.getElementById('googleRegisterBtn'),
                gotoLoginFromRegister: document.getElementById('gotoLoginFromRegister'),
                forgotEmail: document.getElementById('forgotEmail'),
                forgotBtn: document.getElementById('forgotBtn'),
                forgotMessage: document.getElementById('forgotMessage'),
                logoutBtn: document.getElementById('logoutBtn'),
                goToSettings: document.getElementById('goToSettings'),
            };

            // 检查关键元素是否存在
            for (const [key, el] of Object.entries(elements)) {
                if (!el) {
                    console.error(`❌ 元素 #${key} 未找到，请检查 HTML 结构。`);
                    alert(`错误：元素 #${key} 不存在，页面可能不完整。`);
                    return;
                }
            }

            // =============================================================
            // 4. 界面切换函数
            // =============================================================
            function showAuthPanel(panel) {
                elements.loginPanel.classList.add('hidden');
                elements.registerPanel.classList.add('hidden');
                elements.forgotPanel.classList.add('hidden');
                panel.classList.remove('hidden');
                // 清除所有消息
                document.querySelectorAll('.message').forEach(el => {
                    el.className = 'message';
                    el.textContent = '';
                });
            }

            // 认证面板内的导航
            elements.gotoRegister.addEventListener('click', function(e) {
                e.preventDefault();
                showAuthPanel(elements.registerPanel);
            });
            elements.gotoLoginFromRegister.addEventListener('click', function(e) {
                e.preventDefault();
                showAuthPanel(elements.loginPanel);
            });
            elements.gotoForgot.addEventListener('click', function(e) {
                e.preventDefault();
                showAuthPanel(elements.forgotPanel);
            });
            elements.backFromForgot.addEventListener('click', function(e) {
                e.preventDefault();
                showAuthPanel(elements.loginPanel);
            });

            // =============================================================
            // 5. 显示消息
            // =============================================================
            function setMessage(element, text, type = 'error') {
                element.textContent = text;
                element.className = 'message ' + type;
            }

            // =============================================================
            // 6. 切换视图（认证 vs 主页）
            // =============================================================
            function showDashboard(user) {
                elements.authContainer.classList.add('hidden');
                elements.dashboardContainer.classList.remove('hidden');
                elements.welcomeUser.textContent = '👋 你好，' + user.email.split('@')[0];
                elements.userEmail.textContent = user.email;
            }

            function showAuth() {
                elements.authContainer.classList.remove('hidden');
                elements.dashboardContainer.classList.add('hidden');
                showAuthPanel(elements.loginPanel);
            }

            // =============================================================
            // 7. 登录功能（检查 SDK 是否可用）
            // =============================================================
            elements.loginBtn.addEventListener('click', async function() {
                if (!sdkLoaded || !supabase) {
                    setMessage(elements.loginMessage, '⚠️ Supabase SDK 未加载，请检查网络或刷新重试。');
                    return;
                }
                const email = elements.loginEmail.value.trim();
                const password = elements.loginPassword.value;
                if (!email || !password) {
                    setMessage(elements.loginMessage, '请填写完整的邮箱和密码');
                    return;
                }
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        setMessage(elements.loginMessage, error.message);
                    } else {
                        showDashboard(data.user);
                    }
                } catch (err) {
                    setMessage(elements.loginMessage, '网络错误：' + err.message);
                }
            });

            elements.googleLoginBtn.addEventListener('click', async function() {
                if (!sdkLoaded || !supabase) {
                    setMessage(elements.loginMessage, '⚠️ Supabase SDK 未加载，请检查网络或刷新重试。');
                    return;
                }
                try {
                    const { error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo: window.location.origin }
                    });
                    if (error) setMessage(elements.loginMessage, error.message);
                } catch (err) {
                    setMessage(elements.loginMessage, '网络错误：' + err.message);
                }
            });

            // =============================================================
            // 8. 注册功能
            // =============================================================
            elements.registerBtn.addEventListener('click', async function() {
                if (!sdkLoaded || !supabase) {
                    setMessage(elements.registerMessage, '⚠️ Supabase SDK 未加载，请检查网络或刷新重试。');
                    return;
                }
                const email = elements.regEmail.value.trim();
                const password = elements.regPassword.value;
                const confirm = elements.regConfirm.value;
                if (!email || !password || !confirm) {
                    setMessage(elements.registerMessage, '请填写所有字段');
                    return;
                }
                if (password.length < 6) {
                    setMessage(elements.registerMessage, '密码至少6位');
                    return;
                }
                if (password !== confirm) {
                    setMessage(elements.registerMessage, '两次密码输入不一致');
                    return;
                }
                try {
                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password,
                        options: { emailRedirectTo: window.location.origin }
                    });
                    if (error) {
                        setMessage(elements.registerMessage, error.message);
                    } else {
                        setMessage(elements.registerMessage, '✅ 验证邮件已发送，请查收邮箱并点击链接完成注册！', 'success');
                    }
                } catch (err) {
                    setMessage(elements.registerMessage, '网络错误：' + err.message);
                }
            });

            elements.googleRegisterBtn.addEventListener('click', async function() {
                if (!sdkLoaded || !supabase) {
                    setMessage(elements.registerMessage, '⚠️ Supabase SDK 未加载，请检查网络或刷新重试。');
                    return;
                }
                try {
                    const { error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo: window.location.origin }
                    });
                    if (error) setMessage(elements.registerMessage, error.message);
                } catch (err) {
                    setMessage(elements.registerMessage, '网络错误：' + err.message);
                }
            });

            // =============================================================
            // 9. 忘记密码
            // =============================================================
            elements.forgotBtn.addEventListener('click', async function() {
                if (!sdkLoaded || !supabase) {
                    setMessage(elements.forgotMessage, '⚠️ Supabase SDK 未加载，请检查网络或刷新重试。');
                    return;
                }
                const email = elements.forgotEmail.value.trim();
                if (!email) {
                    setMessage(elements.forgotMessage, '请输入你的邮箱地址');
                    return;
                }
                try {
                    const { error } = await supabase.auth.resetPasswordForEmail(email, {
                        redirectTo: window.location.origin + '/update-password.html'
                    });
                    if (error) {
                        setMessage(elements.forgotMessage, error.message);
                    } else {
                        setMessage(elements.forgotMessage, '✅ 重置链接已发送，请查收邮箱！', 'success');
                    }
                } catch (err) {
                    setMessage(elements.forgotMessage, '网络错误：' + err.message);
                }
            });

            // =============================================================
            // 10. 退出登录
            // =============================================================
            elements.logoutBtn.addEventListener('click', async function() {
                if (!sdkLoaded || !supabase) {
                    alert('SDK 未加载，无法退出。');
                    return;
                }
                await supabase.auth.signOut();
                showAuth();
                setMessage(elements.loginMessage, '已退出登录', 'success');
            });

            // =============================================================
            // 11. 设置按钮占位
            // =============================================================
            elements.goToSettings.addEventListener('click', function() {
                alert('设置页面开发中...');
            });

            // =============================================================
            // 12. 初始加载：检测登录状态
            // =============================================================
            (async function init() {
                if (!sdkLoaded || !supabase) {
                    console.warn('⚠️ Supabase 不可用，无法检测登录状态，显示登录界面。');
                    showAuth();
                    return;
                }
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        showDashboard(session.user);
                    } else {
                        showAuth();
                    }
                } catch (err) {
                    console.error('获取会话失败：', err);
                    showAuth();
                }
            })();

            // =============================================================
            // 13. 监听认证状态变化（处理 OAuth 回调等）
            // =============================================================
            if (sdkLoaded && supabase) {
                supabase.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_IN' && session) {
                        showDashboard(session.user);
                    }
                    if (event === 'SIGNED_OUT') {
                        showAuth();
                    }
                });
            }

            console.log('✅ 所有事件绑定完成！');
        }; // window.onload 结束
    </script>

</body>
</html>
