<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>必看网 - 资源分享社区</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #1e293b;
            height: 100vh;
            overflow: hidden;
        }
        input,
        button,
        textarea {
            font-family: inherit;
            outline: none;
        }
        button {
            cursor: pointer;
            border: none;
            background: none;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        #app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            background: #ffffff;
            border-right: 1px solid #eef2f6;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 20px 0 20px 0;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.02);
            z-index: 10;
            overflow-y: auto;
        }
        .sidebar .brand {
            padding: 0 24px 24px 24px;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
        }
        .sidebar .brand span {
            color: #6366f1;
        }
        .sidebar .nav {
            flex: 1;
            padding: 16px 12px 0 12px;
        }
        .sidebar .nav .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            color: #64748b;
            transition: all 0.2s;
            margin-bottom: 4px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
        }
        .sidebar .nav .nav-item:hover {
            background: #f1f4ff;
            color: #6366f1;
        }
        .sidebar .nav .nav-item.active {
            background: #eef2ff;
            color: #6366f1;
            font-weight: 600;
        }
        .sidebar .nav .nav-item .icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }
        .sidebar .nav .nav-item .badge {
            background: #ef4444;
            color: #fff;
            font-size: 11px;
            border-radius: 20px;
            padding: 1px 10px;
            margin-left: auto;
            font-weight: 600;
        }
        .sidebar .user-section {
            border-top: 1px solid #eef2f6;
            padding: 16px 20px 0 20px;
            margin-top: auto;
        }
        .sidebar .user-section .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .sidebar .user-section .user-info .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #6366f1;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }
        .sidebar .user-section .user-info .email {
            font-size: 14px;
            font-weight: 500;
            color: #0f172a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sidebar .user-section .btn-outline {
            width: 100%;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            background: #fff;
            transition: all 0.2s;
        }
        .sidebar .user-section .btn-outline:hover {
            border-color: #ef4444;
            color: #ef4444;
            background: #fef2f2;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f8fafc;
        }

        .announcement-bar {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 52px;
        }
        .announcement-bar .ann-text {
            font-size: 15px;
            font-weight: 500;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .announcement-bar .edit-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
            margin-left: 16px;
        }
        .announcement-bar .edit-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 32px 32px;
        }
        .content-container::-webkit-scrollbar {
            width: 6px;
        }
        .content-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .content-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 22px;
            border: 1px solid #eef2f6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }
        .content-card:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
            border-color: #dce2ec;
        }
        .content-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .content-card .meta .cat {
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 12px;
        }
        .content-card .meta .cat.forum {
            background: #fce7f3;
            color: #db2777;
        }
        .content-card .meta .cat.res {
            background: #fef3c7;
            color: #d97706;
        }
        .content-card .meta .cat.url {
            background: #d1fae5;
            color: #059669;
        }
        .content-card .meta .cat.vpn {
            background: #dbeafe;
            color: #2563eb;
        }
        .content-card .title {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 6px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .content-card .desc {
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .content-card .file-info {
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .content-card .file-info a {
            color: #6366f1;
            font-weight: 500;
        }
        .content-card .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .content-card .actions .btn-sm {
            padding: 4px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #475569;
            transition: all 0.2s;
        }
        .content-card .actions .btn-sm.approve {
            background: #dcfce7;
            color: #166534;
            border-color: #86efac;
        }
        .content-card .actions .btn-sm.approve:hover {
            background: #bbf7d0;
        }
        .content-card .actions .btn-sm.reject {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }
        .content-card .actions .btn-sm.reject:hover {
            background: #fecaca;
        }
        .content-card .actions .btn-sm:hover {
            background: #f1f5f9;
        }
        .content-card .status-badge {
            font-size: 12px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .content-card .status-badge.pending {
            background: #fef3c7;
            color: #d97706;
        }
        .content-card .status-badge.approved {
            background: #dcfce7;
            color: #166534;
        }
        .content-card .status-badge.rejected {
            background: #fee2e2;
            color: #991b1b;
        }
        .content-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
            font-size: 13px;
            color: #94a3b8;
        }
        .content-card .footer .user {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .content-card .footer .user .avatar-sm {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #6366f1;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #94a3b8;
            grid-column: 1 / -1;
        }
        .empty-state .icon {
            font-size: 64px;
            display: block;
            margin-bottom: 12px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.closing {
            animation: fadeOut 0.2s ease forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
        .modal-box {
            background: #fff;
            border-radius: 24px;
            padding: 32px 36px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease;
        }
        .modal-box.closing {
            animation: slideDown 0.25s ease forwards;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @keyframes slideDown {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(30px);
                opacity: 0;
            }
        }
        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #0f172a;
        }
        .modal-box .modal-header .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            font-size: 20px;
            color: #64748b;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box .modal-header .close-btn:hover {
            background: #e2e8f0;
        }
        .modal-box .form-group {
            margin-bottom: 16px;
        }
        .modal-box .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 4px;
        }
        .modal-box .form-group input,
        .modal-box .form-group select,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.2s;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group select:focus,
        .modal-box .form-group textarea:focus {
            border-color: #6366f1;
            background: #fff;
        }
        .modal-box .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-box .form-group .file-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px dashed #d1d5db;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-box .form-group .file-input-wrap:hover {
            border-color: #6366f1;
            background: #f1f4ff;
        }
        .modal-box .form-group .file-input-wrap input[type="file"] {
            display: none;
        }
        .modal-box .form-group .file-input-wrap .file-name {
            font-size: 14px;
            color: #64748b;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .modal-box .btn-submit {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .modal-box .btn-submit:hover {
            background: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }
        .modal-box .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .admin-modal .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 10px;
            margin-bottom: 6px;
        }
        .admin-modal .user-item .email {
            font-weight: 500;
        }
        .admin-modal .user-item .role {
            font-size: 13px;
            color: #94a3b8;
        }
        .admin-modal .user-item .role.admin {
            color: #6366f1;
            font-weight: 600;
        }
        .admin-modal .user-item .btn-set-admin {
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 13px;
            background: #6366f1;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .admin-modal .user-item .btn-set-admin:hover {
            background: #4f46e5;
        }

        .hidden {
            display: none !important;
        }

        .version-tag {
            position: fixed;
            bottom: 16px;
            right: 24px;
            font-size: 12px;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            z-index: 50;
            user-select: none;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 12px 0;
            }
            .sidebar .brand {
                padding: 0 0 16px 0;
                justify-content: center;
                font-size: 18px;
            }
            .sidebar .brand span {
                display: none;
            }
            .sidebar .nav .nav-item {
                justify-content: center;
                padding: 12px 0;
                font-size: 0;
            }
            .sidebar .nav .nav-item .icon {
                font-size: 24px;
                width: auto;
            }
            .sidebar .nav .nav-item .label {
                display: none;
            }
            .sidebar .nav .nav-item .badge {
                position: absolute;
                top: 2px;
                right: 4px;
                font-size: 9px;
                padding: 1px 6px;
            }
            .sidebar .user-section .user-info .email {
                display: none;
            }
            .sidebar .user-section .btn-outline {
                font-size: 0;
                padding: 8px 0;
            }
            .sidebar .user-section .btn-outline::before {
                content: "🚪";
                font-size: 18px;
            }
            .content-container {
                padding: 16px;
            }
            .content-grid {
                grid-template-columns: 1fr;
            }
            .modal-box {
                padding: 24px 20px;
            }
            .announcement-bar .ann-text {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                👁️ <span>必看网</span>
            </div>
            <nav class="nav" id="sideNav">
                <button class="nav-item active" data-nav="home" onclick="switchNav('home')">
                    <span class="icon">🏠</span>
                    <span class="label">首页</span>
                </button>
                <button class="nav-item" data-nav="upload" onclick="openUploadModal()">
                    <span class="icon">📤</span>
                    <span class="label">上传</span>
                </button>
                <button class="nav-item" data-nav="profile" onclick="switchNav('profile')">
                    <span class="icon">👤</span>
                    <span class="label">个人</span>
                </button>
                <button class="nav-item hidden" data-nav="review" id="navReview" onclick="switchNav('review')">
                    <span class="icon">🔍</span>
                    <span class="label">审核</span>
                    <span class="badge hidden" id="reviewBadge">0</span>
                </button>
                <button class="nav-item hidden" data-nav="admin" id="navAdmin" onclick="openAdminModal()">
                    <span class="icon">👑</span>
                    <span class="label">管理员</span>
                </button>
            </nav>
            <div class="user-section">
                <div class="user-info">
                    <div class="avatar" id="userAvatar">U</div>
                    <span class="email" id="userEmail">user@example.com</span>
                </div>
                <button class="btn-outline" onclick="handleLogout()">🚪 退出</button>
            </div>
        </aside>

        <div class="main-area">
            <div class="announcement-bar" id="announcementBar">
                <span class="ann-text" id="announcementText">🎉 欢迎来到必看网！</span>
                <button class="edit-btn hidden" id="editAnnounceBtn" onclick="openAnnounceEditor()">✎ 编辑公告</button>
            </div>
            <div class="content-container" id="contentContainer">
                <div id="contentRender"></div>
            </div>
        </div>
    </div>

    <!-- 上传弹窗 -->
    <div id="uploadModal" class="modal-overlay hidden" onclick="if(event.target===this) closeUploadModal()">
        <div class="modal-box" id="uploadModalBox">
            <div class="modal-header">
                <span>📤 发布内容</span>
                <button class="close-btn" onclick="closeUploadModal()">✕</button>
            </div>
            <form id="uploadForm" onsubmit="submitContent(event)">
                <div class="form-group">
                    <label>分类 *</label>
                    <select id="uploadCategory" required>
                        <option value="论坛">💬 论坛</option>
                        <option value="资源">📦 资源</option>
                        <option value="网址">🔗 网址</option>
                        <option value="VPN">🔒 VPN</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>标题 *</label>
                    <input type="text" id="uploadTitle" placeholder="请输入标题" required maxlength="100">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="uploadDesc" placeholder="请输入描述内容" rows="3"></textarea>
                </div>
                <div class="form-group" id="urlGroup">
                    <label>网址链接</label>
                    <input type="url" id="uploadUrl" placeholder="https://example.com">
                </div>
                <div class="form-group" id="fileGroup">
                    <label>上传文件</label>
                    <div class="file-input-wrap" onclick="document.getElementById('uploadFileInput').click()">
                        <span>📎</span>
                        <span class="file-name" id="uploadFileName">点击选择文件</span>
                        <input type="file" id="uploadFileInput" onchange="updateFileName(this)">
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">📤 提交审核</button>
                <p style="font-size:13px; color:#94a3b8; text-align:center; margin-top:10px;">提交后需管理员审核通过方可公开</p>
            </form>
        </div>
    </div>

    <!-- 公告编辑弹窗 -->
    <div id="announceModal" class="modal-overlay hidden" onclick="if(event.target===this) closeAnnounceModal()">
        <div class="modal-box" style="max-width:500px;">
            <div class="modal-header">
                <span>📢 编辑公告</span>
                <button class="close-btn" onclick="closeAnnounceModal()">✕</button>
            </div>
            <div class="form-group">
                <label>公告内容</label>
                <textarea id="announceInput" rows="3" style="width:100%; padding:12px 14px; border:2px solid #e2e8f0; border-radius:12px; font-size:15px; resize:vertical;"></textarea>
            </div>
            <button onclick="saveAnnouncement()" style="width:100%; padding:14px; background:#6366f1; color:#fff; border:none; border-radius:14px; font-size:17px; font-weight:600;">保存公告</button>
        </div>
    </div>

    <!-- 审核详情弹窗 -->
    <div id="reviewDetailModal" class="modal-overlay hidden" onclick="if(event.target===this) closeReviewDetail()">
        <div class="modal-box" style="max-width:500px;">
            <div class="modal-header">
                <span>📋 审核详情</span>
                <button class="close-btn" onclick="closeReviewDetail()">✕</button>
            </div>
            <div id="reviewDetailContent"></div>
        </div>
    </div>

    <!-- 管理员管理弹窗 -->
    <div id="adminModal" class="modal-overlay admin-modal hidden" onclick="if(event.target===this) closeAdminModal()">
        <div class="modal-box" style="max-width:500px;">
            <div class="modal-header">
                <span>👑 管理员管理</span>
                <button class="close-btn" onclick="closeAdminModal()">✕</button>
            </div>
            <p style="color:#64748b; margin-bottom:16px;">输入用户邮箱，将其设为管理员</p>
            <div style="display:flex; gap:8px; margin-bottom:16px;">
                <input type="email" id="adminAddInput" placeholder="输入邮箱" style="flex:1; padding:10px 14px; border:2px solid #e2e8f0; border-radius:12px; font-size:15px;">
                <button onclick="addAdmin()" style="padding:10px 24px; background:#6366f1; color:#fff; border:none; border-radius:12px; font-weight:600;">添加</button>
            </div>
            <div id="adminList"></div>
        </div>
    </div>

    <div class="version-tag">v6.0.0</div>

    <script>
        // ============================================================
        //  配 置
        // ============================================================
        const SUPABASE_URL = 'https://bazpyoiklkoajdhfkwly.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lTx_tYITroL8_jVVR4EjAA_Eg61lBFT';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        //  状 态
        // ============================================================
        let currentUser = null;
        let currentUserRole = 'user';
        let currentNav = 'home';
        let allContents = [];
        let pendingCount = 0;
        let isSubmitting = false;

        // ============================================================
        //  DOM 引 用
        // ============================================================
        const contentRender = document.getElementById('contentRender');
        const announcementText = document.getElementById('announcementText');
        const editAnnounceBtn = document.getElementById('editAnnounceBtn');
        const navReview = document.getElementById('navReview');
        const navAdmin = document.getElementById('navAdmin');
        const reviewBadge = document.getElementById('reviewBadge');
        const userAvatar = document.getElementById('userAvatar');
        const userEmail = document.getElementById('userEmail');

        // ============================================================
        //  检 查 登 录
        // ============================================================
        (async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/login.html';
                return;
            }
            currentUser = session.user;
            userAvatar.textContent = getInitials(session.user.email);
            userEmail.textContent = session.user.email || '用户';
            await loadUserRole();
            await loadAnnouncement();
            await loadContents();
            updateUI();
        })();

        supabase.auth.onAuthStateChange((event, session) => {
            if (!session) {
                window.location.href = '/login.html';
            }
        });

        // ============================================================
        //  工 具
        // ============================================================
        function getCategoryIcon(cat) {
            const map = { '论坛': '💬', '资源': '📦', '网址': '🔗', 'VPN': '🔒' };
            return map[cat] || '📎';
        }

        function getCategoryClass(cat) {
            const map = { '论坛': 'forum', '资源': 'res', '网址': 'url', 'VPN': 'vpn' };
            return map[cat] || '';
        }

        function formatSize(bytes) {
            if (!bytes) return '0 B';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function timeAgo(date) {
            const diff = Date.now() - new Date(date).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return '刚刚';
            if (mins < 60) return mins + '分钟前';
            const hours = Math.floor(mins / 60);
            if (hours < 24) return hours + '小时前';
            const days = Math.floor(hours / 24);
            if (days < 30) return days + '天前';
            return new Date(date).toLocaleDateString('zh-CN');
        }

        function getStatusText(status) {
            const map = { 'pending': '⏳ 待审核', 'approved': '✅ 已通过', 'rejected': '❌ 已拒绝' };
            return map[status] || status;
        }

        function getInitials(email) {
            if (!email) return '?';
            return email.charAt(0).toUpperCase();
        }

        // ============================================================
        //  退 出
        // ============================================================
        async function handleLogout() {
            try {
                await supabase.auth.signOut();
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = '/login.html';
            } catch (e) {
                // 如果出错，强制跳转
                window.location.href = '/login.html';
            }
        }

        // ============================================================
        //  加 载 用 户 角 色
        // ============================================================
        async function loadUserRole() {
            if (!currentUser) return;
            const { data, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', currentUser.id)
                .single();
            if (data) {
                currentUserRole = data.role;
            } else {
                await supabase.from('profiles').upsert({
                    id: currentUser.id,
                    role: currentUser.email === '3948677391@qq.com' ? 'admin' : 'user'
                });
                currentUserRole = currentUser.email === '3948677391@qq.com' ? 'admin' : 'user';
            }
            updateUI();
        }

        // ============================================================
        //  公 告
        // ============================================================
        async function loadAnnouncement() {
            const { data, error } = await supabase
                .from('announcements')
                .select('*')
                .eq('is_active', true)
                .order('created_at', { ascending: false })
                .limit(1);
            if (data && data.length > 0) {
                announcementText.textContent = data[0].content;
            } else {
                announcementText.textContent = '🎉 欢迎来到必看网！';
            }
            if (currentUserRole === 'admin') {
                editAnnounceBtn.classList.remove('hidden');
            } else {
                editAnnounceBtn.classList.add('hidden');
            }
        }

        // ============================================================
        //  内 容
        // ============================================================
        async function loadContents() {
            if (!currentUser) return;

            let query = supabase.from('contents').select('*, profiles!user_id(role)');

            if (currentNav === 'home') {
                query = query.eq('status', 'approved');
            } else if (currentNav === 'profile') {
                query = query.eq('user_id', currentUser.id);
            } else if (currentNav === 'review') {
                if (currentUserRole === 'admin') {
                    query = query.eq('status', 'pending');
                } else {
                    query = query.eq('status', 'approved').limit(0);
                }
            } else {
                query = query.eq('status', 'approved');
            }

            const { data, error } = await query.order('created_at', { ascending: false });

            if (error) {
                console.error('加载内容失败:', error);
                allContents = [];
                return;
            }
            allContents = data || [];

            if (currentUserRole === 'admin') {
                const { count, error: countErr } = await supabase
                    .from('contents')
                    .select('*', { count: 'exact', head: true })
                    .eq('status', 'pending');
                if (!countErr) {
                    pendingCount = count || 0;
                    if (pendingCount > 0) {
                        reviewBadge.textContent = pendingCount;
                        reviewBadge.classList.remove('hidden');
                    } else {
                        reviewBadge.classList.add('hidden');
                    }
                }
            }

            renderContents();
        }

        function renderContents() {
            const data = allContents;
            if (!data || data.length === 0) {
                const icon = currentNav === 'review' ? '✅' : (currentNav === 'profile' ? '📭' : '🌱');
                const msg = currentNav === 'review' ? '暂无待审核内容' :
                    (currentNav === 'profile' ? '你还没有发布任何内容' : '暂无内容，发布第一个吧！');
                contentRender.innerHTML =
                    `<div class="empty-state"><span class="icon">${icon}</span><p>${msg}</p></div>`;
                return;
            }

            let html = '<div class="content-grid">';
            data.forEach(item => {
                const isOwner = item.user_id === currentUser?.id;
                const isAdmin = currentUserRole === 'admin';
                const showActions = (currentNav === 'review' && isAdmin) || (currentNav === 'profile' && isOwner);

                let extraHtml = '';
                if (item.file_url) {
                    extraHtml =
                        `<div class="file-info">📎 <a href="${item.file_url}" target="_blank">${item.file_name || '下载文件'}</a>${item.file_size ? ' · ' + formatSize(item.file_size) : ''}</div>`;
                }
                if (item.url) {
                    extraHtml =
                        `<div class="file-info">🔗 <a href="${item.url}" target="_blank" class="url-link">${item.url}</a></div>`;
                }

                let statusBadge = '';
                if (currentNav === 'profile') {
                    const map = {
                        'pending': '<span class="status-badge pending">⏳ 待审核</span>',
                        'approved': '<span class="status-badge approved">✅ 已通过</span>',
                        'rejected': '<span class="status-badge rejected">❌ 已拒绝</span>'
                    };
                    statusBadge = map[item.status] || '';
                }

                let actionButtons = '';
                if (showActions && currentNav === 'review' && isAdmin) {
                    actionButtons =
                        `<div class="actions"><button class="btn-sm approve" onclick="reviewContent(${item.id}, 'approved')">✅ 通过</button><button class="btn-sm reject" onclick="reviewContent(${item.id}, 'rejected')">❌ 拒绝</button><button class="btn-sm" onclick="viewContentDetail(${item.id})">📄 详情</button></div>`;
                } else if (showActions && currentNav === 'profile' && isOwner) {
                    actionButtons =
                        `<div class="actions"><button class="btn-sm" onclick="deleteContent(${item.id}, '${item.file_url || ''}')">🗑️ 删除</button></div>`;
                }

                html += `
                    <div class="content-card">
                        <div class="meta"><span class="cat ${getCategoryClass(item.category)}">${getCategoryIcon(item.category)} ${item.category}</span><span>${timeAgo(item.created_at)}</span></div>
                        <div class="title">${item.title}</div>
                        ${item.description ? `<div class="desc">${item.description}</div>` : ''}
                        ${extraHtml}
                        ${statusBadge}
                        ${actionButtons}
                        <div class="footer"><span class="user"><span class="avatar-sm">${getInitials(item.user_id)}</span><span>用户</span></span><span>👁️ ${item.view_count || 0}</span></div>
                    </div>
                `;
            });
            html += '</div>';
            contentRender.innerHTML = html;
        }

        // ============================================================
        //  导 航
        // ============================================================
        function switchNav(nav) {
            currentNav = nav;
            document.querySelectorAll('#sideNav .nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.nav === nav);
            });
            if (nav === 'review' && currentUserRole !== 'admin') return;
            loadContents();
        }

        function updateUI() {
            if (currentUserRole === 'admin') {
                navReview.classList.remove('hidden');
                navAdmin.classList.remove('hidden');
                editAnnounceBtn.classList.remove('hidden');
            } else {
                navReview.classList.add('hidden');
                navAdmin.classList.add('hidden');
                editAnnounceBtn.classList.add('hidden');
            }
            if (currentNav === 'review' && currentUserRole !== 'admin') {
                switchNav('home');
            }
        }

        // ============================================================
        //  上 传
        // ============================================================
        function openUploadModal() {
            if (!currentUser) return;
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadForm').reset();
            document.getElementById('uploadFileName').textContent = '点击选择文件';
            toggleUploadFields('论坛');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
        }

        function updateFileName(input) {
            document.getElementById('uploadFileName').textContent = input.files[0]?.name || '点击选择文件';
        }

        document.getElementById('uploadCategory').addEventListener('change', function() {
            toggleUploadFields(this.value);
        });

        function toggleUploadFields(category) {
            const urlGroup = document.getElementById('urlGroup');
            const fileGroup = document.getElementById('fileGroup');
            if (category === '网址') {
                urlGroup.style.display = 'block';
                fileGroup.style.display = 'none';
            } else if (category === '资源') {
                urlGroup.style.display = 'none';
                fileGroup.style.display = 'block';
            } else {
                urlGroup.style.display = 'none';
                fileGroup.style.display = 'none';
            }
        }

        async function submitContent(e) {
            e.preventDefault();
            if (isSubmitting) return;
            if (!currentUser) { alert('请先登录'); return; }

            const category = document.getElementById('uploadCategory').value;
            const title = document.getElementById('uploadTitle').value.trim();
            const description = document.getElementById('uploadDesc').value.trim();
            const url = document.getElementById('uploadUrl').value.trim();
            const fileInput = document.getElementById('uploadFileInput');
            const file = fileInput.files[0];

            if (!title) { alert('请输入标题'); return; }
            if (category === '网址' && !url) { alert('网址分类需要填写链接'); return; }

            isSubmitting = true;
            const btn = document.getElementById('submitBtn');
            btn.textContent = '⏳ 提交中...';
            btn.disabled = true;

            try {
                let fileUrl = null,
                    fileName = null,
                    fileSize = null;
                if (category === '资源' && file) {
                    const filePath = `${currentUser.id}/${Date.now()}_${file.name}`;
                    const { error: uploadError } = await supabase.storage
                        .from('files')
                        .upload(filePath, file);
                    if (uploadError) throw new Error('文件上传失败：' + uploadError.message);
                    const { data: urlData } = supabase.storage
                        .from('files')
                        .getPublicUrl(filePath);
                    fileUrl = urlData.publicUrl;
                    fileName = file.name;
                    fileSize = file.size;
                }

                const { error: insertError } = await supabase
                    .from('contents')
                    .insert({
                        user_id: currentUser.id,
                        category: category,
                        title: title,
                        description: description || null,
                        url: category === '网址' ? url : null,
                        file_url: fileUrl,
                        file_name: fileName,
                        file_size: fileSize,
                        status: 'pending'
                    });

                if (insertError) throw new Error('发布失败：' + insertError.message);

                alert('✅ 提交成功！等待管理员审核。');
                closeUploadModal();
                loadContents();
            } catch (err) {
                alert('❌ ' + err.message);
            } finally {
                isSubmitting = false;
                btn.textContent = '📤 提交审核';
                btn.disabled = false;
            }
        }

        // ============================================================
        //  审 核
        // ============================================================
        async function reviewContent(contentId, status) {
            if (!confirm(`确定要 ${status === 'approved' ? '通过' : '拒绝'} 这个内容吗？`)) return;
            const { error } = await supabase
                .from('contents')
                .update({ status: status, updated_at: new Date().toISOString() })
                .eq('id', contentId);
            if (error) { alert('操作失败：' + error.message); } else { alert('✅ 操作成功');
                loadContents(); }
        }

        // ============================================================
        //  删 除
        // ============================================================
        async function deleteContent(contentId, fileUrl) {
            if (!confirm('确定要删除这个内容吗？')) return;
            try {
                if (fileUrl) {
                    const pathParts = fileUrl.split('/');
                    const storagePath = pathParts.slice(pathParts.indexOf('files') + 1).join('/');
                    if (storagePath) {
                        await supabase.storage.from('files').remove([storagePath]);
                    }
                }
                const { error } = await supabase
                    .from('contents')
                    .delete()
                    .eq('id', contentId);
                if (error) throw new Error(error.message);
                alert('✅ 删除成功');
                loadContents();
            } catch (err) { alert('❌ 删除失败：' + err.message); }
        }

        // ============================================================
        //  公 告 编 辑
        // ============================================================
        function openAnnounceEditor() {
            document.getElementById('announceInput').value = announcementText.textContent;
            document.getElementById('announceModal').classList.remove('hidden');
        }

        function closeAnnounceModal() {
            document.getElementById('announceModal').classList.add('hidden');
        }

        async function saveAnnouncement() {
            const content = document.getElementById('announceInput').value.trim();
            if (!content) { alert('请输入公告内容'); return; }
            const { error } = await supabase
                .from('announcements')
                .insert({ content: content, is_active: true });
            if (error) { alert('保存失败：' + error.message); } else { alert('✅ 公告已更新');
                closeAnnounceModal();
                loadAnnouncement(); }
        }

        // ============================================================
        //  审 核 详 情
        // ============================================================
        function viewContentDetail(contentId) {
            const item = allContents.find(c => c.id === contentId);
            if (!item) return;
            const detailHtml = `
                <div style="margin-bottom:16px;">
                    <div style="color:#94a3b8;font-size:13px;">分类：${item.category}</div>
                    <div style="font-size:22px;font-weight:700;margin:8px 0;">${item.title}</div>
                    ${item.description ? `<div style="color:#475569;line-height:1.6;margin-bottom:8px;">${item.description}</div>` : ''}
                    ${item.file_url ? `<div style="background:#f1f5f9;padding:8px 12px;border-radius:8px;"><a href="${item.file_url}" target="_blank">📎 下载文件</a></div>` : ''}
                    ${item.url ? `<div style="background:#f1f5f9;padding:8px 12px;border-radius:8px;"><a href="${item.url}" target="_blank">🔗 ${item.url}</a></div>` : ''}
                    <div style="font-size:13px;color:#94a3b8;margin-top:8px;">状态：${getStatusText(item.status)} · ${timeAgo(item.created_at)}</div>
                </div>
                <div style="display:flex;gap:10px;">
                    <button class="btn-sm approve" onclick="reviewContent(${item.id}, 'approved'); closeReviewDetail();" style="padding:8px 24px;border-radius:10px;background:#dcfce7;color:#166534;border:1px solid #86efac;font-weight:600;">✅ 通过</button>
                    <button class="btn-sm reject" onclick="reviewContent(${item.id}, 'rejected'); closeReviewDetail();" style="padding:8px 24px;border-radius:10px;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;font-weight:600;">❌ 拒绝</button>
                    <button class="btn-sm" onclick="closeReviewDetail()" style="padding:8px 24px;border-radius:10px;background:#f1f5f9;border:1px solid #e2e8f0;">关闭</button>
                </div>
            `;
            document.getElementById('reviewDetailContent').innerHTML = detailHtml;
            document.getElementById('reviewDetailModal').classList.remove('hidden');
        }

        function closeReviewDetail() {
            document.getElementById('reviewDetailModal').classList.add('hidden');
        }

        // ============================================================
        //  管 理 员 管 理
        // ============================================================
        async function openAdminModal() {
            if (currentUserRole !== 'admin') return;
            document.getElementById('adminModal').classList.remove('hidden');
            await loadAdminList();
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        let adminUsers = [];

        async function loadAdminList() {
            const { data, error } = await supabase
                .from('profiles')
                .select('id, role')
                .eq('role', 'admin');
            if (error) {
                console.error('加载管理员列表失败:', error);
                return;
            }
            adminUsers = data || [];
            renderAdminList();
        }

        async function renderAdminList() {
            const container = document.getElementById('adminList');
            if (adminUsers.length === 0) {
                container.innerHTML = '<p style="color:#94a3b8;text-align:center;">暂无管理员</p>';
                return;
            }
            let html = '';
            for (const admin of adminUsers) {
                const { data: userData } = await supabase.auth.admin.getUserById(admin.id);
                const email = userData?.user?.email || admin.id;
                html +=
                    `<div class="user-item"><span class="email">${email}</span><span class="role admin">👑 管理员</span></div>`;
            }
            container.innerHTML = html;
        }

        async function addAdmin() {
            const input = document.getElementById('adminAddInput');
            const email = input.value.trim();
            if (!email) { alert('请输入邮箱'); return; }
            try {
                const { data: userData, error: userError } = await supabase.auth.admin.listUsers();
                if (userError) throw new Error(userError.message);
                const found = userData.users.find(u => u.email === email);
                if (!found) { alert('未找到该用户，请确保用户已注册'); return; }
                const { error: updateError } = await supabase
                    .from('profiles')
                    .upsert({ id: found.id, role: 'admin' });
                if (updateError) throw new Error(updateError.message);
                alert('✅ 已设为管理员');
                input.value = '';
                loadAdminList();
                loadUserRole();
                updateUI();
            } catch (err) { alert('操作失败：' + err.message); }
        }

        console.log('👁️ 必看网 v6.0.0 (密码登录版)');
        console.log('📧 管理员: 3948677391@qq.com');
    </script>
