<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #000;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-touch-callout: none; touch-action: none;
  }

  /* ===== 假入口页 ===== */
  #gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
    z-index: 10; text-align: center; padding: 20px;
  }
  .warning-icon {
    width: 120px; height: 120px; object-fit: contain;
    margin-bottom: 30px;
    filter: drop-shadow(0 0 30px rgba(255,0,0,0.8));
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .warning-title { color:#fff; font-size:22px; margin-bottom:10px; letter-spacing:2px; }
  .warning-sub { color:#888; font-size:14px; margin-bottom:40px; line-height:1.6; }
  .enter-btn {
    padding: 16px 60px; font-size: 20px; font-weight: bold; color: #fff;
    background: linear-gradient(90deg, #ff2d55, #ff0055);
    border: none; border-radius: 50px; cursor: pointer;
    letter-spacing: 4px;
    box-shadow: 0 0 25px rgba(255,0,85,0.8);
    animation: glow 1.2s infinite alternate;
    transition: transform 0.15s;
  }
  .enter-btn:active { transform: scale(0.95); }
  @keyframes glow {
    from { box-shadow: 0 0 20px rgba(255,0,85,0.6); }
    to   { box-shadow: 0 0 45px rgba(255,0,85,1); }
  }

  /* ===== 加载页 ===== */
  #loading {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000; z-index: 20; padding: 0 40px;
  }
  #loading .loading-text {
    color: #fff; font-size: 18px; margin-bottom: 20px; letter-spacing: 2px;
  }
  #loading .bar-wrap {
    width: 100%; max-width: 400px; height: 8px;
    background: #222; border-radius: 50px; overflow: hidden;
  }
  #loading .bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff2d55, #ff0055);
    border-radius: 50px;
    transition: width 0.15s linear;
  }
  #loading .percent {
    color: #ff2d55; font-size: 14px; margin-top: 12px;
    font-family: monospace;
  }

  /* ===== 视频层 ===== */
  #video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: none; background: #000;
  }
</style>
</head>
<body>

  <!-- 假入口 -->
  <div id="gate">
    <img src="IMG_6464.jpeg" class="warning-icon" alt="">
    <div class="warning-title">警告：成人内容</div>
    <div class="warning-sub">
      本网站含有成人内容<br>
      请确认您已年满 18 周岁<br>
      点击下方按钮进入
    </div>
    <button class="enter-btn" id="enterBtn">进 入</button>
  </div>

  <!-- 假加载页 -->
  <div id="loading">
    <div class="loading-text">正在加载资源，请稍候...</div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="percent" id="percent">0%</div>
  </div>

  <!-- 视频 -->
  <video id="video" playsinline></video>

<script>
  const VIDEO_FILE = '03794C91-CDC0-4475-8D72-18F05A7C671A%202.mp4';

  const gate     = document.getElementById('gate');
  const loading  = document.getElementById('loading');
  const bar      = document.getElementById('bar');
  const percent  = document.getElementById('percent');
  const video    = document.getElementById('video');
  const btn      = document.getElementById('enterBtn');

  btn.addEventListener('click', () => {
    // ===== 关键：点击瞬间同步解锁音频 =====
    // 用户手势直接触发的 play()，浏览器才认可
    video.muted = false;
    video.volume = 0;              // 先静音，避免没下载完就出声
    video.play().catch(() => {
      video.muted = true;          // 兜底：实在不行先静音播
      video.play().catch(() => {});
    });
    // =====================================

    gate.style.display = 'none';
    loading.style.display = 'flex';
    document.documentElement.requestFullscreen?.().catch(() => {});
    loadVideo();
  });

  async function loadVideo() {
    try {
      const resp = await fetch(VIDEO_FILE);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const total = +resp.headers.get('Content-Length') || 0;
      const reader = resp.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;

        if (total) {
          const p = Math.min(100, Math.round(received / total * 100));
          bar.style.width = p + '%';
          percent.textContent = p + '%';
        } else {
          let p = parseFloat(bar.style.width) || 0;
          p = Math.min(95, p + 0.5);
          bar.style.width = p + '%';
          percent.textContent = Math.round(p) + '%';
        }
      }

      const blob = new Blob(chunks, { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);

      bar.style.width = '100%';
      percent.textContent = '100%';

      setTimeout(() => {
        loading.style.display = 'none';
        video.src = url;
        video.style.display = 'block';
        video.loop = true;

        // 音频已在点击时解锁，这里只恢复音量和取消静音
        video.muted = false;
        video.volume = 1;

        video.controls = false;
        video.disablePictureInPicture = true;
        video.play().catch(() => {});
        startAntiPause();
      }, 300);

    } catch (err) {
      console.log('加载失败:', err);
      loading.style.display = 'none';
      video.src = VIDEO_FILE;
      video.style.display = 'block';
      video.loop = true;
      video.muted = false;
      video.volume = 1;
      video.play().catch(() => {});
      startAntiPause();
    }
  }

  function startAntiPause() {
    // 暂停就恢复
    video.addEventListener('pause', () => video.play().catch(() => {}));

    // 一旦播放起来，检查是否被静音/音量为0，强制恢复
    video.addEventListener('playing', () => {
      if (video.muted || video.volume === 0) {
        video.muted = false;
        video.volume = 1;
        video.play().catch(() => {});
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      const blocked = [' ','Space','k','K','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','MediaPlayPause','MediaPause'];
      if (blocked.includes(e.key)) {
        e.preventDefault(); e.stopPropagation();
        video.play().catch(() => {});
      }
    }, true);
    video.addEventListener('click', e => {
      e.preventDefault();
      video.play().catch(() => {});
    });
    document.addEventListener('visibilitychange', () => video.play().catch(() => {}));

    // 定时兜底：暂停恢复 + 静音恢复
    setInterval(() => {
      if (video.paused) video.play().catch(() => {});
      if (video.muted || video.volume === 0) {
        video.muted = false;
        video.volume = 1;
      }
    }, 500);

    window.addEventListener('blur', () => video.play().catch(() => {}));
  }
</script>
</body>
</html>
