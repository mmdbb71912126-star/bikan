<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bikan · 网址导航</title>
<link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body class="nav-page">

<!-- 首页视图 -->
<div id="homeView">
<header class="nav-header">
  <div class="header-inner">
    <h1 class="logo">bikan</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索网站...">
    </div>
  </div>
</header>

<main class="nav-main">
  <div class="category-tabs" id="categoryTabs"></div>
  <div class="links-grid" id="linksGrid"></div>
</main>
</div>

<!-- 管理视图 -->
<div id="adminView" style="display:none">
<header class="nav-header">
  <div class="header-inner">
    <h1 class="logo">管理后台</h1>
    <a href="/" class="btn ghost">返回首页</a>
  </div>
</header>
<main class="nav-main">
  <!-- 密码验证 -->
  <div id="adminLoginBox" style="max-width:400px;margin:100px auto;text-align:center;">
    <h3>请输入管理密码</h3>
    <input type="password" id="adminPwd" placeholder="密码" style="width:100%;padding:12px;margin:16px 0;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;">
    <button id="adminLoginBtn" class="btn primary" style="width:100%;">登录</button>
    <p id="adminMsg" style="color:#ef4444;margin-top:12px;font-size:13px;"></p>
  </div>

  <!-- 管理面板 -->
  <div id="adminPanel" style="display:none;">
    <div class="admin-section">
      <h3>添加网站</h3>
      <input type="text" id="newTitle" placeholder="网站名称">
      <input type="url" id="newUrl" placeholder="网站地址">
      <input type="text" id="newDesc" placeholder="描述">
      <select id="newCategory"></select>
      <button id="addLinkBtn" class="btn primary">添加</button>
    </div>
    <div class="admin-section">
      <h3>网站列表</h3>
      <div id="adminLinksList"></div>
    </div>
  </div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js?v=3"></script>
<script src="/js/nav.js?v=3"></script>
</body>
</html>
