<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的资源分享站</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .hidden { display: none; }
        input, button { padding: 10px; margin: 5px; }
        .file-item { border: 1px solid #ddd; padding: 10px; margin: 5px 0; display: flex; justify-content: space-between; }
        .file-item a { color: blue; text-decoration: none; }
        .file-item a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div id="app">
    <!-- 未登录时显示 -->
    <div id="loginSection">
        <h2>登录 / 注册</h2>
        <input type="email" id="email" placeholder="邮箱">
        <input type="password" id="password" placeholder="密码（至少6位）">
        <button onclick="signUp()">注册</button>
        <button onclick="signIn()">登录</button>
        <p id="message" style="color:red;"></p>
    </div>

    <!-- 登录后显示 -->
    <div id="dashboardSection" class="hidden">
        <h2>📁 我的资源</h2>
        <button onclick="signOut()">退出登录</button>
        <hr>
        <h3>上传文件</h3>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">上传</button>
        <hr>
        <h3>我的文件列表</h3>
        <div id="fileList"></div>
    </div>
</div>

<script>
    // ========== 🔴 替换成你自己的信息 ==========
    const SUPABASE_URL = 'https://bazpyoiklkoajdhfkwly.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lTx_tYITroL8_jVVR4EjAA_Eg61lBFT';
    // =========================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== 认证相关 =====
    async function signUp() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) return alert('注册失败：' + error.message);
        alert('注册成功！请登录');
    }

    async function signIn() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) return alert('登录失败：' + error.message);
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        loadFiles();
    }

    async function signOut() {
        await supabase.auth.signOut();
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
    }

    // ===== 文件上传 =====
    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        if (!file) return alert('请选择一个文件');

        const { data: { user: userData } } = await supabase.auth.getUser();
        if (!userData) return alert('请先登录');

        // 上传到 Supabase Storage
        const filePath = `${userData.id}/${Date.now()}_${file.name}`;
        const { data: uploadData, error: uploadError } = await supabase.storage
            .from('files')
            .upload(filePath, file);

        if (uploadError) return alert('上传失败：' + uploadError.message);

        // 获取公开访问链接
        const { data: urlData } = supabase.storage
            .from('files')
            .getPublicUrl(filePath);

        // 记录到数据库
        await supabase.from('files').insert({
            user_id: userData.id,
            file_name: file.name,
            file_url: urlData.publicUrl,
            file_size: file.size
        });

        alert('上传成功！');
        fileInput.value = '';
        loadFiles();
    }

    // ===== 加载文件列表 =====
    async function loadFiles() {
        const { data: { user: userData } } = await supabase.auth.getUser();
        if (!userData) return;

        const { data, error } = await supabase
            .from('files')
            .select('*')
            .eq('user_id', userData.id)
            .order('created_at', { ascending: false });

        if (error) return alert('加载失败：' + error.message);

        const list = document.getElementById('fileList');
        list.innerHTML = '';
        if (data.length === 0) {
            list.innerHTML = '<p>暂无文件，上传一个吧！</p>';
            return;
        }
        data.forEach(file => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <span>📄 ${file.file_name} (${(file.file_size/1024).toFixed(1)} KB)</span>
                <a href="${file.file_url}" target="_blank">下载</a>
            `;
            list.appendChild(div);
        });
    }

    // ===== 检查登录状态 =====
    supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            loadFiles();
        } else {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
        }
    });
</script>

</body>
</html>
