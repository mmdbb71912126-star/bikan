<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 登录</title>
    <!-- 网站图标 -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- 加载 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 加载全局样式 -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
    <div class="card" id="authCard">
        <!-- 认证界面 -->
        <div id="authContainer">
            <!-- 登录面板 -->
            <div id="loginPanel">
                <h2>欢迎回来</h2>
                <div class="subtitle">登录你的账户</div>
                <button class="btn btn-google btn-block" id="googleLoginBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Google 一键登录
                </button>
                <div class="divider">或使用邮箱</div>
                <div class="form-group">
                    <label>邮箱地址</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" />
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" />
                </div>
                <button class="btn btn-primary btn-block" id="loginBtn">登录</button>
                <div id="loginMessage" class="message"></div>
                <div class="footer-link">
                    <a id="gotoForgot">忘记密码？点我验证</a> &nbsp;·&nbsp;
                    <a id="gotoRegister">没有账号？点我注册</a>
                </div>
            </div>

            <!-- 注册面板 -->
            <div id="registerPanel" class="hidden">
                <h2>创建账户</h2>
                <div class="subtitle">快速注册，开始体验</div>
                <button class="btn btn-google btn-block" id="googleRegisterBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Google 一键注册
                </button>
                <div class="divider">或使用邮箱注册</div>
                <div class="form-group">
                    <label>邮箱地址</label>
                    <input type="email" id="regEmail" placeholder="your@email.com" />
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="至少6位" />
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirm" placeholder="再次输入密码" />
                </div>
                <button class="btn btn-primary btn-block" id="registerBtn">发送验证邮件</button>
                <div id="registerMessage" class="message"></div>
                <div class="footer-link">
                    已有账号？<a id="gotoLoginFromRegister">点我登录</a>
                </div>
            </div>

            <!-- 忘记密码面板 -->
            <div id="forgotPanel" class="hidden">
                <a class="back-link" id="backFromForgot">← 返回</a>
                <h2>重置密码</h2>
                <div class="subtitle">我们将发送重置链接到你的邮箱</div>
                <div class="form-group">
                    <label>邮箱地址</label>
                    <input type="email" id="forgotEmail" placeholder="your@email.com" />
                </div>
                <button class="btn btn-primary btn-block" id="forgotBtn">点击发送验证邮件</button>
                <div id="forgotMessage" class="message"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 认证脚本（无 emoji）
        // ============================================================
        window.onload = function() {
            var SUPABASE_URL = 'https://bazpyoiklkoajdhfkwly.supabase.co';
            var SUPABASE_ANON_KEY = 'sb_publishable_lTx_tYITroL8_jVVR4EjAA_Eg61lBFT';

            var supabaseClient = null;
            var sdkReady = false;
            try {
                if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    sdkReady = true;
                } else {
                    throw new Error('Supabase SDK 未加载');
                }
            } catch (e) {
                console.error(e);
                showMessage('loginMessage', '初始化失败，请刷新重试');
            }

            var elements = {
                loginPanel: document.getElementById('loginPanel'),
                registerPanel: document.getElementById('registerPanel'),
                forgotPanel: document.getElementById('forgotPanel'),
                loginEmail: document.getElementById('loginEmail'),
                loginPassword: document.getElementById('loginPassword'),
                loginBtn: document.getElementById('loginBtn'),
                loginMessage: document.getElementById('loginMessage'),
                googleLoginBtn: document.getElementById('googleLoginBtn'),
                gotoRegister: document.getElementById('gotoRegister'),
                gotoForgot: document.getElementById('gotoForgot'),
                backFromForgot: document.getElementById('backFromForgot'),
                regEmail: document.getElementById('regEmail'),
                regPassword: document.getElementById('regPassword'),
                regConfirm: document.getElementById('regConfirm'),
                registerBtn: document.getElementById('registerBtn'),
                registerMessage: document.getElementById('registerMessage'),
                googleRegisterBtn: document.getElementById('googleRegisterBtn'),
                gotoLoginFromRegister: document.getElementById('gotoLoginFromRegister'),
                forgotEmail: document.getElementById('forgotEmail'),
                forgotBtn: document.getElementById('forgotBtn'),
                forgotMessage: document.getElementById('forgotMessage')
            };

            function showMessage(id, text, isSuccess) {
                var el = document.getElementById(id);
                if (!el) return;
                el.textContent = text;
                el.className = 'message ' + (isSuccess ? 'success' : 'error');
            }

            function showPanel(panel) {
                elements.loginPanel.classList.add('hidden');
                elements.registerPanel.classList.add('hidden');
                elements.forgotPanel.classList.add('hidden');
                panel.classList.remove('hidden');
                ['loginMessage', 'registerMessage', 'forgotMessage'].forEach(function(id) {
                    var msg = document.getElementById(id);
                    if (msg) msg.className = 'message';
                });
            }

            elements.gotoRegister.addEventListener('click', function(e) { e.preventDefault(); showPanel(elements.registerPanel); });
            elements.gotoLoginFromRegister.addEventListener('click', function(e) { e.preventDefault(); showPanel(elements.loginPanel); });
            elements.gotoForgot.addEventListener('click', function(e) { e.preventDefault(); showPanel(elements.forgotPanel); });
            elements.backFromForgot.addEventListener('click', function(e) { e.preventDefault(); showPanel(elements.loginPanel); });

            elements.loginBtn.addEventListener('click', function() {
                if (!sdkReady) return showMessage('loginMessage', 'SDK未就绪');
                var email = elements.loginEmail.value.trim();
                var password = elements.loginPassword.value;
                if (!email || !password) return showMessage('loginMessage', '请输入邮箱和密码');
                supabaseClient.auth.signInWithPassword({ email: email, password: password })
                    .then(function(result) {
                        if (result.error) {
                            showMessage('loginMessage', result.error.message);
                        } else {
                            window.location.href = 'app.html';
                        }
                    })
                    .catch(function(err) {
                        showMessage('loginMessage', '网络错误：' + err.message);
                    });
            });

            elements.googleLoginBtn.addEventListener('click', function() {
                if (!sdkReady) return showMessage('loginMessage', 'SDK未就绪');
                supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin + '/app.html' }
                }).then(function(result) {
                    if (result.error) showMessage('loginMessage', result.error.message);
                }).catch(function(err) {
                    showMessage('loginMessage', '网络错误：' + err.message);
                });
            });

            elements.registerBtn.addEventListener('click', function() {
                if (!sdkReady) return showMessage('registerMessage', 'SDK未就绪');
                var email = elements.regEmail.value.trim();
                var password = elements.regPassword.value;
                var confirm = elements.regConfirm.value;
                if (!email || !password || !confirm) return showMessage('registerMessage', '请填写所有字段');
                if (password.length < 6) return showMessage('registerMessage', '密码至少6位');
                if (password !== confirm) return showMessage('registerMessage', '两次密码不一致');
                supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: { emailRedirectTo: window.location.origin + '/app.html' }
                }).then(function(result) {
                    if (result.error) {
                        showMessage('registerMessage', result.error.message);
                    } else {
                        showMessage('registerMessage', '验证邮件已发送，请查收邮箱并点击链接完成注册', true);
                    }
                }).catch(function(err) {
                    showMessage('registerMessage', '网络错误：' + err.message);
                });
            });

            elements.googleRegisterBtn.addEventListener('click', function() {
                if (!sdkReady) return showMessage('registerMessage', 'SDK未就绪');
                supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin + '/app.html' }
                }).then(function(result) {
                    if (result.error) showMessage('registerMessage', result.error.message);
                }).catch(function(err) {
                    showMessage('registerMessage', '网络错误：' + err.message);
                });
            });

            elements.forgotBtn.addEventListener('click', function() {
                if (!sdkReady) return showMessage('forgotMessage', 'SDK未就绪');
                var email = elements.forgotEmail.value.trim();
                if (!email) return showMessage('forgotMessage', '请输入邮箱地址');
                supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/update-password.html'
                }).then(function(result) {
                    if (result.error) {
                        showMessage('forgotMessage', result.error.message);
                    } else {
                        showMessage('forgotMessage', '重置链接已发送，请查收邮箱', true);
                    }
                }).catch(function(err) {
                    showMessage('forgotMessage', '网络错误：' + err.message);
                });
            });

            if (sdkReady) {
                supabaseClient.auth.getSession().then(function(result) {
                    if (result.data.session) {
                        window.location.href = 'app.html';
                    }
                });
            }
        };
    </script>
</body>
</html>
