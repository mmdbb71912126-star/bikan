                '0') + '-' + String(d.getDate()).padStart(2, '0'); }

            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            let toastTimer = null;

            function showToast(msg, type) {
                type = type || '';
                var t = document.getElementById('toast');
                if (toastTimer) clearTimeout(toastTimer);
                t.textContent = msg;
                t.className = 'toast ' + type + ' show';
                toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
            }

            // ============================================================
            //  模态框
            // ============================================================
            function showModal(title, fields, confirmLabel, confirmCb, cancelCb) {
                return new Promise(function(resolve) {
                    var overlay = document.getElementById('customModal');
                    var titleEl = document.getElementById('customModalTitle');
                    var body = document.getElementById('customModalBody');
                    var confirmBtn = document.getElementById('customModalConfirm');
                    var cancelBtn = document.getElementById('customModalCancel');

                    titleEl.textContent = title || '输入';
                    body.innerHTML = '';
                    fields.forEach(function(f) {
                        var group = document.createElement('div');
                        group.className = 'form-group';
                        var label = document.createElement('label');
                        label.textContent = f.label || '';
                        group.appendChild(label);
                        var input;
                        if (f.type === 'textarea') {
                            input = document.createElement('textarea');
                            input.rows = 3;
                            if (f.value) input.value = f.value;
                        } else if (f.type === 'select') {
                            input = document.createElement('select');
                            if (f.options) {
                                f.options.forEach(function(opt) {
                                    var o = document.createElement('option');
                                    o.value = opt.value;
                                    o.textContent = opt.label;
                                    if (opt.value === f.value) o.selected = true;
                                    input.appendChild(o);
                                });
                            }
                        } else if (f.type === 'checkbox') {
                            input = document.createElement('input');
                            input.type = 'checkbox';
                            if (f.value) input.checked = true;
                            input.id = f.id || 'modal_input_' + Date.now();
                            group.style.display = 'flex';
                            group.style.alignItems = 'center';
                            group.style.gap = '8px';
                            group.style.padding = '4px 0';
                            var labelSpan = document.createElement('span');
                            labelSpan.textContent = f.label || '';
                            labelSpan.style.color = 'var(--text-secondary)';
                            labelSpan.style.fontSize = '0.85rem';
                            group.appendChild(labelSpan);
                            group.appendChild(input);
                            var oldLabel = group.querySelector('label');
                            if (oldLabel) oldLabel.remove();
                            body.appendChild(group);
                            return;
                        } else {
                            input = document.createElement('input');
                            input.type = 'text';
                            if (f.value) input.value = f.value;
                        }
                        input.id = f.id || 'modal_input_' + Date.now();
                        input.placeholder = f.placeholder || '';
                        group.appendChild(input);
                        body.appendChild(group);
                    });

                    overlay.classList.add('open');

                    var newConfirm = function() {
                        var results = {};
                        fields.forEach(function(f) {
                            var el = document.getElementById(f.id);
                            if (el) {
                                if (f.type === 'checkbox') {
                                    results[f.id] = el.checked;
                                } else {
                                    results[f.id] = el.value;
                                }
                            }
                        });
                        overlay.classList.remove('open');
                        if (confirmCb) confirmCb(results);
                        resolve(results);
                    };
                    var newCancel = function() {
                        overlay.classList.remove('open');
                        if (cancelCb) cancelCb();
                        resolve(null);
                    };

                    confirmBtn.onclick = newConfirm;
                    cancelBtn.onclick = newCancel;
                    overlay.onclick = function(e) {
                        if (e.target === overlay) newCancel();
                    };
                    var firstInput = body.querySelector('input:not([type="checkbox"]), textarea, select');
                    if (firstInput) {
                        firstInput.focus();
                        firstInput.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter' && !e.shiftKey) {
                                e.preventDefault();
                                newConfirm();
                            }
                        });
                    }
                });
            }

            function showConfirm(msg, title) {
                return new Promise(function(resolve) {
                    var overlay = document.getElementById('confirmModal');
                    document.getElementById('confirmModalTitle').textContent = title || '确认操作';
                    document.getElementById('confirmModalMsg').textContent = msg;
                    overlay.classList.add('open');
                    var okBtn = document.getElementById('confirmModalOk');
                    var cancelBtn = document.getElementById('confirmModalCancel');
                    var newOk = function() { overlay.classList.remove('open');
                        resolve(true); };
                    var newCancel = function() { overlay.classList.remove('open');
                        resolve(false); };
                    okBtn.onclick = newOk;
                    cancelBtn.onclick = newCancel;
                    overlay.onclick = function(e) { if (e.target === overlay) newCancel(); };
                });
            }

            // ============================================================
            //  数据加载
            // ============================================================
            async function loadData() {
                try {
                    // 加载设置
                    var { data: settingsData, error: settingsErr } = await supabase
                        .from('settings')
                        .select('key, value');
                    if (!settingsErr && settingsData) {
                        settingsData.forEach(function(row) {
                            if (row.key === 'site') settings.site = row.value;
                            else if (row.key === 'hero') settings.hero = row.value;
                            else if (row.key === 'theme') settings.theme = row.value;
                        });
                    }

                    // 加载分区
                    var { data: sectionsData, error: sectionsErr } = await supabase
                        .from('sections')
                        .select('*')
                        .order('sort_order', { ascending: true });
                    if (!sectionsErr && sectionsData) {
                        sections = sectionsData;
                    }

                    // 加载首页项
                    var { data: homeData, error: homeErr } = await supabase
                        .from('home_items')
                        .select('*')
                        .order('sort_order', { ascending: true });
                    if (!homeErr && homeData) {
                        homeItems = homeData;
                    }

                    // 加载书签
                    var { data: bookmarksData, error: bmErr } = await supabase
                        .from('bookmarks')
                        .select('*')
                        .order('sort_order', { ascending: true });
                    if (!bmErr && bookmarksData) {
                        // 按 section_id 分组
                        var bmMap = {};
                        bookmarksData.forEach(function(b) {
                            if (!bmMap[b.section_id]) bmMap[b.section_id] = [];
                            bmMap[b.section_id].push(b);
                        });
                        // 合并到 sections
                        sections.forEach(function(sec) {
                            if (bmMap[sec.id]) {
                                sec.bookmarks = bmMap[sec.id];
                            } else {
                                sec.bookmarks = [];
                            }
                        });
                    }

                    // 加载 HTML 页面
                    var { data: htmlData, error: htmlErr } = await supabase
                        .from('html_pages')
                        .select('*')
                        .order('sort_order', { ascending: true });
                    if (!htmlErr && htmlData) {
                        var htmlMap = {};
                        htmlData.forEach(function(h) {
                            if (!htmlMap[h.section_id]) htmlMap[h.section_id] = [];
                            htmlMap[h.section_id].push(h);
                        });
                        sections.forEach(function(sec) {
                            if (htmlMap[sec.id]) {
                                sec.htmlPages = htmlMap[sec.id];
                            } else {
                                sec.htmlPages = [];
                            }
                        });
                    }

                    // 构建树形结构
                    var rootSections = sections.filter(function(s) { return !s.parent_id; });
                    var childMap = {};
                    sections.forEach(function(s) {
                        if (s.parent_id) {
                            if (!childMap[s.parent_id]) childMap[s.parent_id] = [];
                            childMap[s.parent_id].push(s);
                        }
                    });

                    // 构建 children 树
                    function buildTree(sec) {
                        var children = childMap[sec.id] || [];
                        sec.children = children.map(function(c) {
                            c.bookmarks = c.bookmarks || [];
                            c.htmlPages = c.htmlPages || [];
                            return buildTree(c);
                        });
                        return sec;
                    }

                    rootSections.forEach(function(sec) {
                        sec.bookmarks = sec.bookmarks || [];
                        sec.htmlPages = sec.htmlPages || [];
                        buildTree(sec);
                    });

                    // 重新赋值 sections
                    sections = rootSections;

                    // 设置默认值
                    if (!settings.site) settings.site = { name: '必看网', version: 'v3.0' };
                    if (!settings.hero) settings.hero = { badge: '✦ 精选优质网站', title: '发现好网站', subtitle: '从必看网开始',
                        highlight: '好网站' };

                    applySettings();
                    renderSidebar();
                    renderHome();

                } catch (err) {
                    console.error('加载数据失败:', err);
                    showToast('数据加载失败', 'error');
                }
            }

            // ============================================================
            //  应用设置到 UI
            // ============================================================
            function applySettings() {
                if (settings.site) {
                    document.getElementById('brandName').textContent = settings.site.name || '必看网';
                    document.getElementById('brandVersion').textContent = settings.site.version || 'v3.0';
                }
                if (settings.hero) {
                    document.getElementById('heroBadge').textContent = settings.hero.badge || '✦ 精选优质网站';
                    var title = settings.hero.title || '发现好网站';
                    var highlight = settings.hero.highlight || '好网站';
                    var titleHtml;
                    if (title.includes(highlight)) {
                        var parts = title.split(highlight);
                        titleHtml = parts[0] + '<span class="highlight" id="heroHighlight">' + highlight + '</span>' +
                            parts.slice(1).join(highlight);
                    } else {
                        titleHtml = title;
                    }
                    document.getElementById('heroTitle').innerHTML = titleHtml;
                    document.getElementById('heroSub').textContent = settings.hero.subtitle || '从必看网开始';
                }
                if (settings.theme) {
                    var root = document.documentElement;
                    if (settings.theme.primaryColor) {
                        root.style.setProperty('--color-primary', settings.theme.primaryColor);
                    }
                }
            }

            // ============================================================
            //  统计
            // ============================================================
            function countAllBookmarks() {
                var total = 0;
                sections.forEach(function(sec) {
                    if (sec.children) {
                        sec.children.forEach(function(c) {
                            if (c.isHtml) {
                                total += (c.htmlPages || []).length;
                            } else {
                                total += (c.bookmarks || []).length;
                            }
                        });
                    }
                });
                return total;
            }

            function countSubSections() {
                var total = 0;
                sections.forEach(function(sec) {
                    if (sec.children) total += sec.children.length;
                });
                return total;
            }

            // ============================================================
            //  查找函数
            // ============================================================
            function findSectionById(nodes, id) {
                for (var i = 0; i < nodes.length; i++) {
                    if (nodes[i].id === id) return nodes[i];
                    if (nodes[i].children) {
                        var found = findSectionById(nodes[i].children, id);
                        if (found) return found;
                    }
                }
                return null;
            }

            function getSection(id) { return findSectionById(sections, id); }

            function getParent(id) {
                for (var i = 0; i < sections.length; i++) {
                    if (sections[i].id === id) return null;
                    if (sections[i].children) {
                        for (var j = 0; j < sections[i].children.length; j++) {
                            if (sections[i].children[j].id === id) return sections[i];
                        }
                    }
                }
                return null;
            }

            // ============================================================
            //  渲染：侧边栏
            // ============================================================
            function renderSidebar() {
                var container = document.getElementById('sidebarTree');
                container.innerHTML = '';
                sections.forEach(function(sec) {
                    var li = buildTreeItem(sec);
                    container.appendChild(li);
                });
                document.getElementById('sidebarTotal').textContent = sections.length;
                var activeId = currentSubId || currentSectionId;
                if (activeId) {
                    document.querySelectorAll('.sidebar-tree .node').forEach(function(el) {
                        el.classList.toggle('active', el.dataset.id === activeId);
                    });
                }
            }

            function buildTreeItem(section) {
                var li = document.createElement('li');
                li.className = 'tree-item';
                li.dataset.id = section.id;

                var hasChildren = section.children && section.children.length > 0;
                var isOpen = expandedNodes[section.id] !== false;

                var nodeDiv = document.createElement('div');
                nodeDiv.className = 'node';
                nodeDiv.dataset.id = section.id;

                var toggle = document.createElement('span');
                toggle.className = 'toggle-icon' + (isOpen ? ' open' : '');
                toggle.textContent = hasChildren ? '▶' : '·';
                toggle.style.opacity = hasChildren ? '1' : '0.2';
                toggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (hasChildren) {
                        expandedNodes[section.id] = !isOpen;
                        renderSidebar();
                    }
                });

                var iconSpan = document.createElement('span');
                iconSpan.className = 'node-icon';
                if (section.icon) {
                    iconSpan.innerHTML = '<img src="' + section.icon + '" alt="" />';
                } else {
                    iconSpan.textContent = section.isHtmlParent ? '📄' : (hasChildren ? '📁' : '📄');
                }

                var name = document.createElement('span');
                name.className = 'node-name';
                name.textContent = section.name;

                var badge = document.createElement('span');
                badge.className = 'node-badge';
                if (section.isHtmlParent) {
                    badge.textContent = 'HTML';
                } else if (hasChildren) {
                    var totalBookmarks = 0;
                    section.children.forEach(function(c) {
                        if (!c.isHtml) totalBookmarks += (c.bookmarks || []).length;
                        else totalBookmarks += (c.htmlPages || []).length;
                    });
                    badge.textContent = totalBookmarks;
                } else {
                    badge.textContent = '0';
                }

                nodeDiv.appendChild(toggle);
                nodeDiv.appendChild(iconSpan);
                nodeDiv.appendChild(name);
                nodeDiv.appendChild(badge);

                nodeDiv.addEventListener('click', function(e) {
                    if (e.target.closest('.toggle-icon')) return;
                    navigateTo('section', section.id);
                });

                li.appendChild(nodeDiv);

                if (hasChildren) {
                    var ul = document.createElement('ul');
                    ul.className = 'children' + (isOpen ? ' open' : '');
                    section.children.forEach(function(child) {
                        var childLi = buildChildItem(child, section.id);
                        ul.appendChild(childLi);
                    });
                    li.appendChild(ul);
                }

                return li;
            }

            function buildChildItem(child, parentId) {
                var li = document.createElement('li');
                li.className = 'tree-item';
                li.dataset.id = child.id;

                var nodeDiv = document.createElement('div');
                nodeDiv.className = 'node';
                nodeDiv.dataset.id = child.id;
                nodeDiv.style.paddingLeft = '8px';

                var iconSpan = document.createElement('span');
                iconSpan.className = 'node-icon';
                if (child.icon) {
                    iconSpan.innerHTML = '<img src="' + child.icon + '" alt="" />';
                } else {
                    iconSpan.textContent = child.isHtml ? '📄' : '📄';
                }

                var name = document.createElement('span');
                name.className = 'node-name';
                name.textContent = child.name;

                var badge = document.createElement('span');
                badge.className = 'node-badge';
                if (child.isHtml) {
                    badge.textContent = (child.htmlPages || []).length;
                } else {
                    badge.textContent = (child.bookmarks || []).length;
                }

                nodeDiv.appendChild(iconSpan);
                nodeDiv.appendChild(name);
                nodeDiv.appendChild(badge);

                nodeDiv.addEventListener('click', function(e) {
                    if (e.target.closest('.toggle-icon')) return;
                    var parentSec = getSection(parentId);
                    if (parentSec) {
                        if (child.isHtml) {
                            navigateTo('subsection', parentId, child.id);
                        } else {
                            navigateTo('bookmarks', parentId, child.id);
                        }
                    }
                });

                li.appendChild(nodeDiv);
                return li;
            }

            // ============================================================
            //  渲染：首页
            // ============================================================
            function renderHome() {
                var totalSections = sections.length;
                var totalSubs = countSubSections();
                var totalBookmarks = countAllBookmarks();

                var statNumbers = document.querySelectorAll('#heroStats .num');
                if (statNumbers.length >= 3) {
                    animateNumber(statNumbers[0], totalSections);
                    animateNumber(statNumbers[1], totalSubs);
                    animateNumber(statNumbers[2], totalBookmarks);
                }

                renderContentGrid();
                renderSidebar();
                updateLayers();
            }

            function animateNumber(el, target) {
                if (target === 0) {
                    el.textContent = '0';
                    return;
                }
                var current = 0,
                    duration = 700,
                    start = performance.now();

                function update(now) {
                    var progress = Math.min((now - start) / duration, 1);
                    var eased = 1 - Math.pow(1 - progress, 3);
                    var val = Math.round(eased * target);
                    el.textContent = val;
                    if (progress < 1) requestAnimationFrame(update);
                    else el.textContent = target;
                }
                requestAnimationFrame(update);
            }

            // ============================================================
            //  渲染：内容网格
            // ============================================================
            function renderContentGrid() {
                var container = document.getElementById('homeContentGrid');
                container.innerHTML = '';
                if (!homeItems || homeItems.length === 0) {
                    if (isManageMode) container.innerHTML =
                        '<div class="empty-state" style="padding:10px 0;"><div class="empty-text" style="font-size:0.7rem;">暂无内容，点击下方添加</div></div>';
                    return;
                }

                homeItems.forEach(function(item, index) {
                    var wrapper = document.createElement('div');
                    wrapper.className = 'grid-item';
                    wrapper.dataset.id = item.id;
                    wrapper.dataset.type = item.type;
                    wrapper.dataset.index = index;
                    if (isManageMode) {
                        wrapper.draggable = true;
                        wrapper.addEventListener('dragstart', onDragStart);
                        wrapper.addEventListener('dragend', onDragEnd);
                        wrapper.addEventListener('dragover', onDragOver);
                        wrapper.addEventListener('dragenter', onDragEnter);
                        wrapper.addEventListener('dragleave', onDragLeave);
                        wrapper.addEventListener('drop', onDrop);
                        var handle = document.createElement('span');
                        handle.className = 'drag-handle';
                        handle.textContent = '≡';
                        handle.title = '拖拽排序';
                        wrapper.appendChild(handle);
                    } else wrapper.draggable = false;

                    if (item.type === 'announcement') {
                        var posClass = item.position === 'top' ? 'top' : (item.position === 'bottom' ? 'bottom' :
                        '');
                        wrapper.innerHTML += '<div class="item-announcement ' + posClass +
                            '"><span class="announce-icon">📢</span><span class="announce-text">' +
                            escapeHtml(item.content || '公告内容') + '</span></div>';
                        if (isManageMode) {
                            var annEl = wrapper.querySelector('.item-announcement');
                            if (annEl) {
                                annEl.style.cursor = 'pointer';
                                annEl.addEventListener('click', function(e) {
                                    if (e.target.closest('.item-actions') || e.target.closest(
                                        '.drag-handle')) return;
                                    openHomeItemEditModal(item.id);
                                });
                            }
                        }
                    } else if (item.type === 'divider') {
                        var text = item.content || '';
                        var textHtml = text ? '<span class="divider-text">' + escapeHtml(text) + '</span>' :
                            '<span class="divider-text empty">━ 分割线 ━</span>';
                        wrapper.innerHTML += '<div class="item-divider"><span class="line"></span>' + textHtml +
                            '<span class="line"></span></div>';
                        if (isManageMode) {
                            var divEl = wrapper.querySelector('.item-divider');
                            if (divEl) {
                                divEl.style.cursor = 'pointer';
                                divEl.addEventListener('click', function(e) {
                                    if (e.target.closest('.item-actions') || e.target.closest(
                                        '.drag-handle')) return;
                                    openHomeItemEditModal(item.id);
                                });
                            }
                        }
                    } else if (item.type === 'section_ref') {
                        var section = getSection(item.section_id);
                        if (!section) {
                            wrapper.innerHTML =
                                '<div style="color:var(--text-muted);font-size:0.7rem;">分区已删除</div>';
                        } else {
                            var total = 0;
                            if (section.children) {
                                section.children.forEach(function(c) {
                                    if (c.isHtml) {
                                        total += (c.htmlPages || []).length;
                                    } else {
                                        total += (c.bookmarks || []).length;
                                    }
                                });
                            }
                            var iconHtml = section.icon ? '<img src="' + section.icon + '" alt="" />' :
                                (section.isHtmlParent ? '📄' : (section.children && section.children.length >
                                    0 ? '📁' : '📄'));
                            var descText = section.isHtmlParent ? 'HTML 模式' : '共 ' + total + ' 个条目';
                            var subCount = section.isHtmlParent ? 'HTML 子分区' : (section.children ? section
                                .children.length : 0) + ' 个子分区';
                            wrapper.innerHTML +=
                                '<div class="item-section" data-section-id="' + section.id +
                                '"><div class="card-glow"></div><div class="card-top"><div class="card-icon">' +
                                iconHtml + '</div><span class="card-count-badge">' + (section.isHtmlParent ?
                                    '📄' : (section.children ? section.children.length : 0)) +
                                ' 个子分区</span></div><div class="card-name">' +
                                escapeHtml(section.name) +
                                '</div><div class="card-desc">' + descText +
                                '</div><div class="card-footer"><span class="sub-count">' + subCount +
                                '</span><span class="arrow">→</span></div></div>';
                            var cardEl = wrapper.querySelector('.item-section');
                            if (cardEl) {
                                cardEl.addEventListener('click', function(e) {
                                    if (e.target.closest('.item-actions') || e.target.closest(
                                        '.drag-handle')) return;
                                    navigateTo('section', section.id);
                                });
                            }
                        }
                    }

                    if (isManageMode) {
                        var actions = document.createElement('div');
                        actions.className = 'item-actions';
                        var editLabel = item.type === 'announcement' ? '编辑公告' : (item.type === 'divider' ?
                            '编辑分割线' : '编辑分区');
                        actions.innerHTML =
                            '<button class="btn-icon" data-action="editItem" title="' + editLabel +
                            '">✏️</button><button class="btn-icon danger" data-action="deleteItem" title="删除">🗑️</button>';
                        wrapper.appendChild(actions);
                        actions.querySelector('[data-action="editItem"]').addEventListener('click', function(e) {
                            e.stopPropagation();
                            openHomeItemEditModal(item.id);
                        });
                        actions.querySelector('[data-action="deleteItem"]').addEventListener('click', function(e) {
                            e.stopPropagation();
                            var name = item.type === 'announcement' ? '公告' : (item.type === 'divider' ?
                                '分割线' : '分区');
                            showConfirm('确定删除此' + name + '？', '确认删除').then(function(ok) {
                                if (ok) deleteHomeItem(item.id);
                            });
                        });
                    }
                    container.appendChild(wrapper);
                });
            }

            // ============================================================
            //  拖拽排序（首页）
            // ============================================================
            function onDragStart(e) {
                var el = e.target.closest('.grid-item');
                if (!el) return;
                if (e.target.closest('button') || e.target.closest('.item-actions')) { e.preventDefault(); return; }
                dragData = { id: el.dataset.id, fromIndex: parseInt(el.dataset.index) };
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', el.dataset.id);
                e.dataTransfer.dropEffect = 'move';
            }

            function onDragEnd(e) {
                var el = e.target.closest('.grid-item');
                if (!el) return;
                el.classList.remove('dragging');
                el.style.opacity = '1';
                document.querySelectorAll('.grid-item.drag-over').forEach(function(el2) { el2.classList.remove(
                    'drag-over'); });
                dragData = null;
            }

            function onDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                var target = e.target.closest('.grid-item');
                if (!target) return;
                if (dragData && dragData.id === target.dataset.id) return;
                target.classList.add('drag-over');
            }

            function onDragEnter(e) {
                e.preventDefault();
                var target = e.target.closest('.grid-item');
                if (!target) return;
                if (dragData && dragData.id === target.dataset.id) return;
                target.classList.add('drag-over');
            }

            function onDragLeave(e) {
                var target = e.target.closest('.grid-item');
                if (!target) return;
                var related = e.relatedTarget;
                if (related && related.closest && related.closest('.grid-item') === target) return;
                target.classList.remove('drag-over');
            }

            function onDrop(e) {
                e.preventDefault();
                var target = e.target.closest('.grid-item');
                if (!target) return;
                target.classList.remove('drag-over');
                if (!dragData) return;
                if (dragData.id === target.dataset.id) return;
                var fromId = dragData.id,
                    toId = target.dataset.id;
                var fromIndex = homeItems.findIndex(function(it) { return it.id === fromId; });
                var toIndex = homeItems.findIndex(function(it) { return it.id === toId; });
                if (fromIndex === -1 || toIndex === -1) return;
                var temp = homeItems[fromIndex];
                homeItems[fromIndex] = homeItems[toIndex];
                homeItems[toIndex] = temp;
                saveHomeItemsOrder();
                renderHome();
                showToast('已调整顺序', 'success');
                dragData = null;
            }

            async function saveHomeItemsOrder() {
                try {
                    for (var i = 0; i < homeItems.length; i++) {
                        await supabase.from('home_items').update({ sort_order: i }).eq('id', homeItems[i].id);
                    }
                } catch (err) {
                    console.error('保存排序失败:', err);
                }
            }

            // ============================================================
            //  首页项 CRUD
            // ============================================================
            async function deleteHomeItem(id) {
                try {
                    await supabase.from('home_items').delete().eq('id', id);
                    homeItems = homeItems.filter(function(it) { return it.id !== id; });
                    renderHome();
                    showToast('已删除', 'success');
                } catch (err) {
                    showToast('删除失败', 'error');
                }
            }

            function openHomeItemEditModal(itemId) {
                var item = homeItems.find(function(it) { return it.id === itemId; });
                if (!item) return;
                var fields = [];
                var title = '';
                if (item.type === 'announcement') {
                    title = '编辑公告';
                    fields.push({ id: 'edit_content', label: '公告内容', type: 'textarea', value: item.content || '' });
                    fields.push({ id: 'edit_position', label: '位置', type: 'select', value: item.position ||
                            'between',
                        options: [{ value: 'top', label: '页面顶部' }, { value: 'between', label: '分区之间' },
                        { value: 'bottom', label: '页面底部' }] });
                } else if (item.type === 'divider') {
                    title = '编辑分割线';
                    fields.push({ id: 'edit_content', label: '分割线文字（可选）', type: 'text', value: item.content ||
                        '' });
                } else if (item.type === 'section_ref') {
                    title = '编辑分区引用';
                    var secOptions = sections.map(function(s) { return { value: s.id, label: s.name }; });
                    fields.push({ id: 'edit_section', label: '选择分区', type: 'select', value: item.section_id ||
                            '', options: secOptions });
                }
                showModal(title, fields, '保存', async function(results) {
                    try {
                        if (item.type === 'announcement') {
                            item.content = results.edit_content || '';
                            item.position = results.edit_position || 'between';
                            await supabase.from('home_items').update({ content: item.content, position: item
                                    .position }).eq('id', item.id);
                        } else if (item.type === 'divider') {
                            item.content = results.edit_content || '';
                            await supabase.from('home_items').update({ content: item.content }).eq('id', item.id);
                        } else if (item.type === 'section_ref') {
                            item.section_id = results.edit_section || '';
                            await supabase.from('home_items').update({ section_id: item.section_id }).eq('id', item
                                .id);
                        }
                        renderHome();
                        showToast('已更新', 'success');
                    } catch (err) {
                        showToast('更新失败', 'error');
                    }
                });
            }

            // ============================================================
            //  导航
            // ============================================================
            function navigateTo(page, sectionId, subId) {
                isNavigating = true;
                if (page === 'home') {
                    pageStack = ['home'];
                    currentSectionId = null;
                    currentSubId = null;
                } else if (page === 'section' && sectionId) {
                    pageStack = ['home', 'section'];
                    currentSectionId = sectionId;
                    currentSubId = null;
                } else if (page === 'subsection' && sectionId && subId) {
                    pageStack = ['home', 'section', 'subsection'];
                    currentSectionId = sectionId;
                    currentSubId = subId;
                } else if (page === 'bookmarks' && sectionId && subId) {
                    pageStack = ['home', 'section', 'bookmarks'];
                    currentSectionId = sectionId;
                    currentSubId = subId;
                }
                updateLayers();
                renderCurrentPage();
                isNavigating = false;
            }

            function goBack() {
                if (pageStack.length <= 1) return;
                pageStack.pop();
                var current = pageStack[pageStack.length - 1];
                if (current === 'home') {
                    currentSectionId = null;
                    currentSubId = null;
                } else if (current === 'section') {
                    currentSubId = null;
                }
                updateLayers();
                renderCurrentPage();
            }

            function updateLayers() {
                var layers = {
                    home: document.getElementById('layerHome'),
                    section: document.getElementById('layerSection'),
                    subsection: document.getElementById('layerSubSection'),
                    bookmarks: document.getElementById('layerBookmarks')
                };
                Object.keys(layers).forEach(function(key) { var el = layers[key]; if (!el) return; el.classList.add(
                        'hidden');
                    el.classList.remove('bg-mode'); });
                pageStack.forEach(function(page, index) {
                    var el = layers[page];
                    if (!el) return;
                    el.classList.remove('hidden');
                    el.classList.remove('bg-mode');
                    el.className = 'page-layer';
                    el.classList.add('depth-' + index);
                    if (index < pageStack.length - 1) el.classList.add('bg-mode');
                });
                var topPage = pageStack[pageStack.length - 1];
                if (topPage) { var topEl = layers[topPage]; if (topEl) topEl.classList.remove('bg-mode'); }
            }

            function renderCurrentPage() {
                var current = pageStack[pageStack.length - 1];
                if (current === 'home') renderHome();
                else if (current === 'section') {
                    if (currentSectionId) renderSection(currentSectionId);
                } else if (current === 'subsection') {
                    if (currentSubId && currentSectionId) renderSubSection(currentSubId, currentSectionId);
                } else if (current === 'bookmarks') {
                    if (currentSubId && currentSectionId) renderBookmarks(currentSubId, currentSectionId);
                }
                updateManageModeUI();
            }

            // ============================================================
            //  渲染：分区详情
            // ============================================================
            function renderSection(sectionId) {
                var section = getSection(sectionId);
                if (!section) { showToast('分区不存在', 'error');
                    goBack(); return; }

                var iconHtml = section.icon ? '<img src="' + section.icon + '" alt="" />' : '📁';
                document.getElementById('detailIcon').innerHTML = iconHtml;
                document.getElementById('detailName').textContent = section.name + (section.isHtmlParent ? ' 📄' : '');

                var total = 0;
                if (section.children) {
                    section.children.forEach(function(c) {
                        if (c.isHtml) {
                            total += (c.htmlPages || []).length;
                        } else {
                            total += (c.bookmarks || []).length;
                        }
                    });
                }
                document.getElementById('detailMeta').textContent = (section.children ? section.children.length : 0) +
                    ' 个子分区 · 共 ' + total + ' 个条目';

                document.getElementById('detailActions').className = 'detail-actions' + (isManageMode ? ' visible' : '');

                var list = document.getElementById('sectionSubList');
                list.innerHTML = '';
                if (!section.children || section.children.length === 0) {
                    list.innerHTML =
                        '<div class="empty-state" style="padding:24px 20px;"><div class="empty-icon">📭</div><div class="empty-text">暂无子分区</div></div>';
                    return;
                }

                section.children.forEach(function(child) {
                    var item = document.createElement('div');
                    item.className = 'sub-item';
                    item.dataset.id = child.id;
                    var iconHtml2 = child.icon ? '<img src="' + child.icon + '" alt="" />' :
                        (child.isHtml ? '📄' : '📄');
                    var descText = child.isHtml ? (child.htmlPages || []).length + ' 个 HTML 页面' : (child
                        .bookmarks || []).length + ' 个网址';
                    var actionsHtml = '';
                    if (isManageMode) {
                        actionsHtml =
                            '<div class="sub-actions visible"><button class="btn-icon" data-action="editSub">✏️</button><button class="btn-icon danger" data-action="deleteSub">🗑️</button></div>';
                    }
                    item.innerHTML =
                        '<div class="sub-icon">' + iconHtml2 + '</div><div class="sub-info"><div class="sub-name">' +
                        escapeHtml(child.name) + '</div><div class="sub-desc">' + descText +
                        '</div></div><div class="sub-right"><span class="sub-count">' + descText +
                        '</span><span class="arrow">→</span>' + actionsHtml + '</div>';
                    item.addEventListener('click', function(e) {
                        if (e.target.closest('button')) return;
                        if (child.isHtml) {
                            navigateTo('subsection', sectionId, child.id);
                        } else {
                            navigateTo('bookmarks', sectionId, child.id);
                        }
                    });
                    if (isManageMode) {
                        var editBtn = item.querySelector('[data-action="editSub"]');
                        if (editBtn) {
                            editBtn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                openEditSubModal(child.id, sectionId);
                            });
                        }
                        var delBtn = item.querySelector('[data-action="deleteSub"]');
                        if (delBtn) {
                            delBtn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                showConfirm('删除子分区「' + child.name + '」及其所有内容？', '确认删除')
                                    .then(function(ok) {
                                        if (ok) deleteSubSection(child.id, sectionId);
                                    });
                            });
                        }
                    }
                    list.appendChild(item);
                });

                renderSidebar();
                document.querySelectorAll('.sidebar-tree .node').forEach(function(el) {
                    el.classList.toggle('active', el.dataset.id === sectionId);
                });
            }

            async function deleteSubSection(subId, sectionId) {
                try {
                    var section = getSection(sectionId);
                    if (!section) return;
                    var child = section.children.find(function(c) { return c.id === subId; });
                    if (!child) return;
                    // 删除书签或 HTML 页面
                    if (child.isHtml) {
                        await supabase.from('html_pages').delete().eq('section_id', subId);
                    } else {
                        await supabase.from('bookmarks').delete().eq('section_id', subId);
                    }
                    await supabase.from('sections').delete().eq('id', subId);
                    section.children = section.children.filter(function(c) { return c.id !== subId; });
                    renderSection(sectionId);
                    showToast('已删除', 'success');
                } catch (err) {
                    showToast('删除失败', 'error');
                }
            }

            // ============================================================
            //  渲染：HTML 子分区
            // ============================================================
            function renderSubSection(subId, sectionId) {
                var section = getSection(sectionId);
                if (!section) { goBack(); return; }
                var sub = section.children.find(function(c) { return c.id === subId; });
                if (!sub) { goBack(); return; }

                var effectiveIsHtml = sub.isHtml || section.isHtmlParent;

                var iconHtml = sub.icon ? '<img src="' + sub.icon + '" alt="" />' : '📄';
                document.getElementById('subDetailIcon').innerHTML = iconHtml;
                document.getElementById('subDetailName').textContent = sub.name + (section.isHtmlParent ? ' 📄' : '');

                var metaText = effectiveIsHtml ? (sub.htmlPages || []).length + ' 个 HTML 页面' : '共 ' + (sub.bookmarks || [])
                    .length + ' 个网址';
                document.getElementById('subDetailMeta').textContent = metaText;

                var actions = document.getElementById('subDetailActions');
                actions.className = 'detail-actions' + (isManageMode ? ' visible' : '');

                var addHtmlBtn = document.getElementById('subAddHtmlPage');
                addHtmlBtn.style.display = effectiveIsHtml ? 'flex' : 'none';

                var contentContainer = document.getElementById('subSectionContent');
                contentContainer.innerHTML = '';

                if (effectiveIsHtml) {
                    var listContainer = document.createElement('div');
                    listContainer.className = 'bm-list';
                    var pages = sub.htmlPages || [];
                    if (pages.length === 0) {
                        listContainer.innerHTML =
                            '<div class="empty-state" style="padding:24px 20px;"><div class="empty-icon">📄</div><div class="empty-text">暂无 HTML 页面</div><div class="empty-sub">' +
                            (isManageMode ? '点击「添加 HTML 页面」创建' : '等待管理员添加') + '</div></div>';
                    } else {
                        pages.forEach(function(page, index) {
                            var item = document.createElement('div');
                            item.className = 'bm-item';
                            item.style.cursor = 'pointer';
                            var actionsHtml = '';
                            if (isManageMode) {
                                actionsHtml =
                                    '<div class="bm-actions visible"><button class="btn-icon" data-action="editHtmlPage" title="编辑">✏️</button><button class="btn-icon danger" data-action="deleteHtmlPage" title="删除">🗑️</button></div>';
                            }
                            item.innerHTML =
                                '<span class="bm-index">' + (index + 1) + '</span>' +
                                '<div class="bm-icon">📄</div>' +
                                '<div class="bm-info"><div class="bm-name">' + escapeHtml(page.name) +
                                '</div><div class="bm-url" style="font-size:0.6rem;">点击全屏查看</div></div>' +
                                '<div class="bm-right">' + actionsHtml + '</div>';
                            item.addEventListener('click', function(e) {
                                if (e.target.closest('button')) return;
                                openFullscreenHtml(page.content, page.name);
                            });
                            if (isManageMode) {
                                var editBtn = item.querySelector('[data-action="editHtmlPage"]');
                                if (editBtn) {
                                    editBtn.addEventListener('click', function(e) {
                                        e.stopPropagation();
                                        openEditHtmlPageModal(subId, sectionId, page.id);
                                    });
                                }
                                var delBtn = item.querySelector('[data-action="deleteHtmlPage"]');
                                if (delBtn) {
                                    delBtn.addEventListener('click', function(e) {
                                        e.stopPropagation();
                                        showConfirm('删除 HTML 页面「' + page.name + '」？',
                                            '确认删除').then(function(ok) {
                                                if (ok) deleteHtmlPage(subId, sectionId, page
                                                    .id);
                                            });
                                    });
                                }
                            }
                            listContainer.appendChild(item);
                        });
                    }
                    contentContainer.appendChild(listContainer);
                } else {
                    // 普通书签模式不应该到这里
                    navigateTo('bookmarks', sectionId, subId);
                }

                renderSidebar();
                document.querySelectorAll('.sidebar-tree .node').forEach(function(el) {
                    el.classList.toggle('active', el.dataset.id === subId);
                });
            }

            async function deleteHtmlPage(subId, sectionId, pageId) {
                try {
                    await supabase.from('html_pages').delete().eq('id', pageId);
                    var section = getSection(sectionId);
                    if (section) {
                        var sub = section.children.find(function(c) { return c.id === subId; });
                        if (sub && sub.htmlPages) {
                            sub.htmlPages = sub.htmlPages.filter(function(p) { return p.id !== pageId; });
                        }
                    }
                    renderSubSection(subId, sectionId);
                    showToast('已删除', 'success');
                } catch (err) {
                    showToast('删除失败', 'error');
                }
            }

            function openEditHtmlPageModal(subId, sectionId, pageId) {
                var section = getSection(sectionId);
                if (!section) { showToast('分区不存在', 'error'); return; }
                var sub = section.children.find(function(c) { return c.id === subId; });
                if (!sub) { showToast('子分区不存在', 'error'); return; }
                var page = (sub.htmlPages || []).find(function(p) { return p.id === pageId; });
                if (!page) { showToast('页面不存在', 'error'); return; }

                var fields = [
                    { id: 'page_name', label: '页面名称', type: 'text', value: page.name || '' },
                    { id: 'html_content', label: 'HTML 内容', type: 'textarea', value: page.content || '' }
                ];
                showModal('编辑 HTML 页面', fields, '保存', async function(results) {
                    var name = results.page_name.trim();
                    var content = results.html_content.trim();
                    if (!name) { showToast('请输入名称', 'error'); return; }
                    if (!content) { showToast('请输入 HTML 内容', 'error'); return; }
                    try {
                        await supabase.from('html_pages').update({ name: name, content: content }).eq('id', page
                        .id);
                        page.name = name;
                        page.content = content;
                        renderSubSection(subId, sectionId);
                        showToast('已更新', 'success');
                    } catch (err) {
                        showToast('更新失败', 'error');
                    }
                });
            }

            // ============================================================
            //  渲染：书签列表
            // ============================================================
            function renderBookmarks(subId, sectionId) {
                var section = getSection(sectionId);
                if (!section) { goBack(); return; }
                var sub = section.children.find(function(c) { return c.id === subId; });
                if (!sub) { goBack(); return; }
                if (sub.isHtml) {
                    navigateTo('subsection', sectionId, subId);
                    return;
                }

                var iconHtml = sub.icon ? '<img src="' + sub.icon + '" alt="" />' : '📄';
                document.getElementById('bmDetailIcon').innerHTML = iconHtml;
                document.getElementById('bmDetailName').textContent = sub.name;
                document.getElementById('bmDetailMeta').textContent = '共 ' + (sub.bookmarks || []).length + ' 个网址';

                document.getElementById('bmDetailActions').className = 'detail-actions' + (isManageMode ? ' visible' : '');

                var list = document.getElementById('bookmarkList');
                list.innerHTML = '';
                var bookmarks = sub.bookmarks || [];
                if (bookmarks.length === 0) {
                    list.innerHTML =
                        '<div class="empty-state" style="padding:24px 20px;"><div class="empty-icon">⭐</div><div class="empty-text">暂无书签</div></div>';
                    return;
                }
                bookmarks.forEach(function(bm, index) {
                    var item = document.createElement('div');
                    item.className = 'bm-item';
                    var starsHtml = '';
                    for (var i = 1; i <= 5; i++) { starsHtml += '<span class="' + (i <= bm.stars ? 'filled' :
                            '') + '">★</span>'; }
                    var vpnText = bm.requiresVpn ? '需VPN' : '无需VPN';
                    var vpnClass = bm.requiresVpn ? 'yes' : 'no';
                    var iconHtml2 = bm.icon ? '<img src="' + bm.icon + '" alt="" />' : '★';
                    var actionsHtml = '';
                    if (isManageMode) {
                        actionsHtml =
                            '<div class="bm-actions visible"><button class="btn-icon" data-action="moveUp" ' +
                            (index === 0 ? 'disabled style="opacity:0.2"' : '') + '>⬆</button><button class="btn-icon" data-action="moveDown" ' +
                            (index === bookmarks.length - 1 ? 'disabled style="opacity:0.2"' : '') +
                            '>⬇</button><button class="btn-icon" data-action="editBookmark">✏️</button><button class="btn-icon danger" data-action="deleteBookmark">🗑️</button></div>';
                    }
                    item.innerHTML =
                        '<span class="bm-index">' + (index + 1) + '</span><div class="bm-icon">' + iconHtml2 +
                        '</div><div class="bm-info"><a href="' + escapeHtml(bm.url) +
                        '" target="_blank" class="bm-name">' + escapeHtml(bm.name) +
                        ' ↗</a><span class="bm-url">' + escapeHtml(bm.url) + '</span>' + (bm.description ?
                            '<div class="bm-desc">' + escapeHtml(bm.description) + '</div>' : '') +
                        '</div><div class="bm-right"><div class="stars">' + starsHtml +
                        '</div><span class="vpn-badge ' + vpnClass + '">' + vpnText + '</span>' + actionsHtml +
                        '</div>';
                    item.addEventListener('click', function(e) {
                        if (e.target.closest('a') || e.target.closest('button')) return;
                        window.open(bm.url, '_blank');
                    });
                    if (isManageMode) {
                        var upBtn = item.querySelector('[data-action="moveUp"]');
                        if (upBtn) {
                            upBtn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                if (index > 0) {
                                    var temp = bookmarks[index];
                                    bookmarks[index] = bookmarks[index - 1];
                                    bookmarks[index - 1] = temp;
                                    saveBookmarksOrder(subId);
                                    renderBookmarks(subId, sectionId);
                                }
                            });
                        }
                        var downBtn = item.querySelector('[data-action="moveDown"]');
                        if (downBtn) {
                            downBtn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                if (index < bookmarks.length - 1) {
                                    var temp = bookmarks[index];
                                    bookmarks[index] = bookmarks[index + 1];
                                    bookmarks[index + 1] = temp;
                                    saveBookmarksOrder(subId);
                                    renderBookmarks(subId, sectionId);
                                }
                            });
                        }
                        var editBtn = item.querySelector('[data-action="editBookmark"]');
                        if (editBtn) {
                            editBtn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                openEditBookmarkModal(bm.id, subId);
                            });
                        }
                        var delBtn = item.querySelector('[data-action="deleteBookmark"]');
                        if (delBtn) {
                            delBtn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                showConfirm('删除书签「' + bm.name + '」？', '确认删除').then(function(ok) {
                                    if (ok) deleteBookmark(bm.id, subId);
                                });
                            });
                        }
                    }
                    list.appendChild(item);
                });

                renderSidebar();
                document.querySelectorAll('.sidebar-tree .node').forEach(function(el) {
                    el.classList.toggle('active', el.dataset.id === subId);
                });
            }

            async function saveBookmarksOrder(subId) {
                try {
                    var section = getSection(currentSectionId);
                    if (!section) return;
                    var sub = section.children.find(function(c) { return c.id === subId; });
                    if (!sub) return;
                    var bookmarks = sub.bookmarks || [];
                    for (var i = 0; i < bookmarks.length; i++) {
                        await supabase.from('bookmarks').update({ sort_order: i }).eq('id', bookmarks[i].id);
                    }
                } catch (err) {
                    console.error('保存排序失败:', err);
                }
            }

            async function deleteBookmark(bmId, subId) {
                try {
                    await supabase.from('bookmarks').delete().eq('id', bmId);
                    var section = getSection(currentSectionId);
                    if (section) {
                        var sub = section.children.find(function(c) { return c.id === subId; });
                        if (sub && sub.bookmarks) {
                            sub.bookmarks = sub.bookmarks.filter(function(b) { return b.id !== bmId; });
                        }
                    }
                    renderBookmarks(subId, currentSectionId);
                    showToast('已删除', 'success');
                } catch (err) {
                    showToast('删除失败', 'error');
                }
            }

            function openEditBookmarkModal(bmId, subId) {
                var section = getSection(currentSectionId);
                if (!section) { showToast('分区不存在', 'error'); return; }
                var sub = section.children.find(function(c) { return c.id === subId; });
                if (!sub) { showToast('子分区不存在', 'error'); return; }
                var bm = (sub.bookmarks || []).find(function(b) { return b.id === bmId; });
                if (!bm) { showToast('书签不存在', 'error'); return; }

                var fields = [
                    { id: 'bm_name', label: '名称', type: 'text', value: bm.name || '' },
                    { id: 'bm_url', label: '网址', type: 'text', value: bm.url || '' },
                    { id: 'bm_desc', label: '介绍', type: 'textarea', value: bm.description || '' },
                    { id: 'bm_stars', label: '星级 (1-5)', type: 'text', value: String(bm.stars || 3) },
                    { id: 'bm_vpn', label: 'VPN', type: 'select', value: bm.requiresVpn ? 'yes' : 'no',
                        options: [{ value: 'no', label: '无需' }, { value: 'yes', label: '需要' }] }
                ];
                showModal('编辑书签', fields, '保存', async function(results) {
                    var name = results.bm_name.trim();
                    var url = results.bm_url.trim();
                    if (!name || !url) { showToast('请填写名称和网址', 'error'); return; }
                    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                    var stars = parseInt(results.bm_stars) || 3;
                    if (stars < 1) stars = 1;
                    if (stars > 5) stars = 5;
                    var vpn = results.bm_vpn === 'yes';
                    try {
                        await supabase.from('bookmarks').update({
                            name: name,
                            url: url,
                            description: results.bm_desc || '',
                            stars: stars,
                            requires_vpn: vpn
                        }).eq('id', bmId);
                        bm.name = name;
                        bm.url = url;
                        bm.description = results.bm_desc || '';
                        bm.stars = stars;
                        bm.requiresVpn = vpn;
                        renderBookmarks(subId, currentSectionId);
                        showToast('已更新', 'success');
                    } catch (err) {
                        showToast('更新失败', 'error');
                    }
                });
            }

            // ============================================================
            //  全屏 HTML
            // ============================================================
            function openFullscreenHtml(htmlContent, title) {
                var overlay = document.getElementById('fullscreenHtmlOverlay');
                var iframe = document.getElementById('fsHtmlIframe');
                var titleEl = document.getElementById('fsHtmlTitle');
                titleEl.textContent = title || 'HTML 页面';
                iframe.srcdoc = htmlContent;
                overlay.classList.add('open');

                var closeBtn = document.getElementById('fsHtmlClose');
                var closeHandler = function() {
                    overlay.classList.remove('open');
                    iframe.srcdoc = '';
                    closeBtn.removeEventListener('click', closeHandler);
                    overlay.removeEventListener('click', overlayClick);
                    document.removeEventListener('keydown', keyHandler);
                };
                var overlayClick = function(e) {
                    if (e.target === overlay) closeHandler();
                };
                var keyHandler = function(e) {
                    if (e.key === 'Escape') closeHandler();
                };
                closeBtn.addEventListener('click', closeHandler);
                overlay.addEventListener('click', overlayClick);
                document.addEventListener('keydown', keyHandler);
            }

            // ============================================================
            //  管理：添加分类/子分区
            // ============================================================
            async function addSection() {
                var parentOptions = [{ value: '', label: '（根级）' }];
                sections.forEach(function(s) { parentOptions.push({ value: s.id, label: s.name }); });
                var fields = [
                    { id: 'sec_name', label: '分类名称', type: 'text', value: '' },
                    { id: 'sec_parent', label: '父分区', type: 'select', value: '', options: parentOptions },
                    { id: 'sec_isHtml', label: 'HTML 模式（子分区只能导入 HTML）', type: 'checkbox', value: false }
                ];
                showModal('新建分类', fields, '创建', async function(results) {
                    var name = results.sec_name.trim();
                    if (!name) { showToast('请输入名称', 'error'); return; }
                    var parentId = results.sec_parent || '';
                    var isHtmlParent = results.sec_isHtml === true;
                    try {
                        var newSec = {
                            id: generateId(),
                            name: name,
                            icon: '',
                            isHtmlParent: isHtmlParent,
                            parent_id: parentId || null,
                            sort_order: sections.length,
                            children: []
                        };
                        var { data, error } = await supabase.from('sections').insert({
                            id: newSec.id,
                            name: newSec.name,
                            icon: newSec.icon,
                            is_html_parent: newSec.isHtmlParent,
                            parent_id: newSec.parent_id,
                            sort_order: newSec.sort_order
                        }).select();
                        if (error) throw error;
                        // 添加首页引用
                        await supabase.from('home_items').insert({
                            id: generateId(),
                            type: 'section_ref',
                            section_id: newSec.id,
                            sort_order: homeItems.length
                        });
                        sections.push(newSec);
                        homeItems.push({ id: generateId(), type: 'section_ref', section_id: newSec.id });
                        renderHome();
                        showToast('分类已创建' + (isHtmlParent ? '（HTML 模式）' : ''), 'success');
                    } catch (err) {
                        showToast('创建失败: ' + err.message, 'error');
                    }
                });
            }

            async function addSubSection(sectionId) {
                var sec = getSection(sectionId);
                if (!sec) { showToast('分区不存在', 'error'); return; }
                var isForcedHtml = sec.isHtmlParent || false;
                var fields = [
                    { id: 'sub_name', label: '子分区名称', type: 'text', value: '' },
                ];
