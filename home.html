<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 发现好网址</title>

    <!-- 网站图标（favicon）使用新的黑色 Logo SVG -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #3ecf8e;
            --primary-dark: #2bb673;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: #3ecf8e;
            --error: #ff6b6b;
            --success: #3ecf8e;
            --google-bg: #ffffff;
            --google-text: #3c4043;
            --google-hover: #f8f9fa;
            --sidebar-width: 240px;
            --sidebar-collapsed-width: 64px;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            overflow-x: hidden;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            transition: width var(--transition), padding var(--transition);
            z-index: 100;
            overflow: hidden;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
            padding: 20px 8px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            padding: 0 8px;
            min-height: 40px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(62, 207, 142, 0.3);
        }
        .logo-icon svg {
            width: 26px;
            height: 18px;
            fill: #000;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.2s ease;
        }
        .sidebar.collapsed .logo-text {
            opacity: 0;
            width: 0;
        }

        .sidebar-toggle {
            position: absolute;
            top: 20px;
            right: -12px;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: transform var(--transition);
            z-index: 101;
        }
        .sidebar-toggle svg {
            width: 14px;
            height: 14px;
            fill: #0f0c29;
            transition: transform 0.3s ease;
        }
        .sidebar.collapsed .sidebar-toggle svg {
            transform: rotate(180deg);
        }

        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        .nav-item.active {
            background: rgba(62, 207, 142, 0.15);
            color: var(--primary);
            box-shadow: inset 0 0 0 1px rgba(62, 207, 142, 0.3);
        }
        .nav-item svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            fill: currentColor;
        }
        .sidebar.collapsed .nav-item span {
            opacity: 0;
            width: 0;
        }

        .sidebar-footer {
            border-top: 1px solid var(--card-border);
            padding-top: 16px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.04);
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #0f0c29;
        }
        .user-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .user-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-email {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar.collapsed .user-details {
            display: none;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
        }
        .logout-btn:hover {
            background: rgba(255, 107, 107, 0.12);
            color: #ffb3b3;
        }
        .logout-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }
        .sidebar.collapsed .logout-btn span {
            display: none;
        }

        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 30px 36px;
            transition: margin-left var(--transition);
            min-height: 100vh;
            width: calc(100% - var(--sidebar-width));
        }
        .main-content.expanded {
            margin-left: var(--sidebar-collapsed-width);
            width: calc(100% - var(--sidebar-collapsed-width));
        }

        /* 顶部栏 */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 13px 16px 13px 42px;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: all var(--transition);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-box input:focus {
            border-color: var(--input-focus);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(62, 207, 142, 0.15);
        }
        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        .submit-btn {
            padding: 10px 22px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), #2bb673);
            color: #0f0c29;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
            box-shadow: 0 4px 12px rgba(62, 207, 142, 0.3);
            white-space: nowrap;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(62, 207, 142, 0.5);
        }
        .submit-btn svg {
            width: 16px;
            height: 16px;
            fill: #0f0c29;
        }

        /* 视图容器 */
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        /* 卡片列表 */
        .card-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .url-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 22px;
            transition: all var(--transition);
            animation: fadeInUp 0.4s ease-out;
            display: flex;
            flex-direction: column;
        }
        .url-card:hover {
            border-color: rgba(62, 207, 142, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }
        .card-title a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition);
        }
        .card-title a:hover {
            color: var(--primary);
        }
        .card-domain {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .card-actions {
            display: flex;
            gap: 6px;
        }
        .card-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition);
            color: var(--text-muted);
        }
        .card-action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--primary);
        }
        .card-action-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .card-action-btn.active {
            color: var(--primary);
        }

        .card-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 12px;
            color: var(--text-muted);
        }
        .card-submitter {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .submitter-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(62, 207, 142, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--primary);
        }
        .card-tags {
            display: flex;
            gap: 6px;
        }
        .tag {
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 15px;
        }

        /* 草稿列表样式 */
        .draft-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .draft-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
        }
        .draft-info {
            flex: 1;
        }
        .draft-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .draft-time {
            font-size: 12px;
            color: var(--text-muted);
        }
        .draft-actions {
            display: flex;
            gap: 8px;
        }

        /* 设置表单 */
        .settings-form {
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
        }
        .avatar-upload {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }
        .avatar-upload-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px dashed var(--primary);
            background: none;
            color: var(--primary);
            cursor: pointer;
        }

        /* 审核视图 */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .admin-tab {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--input-border);
            background: none;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .admin-tab.active {
            background: var(--primary);
            color: #0f0c29;
            border-color: var(--primary);
        }
        .admin-post-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
        }
        .admin-post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .admin-post-title {
            font-weight: 600;
        }
        .admin-post-actions {
            display: flex;
            gap: 8px;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
        .btn-approve {
            background: var(--primary);
            color: #0f0c29;
        }
        .btn-reject {
            background: rgba(255, 107, 107, 0.2);
            color: #ffb3b3;
        }
        .btn-detail {
            background: rgba(255,255,255,0.1);
            color: var(--text-secondary);
        }
        .admin-post-desc {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .admin-post-content {
            margin-top: 10px;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            display: none;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
        }
        .admin-post-content.show {
            display: block;
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 20px 16px;
            }
            .sidebar {
                width: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <div class="sidebar-header">
            <div class="logo-icon">
                <svg viewBox="0 0 1000 720" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(500, 360) scale(1.85) translate(-500, -360)">
                        <path d="M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z" fill="#000000" fill-rule="evenodd" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="484" y="273" width="32" height="100" rx="10" fill="#000000"/>
                        <rect x="488" y="383" width="24" height="24" rx="8" fill="#000000"/>
                    </g>
                </svg>
            </div>
            <span class="logo-text">必看</span>
        </div>

        <nav class="nav-section">
            <button class="nav-item active" data-view="home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>首页</span>
            </button>
            <button class="nav-item" data-view="favorites">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span>我的收藏</span>
            </button>
            <button class="nav-item" data-view="drafts">
                <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                <span>草稿</span>
            </button>
            <button class="nav-item" data-view="settings">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.31.59.22l2.39-.96c.49.37 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54a7.03 7.03 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                <span>设置</span>
            </button>
            <!-- 管理员审核入口（仅管理员可见） -->
            <button class="nav-item" id="adminReviewItem" data-view="admin" style="display: none;">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <span>审核分区</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <div class="user-info" id="userInfo">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <span class="user-name" id="sidebarUserName">加载中...</span>
                    <span class="user-email" id="sidebarUserEmail"></span>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">
                <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                <span>退出登录</span>
            </button>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
        <!-- 首页视图 -->
        <div class="view active" id="view-home">
            <div class="top-bar">
                <div class="search-box">
                    <input type="text" id="homeSearchInput" placeholder="搜索网址、标签或描述..." />

            // 侧边栏折叠

                const userName = document.getElementById('sidebarUserName');
                const userEmail = document.getElementById('sidebarUserEmail');
                const adminItem = document.getElementById('adminReviewItem');
                if (user) {
                    const email = user.email || '';

            // 加载收藏列表
            async function loadFavorites() {
                if (!supabase || !currentUser) return [];
                try {
                    const { data, error } = await supabase
                        .from('favorites')
                        .select('website_id')
                        .eq('user_id', currentUser.id);
                    if (error) throw error;
                    return data.map(item => item.website_id);
                } catch (err) {
                    console.error('加载收藏失败:', err);
                    return [];
                }
            }

            // 渲染卡片（通用）
            function renderCards(data, containerId, favoritesSet) {
                const container = document.getElementById(containerId);
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="empty-state">暂无内容</div>';
                    return;
                }
                container.innerHTML = data.map(item => {
                    let domain = '';
                    try { if (item.url) domain = new URL(item.url).hostname; } catch(e) {}
                    const isAnonymous = item.is_anonymous;
                    const submitterDisplay = isAnonymous ? '匿名用户' : (item.submitter_name || '用户');
                    const avatarText = isAnonymous ? '匿' : (submitterDisplay.charAt(0) || 'U');
                    const date = item.created_at ? new Date(item.created_at).toLocaleDateString() : '';
                    const tagsHtml = item.tags && item.tags.length ? item.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';
                    const isFav = favoritesSet.has(item.id);
                    return `
                    <div class="url-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title"><a href="${item.url || '#'}" target="_blank">${item.title}</a></div>
                                ${domain ? `<div class="card-domain">${domain}</div>` : ''}
                            </div>
                            <div class="card-actions">
                                <button class="card-action-btn fav-btn ${isFav ? 'active' : ''}" data-id="${item.id}" title="收藏">
                                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                </button>
                                <button class="card-action-btn" title="复制链接">
                                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="card-description">${item.description || ''}</div>
                        <div class="card-footer">
                            <div class="card-submitter">
                                <div class="submitter-avatar">${avatarText}</div>
                                <span>${submitterDisplay}</span>
                                ${date ? `<span>·</span><span>${date}</span>` : ''}
                            </div>
                            <div class="card-tags">${tagsHtml}</div>
                        </div>
                    </div>
                    `;
                }).join('');

                // 绑定收藏按钮事件
                container.querySelectorAll('.fav-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.preventDefault();
                        const websiteId = btn.dataset.id;
                        await toggleFavorite(websiteId);
                    });
                });
            }

            // 切换收藏状态
            async function toggleFavorite(websiteId) {
                if (!currentUser) return;
                const isFav = userFavorites.includes(websiteId);
                try {
                    if (isFav) {
                        await supabase.from('favorites').delete().eq('user_id', currentUser.id).eq('website_id', websiteId);
                        userFavorites = userFavorites.filter(id => id !== websiteId);
                    } else {
                        await supabase.from('favorites').insert({ user_id: currentUser.id, website_id: websiteId });
                        userFavorites.push(websiteId);
                    }
                    // 刷新当前视图
                    const activeView = document.querySelector('.view.active').id;
                    if (activeView === 'view-home') loadHomeWebsites();
                    if (activeView === 'view-favorites') loadFavoriteWebsites();
                } catch (err) {
                    console.error('收藏操作失败:', err);
                    showToast('操作失败');
                }
            }

            // 加载首页已审核帖子
            async function loadHomeWebsites() {
                const container = document.getElementById('homeCardList');
                container.innerHTML = '<div class="empty-state">加载中...</div>';
                try {
                    const { data, error } = await supabase
                        .from('websites')
                        .select('*')
                        .eq('status', 'approved')
                        .order('created_at', { ascending: false });
                    if (error) throw error;
                    renderCards(data, 'homeCardList', new Set(userFavorites));
                } catch (err) {
                    console.error('加载首页失败:', err);
                    container.innerHTML = '<div class="empty-state">加载失败</div>';
                }
            }

            // 加载收藏的帖子
            async function loadFavoriteWebsites() {
                const container = document.getElementById('favoritesCardList');
                container.innerHTML = '<div class="empty-state">加载中...</div>';
                if (userFavorites.length === 0) {
                    container.innerHTML = '<div class="empty-state">暂无收藏</div>';
                    return;
                }
                try {
                    const { data, error } = await supabase
                        .from('websites')
                        .select('*')
                        .in('id', userFavorites)
                        .eq('status', 'approved')
                        .order('created_at', { ascending: false });
                    if (error) throw error;
                    renderCards(data, 'favoritesCardList', new Set(userFavorites));
                } catch (err) {
                    console.error('加载收藏失败:', err);
                    container.innerHTML = '<div class="empty-state">加载失败</div>';
                }
            }

            // 加载草稿列表
            function loadDrafts() {
                const container = document.getElementById('draftList');
                const drafts = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('draft_')) {
                        try {
                            const draft = JSON.parse(localStorage.getItem(key));
                            draft.id = key;
                            drafts.push(draft);
                        } catch (e) {}
                    }
                }
                drafts.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                if (drafts.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-muted);">暂无草稿</p>';
                    return;
                }
                container.innerHTML = drafts.map(d => `
                    <div class="draft-item">
                        <div class="draft-info">
                            <div class="draft-title">${d.meta.title || '未命名草稿'}</div>
                            <div class="draft-time">${new Date(d.timestamp).toLocaleString()}</div>
                        </div>
                        <div class="draft-actions">
                            <button class="btn btn-sm btn-secondary" onclick="editDraft('${d.id}')">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteDraft('${d.id}')">删除</button>
                        </div>
                    </div>
                `).join('');
            }

            function editDraft(draftId) {
                // 跳转 submit.html 并传递 draftId 参数（submit.html 需要支持读取该参数加载草稿）
                window.location.href = `submit.html?draftId=${draftId}`;
            }

            function deleteDraft(draftId) {
                localStorage.removeItem(draftId);
                loadDrafts();
                showToast('草稿已删除');
            }

            // 设置视图
            async function loadSettings() {
                if (!currentUser) return;
                document.getElementById('nicknameInput').value = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || '';
                const avatarUrl = currentUser.user_metadata?.avatar_url || '';
                document.getElementById('avatarPreview').src = avatarUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.email)}&background=3ecf8e&color=fff`;
            }

            document.getElementById('avatarUploadBtn').addEventListener('click', () => {
                document.getElementById('avatarFileInput').click();
            });

            document.getElementById('avatarFileInput').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    const fileExt = file.name.split('.').pop();
                    const path = `avatars/${currentUser.id}.${fileExt}`;
                    const { error: uploadError } = await supabase.storage.from('media').upload(path, file, { upsert: true });
                    if (uploadError) throw uploadError;
                    const { data: urlData } = supabase.storage.from('media').getPublicUrl(path);
                    const avatarUrl = urlData.publicUrl;
                    document.getElementById('avatarPreview').src = avatarUrl;
                    // 更新用户元数据
                    const { error: updateError } = await supabase.auth.updateUser({ data: { avatar_url: avatarUrl } });
                    if (updateError) throw updateError;
                    currentUser = (await supabase.auth.getUser()).data.user;
                    updateUserUI(currentUser);
                    showToast('头像更新成功');
                } catch (err) {
                    console.error('头像上传失败:', err);
                    showToast('头像上传失败');
                }
                e.target.value = '';
            });

            document.getElementById('saveProfileBtn').addEventListener('click', async () => {
                const nickname = document.getElementById('nicknameInput').value.trim();
                if (!nickname) { showToast('昵称不能为空'); return; }
                try {
                    const { error } = await supabase.auth.updateUser({ data: { full_name: nickname } });
                    if (error) throw error;
                    currentUser = (await supabase.auth.getUser()).data.user;
                    updateUserUI(currentUser);
                    showToast('昵称更新成功');
                } catch (err) {
                    console.error('昵称更新失败:', err);
                    showToast('更新失败');
                }
            });

            // 审核视图
            let adminCurrentStatus = 'pending';
            async function loadAdminPosts(status) {
                const container = document.getElementById('adminPostList');
                container.innerHTML = '<p>加载中...</p>';
                try {
                    const { data, error } = await supabase
                        .from('websites')
                        .select('*')
                        .eq('status', status)
                        .order('created_at', { ascending: false });
                    if (error) throw error;
                    if (data.length === 0) {
                        container.innerHTML = '<p style="color:var(--text-muted);">暂无内容</p>';
                        return;
                    }
                    container.innerHTML = data.map(post => `
                        <div class="admin-post-item">
                            <div class="admin-post-header">
                                <div class="admin-post-title">${post.title}</div>
                                <div class="admin-post-actions">
                                    <button class="btn btn-sm btn-detail" onclick="toggleAdminContent('${post.id}')">详情</button>
                                    ${status === 'pending' ? `
                                    <button class="btn btn-sm btn-approve" onclick="approvePost('${post.id}')">通过</button>
                                    <button class="btn btn-sm btn-reject" onclick="rejectPost('${post.id}')">拒绝</button>` : ''}
                                </div>
                            </div>
                            <div class="admin-post-desc">${post.description || ''}</div>
                            <div class="admin-post-content" id="adminContent-${post.id}"></div>
                        </div>
                    `).join('');
                } catch (err) {
                    console.error('加载审核列表失败:', err);
                    container.innerHTML = '<p>加载失败</p>';
                }
            }

            function toggleAdminContent(postId) {
                const contentDiv = document.getElementById(`adminContent-${postId}`);
                if (!contentDiv.classList.contains('show')) {
                    // 加载内容
                    const post = allAdminPosts.find(p => p.id === postId);
                    if (post && !contentDiv.innerHTML) {
                        contentDiv.innerHTML = post.content || '无内容';
                    }
                }
                contentDiv.classList.toggle('show');
            }

            async function approvePost(postId) {
                try {
                    const { error } = await supabase.from('websites').update({ status: 'approved' }).eq('id', postId);
                    if (error) throw error;
                    showToast('已通过');
                    loadAdminPosts(adminCurrentStatus);
                } catch (err) {
                    console.error('审核通过失败:', err);
                    showToast('操作失败');
                }
            }

            async function rejectPost(postId) {
                try {
                    // 删除文件
                    const post = allAdminPosts.find(p => p.id === postId);
                    if (post && post.file_map) {
                        for (const [id, info] of Object.entries(post.file_map)) {
                            const path = info.url.split('/').pop(); // 需要完整路径，但 file_map 存储的是 url，需要调整
                            // 这里简化处理，实际需要从 url 提取 bucket 内的路径
                        }
                    }
                    const { error } = await supabase.from('websites').update({ status: 'rejected' }).eq('id', postId);
                    if (error) throw error;
                    showToast('已拒绝');
                    loadAdminPosts(adminCurrentStatus);
                } catch (err) {
                    console.error('审核拒绝失败:', err);
                    showToast('操作失败');
                }
            }

            // 视图切换
            function switchView(viewName) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(`view-${viewName}`).classList.add('active');
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                document.querySelector(`.nav-item[data-view="${viewName}"]`).classList.add('active');
                // 根据视图加载数据
                if (viewName === 'home') loadHomeWebsites();
                if (viewName === 'favorites') loadFavoriteWebsites();
                if (viewName === 'drafts') loadDrafts();
                if (viewName === 'settings') loadSettings();
                if (viewName === 'admin') loadAdminPosts(adminCurrentStatus);
            }

            document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
                btn.addEventListener('click', () => switchView(btn.dataset.view));
            });

            // 审核标签切换
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    adminCurrentStatus = tab.dataset.status;
                    loadAdminPosts(adminCurrentStatus);
                });
            });

            // 首页搜索
            document.getElementById('homeSearchInput').addEventListener('input', function() {
                const query = this.value.trim().toLowerCase();
                // 简单实现：从已渲染的卡片中过滤（更优方案是重新查询，此处简化）
                const cards = document.querySelectorAll('#homeCardList .url-card');
                cards.forEach(card => {
                    const text = card.textContent.toLowerCase();
                    card.style.display = text.includes(query) ? '' : 'none';
                });
            });

            // 收藏搜索类似
            document.getElementById('favoritesSearchInput').addEventListener('input', function() {
                const query = this.value.trim().toLowerCase();
                const cards = document.querySelectorAll('#favoritesCardList .url-card');
                cards.forEach(card => {
                    const text = card.textContent.toLowerCase();
                    card.style.display = text.includes(query) ? '' : 'none';
                });
            });

            // Toast 提示
            function showToast(message) {
                const toast = document.createElement('div');
                toast.textContent = message;
                toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(30,30,50,0.95);color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;z-index:999;';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            }

            // 初始化
            async function init() {
                if (!supabase) {
                    window.location.href = 'index.html';
                    return;
                }
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    window.location.href = 'index.html';
                    return;
                }
                currentUser = user;
                updateUserUI(user);
                userFavorites = await loadFavorites();
                await loadHomeWebsites();
                // 如果管理员，显示审核入口
                if (user.email === ADMIN_EMAIL) {
                    document.getElementById('adminReviewItem').style.display = 'flex';
                }
            }
            init();

            // 暴露全局函数
            window.toggleSidebar = toggleSidebar;
            window.logout = logout;
            window.editDraft = editDraft;
            window.deleteDraft = deleteDraft;
            window.toggleAdminContent = toggleAdminContent;
            window.approvePost = approvePost;
            window.rejectPost = rejectPost;
            window.switchView = switchView;
            // 保持 allAdminPosts 全局可访问（用于详情展开）
            window.allAdminPosts = [];
            // 更新 allAdminPosts 引用
            const originalLoadAdminPosts = loadAdminPosts;
            loadAdminPosts = async function(status) {
                adminCurrentStatus = status;
                const container = document.getElementById('adminPostList');
                container.innerHTML = '<p>加载中...</p>';
                try {
                    const { data, error } = await supabase
                        .from('websites')
                        .select('*')
                        .eq('status', status)
                        .order('created_at', { ascending: false });
                    if (error) throw error;
                    allAdminPosts = data;
                    if (data.length === 0) {
                        container.innerHTML = '<p style="color:var(--text-muted);">暂无内容</p>';
                        return;
                    }
                    container.innerHTML = data.map(post => `
                        <div class="admin-post-item">
                            <div class="admin-post-header">
                                <div class="admin-post-title">${post.title}</div>
                                <div class="admin-post-actions">
                                    <button class="btn btn-sm btn-detail" onclick="toggleAdminContent('${post.id}')">详情</button>
                                    ${status === 'pending' ? `
                                    <button class="btn btn-sm btn-approve" onclick="approvePost('${post.id}')">通过</button>
                                    <button class="btn btn-sm btn-reject" onclick="rejectPost('${post.id}')">拒绝</button>` : ''}
                                </div>
                            </div>
                            <div class="admin-post-desc">${post.description || ''}</div>
                            <div class="admin-post-content" id="adminContent-${post.id}"></div>
                        </div>
                    `).join('');
                } catch (err) {
                    console.error('加载审核列表失败:', err);
                    container.innerHTML = '<p>加载失败</p>';
                }
            };
            // 重新绑定审核标签事件（因为 loadAdminPosts 被重写）
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.removeEventListener('click', tabClickHandler);
                tab.addEventListener('click', tabClickHandler);
            });
            function tabClickHandler() {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                loadAdminPosts(this.dataset.status);
            }
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', tabClickHandler);
            });

            // 确保切换视图时调用 loadAdminPosts
            const originalSwitchView = switchView;
            switchView = function(viewName) {
                originalSwitchView(viewName);
                if (viewName === 'admin') {
                    loadAdminPosts(adminCurrentStatus);
                }
            };
            window.switchView = switchView;
        })();
    </script>
</body>
</html>
