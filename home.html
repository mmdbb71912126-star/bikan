<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <!-- Supabase JS SDK -->

    <style>
        :root {
            --primary: #3ecf8e;
            --primary-dark: #2bb673;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: #3ecf8e;
            --error: #ff6b6b;
            --success: #3ecf8e;
            --google-bg: #ffffff;
            --google-text: #3c4043;
            --google-hover: #f8f9fa;
            --sidebar-width: 240px;
            --sidebar-collapsed-width: 64px;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            overflow-x: hidden;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            transition: width var(--transition), padding var(--transition);
            z-index: 100;
            overflow: hidden;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
            padding: 20px 8px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            padding: 0 8px;
            min-height: 40px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(62, 207, 142, 0.3);
        }
        .logo-icon svg {
            width: 26px;
            height: 18px;
            fill: #000;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
            opacity: 1;
            transition: opacity 0.2s ease;
        }
        .sidebar.collapsed .logo-text {
            opacity: 0;
            width: 0;
        }

        .sidebar-toggle {
            position: absolute;
            top: 20px;
            right: -12px;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: transform var(--transition);
            z-index: 101;
        }
        .sidebar-toggle svg {
            width: 14px;
            height: 14px;
            fill: #0f0c29;
            transition: transform 0.3s ease;
        }
        .sidebar.collapsed .sidebar-toggle svg {
            transform: rotate(180deg);
        }

        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        .nav-item.active {
            background: rgba(62, 207, 142, 0.15);
            color: var(--primary);
            box-shadow: inset 0 0 0 1px rgba(62, 207, 142, 0.3);
        }
        .nav-item svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            fill: currentColor;
        }
        .sidebar.collapsed .nav-item span {
            opacity: 0;
            width: 0;
        }

        .sidebar-footer {
            border-top: 1px solid var(--card-border);
            padding-top: 16px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.04);
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #0f0c29;
        }
        .user-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .user-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-email {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar.collapsed .user-details {
            display: none;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
        }
        .logout-btn:hover {
            background: rgba(255, 107, 107, 0.12);
            color: #ffb3b3;
        }
        .logout-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }
        .sidebar.collapsed .logout-btn span {
            display: none;
        }

        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 30px 36px;
            transition: margin-left var(--transition);
            min-height: 100vh;
            width: calc(100% - var(--sidebar-width));
        }
        .main-content.expanded {
            margin-left: var(--sidebar-collapsed-width);
            width: calc(100% - var(--sidebar-collapsed-width));
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 13px 16px 13px 42px;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: var(--radius-sm);
            outline: none;
            transition: all var(--transition);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-box input:focus {
            border-color: var(--input-focus);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(62, 207, 142, 0.15);
        }
        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        .submit-btn {
            padding: 10px 22px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), #2bb673);
            color: #0f0c29;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
            box-shadow: 0 4px 12px rgba(62, 207, 142, 0.3);
            white-space: nowrap;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(62, 207, 142, 0.5);
        }
        .submit-btn svg {
            width: 16px;
            height: 16px;
            fill: #0f0c29;
        }

        /* ========== 卡片列表 ========== */
        .card-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .url-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 22px;
            transition: all var(--transition);
            animation: fadeInUp 0.4s ease-out;
            display: flex;
            flex-direction: column;
        }
        .url-card:hover {
            border-color: rgba(62, 207, 142, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }
        .card-title a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition);
        }
        .card-title a:hover {
            color: var(--primary);
        }
        .card-domain {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .card-actions {
            display: flex;
            gap: 6px;
        }
        .card-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition);
        }
        .card-action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .card-action-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
            transition: fill var(--transition);
        }
        .card-action-btn:hover svg {
            fill: var(--primary);
        }

        .card-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 12px;
            color: var(--text-muted);
        }
        .card-submitter {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .submitter-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(62, 207, 142, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--primary);
        }
        .card-tags {
            display: flex;
            gap: 6px;
        }
        .tag {
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 15px;
        }
    </style>
</head>

    <script>
        // Supabase 配置
        const SUPABASE_URL = 'https://qziqskgvzabuynduyuqy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6aXFza2d2emFidXluZHV5dXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg4ODQsImV4cCI6MjEwMjQ0NDg4NH0.-LYORLfz-xpr1dMD_T-P8LzvgqTJngc0Hd52wSORhXs';

        const ADMIN_EMAIL = '3948677391@qq.com';

        let supabase;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error('Supabase 初始化失败:', err);
            // 即使初始化失败，也尝试继续渲染 mock 数据，但用户信息可能无法加载
        }

        let currentUser = null;

        // 侧边栏折叠
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('mainContent');
            sidebar.classList.toggle('collapsed');
            main.classList.toggle('expanded');
        }

        // 退出登录
        async function logout() {
            try {
                if (supabase) {
                    await supabase.auth.signOut();
                }
                window.location.href = 'index.html';
            } catch (err) {
                console.error('退出失败:', err);
                // 即使退出失败也强制跳转
                window.location.href = 'index.html';
            }
        }

        // 检查管理员
        function isAdmin(email) {
            return email === ADMIN_EMAIL;
        }

        // 更新侧边栏用户信息
        function updateUserUI(user) {
            const avatar = document.getElementById('userAvatar');
            const userName = document.getElementById('sidebarUserName');
            const userEmail = document.getElementById('sidebarUserEmail');
            const adminItem = document.getElementById('adminReviewItem');

            if (user) {
                const email = user.email || '';
                const name = user.user_metadata?.full_name || user.user_metadata?.name || email.split('@')[0] || '用户';
                userName.textContent = name;
                userEmail.textContent = email;
                avatar.textContent = name.charAt(0).toUpperCase();

                // 显示/隐藏审核入口
                if (isAdmin(email)) {
                    adminItem.style.display = 'flex';
                } else {
                    adminItem.style.display = 'none';
                }
            } else {
                userName.textContent = '未登录';
                userEmail.textContent = '';
                avatar.textContent = '?';
                adminItem.style.display = 'none';
            }
        }

        // 加载示例数据（后续可替换为 Supabase 查询）
        function getMockData() {
            return [

                {

                    tags: ['设计'],
                    submitter: '匿名用户',
                    avatar: '匿',
                    date: '2026-08-14',
                    anonymous: true,
                },
                {
                    id: 3,
                    title: 'Canva - 在线设计工具',
                    url: 'https://www.canva.com',
                    description: '简单易用的在线平面设计工具，海量模板。',
                    tags: ['设计', '工具'],
                    submitter: '李思思',
                    avatar: '李',
                    date: '2026-08-13',
                    anonymous: false,
                },
                {
                    id: 4,
                    title: 'GitHub - 代码托管平台',
                    url: 'https://github.com',
                    description: '全球最大的代码托管平台，协作开发首选。',
                    tags: ['技术', '工具'],
                    submitter: '匿名用户',
                    avatar: '匿',
                    date: '2026-08-12',
                    anonymous: true,
                },
                {
                    id: 5,
                    title: 'Awwwards - 网页设计奖项',
                    url: 'https://www.awwwards.com',
                    description: '全球最优秀的网页设计作品展示与评选。',
                    tags: ['设计'],
                    submitter: '王五',
                    avatar: '王',
                    date: '2026-08-11',
                    anonymous: false,
                },
                {
                    id: 6,
                    title: 'Figma - 协作设计工具',
                    url: 'https://www.figma.com',
                    description: '基于浏览器的实时协作设计工具。',
                    tags: ['设计', '工具'],
                    submitter: '匿名用户',
                    avatar: '匿',
                    date: '2026-08-10',
                    anonymous: true,
                },
            ];
        }

        // 渲染卡片
        function renderCards(data) {
            const container = document.getElementById('cardList');
            if (data.length === 0) {
                container.innerHTML = `<div class="empty-state">暂无符合条件的网址，快去发布第一个吧！</div>`;
                return;
            }
            container.innerHTML = data.map(item => {
                const tagsHtml = item.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
                const submitterDisplay = item.anonymous ? '匿名用户' : item.submitter;
                const avatarText = item.anonymous ? '匿' : (item.avatar || item.submitter.charAt(0));
                return `
                <div class="url-card">
                    <div class="card-header">
                        <div>
                            <div class="card-title"><a href="${item.url}" target="_blank">${item.title}</a></div>
                            <div class="card-domain">${new URL(item.url).hostname}</div>
                        </div>
                        <div class="card-actions">
                            <button class="card-action-btn" title="收藏">
                                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </button>
                            <button class="card-action-btn" title="复制链接">
                                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="card-description">${item.description}</div>
                    <div class="card-footer">
                        <div class="card-submitter">
                            <div class="submitter-avatar">${avatarText}</div>
                            <span>${submitterDisplay}</span>
                            <span>·</span>
                            <span>${item.date}</span>
                        </div>
                        <div class="card-tags">${tagsHtml}</div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            const allData = getMockData();
            if (!query) {
                renderCards(allData);
                return;
            }
            const filtered = allData.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.description.toLowerCase().includes(query) ||
                item.tags.some(tag => tag.toLowerCase().includes(query))
            );
            renderCards(filtered);
        });

        // 页面加载逻辑
        async function init() {
            // 尝试获取用户
            try {
                if (supabase) {
                    const { data: { user } } = await supabase.auth.getUser();
                    currentUser = user;
                    updateUserUI(user);
                    if (!user) {
                        window.location.href = 'index.html';
                        return;
                    }
                } else {
                    // Supabase 初始化失败，使用默认用户（仅用于演示）
                    updateUserUI(null);
                }
                // 渲染初始数据
                renderCards(getMockData());
            } catch (err) {
                console.error('认证检查失败:', err);
                // 如果获取用户失败，仍渲染数据但显示未登录
                updateUserUI(null);
                renderCards(getMockData());
            }
        }

        // 监听认证状态变化
        if (supabase) {
            supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_OUT') {
                    window.location.href = 'index.html';
                }
                if (event === 'SIGNED_IN' && session?.user) {
                    currentUser = session.user;
                    updateUserUI(session.user);
                }
            });
        }

        // 启动
        init();

        // 将函数暴露到全局（确保内联 onclick 可调用）
        window.toggleSidebar = toggleSidebar;
        window.logout = logout;
    </script>
</body>
</html>
