<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 · 网址导航</title>

    <!-- 网站图标 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <link rel="stylesheet" href="style.css" />

</head>
<body>

    <!-- 丝带背景 -->
    <div class="ribbon-container"><div class="ribbon"></div><div class="ribbon"></div><div class="ribbon"></div><div class="ribbon"></div><div class="ribbon"></div></div>
    <div class="bg-glow"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 模态框 -->
    <div class="custom-modal-overlay" id="customModal">
        <div class="custom-modal">
            <h3 id="customModalTitle">输入</h3>
            <div id="customModalBody"></div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="customModalCancel">取消</button>
                <button class="btn btn-primary" id="customModalConfirm">确认</button>
            </div>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div class="custom-modal-overlay" id="confirmModal">
        <div class="custom-modal">
            <h3 id="confirmModalTitle">确认操作</h3>
            <div class="confirm-box">
                <p class="confirm-msg" id="confirmModalMsg">确定执行此操作？</p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="confirmModalCancel">取消</button>
                <button class="btn btn-danger" id="confirmModalOk">确认</button>
            </div>
        </div>
    </div>

    <!-- 全屏 HTML -->
    <div class="fullscreen-html-overlay" id="fullscreenHtmlOverlay">
        <div class="fullscreen-html-container">
            <div class="fs-header">
                <span class="fs-title" id="fsHtmlTitle">HTML 页面</span>
                <button class="fs-close" id="fsHtmlClose">✕</button>
            </div>
            <iframe id="fsHtmlIframe" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
        </div>
    </div>

    <!-- ===== 主应用 ===== -->
    <div class="app" id="app">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="brand" id="brandHome">
                <span class="brand-icon" id="brandLogo"></span>
                <span class="brand-name"><span id="brandName">必看网</span><span class="brand-version" id="brandVersion">v3.0</span></span>
            </div>
            <div class="nav-actions">
                <button class="nav-btn success" id="navImportData">📥 导入数据</button>
                <button class="nav-btn" id="navExport">🌐 导出</button>
                <button class="nav-btn" id="navBackup">💾 备份</button>
                <button class="nav-btn danger" id="navRestore">📥 恢复</button>
                <input type="file" id="restoreFileInput" class="hidden-input" accept=".json" />
                <button class="nav-btn" id="navSettings">⚙️</button>
                <button class="nav-btn primary" id="navManage">＋ 添加分类</button>
                <span class="nav-divider">|</span>
                <button class="mode-toggle" id="modeToggle"><span id="modeIndicator">👁️ 浏览</span></button>
                <button class="nav-btn danger" id="navLogout">🚪 退出</button>
            </div>
        </nav>

        <!-- 主布局 -->
        <div class="app-layout" id="appLayout">
            <!-- 侧边栏 -->
            <aside class="app-sidebar" id="appSidebar">
                <div class="sidebar-header">
                    <h2><span class="icon" id="sidebarIcon"></span> 我的分区</h2>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <button class="btn-add-section" id="btnAddSection" title="新建分区">＋</button>
                        <button class="sidebar-toggle" id="sidebarToggle" title="折叠侧边栏">◀</button>
                    </div>
                </div>
                <ul class="sidebar-tree" id="sidebarTree"></ul>
                <div class="sidebar-footer">共 <span id="sidebarTotal">0</span> 个分区</div>
            </aside>

            <!-- 主内容 -->
            <main class="app-main">
                <div class="page-stack" id="pageStack">
                    <!-- 首页 -->
                    <div class="page-layer depth-0" id="layerHome" data-depth="0">
                        <div class="layer-inner">
                            <div class="page-content">
                                <section class="hero">
                                    <div class="hero-badge" id="heroBadge">✦ 精选优质网站</div>
                                    <h1 id="heroTitle">发现 <span class="highlight" id="heroHighlight">好网站</span><br />从必看网开始</h1>
                                    <p class="hero-sub" id="heroSub">从必看网开始</p>
                                    <div class="hero-stats" id="heroStats">
                                        <div class="stat-item"><div class="stat-number"><span class="num" data-target="0">0</span></div><div class="stat-label">分类</div></div>
                                        <div class="stat-item"><div class="stat-number"><span class="num" data-target="0">0</span></div><div class="stat-label">子分区</div></div>
                                        <div class="stat-item"><div class="stat-number"><span class="num" data-target="0">0</span></div><div class="stat-label">精品网址</div></div>
                                    </div>
                                </section>
                                <div class="content-grid" id="homeContentGrid"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 分区详情 -->
                    <div class="page-layer depth-1 hidden" id="layerSection" data-depth="1">
                        <div class="layer-inner">
                            <div class="page-content">
                                <div class="detail-header" id="sectionDetailHeader">
                                    <button class="back-btn" id="backFromSection">← 返回</button>
                                    <div class="detail-icon" id="detailIcon"></div>
                                    <div class="detail-info">
                                        <div class="detail-name" id="detailName">分区名称</div>
                                        <div class="detail-meta" id="detailMeta">子分区 · 共 0 个网址</div>
                                    </div>
                                    <div class="detail-actions" id="detailActions">
                                        <button class="action-btn primary" id="detailAddSub">＋ 添加子分区</button>
                                        <button class="action-btn" id="detailEditSection">✏️ 编辑</button>
                                        <button class="action-btn danger" id="detailDeleteSection">🗑️ 删除</button>
                                    </div>
                                </div>
                                <div class="sub-list" id="sectionSubList"></div>
                            </div>
                        </div>
                    </div>

                    <!-- HTML 子分区 -->
                    <div class="page-layer depth-2 hidden" id="layerSubSection" data-depth="2">
                        <div class="layer-inner">
                            <div class="page-content">
                                <div class="detail-header" id="subSectionDetailHeader">
                                    <button class="back-btn" id="backFromSubSection">← 返回</button>
                                    <div class="detail-icon" id="subDetailIcon"></div>
                                    <div class="detail-info">
                                        <div class="detail-name" id="subDetailName">子分区名称</div>
                                        <div class="detail-meta" id="subDetailMeta">共 0 个 HTML 页面</div>
                                    </div>
                                    <div class="detail-actions" id="subDetailActions">
                                        <button class="action-btn primary" id="subAddHtmlPage">＋ 添加 HTML 页面</button>
                                        <button class="action-btn" id="subEditSub">✏️ 编辑</button>
                                        <button class="action-btn danger" id="subDeleteSub">🗑️ 删除</button>
                                    </div>
                                </div>
                                <div id="subSectionContent"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 书签列表 -->
                    <div class="page-layer depth-2 hidden" id="layerBookmarks" data-depth="2">
                        <div class="layer-inner">
                            <div class="page-content">
                                <div class="detail-header" id="bookmarkDetailHeader">
                                    <button class="back-btn" id="backFromBookmarks">← 返回</button>
                                    <div class="detail-icon" id="bmDetailIcon"></div>
                                    <div class="detail-info">
                                        <div class="detail-name" id="bmDetailName">子分区名称</div>
                                        <div class="detail-meta" id="bmDetailMeta">共 0 个网址</div>
                                    </div>
                                    <div class="detail-actions" id="bmDetailActions">
                                        <button class="action-btn primary" id="bmAddBookmark">＋ 添加网址</button>
                                        <button class="action-btn" id="bmEditSub">✏️ 编辑</button>
                                        <button class="action-btn danger" id="bmDeleteSub">🗑️ 删除</button>
                                    </div>
                                </div>
                                <div class="bm-list" id="bookmarkList"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- 管理工具栏 -->
        <div class="manage-toolbar" id="manageToolbar">
            <button class="tool-btn primary" id="toolAddAnnouncement">📢 添加公告</button>
            <button class="tool-btn primary" id="toolAddDivider">━ 添加分割线</button>
            <button class="tool-btn" id="toolAddSection">📁 添加分类</button>
            <span class="tool-hint">↕ 拖动 ≡ 排序</span>
        </div>
    </div>

    <!-- ============================================================
    JavaScript 模块
    ============================================================ -->
    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/main.js"></script>

    <script>
        // ============================================================
        //  启动应用
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // 注入品牌 Logo
            var logoEl = document.getElementById('brandLogo');
            if (logoEl) {
                logoEl.innerHTML = App.icons.logo();
            }

            // 注入侧边栏图标
            var sidebarIcon = document.getElementById('sidebarIcon');
            if (sidebarIcon) {
                sidebarIcon.innerHTML = App.icons.folderSmall();
            }

            // 启动主程序
            App.main.init().catch(function(err) {
                console.error('启动失败:', err);
            });
        });
    </script>

</body>
</html>
