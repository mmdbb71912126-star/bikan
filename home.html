<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 · 网址导航</title>

    <!-- 网站图标：黑色 SVG Logo -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <style>
        /* ===== 完整样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #070a14;
            --bg-secondary: #0f1628;
            --bg-card: rgba(255, 255, 255, 0.02);
            --bg-glass: rgba(255, 255, 255, 0.015);
            --color-primary: #6c5ce7;
            --color-primary-light: #a29bfe;
            --color-primary-glow: rgba(108, 92, 231, 0.12);
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.12);
            --text-micro: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.04);
            --border-hover: rgba(255, 255, 255, 0.08);
            --shadow-color: rgba(0, 0, 0, 0.25);
            --glass-blur: 32px;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            --error: #ff6b6b;
            --success: #3ecf8e;
        }

        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: var(--bg-primary);
            background-image: radial-gradient(ellipse at 20% 30%, rgba(60, 40, 180, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(20, 80, 160, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(100, 60, 200, 0.04) 0%, transparent 40%),
                linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 40%, var(--bg-primary) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.6;
            overflow: hidden;
            height: 100vh;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* 丝带背景 */
        .ribbon-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .ribbon {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px) saturate(1.5);
            mix-blend-mode: screen;
            opacity: 0.25;
            will-change: transform;
            animation: ribbonFlow linear infinite alternate;
            transform-origin: center center;
        }
        .ribbon:nth-child(1) {
            width: 50%;
            height: 15%;
            top: 5%;
            left: -30%;
            background: radial-gradient(circle, rgba(120, 80, 255, 0.6), rgba(60, 40, 200, 0.1));
            animation-duration: 14s;
            animation-delay: 0s;
        }
        .ribbon:nth-child(2) {
            width: 40%;
            height: 12%;
            top: 35%;
            left: -40%;
            background: radial-gradient(circle, rgba(30, 120, 220, 0.5), rgba(10, 80, 160, 0.1));
            animation-duration: 18s;
            animation-delay: 2s;
        }
        .ribbon:nth-child(3) {
            width: 60%;
            height: 20%;
            top: 65%;
            left: -20%;
            background: radial-gradient(circle, rgba(180, 80, 255, 0.4), rgba(100, 40, 200, 0.05));
            animation-duration: 22s;
            animation-delay: 4s;
        }
        .ribbon:nth-child(4) {
            width: 30%;
            height: 18%;
            top: 80%;
            left: -50%;
            background: radial-gradient(circle, rgba(60, 180, 255, 0.3), rgba(20, 100, 200, 0.05));
            animation-duration: 16s;
            animation-delay: 6s;
        }
        .ribbon:nth-child(5) {
            width: 45%;
            height: 10%;
            top: 20%;
            left: -60%;
            background: radial-gradient(circle, rgba(200, 120, 255, 0.4), rgba(80, 40, 200, 0.05));
            animation-duration: 20s;
            animation-delay: 8s;
        }
        @keyframes ribbonFlow {
            0% {
                transform: translateX(0) translateY(0) scale(1) rotate(0deg);
                opacity: 0.15;
            }
            25% {
                transform: translateX(35vw) translateY(-8vh) scale(1.15) rotate(6deg);
                opacity: 0.35;
            }
            50% {
                transform: translateX(70vw) translateY(12vh) scale(0.85) rotate(-4deg);
                opacity: 0.2;
            }
            75% {
                transform: translateX(105vw) translateY(-4vh) scale(1.1) rotate(8deg);
                opacity: 0.4;
            }
            100% {
                transform: translateX(140vw) translateY(6vh) scale(0.95) rotate(-2deg);
                opacity: 0.1;
            }
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .bg-glow .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            mix-blend-mode: screen;
        }
        .bg-glow .orb.orb1 {
            width: 500px;
            height: 500px;
            background: var(--color-primary-glow);
            top: -10%;
            left: -5%;
        }
        .bg-glow .orb.orb2 {
            width: 400px;
            height: 400px;
            background: rgba(30, 120, 220, 0.05);
            bottom: -10%;
            right: -5%;
        }
        .bg-glow .orb.orb3 {
            width: 300px;
            height: 300px;
            background: rgba(180, 80, 255, 0.04);
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* ===== 主应用 ===== */
        .app {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 20px 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .app.visible {
            opacity: 1;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            flex-shrink: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(var(--glass-blur)) saturate(1.6);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.6);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 40px var(--shadow-color);
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .navbar .brand:hover {
            color: var(--color-primary-light);
        }
        .navbar .brand .brand-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 4px;
        }
        .navbar .brand .brand-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .navbar .brand .brand-name {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .navbar .brand .brand-version {
            font-size: 0.5rem;
            font-weight: 400;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 1px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .navbar .nav-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 5px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }
        .nav-btn.primary {
            border-color: var(--color-primary-glow);
            background: rgba(108, 92, 231, 0.08);
            color: var(--color-primary-light);
        }
        .nav-btn.primary:hover {
            background: rgba(108, 92, 231, 0.15);
            border-color: rgba(108, 92, 231, 0.2);
            color: #e0d8ff;
        }
        .nav-btn.danger {
            border-color: rgba(239, 68, 68, 0.04);
            color: rgba(239, 68, 68, 0.25);
        }
        .nav-btn.danger:hover {
            border-color: rgba(239, 68, 68, 0.08);
            color: #f87171;
            background: rgba(239, 68, 68, 0.04);
        }
        .nav-btn.success {
            border-color: rgba(16, 185, 129, 0.04);
            color: rgba(16, 185, 129, 0.35);
        }
        .nav-btn.success:hover {
            border-color: rgba(16, 185, 129, 0.08);
            color: #34d399;
            background: rgba(16, 185, 129, 0.04);
        }
        .mode-toggle {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.6rem;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .mode-toggle:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border-color: var(--border-hover);
        }
        .mode-toggle.active {
            border-color: var(--color-primary-glow);
            color: var(--color-primary-light);
            background: rgba(108, 92, 231, 0.04);
        }
        .nav-divider {
            font-size: 0.6rem;
            color: var(--text-micro);
            padding: 0 2px;
        }

        /* ===== 主布局 ===== */
        .app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            border-radius: var(--radius);
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* ===== 侧边栏 ===== */
        .app-sidebar {
            width: 280px;
            min-width: 280px;
            background: rgba(255, 255, 255, 0.01);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            transition: all 0.4s ease;
        }
        .app-sidebar.collapsed {
            width: 50px;
            min-width: 50px;
            overflow: visible;
        }
        .app-sidebar.collapsed .sidebar-header h2 span,
        .app-sidebar.collapsed .sidebar-header .brand-version,
        .app-sidebar.collapsed .sidebar-tree,
        .app-sidebar.collapsed .sidebar-footer,
        .app-sidebar.collapsed .btn-add-section {
            display: none;
        }
        .app-sidebar.collapsed .sidebar-header {
            justify-content: center;
            padding: 12px 0;
        }
        .app-sidebar.collapsed .sidebar-header h2 {
            font-size: 0;
        }
        .app-sidebar.collapsed .sidebar-header .sidebar-toggle {
            margin: 0;
            transform: rotate(180deg);
        }
        .app-sidebar .sidebar-header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .app-sidebar .sidebar-header h2 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-sidebar .sidebar-header h2 .icon {
            font-size: 1.1rem;
        }
        .app-sidebar .sidebar-toggle {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
            background: transparent;
            border: none;
            font-family: inherit;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-sidebar .sidebar-toggle:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
        }

        .app-sidebar .sidebar-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            list-style: none;
        }
        .app-sidebar .sidebar-tree .tree-item {
            margin-bottom: 2px;
        }
        .app-sidebar .sidebar-tree .tree-item .node {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px 6px 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .app-sidebar .sidebar-tree .tree-item .node:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
        }
        .app-sidebar .sidebar-tree .tree-item .node.active {
            background: rgba(108, 92, 231, 0.08);
            border-color: var(--color-primary-glow);
            color: var(--color-primary-light);
        }
        .app-sidebar .sidebar-tree .tree-item .node .toggle-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            color: var(--text-micro);
            transition: transform 0.2s;
            flex-shrink: 0;
            cursor: pointer;
        }
        .app-sidebar .sidebar-tree .tree-item .node .toggle-icon.open {
            transform: rotate(90deg);
        }
        .app-sidebar .sidebar-tree .tree-item .node .node-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            border-radius: 4px;
            overflow: hidden;
        }
        .app-sidebar .sidebar-tree .tree-item .node .node-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .app-sidebar .sidebar-tree .tree-item .node .node-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            font-size: 0.82rem;
        }
        .app-sidebar .sidebar-tree .tree-item .node .node-badge {
            font-size: 0.55rem;
            padding: 1px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-micro);
            flex-shrink: 0;
            font-weight: 500;
        }
        .app-sidebar .sidebar-tree .tree-item .children {
            list-style: none;
            padding-left: 18px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app-sidebar .sidebar-tree .tree-item .children.open {
            max-height: 2000px;
        }
        .app-sidebar .sidebar-footer {
            padding: 8px 12px;
            border-top: 1px solid var(--border-color);
            font-size: 0.6rem;
            color: var(--text-micro);
            text-align: center;
            flex-shrink: 0;
        }

        .btn-add-section {
            display: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .btn-add-section:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border-color: var(--border-hover);
        }
        .btn-add-section.visible {
            display: flex;
        }

        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: rgba(0, 0, 0, 0.05);
        }

        /* ===== 页面堆叠 ===== */
        .page-stack {
            position: relative;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }
        .page-layer {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 16px 16px;
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), filter 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, opacity, filter;
            scroll-behavior: smooth;
        }
        .page-layer::-webkit-scrollbar {
            width: 3px;
        }
        .page-layer::-webkit-scrollbar-track {
            background: transparent;
        }
        .page-layer::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
        }
        .page-layer.depth-0 {
            z-index: 1;
            opacity: 1;
            filter: none;
            transform: scale(1);
            pointer-events: auto;
            background: transparent;
        }
        .page-layer.depth-0 .layer-inner {
            background: transparent;
            border-radius: var(--radius);
            padding: 0;
            height: 100%;
            overflow-y: auto;
        }
        .page-layer.depth-1 {
            z-index: 2;
            opacity: 1;
            filter: none;
            transform: scale(1);
            pointer-events: auto;
            background: transparent;
        }
        .page-layer.depth-1 .layer-inner {
            background: var(--bg-glass);
            backdrop-filter: blur(16px) saturate(1.3);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 0;
            height: 100%;
            overflow-y: auto;
            box-shadow: 0 8px 40px var(--shadow-color);
        }
        .page-layer.depth-2 {
            z-index: 3;
            opacity: 1;
            filter: none;
            transform: scale(1);
            pointer-events: auto;
            background: transparent;
        }
        .page-layer.depth-2 .layer-inner {
            background: var(--bg-glass);
            backdrop-filter: blur(24px) saturate(1.5);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 0;
            height: 100%;
            overflow-y: auto;
            box-shadow: 0 12px 48px var(--shadow-color);
        }
        .page-layer.bg-mode {
            pointer-events: none;
            cursor: default;
        }
        .page-layer.bg-mode .layer-inner {
            filter: blur(6px) brightness(0.4);
            opacity: 0.5;
            transform: scale(0.97);
            transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            border-color: transparent;
            box-shadow: none;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
        }
        .page-layer.hidden {
            opacity: 0;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.4s ease;
        }
        .page-layer.hidden .layer-inner {
            transform: scale(0.96);
        }
        .page-content {
            padding: 4px 2px 16px;
        }

        /* ===== Hero ===== */
        .hero {
            text-align: center;
            padding: 12px 0 20px;
            animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
            animation-delay: 0.1s;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .hero .hero-badge {
            display: inline-block;
            padding: 2px 16px;
            border-radius: 30px;
            background: var(--color-primary-glow);
            border: 1px solid rgba(108, 92, 231, 0.04);
            color: var(--color-primary-light);
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .hero h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
            background: linear-gradient(135deg, #fff 35%, var(--color-primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            cursor: pointer;
        }
        .hero h1 .highlight {
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .hero-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 0.3px;
            cursor: pointer;
        }
        .hero .hero-stats {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .hero .hero-stats .stat-item {
            text-align: center;
        }
        .hero .hero-stats .stat-number {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }
        .hero .hero-stats .stat-label {
            font-size: 0.62rem;
            color: var(--text-micro);
            margin-top: 0px;
        }

        /* ===== 内容网格 ===== */
        .content-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 4px 0 10px;
            min-height: 50px;
        }
        .grid-item {
            position: relative;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid transparent;
            cursor: default;
            user-select: none;
            animation: fadeSlide 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .grid-item.dragging {
            opacity: 0.15;
            transform: scale(0.95);
        }
        .grid-item.drag-over {
            border-color: var(--color-primary-glow);
            background: rgba(108, 92, 231, 0.04);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.06);
        }
        .grid-item.drag-over .item-actions {
            opacity: 0 !important;
        }
        .grid-item .drag-handle {
            position: absolute;
            left: 2px;
            top: 50%;
            transform: translateY(-50%);
            cursor: grab;
            color: var(--text-micro);
            font-size: 0.6rem;
            opacity: 0;
            transition: opacity 0.25s ease;
            padding: 4px 6px;
            border-radius: 4px;
            line-height: 1;
            user-select: none;
            touch-action: none;
        }
        .grid-item:hover .drag-handle {
            opacity: 1;
        }
        .grid-item .drag-handle:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
        }
        .grid-item .drag-handle:active {
            cursor: grabbing;
        }
        .grid-item .item-actions {
            position: absolute;
            right: 4px;
            top: 4px;
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: opacity 0.25s ease;
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 0 2px;
            border: 1px solid var(--border-color);
        }
        .grid-item:hover .item-actions {
            opacity: 1;
        }
        .grid-item .item-actions .btn-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.55rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-family: inherit;
        }
        .grid-item .item-actions .btn-icon:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
        }
        .grid-item .item-actions .btn-icon.danger:hover {
            background: rgba(239, 68, 68, 0.06);
            color: #f87171;
        }

        .item-announcement {
            background: var(--color-primary-glow);
            border-color: rgba(108, 92, 231, 0.04);
            border-radius: var(--radius-sm);
            padding: 8px 14px 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .item-announcement .announce-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }
        .item-announcement .announce-text {
            flex: 1;
            word-break: break-word;
        }
        .item-announcement.top {
            background: var(--color-primary-glow);
            border-left: 3px solid var(--color-primary);
        }
        .item-announcement.bottom {
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid var(--text-micro);
        }

        .item-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 0 4px 0;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .item-divider .line {
            flex: 1;

            background: linear-gradient(to right, transparent, var(--border-color), transparent);
        }
        .item-divider .divider-text {
            flex-shrink: 0;
            padding: 0 8px;
            color: var(--text-muted);
        }
        .item-divider .divider-text.empty {
            color: var(--text-micro);
            font-size: 0.6rem;
        }

        .item-section {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-sm);
            padding: 14px 16px 12px;
            border: 1px solid var(--border-color);

            overflow: hidden;
            margin: 0;
        }
        .item-section:hover {

            border-color: var(--color-primary-glow);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 16px 48px var(--shadow-color), inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }
        .item-section .card-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, var(--color-primary-glow), transparent 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        .item-section:hover .card-glow {

        }
        .item-section .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .item-section .card-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--bg-card);
            border: 1px solid var(--border-color);
            flex-shrink: 0;

        .item-section .card-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-section .card-count-badge {

            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .item-section .card-desc {
            font-size: 0.7rem;
            color: var(--text-muted);

        .item-section .card-footer {
            display: flex;

            justify-content: space-between;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--border-color);

        .item-section .card-footer .sub-count {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .item-section .card-footer .arrow {
            font-size: 0.7rem;
            color: var(--text-micro);
            transition: all 0.3s ease;
        }
        .item-section:hover .card-footer .arrow {
            color: var(--color-primary-light);
            transform: translateX(4px);
        }

        /* ===== 分区详情 ===== */
        .detail-header {
            display: flex;

            gap: 12px;
            padding: 2px 0 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .detail-header .back-btn {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.68rem;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .detail-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border-color: var(--border-hover);
            transform: translateX(-3px);
        }
        .detail-header .detail-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .detail-header .detail-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-header .detail-info {
            flex: 1;
            min-width: 0;
        }
        .detail-header .detail-info .detail-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);

        .detail-header .detail-info .detail-meta {
            font-size: 0.65rem;
            color: var(--text-muted);
        }
        .detail-actions {
            display: none !important;
            gap: 4px;
            flex-wrap: wrap;
        }
        .detail-actions.visible {
            display: flex !important;
        }

        .action-btn {
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.62rem;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 3px;
            backdrop-filter: blur(4px);
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border-color: var(--border-hover);
        }
        .action-btn.primary {
            border-color: var(--color-primary-glow);
            background: rgba(108, 92, 231, 0.04);
            color: var(--color-primary-light);
        }
        .action-btn.primary:hover {
            background: rgba(108, 92, 231, 0.08);
            color: #e0d8ff;
            border-color: rgba(108, 92, 231, 0.12);
        }
        .action-btn.danger {
            border-color: rgba(239, 68, 68, 0.04);
            color: rgba(239, 68, 68, 0.25);
        }
        .action-btn.danger:hover {
            background: rgba(239, 68, 68, 0.04);
            color: rgba(239, 68, 68, 0.45);
            border-color: rgba(239, 68, 68, 0.06);
        }

        .sub-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .sub-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .sub-item:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: var(--border-hover);
            transform: translateX(3px);
        }
        .sub-item .sub-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            background: var(--bg-card);
            flex-shrink: 0;
        }
        .sub-item .sub-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sub-item .sub-info {
            flex: 1;
            min-width: 0;
        }
        .sub-item .sub-info .sub-name {
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }
        .sub-item .sub-info .sub-desc {
            font-size: 0.62rem;
            color: var(--text-muted);
        }
        .sub-item .sub-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .sub-item .sub-right .sub-count {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .sub-item .sub-right .arrow {
            font-size: 0.6rem;
            color: var(--text-micro);
            transition: 0.3s;
        }
        .sub-item:hover .sub-right .arrow {
            color: var(--text-muted);
            transform: translateX(3px);
        }
        .sub-actions {
            display: none !important;
            gap: 2px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .sub-actions.visible {
            display: flex !important;
        }
        .sub-item:hover .sub-actions {
            opacity: 1;
        }
        .sub-actions .btn-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.55rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-family: inherit;
        }
        .sub-actions .btn-icon:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
        }
        .sub-actions .btn-icon.danger:hover {
            background: rgba(239, 68, 68, 0.04);
            color: #f87171;
        }

        /* ===== 书签列表 ===== */
        .bm-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .bm-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid transparent;
            transition: all 0.35s ease;
        }
        .bm-item:hover {
            background: rgba(255, 255, 255, 0.01);
            border-color: var(--border-color);
            transform: translateX(3px);
        }
        .bm-item .bm-index {
            font-size: 0.5rem;
            color: var(--text-micro);
            font-weight: 600;
            min-width: 18px;
            text-align: center;
            flex-shrink: 0;
        }
        .bm-item .bm-icon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            flex-shrink: 0;
            background: var(--bg-card);
        }
        .bm-item .bm-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .bm-item .bm-info {
            flex: 1;
            min-width: 0;
        }
        .bm-item .bm-info .bm-name {
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: 0.2s;
        }
        .bm-item .bm-info .bm-name:hover {
            color: var(--color-primary-light);
        }
        .bm-item .bm-info .bm-url {
            font-size: 0.58rem;
            color: var(--text-micro);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
        }
        .bm-item .bm-info .bm-desc {
            font-size: 0.62rem;
            color: var(--text-micro);
        }
        .bm-item .bm-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .bm-item .bm-right .stars {
            font-size: 0.55rem;
            letter-spacing: 0.5px;

        .bm-item .bm-right .vpn-badge {

            font-weight: 500;
            padding: 1px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }
        .bm-item .bm-right .vpn-badge.yes {
            background: rgba(16, 185, 129, 0.04);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.02);
        }
        .bm-item .bm-right .vpn-badge.no {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .bm-actions {
            display: none !important;
            gap: 2px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .bm-actions.visible {
            display: flex !important;
        }
        .bm-item:hover .bm-actions {
            opacity: 1;
        }
        .bm-actions .btn-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.5rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-family: inherit;
        }
        .bm-actions .btn-icon:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
        }
        .bm-actions .btn-icon.danger:hover {
            background: rgba(239, 68, 68, 0.04);
            color: #f87171;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 2rem;
            opacity: 0.2;
            margin-bottom: 6px;
        }
        .empty-state .empty-text {
            font-size: 0.8rem;
        }
        .empty-state .empty-sub {
            font-size: 0.65rem;
            color: var(--text-micro);
        }

        /* ===== 管理工具栏 ===== */
        .manage-toolbar {
            flex-shrink: 0;
            display: none;
            gap: 8px;
            padding: 8px 14px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: 0 -4px 30px var(--shadow-color);

            align-items: center;
            justify-content: center;
            margin-top: 8px;
        }
        .manage-toolbar.visible {
            display: flex;
        }
        .manage-toolbar .tool-btn {
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(4px);

            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }
        .manage-toolbar .tool-btn.primary {
            border-color: var(--color-primary-glow);
            background: rgba(108, 92, 231, 0.04);
            color: var(--color-primary-light);
        }
        .manage-toolbar .tool-btn.primary:hover {
            background: rgba(108, 92, 231, 0.08);
            color: #e0d8ff;
        }
        .manage-toolbar .tool-hint {
            font-size: 0.6rem;
            color: var(--text-micro);
            margin-left: 4px;
        }

        /* ===== 模态框 ===== */
        .custom-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .custom-modal-overlay.open {
            display: flex;
        }
        .custom-modal {
            background: rgba(16, 24, 44, 0.92);
            backdrop-filter: blur(48px) saturate(1.6);
            -webkit-backdrop-filter: blur(48px) saturate(1.6);
            border-radius: var(--radius);
            padding: 26px 28px 22px;
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--border-color);

            overflow-y: auto;

        @keyframes modalSlideUp {
            from {

                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            margin-bottom: 4px;

        .custom-modal .form-group textarea,
        .custom-modal .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: inherit;

            background: var(--bg-card);
            color: var(--text-secondary);
            resize: vertical;

        .custom-modal .form-group input:focus,
        .custom-modal .form-group textarea:focus,
        .custom-modal .form-group select:focus {
            outline: none;
            border-color: var(--color-primary-glow);
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.04);
        }
        .custom-modal .form-group textarea {
            min-height: 60px;
            max-height: 150px;
        }
        .custom-modal .form-group select {
            background: rgba(16, 24, 44, 0.8);
            color: var(--text-secondary);
            border-color: var(--border-color);
            appearance: auto;
            -webkit-appearance: auto;
        }
        .custom-modal .form-group select option {
            background: #1a2440;
            color: #e8edf5;

            color: #e8edf5;

        .custom-modal .form-group select option:hover {

        .custom-modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .custom-modal .btn {
            padding: 8px 22px;

        (function() {

            // ============================================================

            function generateId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9); }

            function escapeHtml(s) { if (!s) return ''; var d = document.createElement('div');
                d.textContent = s; return d.innerHTML; }
