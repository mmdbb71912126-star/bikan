            // ============================================================
            //  数据导入（从 localStorage）
            // ============================================================
            async function importFromLocalStorage() {
                try {
                    var oldData = localStorage.getItem('bikan_data_v10');
                    if (!oldData) {
                        showToast('未找到旧数据，请确认之前使用过此浏览器', 'error');
                        return;
                    }
                    var data = JSON.parse(oldData);
                    if (!data.sections || data.sections.length === 0) {
                        showToast('旧数据为空', 'error');
                        return;
                    }

                    var confirmMsg = '将导入 ' + data.sections.length + ' 个分区及其所有书签。\n注意：会追加到现有数据中，不会覆盖。';
                    var ok = await showConfirm(confirmMsg, '导入确认');
                    if (!ok) return;

                    var importedCount = 0;

                    for (var si = 0; si < data.sections.length; si++) {
                        var oldSec = data.sections[si];
                        // 检查是否已存在同名分区
                        var existing = sections.find(function(s) { return s.name === oldSec.name && !s.parent_id; });
                        var parentId = null;
                        if (!existing) {
                            // 创建新分区
                            var newSec = {
                                id: generateId(),
                                name: oldSec.name || '未命名',
                                icon: oldSec.icon || '',
                                isHtmlParent: oldSec.isHtmlParent || false,
                                parent_id: null,
                                sort_order: sections.length,
                                children: []
                            };
                            var { error: secErr } = await supabase.from('sections').insert({
                                id: newSec.id,
                                name: newSec.name,
                                icon: newSec.icon,
                                is_html_parent: newSec.isHtmlParent,
                                parent_id: newSec.parent_id,
                                sort_order: newSec.sort_order
                            });
                            if (secErr) { console.error('创建分区失败:', secErr); continue; }
                            sections.push(newSec);
                            // 添加首页引用
                            await supabase.from('home_items').insert({
                                id: generateId(),
                                type: 'section_ref',
                                section_id: newSec.id,
                                sort_order: homeItems.length
                            });
                            homeItems.push({ id: generateId(), type: 'section_ref', section_id: newSec.id });
                            parentId = newSec.id;
                            importedCount++;
                        } else {
                            parentId = existing.id;
                        }

                        // 导入子分区
                        if (oldSec.children && oldSec.children.length > 0) {
                            for (var ci = 0; ci < oldSec.children.length; ci++) {
                                var oldChild = oldSec.children[ci];
                                var newChild = {
                                    id: generateId(),
                                    name: oldChild.name || '未命名',
                                    icon: oldChild.icon || '',
                                    isHtml: oldChild.isHtml || false,
                                    parent_id: parentId,
                                    sort_order: ci,
                                    children: [],
                                    bookmarks: [],
                                    htmlPages: []
                                };
                                var { error: childErr } = await supabase.from('sections').insert({
                                    id: newChild.id,
                                    name: newChild.name,
                                    icon: newChild.icon,
                                    is_html_parent: false,
                                    parent_id: newChild.parent_id,
                                    sort_order: newChild.sort_order
                                });
                                if (childErr) { console.error('创建子分区失败:', childErr); continue; }
                                var parentSec = getSection(parentId);
                                if (parentSec) {
                                    if (!parentSec.children) parentSec.children = [];
                                    parentSec.children.push(newChild);
                                }

                                if (oldChild.isHtml && oldChild.htmlPages) {
                                    // HTML 模式
                                    for (var hi = 0; hi < oldChild.htmlPages.length; hi++) {
                                        var hp = oldChild.htmlPages[hi];
                                        await supabase.from('html_pages').insert({
                                            id: generateId(),
                                            section_id: newChild.id,
                                            name: hp.name || '页面',
                                            content: hp.content || '',
                                            sort_order: hi
                                        });
                                        if (!newChild.htmlPages) newChild.htmlPages = [];
                                        newChild.htmlPages.push(hp);
                                    }
                                } else if (oldChild.bookmarks) {
                                    // 书签模式
                                    for (var bi = 0; bi < oldChild.bookmarks.length; bi++) {
                                        var bm = oldChild.bookmarks[bi];
                                        await supabase.from('bookmarks').insert({
                                            id: generateId(),
                                            section_id: newChild.id,
                                            name: bm.name || '未命名',
                                            url: bm.url || '',
                                            description: bm.description || '',
                                            stars: Math.max(1, Math.min(5, parseInt(bm.stars) || 3)),
                                            requires_vpn: (bm.requiresVpn === true || bm
                                                .requiresVpn === 'yes') ? true : false,
                                            icon: bm.icon || '',
                                            sort_order: bi
                                        });
                                        if (!newChild.bookmarks) newChild.bookmarks = [];
                                        newChild.bookmarks.push(bm);
                                    }
                                }
                                importedCount++;
                            }
                        }
                    }

                    renderHome();
                    showToast('导入成功！共导入 ' + importedCount + ' 个分区/子分区', 'success');

                } catch (err) {
                    console.error('导入失败:', err);
                    showToast('导入失败: ' + err.message, 'error');
                }
            }

            // ============================================================
            //  导出 JSON 备份
            // ============================================================
            async function exportJson() {
                try {
                    var allData = {
                        sections: sections,
                        homeItems: homeItems,
                        settings: settings,
                        exportedAt: new Date().toISOString()
                    };
                    // 获取所有书签和 HTML 页面
                    var { data: bookmarks } = await supabase.from('bookmarks').select('*');
                    var { data: htmlPages } = await supabase.from('html_pages').select('*');
                    allData.bookmarks = bookmarks || [];
                    allData.htmlPages = htmlPages || [];

                    var jsonStr = JSON.stringify(allData, null, 2);
                    var filename = (settings.site && settings.site.name ? settings.site.name : '必看网') + '_备份_' +
                        formatDate() + '.json';
                    downloadFile(jsonStr, filename, 'application/json');
                    showToast('备份已导出', 'success');
                } catch (err) {
                    showToast('导出失败: ' + err.message, 'error');
                }
            }

            function downloadFile(content, filename, mime) {
                var blob = new Blob(['\uFEFF' + content], { type: mime });
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            }

            // ============================================================
            //  恢复数据
            // ============================================================
            function triggerRestore() { document.getElementById('restoreFileInput').click(); }

            function importFromJson(file) {
                var reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        var imported = JSON.parse(e.target.result);
                        if (!imported.sections) { throw new Error('无效的数据格式'); }

                        var ok = await showConfirm('将覆盖当前所有数据，确定继续？', '⚠️ 恢复确认');
                        if (!ok) return;

                        // 清空现有数据
                        await supabase.from('home_items').delete().neq('id', '');
                        await supabase.from('bookmarks').delete().neq('id', '');
                        await supabase.from('html_pages').delete().neq('id', '');
                        await supabase.from('sections').delete().neq('id', '');

                        sections = [];
                        homeItems = [];

                        // 重新导入
                        for (var si = 0; si < imported.sections.length; si++) {
                            var sec = imported.sections[si];
                            var newSec = {
                                id: sec.id || generateId(),
                                name: sec.name || '未命名',
                                icon: sec.icon || '',
                                isHtmlParent: sec.isHtmlParent || false,
                                parent_id: sec.parent_id || null,
                                sort_order: sec.sort_order || 0
                            };
                            await supabase.from('sections').insert(newSec);
                            sections.push(newSec);
                        }

                        if (imported.homeItems) {
                            for (var hi = 0; hi < imported.homeItems.length; hi++) {
                                var item = imported.homeItems[hi];
                                await supabase.from('home_items').insert({
                                    id: item.id || generateId(),
                                    type: item.type || 'section_ref',
                                    content: item.content || '',
                                    position: item.position || 'between',
                                    section_id: item.section_id || null,
                                    sort_order: item.sort_order || 0
                                });
                                homeItems.push(item);
                            }
                        }

                        if (imported.bookmarks) {
                            for (var bi = 0; bi < imported.bookmarks.length; bi++) {
                                var bm = imported.bookmarks[bi];
                                await supabase.from('bookmarks').insert({
                                    id: bm.id || generateId(),
                                    section_id: bm.section_id,
                                    name: bm.name || '未命名',
                                    url: bm.url || '',
                                    description: bm.description || '',
                                    stars: bm.stars || 3,
                                    requires_vpn: bm.requires_vpn || false,
                                    icon: bm.icon || '',
                                    sort_order: bm.sort_order || 0
                                });
                            }
                        }

                        if (imported.htmlPages) {
                            for (var hpi = 0; hpi < imported.htmlPages.length; hpi++) {
                                var hp = imported.htmlPages[hpi];
                                await supabase.from('html_pages').insert({
                                    id: hp.id || generateId(),
                                    section_id: hp.section_id,
                                    name: hp.name || '页面',
                                    content: hp.content || '',
                                    sort_order: hp.sort_order || 0
                                });
                            }
                        }

                        if (imported.settings) {
                            settings = imported.settings;
                            if (settings.site) {
                                await supabase.from('settings').upsert({ key: 'site', value: settings.site });
                            }
                            if (settings.hero) {
                                await supabase.from('settings').upsert({ key: 'hero', value: settings.hero });
                            }
                            if (settings.theme) {
                                await supabase.from('settings').upsert({ key: 'theme', value: settings.theme });
                            }
                        }

                        await loadData();
                        showToast('数据恢复成功', 'success');

                    } catch (err) {
                        showToast('恢复失败: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
                document.getElementById('restoreFileInput').value = '';
            }

            function updateManageModeUI() {
                document.getElementById('modeIndicator').textContent = isManageMode ? '⚙️ 管理' : '👁️ 浏览';
                document.getElementById('modeToggle').classList.toggle('active', isManageMode);
                var toolbar = document.getElementById('manageToolbar');
                if (toolbar) toolbar.classList.toggle('visible', isManageMode);
                var addBtn = document.getElementById('btnAddSection');
                if (addBtn) addBtn.classList.toggle('visible', isManageMode);
            }

            // ============================================================
            //  侧边栏折叠
            // ============================================================
            function toggleSidebar() {
                isSidebarCollapsed = !isSidebarCollapsed;
                var sidebar = document.getElementById('appSidebar');
                var btn = document.getElementById('sidebarToggle');
                sidebar.classList.toggle('collapsed', isSidebarCollapsed);
                btn.textContent = isSidebarCollapsed ? '▶' : '◀';
            }

            // ============================================================
            //  退出登录
            // ============================================================
            async function logout() {
                var ok = await showConfirm('确定要退出登录吗？', '退出确认');
                if (!ok) return;
                try {
                    await supabase.auth.signOut();
                    window.location.href = 'index.html';
                } catch (err) {
                    showToast('退出失败: ' + err.message, 'error');
                }
            }

            // ============================================================
            //  初始化
            // ============================================================
            async function init() {
                // 检查登录状态
                try {
                    var { data: { user } } = await supabase.auth.getUser();
                    if (!user) {
                        // 未登录，跳转到登录页
                        window.location.href = 'index.html';
                        return;
                    }
                    currentUser = user;
                    console.log('当前用户:', user.email);
                } catch (err) {
                    console.error('获取用户失败:', err);
                    window.location.href = 'index.html';
                    return;
                }

                // 加载数据
                await loadData();

                // 显示应用
                document.getElementById('app').classList.add('visible');

                // 绑定事件
                document.getElementById('brandHome').addEventListener('click', function() { navigateTo('home'); });
                document.getElementById('backFromSection').addEventListener('click', goBack);
                document.getElementById('backFromBookmarks').addEventListener('click', goBack);
                document.getElementById('backFromSubSection').addEventListener('click', goBack);
                document.getElementById('modeToggle').addEventListener('click', toggleManageMode);
                document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
                document.getElementById('navLogout').addEventListener('click', logout);
                document.getElementById('navExport').addEventListener('click', exportHtml);
                document.getElementById('navBackup').addEventListener('click', exportJson);
                document.getElementById('navRestore').addEventListener('click', triggerRestore);
                document.getElementById('restoreFileInput').addEventListener('change', function() {
                    if (this.files && this.files[0]) { importFromJson(this.files[0]);
                        this.value = ''; }
                });
                document.getElementById('navImportData').addEventListener('click', importFromLocalStorage);

                document.getElementById('navManage').addEventListener('click', function() {
                    if (!isManageMode) toggleManageMode();
                    addSection();
                });
                document.getElementById('toolAddSection').addEventListener('click', function() {
                    if (!isManageMode) toggleManageMode();
                    addSection();
                });
                document.getElementById('btnAddSection').addEventListener('click', function() {
                    if (!isManageMode) toggleManageMode();
                    addSection();
                });

                document.getElementById('toolAddAnnouncement').addEventListener('click', function() {
                    if (!isManageMode) toggleManageMode();
                    addAnnouncement();
                });
                document.getElementById('toolAddDivider').addEventListener('click', function() {
                    if (!isManageMode) toggleManageMode();
                    addDivider();
                });

                document.getElementById('detailAddSub').addEventListener('click', function() {
                    if (currentSectionId) addSubSection(currentSectionId);
                });

                document.getElementById('subAddHtmlPage').addEventListener('click', function() {
                    if (currentSubId && currentSectionId) {
                        addHtmlPage(currentSubId, currentSectionId);
                    }
                });

                document.getElementById('bmAddBookmark').addEventListener('click', function() {
                    if (currentSubId && currentSectionId) {
                        addBookmark(currentSubId, currentSectionId);
                    }
                });

                document.getElementById('detailEditSection').addEventListener('click', function() {
                    if (currentSectionId) {
                        var sec = getSection(currentSectionId);
                        if (sec) {
                            var fields = [
                                { id: 'sec_name', label: '分类名称', type: 'text', value: sec.name || '' },
                                { id: 'sec_isHtml', label: 'HTML 模式', type: 'checkbox', value: sec
                                        .isHtmlParent || false }
                            ];
                            showModal('编辑分区', fields, '保存', async function(results) {
                                var name = results.sec_name.trim();
                                if (!name) { showToast('请输入名称', 'error'); return; }
                                try {
                                    await supabase.from('sections').update({
                                        name: name,
                                        is_html_parent: results.sec_isHtml === true
                                    }).eq('id', currentSectionId);
                                    sec.name = name;
                                    sec.isHtmlParent = results.sec_isHtml === true;
                                    renderSection(currentSectionId);
                                    showToast('已更新', 'success');
                                } catch (err) {
                                    showToast('更新失败', 'error');
                                }
                            });
                        }
                    }
                });

                document.getElementById('detailDeleteSection').addEventListener('click', function() {
                    if (currentSectionId) {
                        var sec = getSection(currentSectionId);
                        if (sec) {
                            showConfirm('删除分类「' + sec.name + '」及其所有内容？', '确认删除').then(function(ok) {
                                if (ok) deleteSection(currentSectionId);
                            });
                        }
                    }
                });

                async function deleteSection(sectionId) {
                    try {
                        // 删除所有子分区
                        var sec = getSection(sectionId);
                        if (sec && sec.children) {
                            for (var i = 0; i < sec.children.length; i++) {
                                var child = sec.children[i];
                                if (child.isHtml) {
                                    await supabase.from('html_pages').delete().eq('section_id', child.id);
                                } else {
                                    await supabase.from('bookmarks').delete().eq('section_id', child.id);
                                }
                                await supabase.from('sections').delete().eq('id', child.id);
                            }
                        }
                        await supabase.from('sections').delete().eq('id', sectionId);
                        await supabase.from('home_items').delete().eq('section_id', sectionId);
                        sections = sections.filter(function(s) { return s.id !== sectionId; });
                        homeItems = homeItems.filter(function(it) { return it.section_id !== sectionId; });
                        navigateTo('home');
                        showToast('已删除', 'success');
                    } catch (err) {
                        showToast('删除失败', 'error');
                    }
                }

                document.getElementById('subEditSub').addEventListener('click', function() {
                    if (currentSubId && currentSectionId) {
                        openEditSubModal(currentSubId, currentSectionId);
                    }
                });
                document.getElementById('subDeleteSub').addEventListener('click', function() {
                    if (currentSubId && currentSectionId) {
                        showConfirm('删除此子分区及其所有内容？', '确认删除').then(function(ok) {
                            if (ok) deleteSubSection(currentSubId, currentSectionId);
                        });
                    }
                });

                document.getElementById('bmEditSub').addEventListener('click', function() {
                    if (currentSubId && currentSectionId) {
                        openEditSubModal(currentSubId, currentSectionId);
                    }
                });
                document.getElementById('bmDeleteSub').addEventListener('click', function() {
                    if (currentSubId && currentSectionId) {
                        showConfirm('删除此子分区及其所有书签？', '确认删除').then(function(ok) {
                            if (ok) deleteSubSection(currentSubId, currentSectionId);
                        });
                    }
                });

                // 键盘快捷键
                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'e') { e.preventDefault();
                        toggleManageMode(); }
                    if (e.key === 'Escape') {
                        document.querySelectorAll('.custom-modal-overlay.open').forEach(function(el) {
                            el.classList.remove('open');
                        });
                        document.getElementById('fullscreenHtmlOverlay').classList.remove('open');
                    }
                });

                console.log('✅ 必看网 v3.0 已加载');
            }

            // DOM 准备好后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
