<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必看 - 帖子详情</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 1000 720' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(500, 360) scale(1.85) translate(-500, -360)'%3E%3Cpath d='M 300 340 C 460 165, 540 165, 700 340 C 540 515, 460 515, 300 340 Z M 320 340 C 470 235, 530 235, 680 340 C 530 445, 470 445, 320 340 Z' fill='%23000000' fill-rule='evenodd' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='484' y='273' width='32' height='100' rx='10' fill='%23000000'/%3E%3Crect x='488' y='383' width='24' height='24' rx='8' fill='%23000000'/%3E%3C/g%3E%3C/svg%3E">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #3ecf8e;
            --primary-dark: #2bb673;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.45);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --error: #ff6b6b;
            --success: #3ecf8e;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 0;                     /* 移除所有内边距 */
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            flex: 1;                        /* 让容器占满剩余高度 */
            display: flex;
            flex-direction: column;
        }

        /* 返回按钮固定在右上角 */
        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .back-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
        .back-btn svg { width: 16px; height: 16px; fill: currentColor; }

        /* 卡片底板铺满全屏，无圆角、无边框 */
        .post-card {
            flex: 1;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: none;
            border-radius: 0;
            padding: 80px 50px 50px;   /* 顶部留白避免返回按钮遮挡 */
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .post-header { margin-bottom: 20px; }
        .post-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 8px;
        }
        .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text-muted);
        }
        .short-id-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .post-desc {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .post-content {
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-primary);
            word-break: break-word;
        }
        .post-content h1, .post-content h2, .post-content h3, .post-content h4 {
            margin: 20px 0 10px;
            line-height: 1.3;
        }
        .post-content h1 { font-size: 2em; }
        .post-content h2 { font-size: 1.5em; }
        .post-content h3 { font-size: 1.17em; }
        .post-content p { margin: 10px 0; }
        .post-content code {
            background: rgba(255,255,255,0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .post-content pre {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .post-content pre code { background: none; padding: 0; }
        .post-content a { color: var(--primary); text-decoration: none; }
        .post-content a:hover { text-decoration: underline; }
        .post-content blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 16px;
            margin: 10px 0;
            color: var(--text-secondary);
        }
        .post-content ul, .post-content ol { padding-left: 24px; margin: 10px 0; }
        .post-content img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
        .post-content video { max-width: 100%; border-radius: 8px; margin: 10px 0; }
        .post-content audio { width: 100%; margin: 10px 0; }

        /* 文件卡片 */
        .file-card-preview {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border: 1px solid var(--card-border); border-radius: 8px;
            background: rgba(255,255,255,0.04); margin: 8px 0;
        }
        .file-card-preview svg { width: 32px; height: 32px; fill: var(--primary); flex-shrink: 0; }
        .file-card-info { flex: 1; min-width: 0; }
        .file-card-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-card-meta { font-size: 12px; color: var(--text-muted); }
        .file-card-download {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 6px 12px; background: var(--primary); color: #0f0c29 !important;
            border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 12px;
            white-space: nowrap; flex-shrink: 0;
        }
        .post-content a.file-card-download { color: #0f0c29 !important; }

        .error-message { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 16px; }
        .loading { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    </style>
</head>
<body>
    <a class="back-btn" href="home.html">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        返回主页
    </a>

    <div class="container">
        <div id="detailContainer">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://qziqskgvzabuynduyuqy.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6aXFza2d2emFidXluZHV5dXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg4ODQsImV4cCI6MjEwMjQ0NDg4NH0.-LYORLfz-xpr1dMD_T-P8LzvgqTJngc0Hd52wSORhXs';
            const ADMIN_EMAIL = '3948677391@qq.com';

            let supabase;
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (err) {
                console.error('Supabase 初始化失败:', err);
                document.getElementById('detailContainer').innerHTML = '<div class="error-message">Supabase 配置错误</div>';
                return;
            }

            // 预处理 Markdown，支持自定义媒体语法
            function preprocessMarkdown(markdown) {
                // 处理图片：@image[描述](url =50%) 或 @image[描述](url)
                markdown = markdown.replace(/@image\[([^\]]*)\]\(([^)]+?)(?:\s*=(\d+)%)?\)/g, (match, alt, url, width) => {
                    const widthStyle = width ? `${width}%` : '100%';
                    return `<img src="${url}" alt="${alt}" style="max-width: ${widthStyle}; border-radius: 8px;" />`;
                });
                // 处理视频：@video[描述](url =50%) 或 @video[描述](url)
                markdown = markdown.replace(/@video\[([^\]]*)\]\(([^)]+?)(?:\s*=(\d+)%)?\)/g, (match, alt, url, width) => {
                    const widthStyle = width ? `${width}%` : '100%';
                    return `<video controls src="${url}" style="max-width: ${widthStyle}; border-radius: 8px;"></video>`;
                });
                // 处理音频：@audio[描述](url)
                markdown = markdown.replace(/@audio\[([^\]]*)\]\(([^)]+?)\)/g, (match, alt, url) => {
                    return `<audio controls src="${url}"></audio>`;
                });
                // 处理文件：@file[描述](url)
                markdown = markdown.replace(/@file\[([^\]]*)\]\(([^)]+?)\)/g, (match, alt, url) => {
                    const urlParts = url.split('/');
                    const filename = urlParts[urlParts.length - 1] || '文件';
                    return `<div class="file-card-preview"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg><div class="file-card-info"><div class="file-card-name">${alt || filename}</div><div class="file-card-meta">文件</div></div><a class="file-card-download" href="${url}" download="${filename}">下载</a></div>`;
                });
                // 处理标准 Markdown 图片
                markdown = markdown.replace(/!\[([^\]]*)\]\(([^)]+?)\)/g, (m, alt, url) => `<img src="${url}" alt="${alt}" />`);
                return markdown;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function renderPost(post, canViewFull) {
                const date = post.created_at ? new Date(post.created_at).toLocaleString() : '';
                const shortId = post.short_id ? `#${post.short_id}` : '';

                let contentHtml = '';
                if (canViewFull) {
                    const processed = preprocessMarkdown(post.content || '');
                    contentHtml = marked.parse(processed);
                } else {
                    contentHtml = '<p style="color:var(--text-muted);">该内容正在审核中，暂不可见。</p>';
                }

                document.getElementById('detailContainer').innerHTML = `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-title">${post.title}</div>
                            <div class="post-meta">
                                ${shortId ? `<span class="short-id-badge">${shortId}</span>` : ''}
                                ${date ? `<span>${date}</span>` : ''}
                            </div>
                        </div>
                        <div class="post-desc">${post.description || ''}</div>
                        <div class="post-content">${contentHtml}</div>
                    </div>
                `;
            }

            async function loadPost() {
                const params = new URLSearchParams(window.location.search);
                const shortIdParam = params.get('id');
                if (!shortIdParam) {
                    document.getElementById('detailContainer').innerHTML = '<div class="error-message">缺少短 ID</div>';
                    return;
                }

                const shortId = Number(shortIdParam);
                if (isNaN(shortId)) {
                    document.getElementById('detailContainer').innerHTML = '<div class="error-message">无效的短 ID</div>';
                    return;
                }

                try {
                    const { data: { user } } = await supabase.auth.getUser();
                    const currentUser = user;

                    const { data, error } = await supabase
                        .from('websites')
                        .select('*')
                        .eq('short_id', shortId)
                        .single();

                    if (error) {
                        console.error('加载帖子失败:', error);
                        document.getElementById('detailContainer').innerHTML = '<div class="error-message">帖子不存在或加载失败</div>';
                        return;
                    }

                    const isOwner = currentUser && data.submitter_id === currentUser.id;
                    const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
                    const canViewFull = data.status === 'approved' || isOwner || isAdmin;

                    renderPost(data, canViewFull);
                } catch (err) {
                    console.error('错误:', err);
                    document.getElementById('detailContainer').innerHTML = '<div class="error-message">加载失败</div>';
                }
            }

            loadPost();
        })();
    </script>
</body>
</html>
